laces the Sanjiao's seat at the qi street, which can be read two ways; one of them lies in the groin, where the kua root is:"},"lingshu-yingwei-xia":{"book":"《灵枢·营卫生会》","text":"下焦者，别回肠，注于膀胱而渗入焉。","en":"","about":["xiajiao"],"lead":"下焦管往下排：","leadEn":"The lower jiao carries things down and out:"},"huangting-wai-jingqi":{"book":"《黄庭外景经》（「老」字，书法传本一系或作「志」；旧注多就「老」字解，以灵根为舌根）","text":"丹田之中精气微，玉池清水上生肥，灵根坚固老不衰。","en":"校勘：道藏、《云笈七籤》本、唐李善《文选》注引都作「老不衰」；王羲之、赵孟頫小楷作「志不衰」，朱耷写本又作「老」。《云笈七籤》注「灵根者，舌根也……久寿不衰」，注和「老」字配套。不要和《黄庭内景经》「灵台盘固永不衰」混引。《黄庭》墨迹本和刻本另有若干字句出入，不止这一处。","about":["dantian"],"lead":"同一部经接着说：丹田里的精气是微细的。后面两句讲的是口中的津液：","leadEn":"The same text goes on: the essence and qi in the dantian are subtle. The next two lines turn to the saliva in the mouth:"},"lingshu-yingwei-sanjiao":{"book":"《灵枢·营卫生会》","text":"上焦如雾，中焦如沤，下焦如渎。","en":"三焦讲的是过程：散、泡、排。和丹田「田、鼎」的容器语汇不同。","about":["dantian","shangjiao","zhongjiao","xiajiao"],"lead":"三焦的三个样子：雾、沤、渎：","leadEn":"Three images of the Sanjiao: mist, steeping, and a drainage ditch:"},"huangting-zhu-sancun":{"zhu":true,"book":"务成子注《黄庭外景经》（《中华传世藏书·子部·道教》所收本）","text":"丹田中者，脐下三寸阴阳户，俗人以生子，道人以生身。","en":"这是注，不是经文：散句夹在七言经文中间。只能写「务成子注说」，不能写「《黄庭经》说」。","about":["dantian"],"lead":"这是注，不是经文。务成子注《黄庭外景经》，把丹田定在脐下三寸：","leadEn":"This is a commentary, not the scripture itself. Wuchengzi's commentary on the Yellow Court Classic places the dantian three cun below the navel:"},"huanzhen-taixi":{"hold":"11-21 撤下：不在来源清单","zhu":true,"book":"幻真注《胎息经》（《遵生八笺》所收）","text":"脐下三寸为气海，亦为下丹田，亦为玄牝。","en":"这也是注：《胎息经》经文只有开头「胎从伏气中结，气从有胎中息」等几句，这句是幻真的注。它是散体解释语，不合经文的韵语体例。连学术著作也常误引作《胎息经》。","about":["dantian"],"lead":"这也是注。幻真注《胎息经》把气海、下丹田、玄牝说成同一个地方：","leadEn":"This too is a commentary. Huanzhen's notes on the Embryonic Breathing Classic treat the Sea of Qi, the lower dantian and the Mysterious Female as one place:"},"yunji-sandantian":{"hold":"11-21 撤下：不在来源清单","book":"《云笈七籤·延陵君修养大略》（见《中华传世藏书》所收本）","todo":true,"text":"人有三丹田，上元、中元、下元是也。上元丹田，脑也，亦名泥丸；中元丹田，心也，亦名绛宫……","en":"转引自《阴符经 清静经》注本，待对原书。","about":["dantian"]},"zisheng-erchun":{"book":"王执中《针灸资生经》","text":"论丹田穴，当以脐下二寸为是。","en":"「当以……为是」本身说明当时有二寸、三寸几种说法。","about":["dantian"],"lead":"几寸，古人说法不一。宋代的《针灸资生经》要「纠正」成二寸，正说明当时有好几种说法：","leadEn":"The old texts disagree on the distance. The Song-dynasty Zhenjiu Zisheng Jing insists on two cun, which shows that several answers were in circulation:"},"wanbing-huichun":{"book":"龚廷贤《万病回春》（见《中华传世藏书》所收本）","todo":true,"text":"气海穴在脐下一寸五分，丹田在脐下二寸，关元在脐下三寸。","en":"转引，待对原书。","about":["dantian","qihai"]},"suwen-benbing-shang":{"book":"《素问·本病论》（遗篇）","todo":true,"flag":"遗篇，非《内经》本文","text":"神失守位，即神游上丹田，在帝太一帝君泥丸宫下。","en":"注意：《本病论》是《素问》的遗篇，原文早佚，宋以后流传的是后人补的。所以不能说「《内经》本身讲丹田」。这里的丹田指头部的上丹田。","about":["dantian"]},"xinggong-jifa":{"book":"武禹襄《十三势行功心解》","text":"力由脊发，步随身换。","en":"","about":["du","chair"]},"nanjing-28-du":{"book":"《难经·二十八难》","text":"督脉者，起于下极之俞，并于脊里，上至风府，入属于脑。","en":"","about":["du","mingmen"]},"lingshu-jingmai-kidney":{"book":"《灵枢·经脉》","text":"肾足少阴之脉，起于小指之下，邪走足心。","en":"","about":["kidney","yongquan"]},"lingshu-benshu-yongquan":{"book":"《灵枢·本输》","text":"肾出于涌泉，涌泉者，足心也。","en":"The Kidney emerges at Yongquan; Yongquan is the centre of the sole.","about":["yongquan"]},"lingshu-benshu-taixi":{"book":"《灵枢·本输》","text":"注于太溪，太溪，内踝之后，跟骨之上，陷中者也。","en":"","about":["taixi"]},"lingshu-jingmai-spleen":{"book":"《灵枢·经脉》","text":"脾足太阴之脉，起于大指之端，循指内侧白肉际，过核骨后，上内踝前廉，上踹内，循胫骨后，交出厥阴之前，上膝股内前廉，入腹，属脾络胃。","en":"","about":["spleen","xuehai","kuagen","frog"]},"lingshu-jingmai-dabao":{"book":"《灵枢·经脉》","text":"脾之大络，名曰大包，出渊腋下三寸，布胸胁。","en":"","about":["dabao","spleen"]},"lingshu-benshu-laogong":{"book":"《灵枢·本输》","text":"溜于劳宫，劳宫，掌中中指本节之内间也，为荥。","en":"It flows to Laogong, in the palm, in the space on the inner side of the middle-finger knuckle; this is the Spring point.","about":["laogong"]},"lingshu-benshu-yemen":{"book":"《灵枢·本输》","text":"溜于液门，液门，小指次指之间也，为荥。","en":"It flows to Yemen, between the little finger and the finger next to it; this is the Spring point.","about":["yemen"],"lead":"液门的位置。这是五输穴的荥穴，不是循行：","leadEn":"Where Yemen lies. This is about the Spring point among the five transport points, not the route of the channel:"},"lingshu-jingmai-sj":{"book":"《灵枢·经脉》","text":"三焦手少阳之脉，起于小指次指之端，上出两指之间，循手表腕，出臂外两骨之间，上贯肘，循臑外上肩……入缺盆，布膻中，散络心包，下膈，循属三焦。……其支者，从耳后入耳中，出走耳前，过客主人前，交颊，至目锐眦。","en":"「散络」：多数本子如此；张其成全解本作「散落」，底本待核。","about":["yemen"]},"lingshu-yingqi-xu":{"book":"《灵枢·营气》","text":"故气从太阴出，注手阳明……","en":"","about":["lung","li","st","dd"]},"zhenjiu-daquan-shichen":{"book":"徐凤《针灸大全》（明）","text":"肺寅大卯胃辰宫，脾巳心午小未中，申膀酉肾心包戌，亥焦子胆丑肝通。","en":"","about":["li","st","dd"]},"tian-chousi-fangxiang":{"modern":true,"book":"田兆麟语，见黄震寰《大道太极：太极拳道修诀要》，北京科学技术出版社，2023 年 1 月（ISBN 9787571422011），第三章第三节「太极抽丝功修炼」（电子版）· A","pub":true,"text":"按抽丝二字，非仅指缓徐直拉而出，因直拉而出，弗论如何缓徐，绝不能绵绵不断。其实抽丝二字，乃指旋转出入，如来复线之螺旋形也，出为顺抽，入为逆抽，一切运劲，概不外乎此顺逆二抽，即两仪之谓也。","en":""},"tian-chousi-lu":{"modern":true,"book":"田兆麟语，见黄震寰《大道太极：太极拳道修诀要》，北京科学技术出版社，2023 年 1 月（ISBN 9787571422011），第三章第三节「太极抽丝功修炼」（电子版）· A","pub":true,"text":"其顺抽乃由足至于手指之抽，其逆抽乃由手指回归足之抽，其路线即左足右手、右足左手。","en":""},"wu-tunan-chousi":{"modern":true,"book":"吴图南语，黄震寰记，见黄震寰《大道太极：太极拳道修诀要》，北京科学技术出版社，2023 年 1 月（ISBN 9787571422011），第三章第三节「太极抽丝功修炼」（电子版）· A","pub":true,"text":"太极拳运劲就同抽丝一样，如抽猛了，丝就断了；抽得不合适，丝又抽不出来。这是比喻练太极拳劲，不能够过强，也不能过弱，要恰如其分。","en":""},"qianjin-yifang-names":{"book":"孙思邈《千金翼方》或《备急千金要方》（论穴名）","todo":true,"flag":"书名、卷次待核","text":"凡诸孔穴，名不徒设，皆有深意。","en":"None of the point names were chosen at random; every one carries a deep meaning.","about":["xuehai"]},"taijiquanlun-sanwu":{"book":"《太极拳论》","text":"无使有缺陷处，无使有凹凸处，无使有断续处。","en":"","about":["dd"]},"huang-shunchou":{"modern":true,"book":"黄震寰《大道太极：太极拳道修诀要》，北京科学技术出版社，2023 年 1 月（ISBN 9787571422011），第三章第三节「太极抽丝功修炼」（电子版）· A","pub":true,"text":"两脚平行站立，两上肢沉肩坠肘，竖掌，劳宫朝前……涌泉内气反射而上，如抽丝般由脚而腿而腰脊，经九节而循督脉升至泥丸和两手劳宫，两手随气之鼓荡旋转而伸开，表现为吐、为放、为开、为阳，此为顺抽丝。","en":""},"huang-nichou":{"modern":true,"book":"黄震寰《大道太极：太极拳道修诀要》，北京科学技术出版社，2023 年 1 月（ISBN 9787571422011），第三章第三节「太极抽丝功修炼」（电子版）· A","pub":true,"text":"静定片刻后，静极而动，泥丸、劳宫之内气如抽丝状由手而腰而腿而脚，经九节而循任脉降至涌泉。两手随气之鼓荡而回吸，表现为吞、为收、为合、为阴，此为逆抽丝。","en":""}};
const P={"yongquan":{"zh":"涌泉","trad":"湧泉","py":"Yongquan","code":"KI1","en":"Bubbling Spring","mer":"kidney","place":"脚底","find":"脚趾往下蜷，脚底前面那块肉的正后方会凹下去一个小窝。","findEn":"Curl your toes: the small hollow just behind the ball of the foot.","st":"ok","src":["lingshu-benshu-yongquan"]},"taixi":{"zh":"太溪","trad":"太溪","py":"Taixi","code":"KI3","en":"Great Stream","mer":"kidney","place":"脚踝","find":"脚腕内侧有一块凸起的骨头。从它往脚后跟方向摸，碰到那根粗粗的筋之前，中间有个小窝。","findEn":"From the bump on the inside of your ankle, slide back towards the heel: the hollow before the thick cord.","st":"try","src":["lingshu-benshu-taixi"]},"xuehai":{"zh":"血海","trad":"血海","py":"Xuehai","code":"SP10","en":"Sea of Blood","mer":"spleen","place":"膝盖","find":"坐着弯膝。右手掌盖住左膝盖骨，拇指斜向大腿内侧，拇指尖落下的地方。","findEn":"Seated, knee bent: cup your right palm over your left kneecap; the tip of your thumb points to it on the inner thigh.","st":"ok","src":[],"ming":{"draft":true,"img":"血，和海。海是百川归去的地方：深，满，容得下。血海，就是血汇成海的地方。","imgEn":"Blood, and the sea. The sea is where all rivers go: deep, full, able to hold. Xuehai is where the blood gathers into a sea.","use":"练的时候，让大腿内侧这一片饱满、开阔，像潮水慢慢涨上来，不被挤压。","useEn":"In practice, let this stretch of the inner thigh feel full and open, like a tide slowly rising, never squeezed.","src":["qianjin-yifang-names"]}},"huantiao":{"zh":"环跳","trad":"環跳","py":"Huantiao","code":"GB30","en":"Jumping Circle","mer":"gb","place":"髋","find":"左侧躺，下面的腿伸直，上面的右腿屈髋屈膝。右手摸到屁股外侧最凸的那块骨头。右手拇指第一个关节的横纹压在这块骨头最高点上，拇指尖朝脊柱。拇指尖落下的地方就是。","findEn":"Lie on your left side, lower leg straight, right leg bent at hip and knee. With your right hand, find the most prominent bone on the outside of your hip. Press the crease of your thumb's first joint on its highest point, thumb tip pointing to the spine. Where the thumb tip lands is the point.","st":"ok","src":["jiayi-huantiao","lingshu-gudu-bishu"]},"baliao":{"zh":"八髎","label":"骶部 · 八髎","trad":"八髎","py":"Baliao","code":"BL31–34","en":"Eight Crevices","mer":"bl","place":"骶骨","region":true,"find":"站着，双手叉腰，拇指在后。拇指往后、往中间滑，碰到脊柱。拇指不动，手掌往下翻，贴着后腰。中指往下的这一片就是骶部，八髎都在里面。","findEn":"Stand with hands on hips, thumbs behind. Slide the thumbs back and in until they meet the spine. Keep the thumbs there and turn the palms down onto the lower back. The area under your middle fingers and below is the sacrum; the eight Baliao points are all in it.","findIn":"站着，双手叉腰，拇指在后。拇指往后、往中间滑，碰到脊柱。拇指不动，手掌往下翻，贴着后腰。中指往下的这一片就是骶部，八髎都在里面。","st":"try","src":[],"regionAbout":[["是一片区域，练的时候也按一片来感受","八髎是左右四对骶后孔，但孔藏在骨头里，体表摸不到孔口，只能摸到骨面上的凹陷。练习里感受和动作都是一整片，不是一个孔一个孔。下面的标准穴位只作参照。","An area, and felt as one","The eight crevices are four pairs of posterior sacral foramina, but the openings lie inside the bone and cannot be felt from the surface. In practice the sensation and the movement come as one area, not hole by hole. The standard points below are for reference only."],["能摸到的骨","髂后上棘：骨盆后面最突出的两个骨尖，左右各一。骶正中嵴：骶骨背面正中一条纵向骨嵴。骶角：最下面两个像小豆子的突起，中间的凹陷是骶管裂孔。国标的说法是：「骶管裂孔：取尾骨上方左右的骶角，与左右骶角平齐的后正中线上。」（GB/T 12346-2021 4.2.1，第 5 页，A）骶管裂孔中心与两侧髂后上棘连线，大致是一个等边三角形（《实用疼痛学》等转述，B，原书待核）。骶管裂孔的形状因人而异，摸不到不等于找错了。","Bones you can feel","Posterior superior iliac spines: the two most prominent bony points at the back of the pelvis. Median sacral crest: the vertical ridge down the middle of the sacrum. Sacral cornua: the two small bumps at the bottom, with the sacral hiatus in the hollow between them. The Chinese national standard puts the sacral hiatus on the midline, level with the two sacral cornua above the tailbone (GB/T 12346-2021, 4.2.1, p. 5). The hiatus and the two iliac spines roughly make an equilateral triangle. Its shape varies from person to person, so not finding it does not mean you are in the wrong place."],["《素问·骨空论》","「……八髎在腰尻分间。」（节引，三个整理本一致，A）腰尻就是骶骨；「分间」是骨间的孔隙。经文说的是一片骨间孔隙；把它讲成上、次、中、下左右八个穴，是后世注文的说法，不是经文。","Suwen, chapter 60","The classical line (quoted in part) places the eight crevices in the gaps of the sacrum: one stretch of gaps between the bones. Reading it as eight separate points comes from later commentary, not from the classic itself."],["「尾闾」有三种指法","一、长强穴的别名（尾骨端）；二、骶骨加尾骨整段（武术常用）；三、只指能动的尾骨（讲「转尾闾」时）。用这个词时先想清楚说的是哪一种。","Three meanings of weilü","1. Another name for Changqiang, at the tip of the tailbone; 2. the whole of sacrum and tailbone, as martial arts usually mean it; 3. only the movable tailbone, when people speak of turning the weilü."]],"inside":[["上髎","BL31","在骶部，正对第 1 骶后孔中。注：从次髎向上触摸到的凹陷即第一骶后孔。（GB/T 12346-2021 5.7.31，第 18 页）","A"],["次髎","BL32","在骶部，第 2 骶后孔中。注：俯卧，于第 2 骶后孔中取之。髂后上棘与第 2 骶椎棘突连线的中点凹陷中，即第 2 骶后孔。（GB/T 12346-2021 5.7.32，第 18 页）","A"],["中髎","BL33","在骶部，正对第 3 骶后孔中。注：次髎向下触摸到的第 1 个凹陷即第 3 骶后孔。（GB/T 12346-2021 5.7.33，第 18 页）","A"],["下髎","BL34","在骶部，正对第 4 骶后孔中。注：次髎向下触摸到的第 2 个凹陷即第 4 骶后孔，横平骶管裂孔。（GB/T 12346-2021 5.7.34，第 18 页）","A"],["小肠俞","BL27","在骶部，横平第 1 骶后孔，骶正中嵴旁开 1.5 寸。注：横平上髎。（GB/T 12346-2021 5.7.27，第 17 页）","A"],["膀胱俞","BL28","在骶部，横平第 2 骶后孔，骶正中嵴旁开 1.5 寸。注：横平次髎。（GB/T 12346-2021 5.7.28，第 17–18 页）","A"],["中膂俞","BL29","在骶部，横平第 3 骶后孔，骶正中嵴旁开 1.5 寸。注：横平中髎。（GB/T 12346-2021 5.7.29，第 18 页）","A"],["白环俞","BL30","在骶部，横平第 4 骶后孔，骶正中嵴旁开 1.5 寸。注：骶管裂孔旁开 1.5 寸，横平下髎。（GB/T 12346-2021 5.7.30，第 18 页）","A"],["胞肓","BL53","#baohuang",""],["秩边","BL54","#zhibian",""],["会阳","BL35","在臀部，尾骨端旁开 0.5 寸。注：俯卧，或跪伏位，按取尾骨下端旁软陷处取穴。（GB/T 12346-2021 5.7.35，第 18 页）","A"],["腰俞","GV2","在骶部，正对骶管裂孔，后正中线上。注：臀裂正上方的小凹陷即骶管裂孔。（GB/T 12346-2021 5.13.2，第 27–28 页）","A"],["长强","GV1","在会阴部，尾骨下方，尾骨端与肛门连线的中点处。（GB/T 12346-2021 5.13.1，第 27 页）别名尾闾（教材说法，B）。","A"]]},"baohuang":{"zh":"胞肓","trad":"胞肓","py":"Baohuang","code":"BL53","en":"Bladder Vitals","mer":"bl","place":"臀","find":"站着。先找腰窝：后腰最下面，脊柱两边各有一个小凹窝。右手放到背后，手指朝下，手掌贴在屁股上半部、靠外边。手往上挪，让手腕这一头和腰窝一样高。手掌最上面靠外的这一片，胞肓就在里面。","findEn":"Stand. First find the dimples: at the very bottom of your lower back there is a small hollow on each side of the spine. Put your right hand behind you, fingers pointing down, palm on the upper, outer part of the buttock. Move the hand up until the wrist end is level with the dimples. Baohuang lies in the area at the top outer corner of your palm.","st":"try","src":[]},"zhibian":{"zh":"秩边","trad":"秩邊","py":"Zhibian","code":"BL54","en":"Order's Edge","mer":"bl","place":"臀","find":"站着，右手像插进裤子后口袋那样，手掌贴在屁股上，手指朝下。中指尖和尾骨一样高，不要更低。手掌盖住的这一片，秩边就在里面。","findEn":"Stand and put your right hand as if into the back pocket of your trousers: palm on the buttock, fingers pointing down. Keep the tip of your middle finger level with your tailbone, no lower. Zhibian lies in the area under your palm.","st":"try","src":[]},"mingmen":{"zh":"命门","trad":"命門","py":"Mingmen","code":"GV4","en":"Gate of Life","mer":"du","place":"腰","find":"先找到肚脐。从肚脐正对着往后，到后腰脊柱的正中。用中指指肚摸，正对的地方有一个凹陷。","findEn":"Find your navel first. Go straight back from it to the middle of the spine in your lower back. Feel with the pad of your middle finger: right there is a small hollow.","st":"try","src":[]},"qugu":{"zh":"曲骨","trad":"曲骨","py":"Qugu","code":"CV2","en":"Curved Bone","mer":"ren","place":"下腹","find":"中指从肚脐沿着中线往下滑。滑到下腹最下面那块横着的硬骨。它上边缘的正中间。","findEn":"Slide your middle finger down the midline from the navel. Stop at the hard bone at the bottom of the belly. The centre of its upper edge.","st":"try","src":[]},"qihai":{"zh":"气海","trad":"氣海","py":"Qihai","code":"CV6","en":"Sea of Qi","mer":"ren","place":"腹","find":"食指和中指并拢，放在肚脐正下方，两指的下沿。","findEn":"Two fingers together just below the navel: the point is at their lower edge.","st":"ok","q":"吸气从下丹田沿着脊柱一直往上。","src":[]},"dantian":{"zh":"丹田","trad":"丹田","py":"Dantian","code":"Area","en":"Lower Dantian","mer":"ren","place":"下腹","kind":"area","find":"手掌横放在肚脐下面，掌心对着小腹。手掌盖住的这一片，就是下丹田。它不是一个点，是一片区域。","findEn":"Lay your palm across your belly just below the navel. The area under your hand is the lower dantian. It is an area, not a point.","st":"ok","q":"气从丹田沉到脚，血从血海压到手指脚趾。","about":[["不是一个点，是一片区域","丹田本身不是一个穴位，所以没有编号；它盖住的这一片里，气海、关元各有编号。古人都说它在脐下，但几寸说法不一：有说二寸，有说三寸，也有说二到三寸之间。中医穴位里，脐下一寸半是气海，脐下三寸是关元；丹田就在这一带。所以这里不找一个点，用整个手掌盖住这一片。","An area, not a point","The dantian is not an acupoint itself, so it has no code; Qihai and Guanyuan, which lie inside the area it covers, each have one. The old texts all place it below the navel but disagree on how far: two cun, three cun, or somewhere between (a cun is a body-relative inch, about the width of your own thumb). On the acupoint map, Qihai sits 1.5 cun below the navel and Guanyuan 3 cun below; the dantian covers this stretch. So you don't look for one point here; you cover the whole area with your palm."],["名字从哪里来","「丹田」这个名字来自道家修炼的书，不是来自医书。现存较早写下「出入丹田」的是《黄庭经》。后来又分出三个丹田：头、心下、脐下。这里说的是脐下的下丹田。","Where the name comes from","The name comes from Daoist cultivation texts, not from the medical classics. The Yellow Court Classic is among the earliest surviving texts to say that breath goes out and in through the dantian. Later traditions name three: in the head, below the heart, and below the navel. These notes mean the lower one."],["丹田和小周天：两张不同的地图","穴位地图上的丹田，和小周天练习里的丹田，名字一样，却不是同一张图。小周天是后来内丹和气功的练习图像：气沿督脉上行，沿任脉下行。幻椅式里「吸气从下丹田沿脊柱往上」，用的是小周天这张图。","The dantian and the Microcosmic Orbit: two different maps","The dantian on the acupoint map and the dantian in Microcosmic Orbit practice share a name but belong to different maps. The Microcosmic Orbit is a later image from Daoist inner alchemy and qigong: qi rises along the Governing Vessel and comes down along the Conception Vessel. In Chair Pose, \"breathe in from the lower dantian and up along the spine\" draws on this second map."],["气沉丹田：起点，不是停住","站桩的口令是「屈膝松胯，气沉丹田，意守涌泉，虚领顶劲」。丹田和涌泉一起用：气从丹田往下沉，落到脚底。不是把气守在丹田不动。","Sinking the qi: a starting point, not a resting place","The standing cue runs: bend the knees, release the hips, sink the qi to the dantian, rest your attention on Yongquan, lift lightly through the crown. The dantian and Yongquan work together: the qi sinks from the dantian and lands in the soles. You don't hold the qi still in the dantian."],["丹田不是下焦","下腹这一片，在两张图上有两个名字。在三焦这张图上，肚脐以下叫下焦。下焦是六腑里三焦的一段，古人说「下焦如渎」，像一条水沟，讲的是通不通。丹田来自内丹，是「田」，是「鼎」，讲的是聚和炼。所以这里说「丹田」，用的是内丹这张图；说「下焦」，用的是中医这张图。两边的形容词不互借：不说「下焦饱满」，也不说「丹田通畅」。","Not the lower jiao","The lower belly carries two names on two maps. On the Sanjiao map, the area below the navel is the lower jiao. The lower jiao is one section of the Sanjiao, one of the six fu organs; the classics say it works like a drainage ditch, so the question there is whether things flow. The dantian comes from Daoist inner alchemy. It is a field, a cauldron, so the question there is gathering and refining. When these notes say dantian, they use the inner-alchemy map; when they say lower jiao, they use the medical map. The two maps don't share adjectives: these notes never call the lower jiao full, and never call the dantian unblocked."],["怎么放注意力","手盖在这里，不用去找某种特定的感觉。只注意这一片此刻是什么样：清楚、模糊、温暖、凉，还是没有明显感觉。感觉是真实的；感觉意味着什么，仍然是开放的。","How to rest your attention here","Rest your hand here and don't go looking for any particular feeling. Just notice what the area is like right now: clear, blurred, warm, cool, or nothing in particular. The sensation is real. The interpretation remains open."]],"cmp":[],"src":["huangting-wai-dantian","suwen-shengqi-wuwei","taijiquanlun-qichen","shisanshi-ge-songjing","huangting-wai-jingqi","huangting-zhu-sancun","lingshu-hanre-guanyuan","zisheng-erchun","nanjing-66-dongqi","lingshu-yingwei-sanjiao","wanbing-huichun","suwen-benbing-shang"]},"dabao":{"zh":"大包","trad":"大包","py":"Dabao","code":"SP21","en":"Great Embracement","mer":"spleen","place":"侧肋","find":"坐着，左手臂举过头顶。右手手掌横放，手指并拢，食指一边贴着左腋窝正中。往下量两个手掌宽。用中指指肚在那里摸，会摸到两根骨头之间的一道软缝，就是这一片。","findEn":"Sit and raise your left arm over your head. Lay your right hand flat and sideways, fingers together, index-finger edge against the middle of your left armpit. Measure down two hand-widths. Feel there with the pad of your middle finger: a soft groove between two ribs. That is the place.","st":"ok","q":"「布」这个字没有替我完成动作。它让我在那里，多停留了一会儿。","src":["lingshu-jingmai-dabao"]},"laogong":{"zh":"劳宫","trad":"勞宮","py":"Laogong","code":"PC8","en":"Palace of Toil","mer":"pc","place":"掌心","find":"轻轻握拳，中指尖碰到掌心的地方。","findEn":"Make a loose fist: where the tip of your middle finger meets the palm.","st":"ask","src":["lingshu-benshu-laogong"]},"yemen":{"zh":"液门","trad":"液門","py":"Yemen","code":"TE2","en":"Fluid Gate","mer":"sj","place":"手背","find":"手背朝上，无名指和小指之间的指缝，往手腕方向一点点的小窝。","findEn":"Back of the hand: the small hollow just behind the web between ring and little fingers.","st":"try","src":["lingshu-benshu-yemen"]},"shangyang":{"zh":"商阳","trad":"商陽","py":"Shangyang","code":"LI1","en":"Shang Yang","mer":"li","place":"食指","find":"食指伸直，指甲朝上。看指甲靠大拇指那一边、靠近手指根的那个角。同一只手的拇指指甲尖，放在这个角外面紧挨着的地方，不压在指甲上。","findEn":"Straighten your index finger, nail up. Look at the corner of the nail on the thumb side, nearest the base of the finger. Put the tip of the thumbnail of the same hand just outside that corner, right beside it, not on the nail.","st":"ok","src":[]},"zhongfu":{"zh":"中府","trad":"中府","py":"Zhongfu","code":"LU1","en":"Middle Palace","mer":"lung","place":"肩前","find":"右手中指，放在左边锁骨靠肩膀那一头的下面。往下一个大拇指宽，再往胸口里挪一点。那一片里最凹、最深的地方。","findEn":"Right middle finger under the outer end of the left collarbone, near the shoulder. Move down one thumb-width, then a little in towards the chest. The deepest, most hollow spot there.","st":"try","src":[]},"shangjiao":{"zh":"上焦","trad":"上焦","py":"Shangjiao","code":"Area","en":"Upper jiao","mer":"sjfu","place":"胸","kind":"area","find":"手掌平放在胸骨上，两乳之间。手掌盖住的胸腔这一片，就是上焦。","findEn":"Lay your palm flat on your breastbone, between the breasts. The chest under your hand is the upper jiao.","st":"ok","q":"站立下轮的时候，我明显感觉胸腔这块是弯不下去的。","about":[["三焦是什么","《灵枢·本输》叫三焦「孤之腑」。五脏只有五个，六腑却有六个，多出来的那一个就是三焦；后世把心包配给它，凑成表里，但心包不算一个独立的脏。它是一套通道，管水、管气，分上中下三段。经文用「膈」分开上焦和中焦；中焦和下焦之间，经文没有给结构上的边界，是按功能分的。三焦经是另一回事：一条从无名指端，经手臂外侧、肩、颈侧、耳后，到眼外角的线。","What the Sanjiao is","The Lingshu calls the Sanjiao the \"solitary fu\". There are five zang organs but six fu, and the Sanjiao is the sixth, the one left over; later tradition paired it with the pericardium, which is not a full zang organ in its own right. It is a set of passages for water and qi, in three sections. The classics divide the upper from the middle jiao at the diaphragm; between the middle and lower jiao they give no structural boundary, only a functional one. The Sanjiao channel is something else: a line from the tip of the ring finger, up the outside of the arm, over the shoulder and side of the neck, behind the ear, to the outer corner of the eye."],["上焦如雾","经文说上焦「贯膈而布胸中」，在膈以上，心和肺在这里。它的样子像雾：「上焦开发……若雾露之溉」，气往上、往外散开。","Like mist","The classics place the upper jiao above the diaphragm, spread through the chest, where the heart and lungs sit. It works like mist: it opens and spreads outward and upward, \"like a mist of dew that waters everything\"."],["和现代解剖对照","大致是胸腔。膈肌是躯干里唯一一道横跨整个体腔、把它分成上下两部分的肌性隔板，也正是经文分上焦和中焦的地方。手掌盖到的只是胸前这一片；上焦比手掌深，也比手掌大，手只是一个入口。","Next to modern anatomy","Roughly the chest cavity. The diaphragm is the one muscular sheet that spans the whole trunk and divides it into upper and lower parts, and it is exactly where the classics divide the upper jiao from the middle. Your palm covers only the front of the chest; the upper jiao is deeper and wider than your hand, which is only a way in."],["怎么放注意力","用雾的词：开不开、散不散。不用「饱满」「聚」，那是丹田的词。自测一句：能不能开。后弯时注意胸这一片能不能打开，有没有哪里卡住。","How to rest your attention here","Use the words of mist: does it open, does it spread. Leave \"full\" and \"gathered\" to the dantian. One question to test it: does it open? In backbends, notice whether the chest opens and where it catches."]],"src":["lingshu-yingwei-shang","lingshu-yingwei-wushidu","lingshu-jueqi-shangjiao","lingshu-yingwei-sanjiao","suwen-linglan-sanjiao","lingshu-benshu-gufu","lingshu-wulong-sanjiao","lingshu-benzang-couli"]},"zhongjiao":{"zh":"中焦","trad":"中焦","py":"Zhongjiao","code":"Area","en":"Middle jiao","mer":"sjfu","place":"腹","kind":"area","find":"手掌放在胸骨下端和肚脐之间，也就是上腹。这一片是中焦。","findEn":"Rest your palm between the bottom of your breastbone and your navel, on the upper belly. This is the middle jiao.","st":"ok","q":"如果一个人消化不良，前屈是一定会受阻的。","about":[["三焦是什么","《灵枢·本输》叫三焦「孤之腑」。五脏只有五个，六腑却有六个，多出来的那一个就是三焦；后世把心包配给它，凑成表里，但心包不算一个独立的脏。它是一套通道，管水、管气，分上中下三段。经文用「膈」分开上焦和中焦；中焦和下焦之间，经文没有给结构上的边界，是按功能分的。三焦经是另一回事：一条从无名指端，经手臂外侧、肩、颈侧、耳后，到眼外角的线。","What the Sanjiao is","The Lingshu calls the Sanjiao the \"solitary fu\". There are five zang organs but six fu, and the Sanjiao is the sixth, the one left over; later tradition paired it with the pericardium, which is not a full zang organ in its own right. It is a set of passages for water and qi, in three sections. The classics divide the upper from the middle jiao at the diaphragm; between the middle and lower jiao they give no structural boundary, only a functional one. The Sanjiao channel is something else: a line from the tip of the ring finger, up the outside of the arm, over the shoulder and side of the neck, behind the ear, to the outer corner of the eye."],["中焦如沤","经文说中焦「并胃中，出上焦之后」，在膈以下，脾胃在这里，管消化：「泌糟粕，蒸津液，化其精微」，做出来的叫「营气」。它的样子像沤：泡着、慢慢化开。","Like soaking","The classics place the middle jiao with the stomach, just below the diaphragm. It digests: it separates the clear from the turbid, steams the fluids and refines what is fine, and what it makes is called the nutritive qi. It works like soaking: things steep and slowly break down."],["和现代解剖对照","大致是腹腔的上半部，不是整个腹腔。经文自己就这样划：中焦「泌糟粕」，糟粕往下进「回肠」，回肠归下焦。中焦和下焦之间没有隔膜，是一个连通的腔。","Next to modern anatomy","Roughly the upper half of the abdomen, not the whole of it. The classics draw the line themselves: the middle jiao passes the waste down into the large intestine, which belongs to the lower jiao. No membrane separates the middle and lower jiao; the cavity is continuous."],["怎么放注意力","用沤的词：化不化、沉不沉、胀不胀。自测一句：能不能转。前屈和扭转时，注意上腹是软的、能让开，还是顶着。","How to rest your attention here","Use the words of soaking: is it breaking down, does it sink, is it bloated. One question to test it: does it turn? In forward folds and twists, notice whether the upper belly is soft and gives way, or pushes back."],["没有放在这里的","蝴蝶式不放在这里：它动的是髋，上腹不受压，测不到「能不能转」。","Left out on purpose","Butterfly is left out here: it works the hips and doesn't press the upper belly, so it can't answer \"does it turn?\""]],"src":["lingshu-yingwei-zhong","lingshu-yingwei-sanjiao","suwen-linglan-sanjiao","lingshu-benshu-gufu","lingshu-wulong-sanjiao","lingshu-benzang-couli","nanjing-31-sanjiao"]},"xiajiao":{"zh":"下焦","trad":"下焦","py":"Xiajiao","code":"Area","en":"Lower jiao","mer":"sjfu","place":"下腹","kind":"area","find":"手掌放在肚脐以下，一直到耻骨。这一片，连同盆腔，是下焦。","findEn":"Rest your palm below your navel, down to the pubic bone. This area, with the pelvis behind it, is the lower jiao.","st":"ok","q":"下焦要往下，那就跟排泄有关。如果一个人排泄功能不好，可能也会影响到站立体式。（猜想：没有找到研究支持，记在这里是因为练习中的观察值得记下来。）","about":[["三焦是什么","《灵枢·本输》叫三焦「孤之腑」。五脏只有五个，六腑却有六个，多出来的那一个就是三焦；后世把心包配给它，凑成表里，但心包不算一个独立的脏。它是一套通道，管水、管气，分上中下三段。经文用「膈」分开上焦和中焦；中焦和下焦之间，经文没有给结构上的边界，是按功能分的。三焦经是另一回事：一条从无名指端，经手臂外侧、肩、颈侧、耳后，到眼外角的线。","What the Sanjiao is","The Lingshu calls the Sanjiao the \"solitary fu\". There are five zang organs but six fu, and the Sanjiao is the sixth, the one left over; later tradition paired it with the pericardium, which is not a full zang organ in its own right. It is a set of passages for water and qi, in three sections. The classics divide the upper from the middle jiao at the diaphragm; between the middle and lower jiao they give no structural boundary, only a functional one. The Sanjiao channel is something else: a line from the tip of the ring finger, up the outside of the arm, over the shoulder and side of the neck, behind the ear, to the outer corner of the eye."],["下焦如渎","经文说下焦「别回肠，注于膀胱而渗入焉」：糟粕下到大肠，水液渗进膀胱。它的样子像渎，一条往下排的水沟。《难经》给它定了性：「主出而不内」。上焦出的是气，中焦出的是营气，下焦只管往外排。","Like a drainage ditch","The classics describe the lower jiao through the large intestine and the bladder: waste moves down into the large intestine, and fluids seep into the bladder. It works like a drainage ditch, carrying things down and out. The Classic of Difficulties sums it up: it \"lets out and never takes in\". The upper jiao gives qi, the middle jiao the nutritive qi, and the lower jiao only lets go."],["和现代解剖对照","大致是下腹和盆腔。上界在肚脐，只是体表标志：注家讲「别回肠」，说糟粕的分别发生在「脐上一寸水分穴处」，功能上是连过去的。下界是骨盆底，躯干的另一道肌性隔板，但它封住的是出口，不是把体腔分成两半：膈是分，盆底是封。肾的位置在腰部，比肚脐还高，后世却把它归在下焦：三焦是按功能分的，不是按高度分的。","Next to modern anatomy","Roughly the lower belly and the pelvis. Its upper edge, the navel, is only a surface landmark: a commentary places the sorting of waste one cun above the navel, so the function runs across it. Its lower edge is the pelvic floor, the trunk's other muscular sheet; but it seals the outlet rather than dividing the cavity in two. The diaphragm divides; the pelvic floor seals. The kidneys sit at the waist, higher than the navel, yet later tradition places them in the lower jiao: the Sanjiao is divided by function, not by height."],["和丹田、胯根的关系","同一片身体，三张图：在穴位图上是气海、关元，在内丹图上是丹田，在三焦图上是下焦。胯根在它的两侧，是腿接进来的地方。","The dantian and the kua root","One stretch of body on three maps: Qihai and Guanyuan on the acupoint map, the dantian on the inner-alchemy map, the lower jiao on the Sanjiao map. The kua root lies on either side, where the legs join it."],["怎么放注意力","用渎的词：通不通、顺不顺、往不往下走。自测一句：能不能排。桥式同时落在两张图上：抬髋时开上焦（胸），也动下焦（腹股沟），注意腹股沟是打开的还是缩着的。不说「下焦饱满」。日志里的「排便」那一项，就记在这里。","How to rest your attention here","Use the words of a ditch: does it flow, is it smooth, does it move downward. One question to test it: does it empty? Bridge sits on two maps at once: lifting the hips opens the upper jiao (the chest) and works the lower jiao (the groin); notice whether the groin opens or draws in. Never call the lower jiao full. The bowel field in the log belongs here."]],"src":["lingshu-yingwei-xia","zhu-xiajiao-rudu","nanjing-31-xiajiao","lingshu-yingwei-sanjiao","suwen-linglan-sanjiao","lingshu-benshu-gufu","lingshu-wulong-sanjiao","lingshu-benzang-couli"]},"kuagen":{"zh":"胯根","trad":"胯根","py":"Kua root","slug":"kuagen","code":"Area","en":"Kua root · inner groin","mer":"spleen","place":"腹股沟","kind":"area","region":true,"inside":[["冲门","SP12","#chongmen",""],["气冲","ST30","#qichong",""]],"findShort":"大腿根前内侧、腹股沟折痕下面凹下去的窝。只放注意力，不用力按。","findShortEn":"The hollow at the front of the inner thigh, just below the groin crease. Rest your attention; don't press.","find":"坐着，屈膝，膝盖往外打开。同侧手的中指放进大腿根和小腹相连的那条折痕。手掌盖住的这一片就是胯根。中指往深处轻轻探，会摸到一条往下凹的槽。","findEn":"Sit with your knee bent and dropped open to the side. Lay the middle finger of the same-side hand in the crease where the thigh meets the belly. The area under your palm is the kua root. Let the middle finger feel gently deeper: there is a groove that dips down.","st":"ok","q":"我不清楚这个地方到底叫什么，但是我觉得它把我整个身体给连起来了。","about":[["是一片区域，不是一个穴位","这个窝就是你在《胯根》里写的胯根：大腿根前内侧，腹股沟下面凹下去的那一片，每条腿各一个。穴位是点，这里是一片面。冲门、箕门、急脉这些穴位都落在这一片里，但不能说「这个窝就是某个穴」。","An area, not a point","This hollow is the kua root: the dip at the front of the inner thigh, just below the groin crease, one on each leg. An acupoint is a point; this is an area. Chongmen, Jimen and Jimai all sit inside it, but the hollow itself is not any one of them."],["和环跳隔着髋关节相对","胯根在髋关节的前内侧，环跳在髋关节的后外侧，两点隔着股骨头相对。所以「注意力点要成对」在一条腿上也成立：不是左右成对，是内外成对。","Facing Huantiao across the hip joint","The kua root sits at the front and inside of the hip joint; Huantiao sits at the back and outside. The two face each other across the head of the femur. So \"attention points come in pairs\" holds on a single leg too: not left and right, but inside and outside."],["在力线里","站立力线是一串窝：涌泉 → 太白（足弓）→ 膝盖内侧 → 胯根 → 环跳。这条线不是直的，是从腿的内侧往上，绕过髋关节，到外后方。","In the line of force","The standing line is a chain of hollows: Yongquan → Taibai (the arch) → the inner knee → the kua root → Huantiao. It isn't straight: it rises along the inside of the leg, wraps around the hip joint and ends at the back and outside."],["怎么放注意力","这里有股动脉和股神经经过。只放注意力，不用力按。","How to rest your attention here","The femoral artery and nerve pass through here. Rest your attention; don't press."]],"src":["nanjing-31-xiajiao","liver-route-jimai"]},"chongmen":{"zh":"冲门","trad":"衝門","py":"Chongmen","code":"SP12","en":"Surging Gate","mer":"spleen","place":"腹股沟","find":"半躺或平躺，腿伸直。右手食指和中指并拢，放在右边大腿根的折痕上，从外侧骨盆那块骨头旁边开始。沿折痕慢慢往里、往下移，找到一跳一跳的地方。从跳的地方往外挪一个手指宽，还在折痕里。","findEn":"Lie back, legs straight. Put your right index and middle fingers together on the crease at the top of your right thigh, beside the hip bone. Slide along the crease, inward and down, until you feel a beat. Then move one finger-width outward, still in the crease.","st":"try","src":[]},"qichong":{"zh":"气冲","trad":"氣衝","py":"Qichong","code":"ST30","en":"Surging Qi","mer":"st","place":"腹股沟","find":"平躺。中指从肚脐沿中线往下滑，滑到下腹最下面那块横着的硬骨，停在它上边。食指、中指、无名指并拢竖放，从这里往外量三个手指宽。那里能摸到一跳一跳的，就是。","findEn":"Lie on your back. Slide your middle finger down the midline from the navel to the hard crosswise bone at the bottom of the belly, and stop on its upper edge. Put the index, middle and ring fingers together, pointing up and down, and measure three finger-widths out from there. Where you feel a beat is the point.","st":"try","src":[]},"shenque":{"zh":"神阙","trad":"神闕","py":"Shenque","code":"CV8","en":"Spirit Gate","mer":"ren","place":"腹","find":"肚脐正中。","findEn":"The centre of the navel.","st":"ok","src":[]},"xiangxia":{"zh":"项下背上","trad":"項下背上","py":"Below the nape","code":"Area","en":"One palm of upper back","mer":"du","place":"上背","kind":"area","region":true,"focus":true,"bodyTags":["颈椎紧","上背紧","上背不舒服","头胀","颈椎放松"],"inside":[["大椎","GV14","#dazhui",""]],"regionAbout":[["怎么框这一片","上界是大椎：第 7 颈椎棘突，低头时后颈最突出的那块骨头。往下约到第 3 胸椎，两边到肩胛骨内缘。这是按「一只手竖着盖住」量出来的范围，是我们自己的框法；上面焦点卡里的国家标准一直列到第 7 胸椎。","Framing the area","Top edge: Dazhui, under the seventh cervical spine, the bone that stands out when you bow your head. Down to about the third thoracic vertebra, out to the inner edges of the shoulder blades. This assumes one hand laid vertically; still to confirm."],["先按，再定","《灵枢·背腧》：「按其处，应在中而痛解，乃其腧也。」先用手按，按到对得上的地方，再定位置。「应在中而痛解」怎么读，注家不一。（B）","Press first, then place","Lingshu, Beishu: find it by pressing first, then fix the place. How to read the last phrase is disputed. (B)"],["四层","这一片的穴位按离脊柱正中多远排成四层：正中（大椎、陶道、身柱）；旁开 1.5 寸（大杼、风门、肺俞）；旁开 2 寸只有一个，肩中俞 SI14，正在项背交界；旁开 3 寸（肩外俞 SI15、附分、魄户，和肩胛上的曲垣 SI13、秉风 SI12）。肩中俞、肩外俞、曲垣、秉风的定位来自普及读本，还没对国家标准原文。（B）","Four layers","By distance from the midline: on it (Dazhui, Taodao, Shenzhu); 1.5 cun out (Dazhu, Fengmen, Feishu); 2 cun out, only Jianzhongshu SI14, right at the nape–back boundary; 3 cun out (Jianwaishu SI15, Fufen, Pohu, and Quyuan SI13 and Bingfeng SI12 on the shoulder blade). The SI points are from popular manuals, not yet checked against the national standard. (B)"],["大椎","项和背的分界点。历代都说它是督脉和手足三阳经交会的地方，「诸阳之会」。（B）","Dazhui","Where the nape ends and the back begins; traditionally the meeting point of the Governing Vessel and the six yang channels. (B)"],["大杼：骨会","八会穴里的「骨会」就在这一片：「骨会大杼」（《针灸聚英》引《难经》）。（B）","Dazhu, meeting point of bone","One of the eight meeting points lies here: \"the meeting of bone is Dazhu\" (Nanjing, via Zhenjiu Juying). (B)"],["「背者，胸中之府」的注","经文见上面焦点卡。注文：「背乃藏俞所系，故为胸中之府。」背之所以叫府，是因为五脏的俞穴都系在这里。注家未核。（B）","A gloss on \"the back is the mansion of the chest\"","Commentary: the back is called a mansion because the transport points of the organs are tethered to it. Commentator not yet identified. (B)"],["项背强几几","《伤寒论》原文只说「项背强几几」。「几几」至少有五种读法：成无己读「殊」，短羽之鸟不能飞腾，动则先伸引其头（罗天益说这一解「甚得仲景旨」）；罗天益：如几，人疾屈而强；谢复古：凭几而起（被罗天益否定）；方有执：颈项俱病，俯仰不能自如；吴仪洛：颈不舒。连字形都有争议：程应旄作「兀」，程林作「𠘧」。和你 11/17 的感觉对得上的是成无己、方有执两家：低头抬头都不顺。《素问·刺腰痛》的「几几然」说的是另一件事，不互相解释。原文后半的方药不引用。（B）","Xiangbei qiang jiji","The Shanghan Lun only says \"stiff nape and back, jiji\". At least five readings of jiji survive; the two that match Wei's body on 17 Nov are Cheng Wuji (a short-feathered bird stretching its head before it moves) and Fang Youzhi (neck and nape both affected, unable to bow or lift the head freely). The Suwen usage is a different context. The formula in the second half is not quoted. (B)"]],"find":"后颈根下方，身体背面，从脊柱正中向两边，一只手能盖住的地方。","findEn":"Below the root of the neck, on the back, spreading out from the spine: the area one hand can cover.","st":"try","src":[]},"jianwo":{"zh":"肩窝","trad":"肩窩","py":"Shoulder hollow","slug":"shoulder-hollow","code":"Area","en":"Shoulder hollow","mer":"lung","place":"肩前","kind":"area","region":true,"find":"锁骨外端下面、肩前那个凹下去的窝。手掌轻轻盖住，盖住的这一片就是肩窝。","findEn":"The hollow under the outer end of the collarbone, at the front of the shoulder. Cover it lightly with your palm; the area under your hand is the shoulder hollow.","st":"ok","q":"一旦把觉知放在肩窝，手指自己会动，手腕自己会动。","src":[],"about":[["是一片区域，不是一个穴位","云门、中府都落在这一片里，但练习里感受到的是整个窝，不是其中某一个点。","An area, not a point","Yunmen and Zhongfu both lie inside it, but in practice what you feel is the whole hollow, not one point in it."]],"inside":[["云门","LU2","#yunmen",""],["中府","LU1","#zhongfu",""]]},"xiongqiang":{"zh":"胸腔","trad":"胸腔","py":"Thoracic cavity","slug":"thoracic-cavity","code":"Area","en":"Thoracic cavity","mer":"ren","place":"胸","kind":"area","region":true,"find":"手掌平放在胸骨上。掌心对着的里面，肋骨围起来的这一片，就是胸腔。","findEn":"Lay your palm flat on your breastbone. Inside, behind it, the space your ribs wrap around is the thoracic cavity.","st":"try","src":[],"about":[["是一片地方，不是穴位","胸腔是日常身体的说法，国标里没有叫这个名字的穴位。同一片在别的地图上的名字，见「在别的地图上」。","A place, not a point","\"Thoracic cavity\" is a word for a place in the body; no point in the national standard has this name. For the names of the same stretch on other maps, see \"On other maps\"."]]},"fuqiang":{"zh":"腹腔","trad":"腹腔","py":"Abdominal cavity","slug":"abdominal-cavity","code":"Area","en":"Abdominal cavity","mer":"ren","place":"腹","kind":"area","region":true,"find":"手掌平放在肚子上，肚脐在掌心下面。掌心对着的里面，这一大片就是腹腔。它往下和盆腔连着，中间没有隔开。","findEn":"Lay your palm flat on your belly, navel under the centre of your palm. Inside, behind it, this large space is the abdominal cavity. Below, it runs on into the pelvic cavity with nothing dividing them.","st":"try","src":[],"about":[["是一片地方，不是穴位","腹腔是日常身体的说法，国标里没有叫这个名字的穴位。同一片在别的地图上的名字，见「在别的地图上」。","A place, not a point","\"Abdominal cavity\" is a word for a place in the body; no point in the national standard has this name. For the names of the same stretch on other maps, see \"On other maps\"."]]},"penqiang":{"zh":"盆腔","trad":"盆腔","py":"Pelvic cavity","slug":"pelvic-cavity","code":"Area","en":"Pelvic cavity","mer":"ren","place":"骨盆","kind":"area","region":true,"find":"一只手掌放在肚脐下面、耻骨上面，另一只手掌放在背后的骶骨上。两只手中间、骨盆围起来的这一片，就是盆腔。","findEn":"One palm below your navel, above the pubic bone; the other on your sacrum at the back. Between your hands, the space your pelvis wraps around is the pelvic cavity.","st":"try","src":[],"about":[["是一片地方，不是穴位","盆腔是日常身体的说法，国标里没有叫这个名字的穴位。同一片在别的地图上的名字，见「在别的地图上」。","A place, not a point","\"Pelvic cavity\" is a word for a place in the body; no point in the national standard has this name. For the names of the same stretch on other maps, see \"On other maps\"."]]},"xinei":{"zh":"膝盖内侧","trad":"膝蓋內側","py":"Inner knee","slug":"inner-knee","code":"Area","en":"Inner knee","mer":"spleen","place":"膝盖","kind":"area","region":true,"find":"坐着，翘起二郎腿。用对侧的手盖住上面那条腿的膝盖，掌心正对膝盖骨。手自然地盖上去，大拇指根那块肉下面，膝盖骨内侧边上，会摸到一个窝。","findEn":"Sit and cross one leg over the other. Cover the top knee with the opposite hand, palm right over the kneecap. Let it rest there naturally: under the fleshy pad at the base of your thumb, beside the inner edge of the kneecap, you will feel a hollow.","st":"ok","q":"找到这个窝的时候，很有感觉。","src":[],"about":[["是一片地方，不是穴位","膝盖内侧是日常身体的说法，国标里没有叫这个名字的穴位。附近有名字的穴位，见「在别的地图上」。","A place, not a point","\"Inner knee\" is an everyday word for the body; no point in the national standard has this name. For the named points nearby, see \"On other maps\"."]]},"yunmen":{"zh":"云门","trad":"雲門","py":"Yunmen","code":"LU2","en":"Cloud Gate","mer":"lung","place":"肩前","find":"手叉腰，锁骨外端下面会出现一个窝。","findEn":"Hands on hips: a hollow appears just below the outer end of the collarbone.","st":"ok","q":"这里没被挤住时，力从手指连到肩胛和胸廓。","src":[]},"fengfu":{"zh":"风府","trad":"風府","py":"Fengfu","code":"GV16","en":"Wind Palace","mer":"du","place":"项","find":"一只手，中指指腹放在脖子后面发际线的正中，往上推。推到后脑勺那块骨头挡住手指的地方，手指下面那个小凹陷就是风府。","findEn":"One hand: put the pad of your middle finger on the hairline at the middle of the back of your neck and push upwards. Where the bone at the back of your skull stops the finger, the small hollow under it is Fengfu.","st":"ok","q":"2026-11-20：照着找，马上就找到了。","bodyTags":["颈椎紧","颈椎放松"],"src":[]},"fengchi":{"zh":"风池","trad":"風池","py":"Fengchi","code":"GB20","en":"Wind Pool","mer":"gb","place":"颈","find":"双手十指交叉抱住后脑勺，两个拇指放在后脑勺最下沿，从中间往两边慢慢滑。大约滑到耳朵和脖子正中的一半，拇指落进一个凹窝，左右各一个。","findEn":"Interlace your fingers and cradle the back of your head, thumbs on the lower edge of the skull. Slide them slowly outwards from the middle. About halfway between the ear and the middle of the neck, each thumb drops into a hollow, one on each side.","st":"try","bodyTags":["颈椎紧","头胀","头晕","颈椎放松"],"src":["jiayi-fengchi"]},"yuji":{"zh":"鱼际","trad":"魚際","py":"Yuji","code":"LU10","en":"Fish Border","mer":"lung","place":"掌心","find":"手掌朝上。大拇指下面有一根骨头，沿着它找到中间。手指在这里从手心往侧边摸过去：手心的皮肤软，翻到侧边就变硬、变紧了。软变硬的那条线上，就是。","findEn":"Palm up. Under the thumb runs a bone; find the middle of it. There, feel from the palm toward the side of the hand: the palm skin is soft, and as you come round the edge it turns firmer and tighter. The point is on that line where soft turns firm.","st":"ok","q":"眼镜蛇推起来的时候，手上明显是鱼际。","src":[]},"taiyang":{"zh":"太阳","trad":"太陽","py":"Taiyang","code":"EX-HN5","en":"Temple","mer":"extra","place":"头侧","find":"眉梢和外眼角连线的中点，往后约一横指，按下去有一个软的凹陷。咬一下牙，这里的肌肉会鼓起来：那是颞肌。","findEn":"From the midpoint between the end of the eyebrow and the outer corner of the eye, go back about a finger's width to a soft hollow. Clench your teeth and the muscle here bulges: that is the temporalis.","st":"try","q":"待试：做「下颌放松」时，注意力同时放在太阳穴，看它会不会跟着松开。","src":[]},"yintang":{"zh":"印堂","trad":"印堂","py":"Yintang","code":"GV24+","en":"Hall of Impression","mer":"du","place":"额","find":"两眉头连线的正中。","findEn":"Midway between the inner ends of the eyebrows.","st":"ok","q":"婴儿式里额头点地，慢慢转动额头，头觉得轻了一些。","src":[]},"dazhui":{"zh":"大椎","trad":"大椎","py":"Dazhui","code":"GV14","en":"Great Vertebra","mer":"du","place":"项背交界","find":"低头，后颈根最突出的那块骨头（第 7 颈椎）。它下面的那个凹陷，在脊柱正中，就是大椎。","findEn":"Bow your head: the bone that stands out most at the root of the neck is the seventh cervical vertebra. The hollow just below it, on the midline, is Dazhui.","st":"ok","q":"2026-11-20：收下巴时，从大椎沿着一条线一直到风府。","bodyTags":["颈椎紧","上背紧","上背不舒服","头胀","颈椎放松"],"about":[["项和背的分界","大椎以上属项，以下属背。「项下背上，一掌之区」的上界就是它。","Where the nape ends","Above Dazhui is the nape, below it the back. It is the top edge of the one-palm area below the nape."],["诸阳之会","历代都说大椎是督脉和手足三阳经交会的地方，「诸阳之会」。（B）","Meeting of the yang channels","Traditionally Dazhui is the meeting point of the Governing Vessel and the six yang channels. (B)"]],"src":[]},"taibai":{"zh":"太白","trad":"太白","py":"Taibai","code":"SP3","en":"Supreme White","mer":"spleen","place":"足内侧","find":"坐着，看脚内侧。大脚趾根部后面有一块鼓起的骨头。从这块骨头往脚跟方向摸，刚过骨头就有一个小窝，在脚底和脚背颜色交界的那条边上。","findEn":"Sit and look at the inside of your foot. Behind the base of the big toe is a bony bump. Feel from it toward the heel: just past the bone is a small hollow, on the line where the colour of the sole meets the colour of the top of the foot.","st":"ok","q":"","about":[["弓的前端支点","第 1 跖骨头是脚内侧纵弓的前方支点，太白就在这个支点稍后。","The front pivot of the arch","The head of the first metatarsal is the forward support of the inner longitudinal arch, and Taibai sits just behind it."]],"src":[]},"taichong":{"zh":"太冲","trad":"太衝","py":"Taichong","code":"LR3","en":"Great Rush","mer":"liver","place":"脚背","find":"脚背上，大脚趾和第二脚趾之间，往脚踝方向推，推到两根骨头相接前的凹陷。","findEn":"On top of the foot, slide from the web between the big and second toes towards the ankle, into the hollow just before the two bones meet.","st":"try","q":"待试：头朝下的时候，注意力放在太冲或涌泉，看头部的胀感有没有不同。","src":[]}};
const STD_LOC={"yintang": {"zh": "在头部，两眉毛内侧端中间的凹陷中。", "en": "On the head, in the depression between the medial ends of the two eyebrows.", "code": "GV24+", "ok": true, "enSelf": true, "note": "印堂原为经外奇穴，2006 年版国标归入督脉，编号 GV29；2021 年版改编号为 GV24+，移到神庭和素髎之间。WHO 2008 标准只收 361 个经穴，没有印堂，所以这里的英文是自译。", "noteEn": "Yintang was originally an extra point. The 2006 Chinese standard placed it on the Governing Vessel as GV29; the 2021 edition renumbered it GV24+ and moved it between Shenting (GV24) and Suliao (GV25). The WHO 2008 standard covers 361 channel points and does not include Yintang, so the English here is our own translation.", "gb": {"c": "5.13.25", "p": "29", "grade": "A", "notes": ["左右攒竹（BL2）连线的中点。"], "notesEn": ["The midpoint of the line between left and right Cuanzhu (BL2)."]}}, "taiyang": {"zh": "在头部，眉梢与目外眦之间，向后约一横指（中指）的凹陷中。", "en": "On the head, in the depression about one finger-breadth (the middle finger) posterior to the midpoint between the lateral end of the eyebrow and the outer canthus.", "code": "EX-HN5", "ok": true, "enSelf": true, "note": "GB/T 40997-2021 原文写「在头部」，不是有些教材的「在颞部」。标准原注：丝竹空（TE23）与瞳子髎（GB1）连线中点向外约一横指处。", "noteEn": "GB/T 40997-2021 says \"on the head\", not \"on the temporal region\" as some textbooks put it. The standard adds: about one finger-breadth lateral to the midpoint of the line between Sizhukong (TE23) and Tongziliao (GB1)."}, "fengchi": {"zh": "在项部，枕骨之下，胸锁乳突肌上端与斜方肌上端之间的凹陷中。", "en": "In the posterior region of the neck, inferior to the occipital bone, in the depression between the origins of the sternocleidomastoid and the trapezius muscles.", "code": "GB20", "ok": true, "enOk": true, "note": "第 3.6.20 条（基准穴点，第 4 页）文字相同。项专指脖子后面（《说文》：「项，头后也。」）。", "noteEn": "Clause 3.6.20 (reference points, p. 4) reads the same. The nape (项) means the back of the neck only.", "gb": {"c": "5.11.20", "p": "25", "grade": "A", "notes": ["项部枕骨下两侧，横平风府（GV16），胸锁乳突肌与斜方肌两肌之间凹陷中。"], "notesEn": ["On both sides of the nape below the occipital bone, level with Fengfu (GV16), in the hollow between the sternocleidomastoid and trapezius."]}}, "yunmen": {"zh": "在前胸部，锁骨下窝凹陷中，肩胛骨喙突内缘，前正中线旁开6寸。", "en": "On the anterior thoracic region, in the depression of the infraclavicular fossa, medial to the coracoid process of the scapula, 6 B-cun lateral to the anterior median line.", "code": "LU2", "ok": true, "enOk": true, "gb": {"c": "5.1.2", "p": "8", "grade": "A", "notes": ["横平内侧的气户（ST13）、俞府（KI27）、璇玑（CV21），4穴略呈一弧形分布，其弧度与锁骨下缘弧度相应。"], "notesEn": ["Level with Qihu (ST13), Shufu (KI27) and Xuanji (CV21) on the inside; the four points lie on a slight arc that follows the curve of the lower edge of the collarbone."]}}, "zhongfu": {"zh": "在前胸部，横平第1肋间隙，锁骨下窝外侧，前正中线旁开6寸。", "en": "On the anterior thoracic region, at the same level as the first intercostal space, lateral to the infraclavicular fossa, 6 B-cun lateral to the anterior median line.", "code": "LU1", "ok": true, "enOk": true, "gb": {"c": "5.1.1", "p": "8", "grade": "A", "notes": ["先确定云门（LU2），中府即在云门（LU2）下1寸。", "横平内侧的库房（ST14）、彧中（KI26）、华盖（CV20），4穴略呈一弧形分布，其弧度与第1肋间隙弧度相应。"], "notesEn": ["First locate Yunmen (LU2); Zhongfu is 1 cun below Yunmen (LU2).", "Level with Kufang (ST14), Yuzhong (KI26) and Huagai (CV20) on the inside; the four points lie on a slight arc that follows the curve of the first intercostal space."]}}, "dabao": {"zh": "在侧胸部，第6肋间隙，腋中线上。", "en": "In the lateral thoracic region, in the sixth intercostal space, on the midaxillary line.", "code": "SP21", "ok": true, "enOk": true, "gb": {"c": "5.4.21", "p": "14", "grade": "A", "notes": ["侧卧举臂，在第6肋间隙与腋中线的交点处。"], "notesEn": ["Lying on the side with the arm raised: where the sixth intercostal space meets the midaxillary line."]}}, "laogong": {"zh": "在手掌，横平第3掌指关节近端，第2、3掌骨之间偏于第3掌骨。", "en": "On the palm of the hand, in the depression between the second and third metacarpal bones, proximal to the metacarpophalangeal joints.", "code": "PC8", "ok": true, "enOk": true, "gb": {"c": "5.9.8", "p": "22", "grade": "A", "notes": ["握拳屈指时，中指尖点到处，第3掌骨桡侧。", "另一种定位：在手掌，横平第3掌指关节近端，第3、4掌骨之间偏于第3掌骨。"], "notesEn": ["Make a fist and bend the fingers: where the tip of the middle finger lands, on the radial side of the third metacarpal.", "Alternative location: on the palm, level with the proximal end of the third metacarpophalangeal joint, between the third and fourth metacarpals, nearer the third."]}}, "yuji": {"zh": "在手掌，第1掌骨桡侧中点赤白肉际处。", "en": "On the palm, radial to the midpoint of the first metacarpal bone, at the border between the red and white flesh.", "code": "LU10", "ok": true, "enOk": true, "gb": {"c": "5.1.10", "p": "8", "grade": "A", "notes": [], "notesEn": []}}, "yemen": {"zh": "在手背，第4、5指间，指蹼缘上方赤白肉际凹陷中。", "en": "On the dorsum of the hand, in the depression superior to the web margin between the ring and little fingers, at the border between the red and white flesh.", "code": "TE2", "ok": true, "enOk": true, "gb": {"c": "5.10.2", "p": "22", "grade": "A", "notes": [], "notesEn": []}}, "shangyang": {"zh": "在手指，食指末节桡侧，指甲根角侧上方0.1寸。", "en": "On the index finger, radial to the distal phalanx, 0.1 F-cun proximal-lateral to the radial corner of the index fingernail, at the intersection of the vertical line of the radial border of the fingernail and the horizontal line of the base of the index fingernail.", "code": "LI1", "ok": true, "enOk": true, "gb": {"c": "5.2.1", "p": "8", "grade": "A", "notes": ["食指桡侧指甲根角侧上方（即沿角平分线方向）0.1寸。相当于沿爪甲桡侧画一直线与爪甲基底缘水平线交点处取穴。"], "notesEn": ["0.1 cun from the radial corner of the index fingernail (along the line bisecting the corner). That is, where a line along the radial edge of the nail meets a line along the base of the nail."]}}, "shenque": {"zh": "在上腹部，脐中央。", "en": "On the upper abdomen, in the centre of the umbilicus.", "code": "CV8", "ok": true, "enOk": true, "note": "中国标准和 WHO 都把肚脐算在「上腹部」。", "noteEn": "Both the Chinese standard and WHO place the navel in the upper abdomen.", "gb": {"c": "5.14.8", "p": "30", "grade": "A", "notes": [], "notesEn": []}}, "qihai": {"zh": "在下腹部，脐中下1.5寸，前正中线上。", "en": "On the lower abdomen, 1.5 B-cun inferior to the centre of the umbilicus, on the anterior median line.", "code": "CV6", "ok": true, "enOk": true, "gb": {"c": "5.14.6", "p": "29–30", "grade": "A", "notes": [], "notesEn": []}}, "mingmen": {"zh": "在腰部，第2腰椎棘突下凹陷中，后正中线上。", "en": "In the lumbar region, in the depression inferior to the spinous process of the second lumbar vertebra (L2), on the posterior median line.", "code": "GV4", "ok": true, "enOk": true, "gb": {"c": "5.13.4", "p": "28", "grade": "A", "notes": [], "notesEn": []}}, "qugu": {"zh": "在下腹部，耻骨联合上缘，前正中线上。", "en": "On the lower abdomen, superior to the pubic symphysis, on the anterior median line.", "code": "CV2", "ok": true, "enOk": true, "gb": {"c": "5.14.2", "p": "29", "grade": "A", "notes": [], "notesEn": []}}, "chongmen": {"zh": "在腹股沟，腹股沟斜纹中，髂外动脉搏动处的外侧。", "en": "In the groin region, at the inguinal crease, lateral to the femoral artery.", "code": "SP12", "ok": true, "enOk": true, "note": "中文标准写「髂外动脉」，WHO 写 femoral artery（股动脉）。是同一条动脉：髂外动脉过了腹股沟韧带就叫股动脉。", "noteEn": "The Chinese standard names the external iliac artery; WHO names the femoral artery. They are one vessel: the external iliac artery becomes the femoral artery below the inguinal ligament.", "gb": {"c": "5.4.12", "p": "13", "grade": "A", "notes": ["横平曲骨（CV2），府舍（SP13）稍内下方。"], "notesEn": ["Level with Qugu (CV2), slightly medial and inferior to Fushe (SP13)."]}}, "qichong": {"zh": "在腹股沟，耻骨联合上缘，前正中线旁开2寸，动脉搏动处。", "en": "In the groin region, at the same level as the superior border of the pubic symphysis, 2 B-cun lateral to the anterior median line, over the femoral artery.", "code": "ST30", "ok": true, "enOk": true, "note": "中文标准只写「动脉搏动处」，WHO 写明是股动脉（femoral artery）。", "noteEn": "The Chinese standard says only \"where the artery pulses\"; WHO names it as the femoral artery.", "gb": {"c": "5.3.30", "p": "11", "grade": "A", "notes": ["天枢（ST25）下5寸，曲骨（CV2）旁开2寸。"], "notesEn": ["5 cun below Tianshu (ST25), 2 cun lateral to Qugu (CV2)."]}}, "baliao": {"zh": "上髎：在骶部，正对第1骶后孔中。次髎：在骶部，第2骶后孔中。中髎：在骶部，正对第3骶后孔中。下髎：在骶部，正对第4骶后孔中。", "en": "Shangliao, Ciliao, Zhongliao and Xialiao (BL31–BL34), one on each side: in the sacral region, in the first, second, third and fourth posterior sacral foramen respectively.", "code": "BL31–BL34", "ok": true, "enOk": true, "note": "分区词「骶部」是国标自己的用词，见附录 B 表 B.1（第 32 页）。四个穴左右各一，共八穴。每个穴另有一条取穴的注，见下面「这一片里的标准穴位」。", "noteEn": "\"Sacral region\" (骶部) is the standard's own regional term (Annex B, table B.1, p. 32). Each of the four points is on both sides, eight in all. Each point also has a short note on how to find it; see the list of standard points below.", "gb": {"c": "5.7.31–5.7.34", "p": "18", "grade": "A", "notes": [], "notesEn": []}}, "baohuang": {"zh": "在臀部，横平第2骶后孔，骶正中嵴旁开3寸。", "en": "In the buttock region, at the same level as the second posterior sacral foramen, 3 B-cun lateral to the median sacral crest.", "code": "BL53", "ok": true, "enOk": true, "gb": {"c": "5.7.53", "p": "19", "grade": "A", "notes": ["本穴与内侧的膀胱俞（BL28）、次髎（BL32）均位于第2骶后孔水平。"], "notesEn": ["This point, Pangguangshu (BL28) and Ciliao (BL32) on the inside all lie level with the second posterior sacral foramen."]}}, "zhibian": {"zh": "在臀部，横平第4骶后孔，骶正中嵴旁开3寸。", "en": "In the buttock region, at the same level as the fourth posterior sacral foramen, 3 B-cun lateral to the median sacral crest.", "code": "BL54", "ok": true, "enOk": true, "gb": {"c": "5.7.54", "p": "19", "grade": "A", "notes": ["本穴位于骶管裂孔旁开３寸，横平白环俞（BL30）。"], "notesEn": ["This point is 3 cun lateral to the sacral hiatus, level with Baihuanshu (BL30)."]}}, "huantiao": {"zh": "在臀部，股骨大转子最凸点与骶管裂孔连线的外1/3与内2/3交点处。", "en": "In the buttock region, at the junction of the lateral one third and medial two thirds of the line connecting the prominence of the greater trochanter with the sacral hiatus.", "code": "GB30", "ok": true, "enOk": true, "gb": {"c": "5.11.30", "p": "26", "grade": "A", "notes": ["侧卧，伸下腿，上腿屈髋屈膝取穴。"], "notesEn": ["Lie on your side, lower leg straight, upper leg bent at hip and knee."]}}, "xuehai": {"zh": "在股前内侧，髌底内侧端上2寸，股内侧肌隆起处。", "en": "On the anteromedial aspect of the thigh, on the bulge of the vastus medialis muscle, 2 B-cun superior to the medial end of the base of the patella.", "code": "SP10", "ok": true, "enOk": true, "gb": {"c": "5.4.10", "p": "13", "grade": "A", "notes": [], "notesEn": []}}, "taixi": {"zh": "在踝后内侧，内踝尖与跟腱之间的凹陷中。", "en": "On the posteromedial aspect of the ankle, in the depression between the prominence of the medial malleolus and the calcaneal tendon.", "code": "KI3", "ok": true, "enOk": true, "gb": {"c": "5.8.3", "p": "20", "grade": "A", "notes": [], "notesEn": []}}, "yongquan": {"zh": "在足底，屈足卷趾时足心最凹陷中。", "en": "On the sole of the foot, in the deepest depression of the sole when the toes are flexed.", "code": "KI1", "ok": true, "enOk": true, "gb": {"c": "5.8.1", "p": "20", "grade": "A", "notes": ["卧位或伸腿坐位，卷足，约当足底第2、3趾蹼缘与足跟连线的前1/3与后2/3交点凹陷中。"], "notesEn": ["Lying down or sitting with legs straight, curl the toes: roughly in the hollow at the junction of the front third and back two thirds of the line from the web between the 2nd and 3rd toes to the heel."]}}, "taichong": {"zh": "在足背，第1、2跖骨间，跖骨底结合部前方凹陷中，或触及动脉搏动。", "en": "On the dorsum of the foot, between the first and second metatarsal bones, in the depression distal to the junction of the bases of the two bones, over the dorsalis pedis artery.", "code": "LR3", "ok": true, "enOk": true, "gb": {"c": "5.12.3", "p": "27", "grade": "A", "notes": ["从第1、2跖骨间向后推移至底部的凹陷中取穴。"], "notesEn": ["Slide back between the first and second metatarsals into the hollow at their base."]}}, "fengfu": {"zh": "在颈后部，枕外隆凸直下，两侧斜方肌之间凹陷中。", "en": "In the posterior region of the neck, directly inferior to the external occipital protuberance, in the depression between the trapezius muscles.", "code": "GV16", "ok": true, "gb": {"c": "5.13.16", "p": "28", "grade": "A", "notes": ["注：正坐，头稍仰，使项部斜方肌松弛，从项后发际正中上推至枕骨而止即是本穴。"], "notesEn": ["Note: sit upright with the head tilted slightly back so the trapezius relaxes; push up from the middle of the hairline at the back of the neck until the occipital bone stops you: that is the point."]}}, "dazhui": {"zh": "在颈后部，第7颈椎棘突下凹陷中，后正中线上。", "en": "In the posterior region of the neck, in the depression inferior to the spinous process of the seventh cervical vertebra (C7), on the posterior median line.", "code": "GV14", "ok": true, "gb": {"c": "5.13.14", "p": "28", "grade": "A", "notes": [], "notesEn": []}}, "taibai": {"zh": "在足内侧，第1跖趾关节近端赤白肉际凹陷中。", "en": "On the medial aspect of the foot, in the depression proximal to the first metatarsophalangeal joint, at the border between the red and white flesh.", "code": "SP3", "ok": true, "gb": {"c": "5.4.3", "p": "13", "grade": "A", "notes": [], "notesEn": []}}};
