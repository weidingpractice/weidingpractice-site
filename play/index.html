:root[data-theme="dark"]{--bg:#121a1b;--surface:#192324;--ink:#e4ebe9;--muted:#9aa9a7;--line:#2b3839;--water:#6cc2ba;--water-soft:#1d3433;--seal:#e07a62;--seal-soft:#3a2420;color-scheme:dark}

h1{font-size:30px}h2{font-size:22px}
.en{color:var(--muted);font-size:.82em;font-weight:400}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.cards{font-size:13px;color:var(--muted);background:none;border:0;padding:0;cursor:pointer;font:inherit;font-size:13px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:0;text-align:left;background:var(--surface);color:inherit;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;cursor:pointer;min-width:0}
.tile:hover,.tile:focus-visible{border-color:var(--water);outline:none}
.tile b{font-weight:500}.tile span{font-size:13px;color:var(--muted)}
.clue{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px}
.clue .q{font-family:var(--display);font-size:20px;line-height:1.5}
.breath{display:flex;align-items:center;gap:16px}
.dot{width:56px;height:56px;border-radius:50%;background:var(--water-soft);border:2px solid var(--water);flex:none;animation:br 10s ease-in-out infinite}
@keyframes br{0%,100%{transform:scale(.6)}50%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;border-radius:999px;padding:10px 16px;border:1px solid var(--line);background:var(--surface);color:inherit;cursor:pointer}
.btn.main{background:var(--water);border-color:var(--water);color:var(--bg)}
.btn:hover{border-color:var(--water)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:12px}
.card .name{font-family:var(--display);font-size:34px;line-height:1.1}
.card .name small{font-family:var(--body);font-size:14px;color:var(--muted);margin-left:8px}
.lv{display:flex;gap:4px}.lv i{width:22px;height:6px;border-radius:3px;background:var(--line)}.lv i.on{background:var(--water)}
.layer{border-left:3px solid var(--water);padding-left:12px;display:flex;flex-direction:column;gap:2px}
.layer .k{font-size:12px;letter-spacing:.06em;color:var(--muted)}
.classic{font-family:var(--display);font-size:19px}
.next{border-left-color:var(--seal)}
.clearing{background:var(--seal-soft);border-radius:10px;padding:10px 12px;font-size:14px}
.small{font-size:13px;color:var(--muted)}
.why{font-size:14px;color:var(--muted);border-left:2px solid var(--line);padding-left:8px}
a{color:var(--water);text-underline-offset:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{font-size:13px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--surface)}
footer{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
</style>

  :['换一棵树',(()=>{const o=x.others.filter(n=>n.id!==p.id);if(!o.length)return esc('明天在'+p.zh+'里再找一次。');const n=o.find(q=>q.why)||o[0];const sh=n.why?n.why.split(/[，。；！？,.]/)[0]:'';return `<span><a href="${SITE}${esc(n.slug)}.html" target="_blank" rel="noopener">${esc(n.zh)}</a>里也有${esc(x.zh)}${sh?'：'+esc(sh.length>22?sh.slice(0,22)+'…':sh):''}。</span>`})()];
 app.innerHTML=topbar()+`<div class="step">发芽</div>
 <div class="card"><div class="name">${esc(x.zh)}<small>${esc(x.code)}</small></div>
  <div class="lv" aria-label="已打开 ${lv} / ${L.length} 层">${L.map((_,i)=>`<i class="${i<lv?'on':''}"></i>`).join('')}</div>
  <p class="small">${isNew?'新词卡 · 你在'+esc(p.zh)+'里找到了它。':full?'这张词卡已经全部打开。林子每天在长，以后会有新的一层。':'这张词卡打开了第 '+lv+' 层'+(lv<L.length?'。同样的地方，下次会再开一层。':'，全部打开了。')}</p>
  <div class="layer"><span class="k">${esc(opened[0])}</span><span>${opened[1]}</span></div>
  ${S.status==='maybe'?`<p class="clearing">这块是空地：${esc(p.zh)}和${esc(x.zh)}之间，还没有人走通过。你感觉到了什么，都是第一手的。</p>`:''}
  <div class="layer next"><span class="k">${esc(nxt[0])}</span><span style="display:flex;flex-direction:column;gap:4px">${nxt[1].startsWith('<')?nxt[1]:esc(nxt[1])}</span></div>
  <p class="small"><a href="${SITE}${esc(x.slug)}.html" target="_blank" rel="noopener">走进林子看${esc(x.zh)} →</a>　每一页最下面，可以留一片叶子。</p></div>
 <div class="row"><button class="btn main" data-go="again">再来一局</button><button class="btn" data-go="home">换一个体式</button></div>`+foot()}
function cards(){const ks=Object.keys(CARDS);
 app.innerHTML=topbar()+`<h2>你的词卡<span class="en"> · Your cards</span></h2>
 ${ks.length?`<div class="chips">${ks.map(k=>`<span class="chip">${esc(D.points[k]?.zh||k)} · ${CARDS[k]} 层</span>`).join('')}</div>`:'<p class="small">还没有。玩一局，就有第一张。</p>'}
 <p class="small">林子里一共 ${Object.keys(D.points).length} 个地方。词卡只存在你自己的浏览器里。</p>
 <p><button class="btn" data-go="home">← 回去</button></p>`+foot()}
function foot(){return `<footer>只讲注意力放在哪里，不是诊断，也不是治疗。有伤病或疼痛，请先咨询医生。线索来自一个练习者的身体笔记 · <a href="${SITE}" target="_blank" rel="noopener">走进林子</a></footer>`}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
 if(t.dataset.pose){S.pose=t.dataset.pose;feel()}
 else if(t.dataset.feel){S.feel=t.dataset.feel;clue()}
 else if(t.dataset.ans){S.answer=t.dataset.ans;report()}
 else if(t.dataset.go==='home')home();
 else if(t.dataset.go==='again'){clue()}
 else if(t.dataset.tree){S.force=S.pt;S.pose=t.dataset.tree;S.feel='any';clue()}
 else if(t.dataset.go==='cards')cards();
 window.scrollTo(0,0)});
home();
