const JOURNAL=[{"n": 1, "slug": "journal-yang-habits-in-yin", "date": "15 November 2026", "title": "Noticing My Yang Habits in Yin", "summary": "I had changed the duration, but not the way I was practising.", "principles": ["幅度永远不是重点。"], "paras": ["In a seated forward fold (Caterpillar), I would almost automatically approach it as Paschimottanasana: inhale to lengthen, exhale to go deeper, then use muscular effort to hold that position for three to five minutes.", "I had changed the duration, but not the way I was practising.", "Austin described repeated lifting and folding with the breath as a yang method: engaging the muscles to move deeper. His instruction for Yin was to find the edge, stay there and relax.", "His explanation helped me recognise the effort I was carrying into the pose. He described how muscular contraction pulls things tight, and how relaxing allows things to lengthen. I was still pulling myself forward and holding on.", "Austin described Yin as placing more emphasis on connective tissues, including fascia, tendons and ligaments. He also stressed that these cannot be isolated from muscles. The distinction is about focus.", "In Bananasana, he made the approach tangible: stop where the body naturally stops, avoid pulling further, and give it time. If the position becomes easier, a small adjustment may become available.", "I'm used to making an adjustment to deepen a stretch. I'm less used to waiting and noticing whether the experience changes before I do anything more.", "Another instruction stayed with me: “You can't force yourself to relax.” It made me wonder whether I might bring that same habit of effort to softening — turning relaxation into another task to accomplish.", "What I'm learning is to find a position where I can begin to let go, and give myself time to notice what happens.", "Three to five minutes gives me time to notice those habits. It doesn't automatically change them."], "sign": "Wei Ding · Practice journal, reflecting on Austin's Yin Yoga training.", "dateShort": "2026-11-15"}];

const PRIVACY_HTML="\"<section class=\"prose\">\n<h2>找到了吗<span class=\"en\">Did you find it?</span></h2>\n<p>每个穴位页上「找到了吗」的回答，和「我也感觉到了」一样：只记每个穴位被点了几次「找到了」、几次「没找到」，不记名字，不记 IP，不用 cookie。我们用它来改写那几句「用手怎么找」。<span class=\"en\">Answers to “Did you find it?” on each point page work like “Me too”: only how many times each point got “Yes” or “No”. No names, no IP addresses, no cookies. We use the counts to rewrite the directions.</span></p>\n<h2>我也感觉到了<span class=\"en\">Me too</span></h2>\n<p>只记每一处被点了几次。不记名字，不记 IP，不用 cookie。你的浏览器会在本机记住你点过，免得重复计数；清除浏览器数据，它就忘了。计数由 Cloudflare 运行。<span class=\"en\" lang=\"en\" style=\"display:block\">Only the number of taps on each item is kept. No names, no IP addresses, no cookies. Your own browser remembers that you tapped, so you aren't counted twice; clearing your browser data forgets it. The counter runs on Cloudflare.</span></p>\n<h2>林子<span class=\"en\">The Forest</span></h2>\n<p>在林子里点「感觉到了 · 没感觉 · 说不清」时，只给「这个体式、这个地方、这个回答」记一次数，用的是和「我也感觉到了」同一个计数器。不记名字，不记 IP，不用 cookie。同一个浏览器同一天对同一个回答只算一次，靠的是你的浏览器在本机记住；清除浏览器数据，它就忘了。<span class=\"en\" lang=\"en\" style=\"display:block\">When you tap \"Yes, No or Not sure\" in the Forest, only one count is added for that pose, that place and that answer, on the same counter as \"Me too\". No names, no IP addresses, no cookies. The same answer counts once per browser per day; your own browser remembers that locally, and clearing your browser data forgets it.</span></p>\n<h2>叶子<span class=\"en\">Leaves</span></h2>\n<p>回答「找到了吗」以后，你可以接住一片飘过来的叶子（比如「热了」「卡在这一步」）。这和「我也感觉到了」一样，只给那片叶子记一次数：不记名字，不记 IP，不用 cookie；你的浏览器在本机记住你接过哪片，清除浏览器数据，它就忘了。<span class=\"en\" lang=\"en\" style=\"display:block\">After answering \"Did you find it?\", you can catch a drifting leaf (such as \"warm\" or \"one step is unclear\"). Like \"Me too\", this only adds one to that leaf's count: no names, no IP addresses, no cookies. Your own browser remembers which leaves you caught; clearing your browser data forgets it.</span></p>\n<p>想写信，可以寄到 hello@weidingpractice.com。信不会出现在网站上。<span class=\"en\" lang=\"en\" style=\"display:block\">To write, use hello@weidingpractice.com. Letters never appear on the site.</span></p>\n<h2>其他<span class=\"en\">Everything else</span></h2>\n<p>这个网站没有分析工具，也没有广告追踪。字体从 Google Fonts 加载。<span class=\"en\" lang=\"en\" style=\"display:block\">This site has no analytics and no ad tracking. Fonts load from Google Fonts.</span></p>\n</section>";

  try{await db.collection('entries').doc(id).set({...doc,...(old&&old.practice&&!doc.practice?{practice:old.practice}:{}),...(old&&old.orig?{orig:old.orig,origin:old.origin||''}:{}),...(old&&old.pic?{pic:old.pic,picAlt:old.picAlt||''}:{}),createdAt:old&&old.createdAt||Date.now(),updatedAt:Date.now()});
   t.textContent='已自动保存 · '+hhmm();try{localStorage.removeItem('daydraft')}catch(e){}}
  catch(e){t.textContent=e&&e.code==='permission_denied'?'没有保存：你需要这一页的编辑权限。这台设备上先替你留着。':'刚才没存上，这台设备上先替你留着，会再试。'}
 };
 const flush=()=>{if(!timer)return;clearTimeout(timer);timer=null;const doc=readDay(f);doc.date=origDate;saving=saving.then(()=>write(doc))};
 dayFlush=flush;
 dayActive=f;
 f.querySelectorAll('[data-preset]').forEach(b=>b.addEventListener('click',()=>{const c=CLASS_PRESETS.find(x=>x.id===b.dataset.preset);if(!c)return;
  const cur=readDay(f);fillDay(f,{practice:{forms:[...new Set([...formsOf(cur.practice),c.form])],dur:c.dur,intensity:c.intensity,load:c.load,teacher:c.teacher,poses:[...new Set([...(cur.practice&&cur.practice.poses||[]),...c.poses])]}});

 const schedule=()=>{if(f!==dayActive)return;dayDirty=true;t.textContent='正在保存……';clearTimeout(timer);timer=setTimeout(()=>{if(f===dayActive)flush();else{clearTimeout(timer);timer=null}},800)};
 f.addEventListener('input',e=>{if(e.target.id!=='d-date')schedule()});f.addEventListener('change',e=>{if(e.target.id!=='d-date')schedule()});
 // changing the date: go to that day's record, or carry what was just written over to the new day
 f.querySelector('#d-date').addEventListener('change',async e=>{const nd=e.target.value;if(!nd||nd===origDate)return;

所见两种</th>\n<th>出处</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>甲木第三句</td>\n<td>「火炽<strong>乘</strong>龙，水<strong>宕</strong>骑虎」</td>\n<td>简书转录本</td>\n</tr>\n<tr>\n<td>同上</td>\n<td>「火炽<strong>成</strong>龙，水<strong>荡</strong>骑虎」</td>\n<td>微博转录本</td>\n</tr>\n<tr>\n<td>乙木首句</td>\n<td>「乙木虽柔，<strong>刲</strong>羊解牛」</td>\n<td>简书、微博多个本子</td>\n</tr>\n<tr>\n<td>同上</td>\n<td>「乙木虽柔，<strong>封</strong>羊解牛」</td>\n<td>微博另一本</td>\n</tr>\n</tbody>\n</table></div>\n<p>「刲」（kuī，割）与「封」形近，从文义看「刲羊解牛」可通（与下文「跨凤乘猴」对举，皆言地支），「封羊」不成文义，疑为形讹。但本报告未见任何有版本著录的整理本，不足以判定原貌，故只列异文，不下结论。</p>\n<h3>1.3 作者归属与版本</h3>\n<ul>\n<li>旧题宋·京图撰、明·刘基（刘伯温）注。这是通行著录。</li>\n<li>清·任铁樵（道光年间人）增注，成《滴天髓阐微》，为流传最广的注本。</li>\n<li>民国·徐乐吾有《滴天髓补注》《滴天髓征义》。</li>\n</ul>\n<p>版本线索（据豆瓣、旧书网书目信息，等级 B，未见到实体书）：</p>\n<div class=\"tblwrap\"><table>\n<thead>\n<tr>\n<th>书名</th>\n<th>著录</th>\n<th>出版信息</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>滴天髓补注</td>\n<td>刘基撰，徐乐吾补注，孙正治译</td>\n<td>中医古籍出版社，2012 年 2 月，ISBN 9787515201122，326 页</td>\n</tr>\n<tr>\n<td>滴天髓征义</td>\n<td>徐乐吾</td>\n<td>华龄出版社，2007 年 3 月，ISBN 9789573501374，329 页</td>\n</tr>\n<tr>\n<td>秘授滴天髓阐微</td>\n<td>刘基、任铁樵</td>\n<td>子平汇刊第 4 种，页数 277，出版社与年份未核到</td>\n</tr>\n</tbody>\n</table></div>\n<p>正文与注文的区分：本报告没有做到。上引那段十干文字在流传中已与注文混排。以「甲木参天，脱胎要火」为例，「甲为纯阳之木，体本坚固，参天之势，又极雄壮」一类文字是注，不是原文；且不排除是后人所加。所见网络转录本均未标明哪几句是正文、哪几句是注。</p>\n<h3>1.4 比命理文献更早的线索</h3>\n<h4>（一）《淮南子·天文训》：十干两两分刚柔</h4>\n<blockquote>\n<p>凡日，甲刚乙柔，丙刚丁柔，以至于癸。</p>\n</blockquote>\n<p>出处：《淮南子》卷三《天文训》。据网络转录古籍库，等级 B（未核中华书局点校本页码）。</p>\n<p><strong>这一条核上了，且正是要注意的那种情况：原文讲的是「刚柔」，不是「阴阳」。</strong> 此段在论「太阴所居，日为德，辰为刑」的刑德体系，「甲刚乙柔」用来说明日干的德刑归属，属汉代已有的十干两两分组证据，但用字是「刚柔」。</p>\n<p>同段紧接的文字为：「木生于亥，壮于卯，死于未，三辰皆木也。」——这是地支三合说，与十干刚柔是两件事，勿混。</p>\n<p>事实层面可这样表述：汉代《淮南子》已把十干两两分成刚与柔两组；但「刚柔」与「阴阳」在此段中并未互换使用。二者是否同一回事，本报告不作判断。</p>\n<h4>（二）隋·萧吉《五行大义》：论配支干</h4>\n<p>《五行大义》五卷二十四篇，其中卷二有「论配支干」一篇。</p>\n<p>出处：据网络书目与提要，等级 B。</p>\n<p><strong>但「论配支干」一篇的正文，本报告没有拿到。</strong> 各平台均为付费内容，仅见目录与前序。</p>\n<h4>（三）照实结论</h4>\n<div class=\"tblwrap\"><table>\n<thead>\n<tr>\n<th>问题</th>\n<th>核查结果</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>十干字义有更早出处吗</td>\n<td>有。《史记·律书》《汉书·律历志》释十干，等级 B</td>\n</tr>\n<tr>\n<td>十干分两组（刚柔）有更早出处吗</td>\n<td>有。《淮南子·天文训》，汉代，等级 B</td>\n</tr>\n<tr>\n<td>十干分两组（阴阳）有更早出处吗</td>\n<td><strong>未找到。</strong> 可核到的、把「甲为阳、乙为阴」讲成定式的材料，最早仍是命理一系的著作</td>\n</tr>\n</tbody>\n</table></div>\n<hr />\n<h2>二、《灵枢·逆顺肥瘦》经脉走向</h2>\n<p>原文：「手之三阴，从脏走手；手之三阳，从手走头；足之三阳，从头走足；足之三阴，从足走腹。」</p>\n<h3>2.1 上下文</h3>\n<p>据中华传世藏书所收本：</p>\n<blockquote>\n<p>黄帝曰：脉行之逆顺奈何？岐伯曰：手之三阴，从脏走手；手之三阳，从手走头；足之三阳，从头走足；足之三阴，从足走腹。黄帝曰：少阴之脉独下行何也？岐伯曰：不然。夫冲脉者，五脏六腑之海也，五脏六腑皆禀焉⋯⋯</p>\n</blockquote>\n<p>出处：中华传世藏书（第 74 册）子部·中医一，等级 B。</p>\n<p>说明：这段是回答「脉行之逆顺」这一问的。紧接的下一个问答转入冲脉，与经脉走向不是同一话题。引文如需标明边界，止于「从足走腹」为宜。</p>\n<h3>2.2 版本与卷次</h3>\n<ul>\n<li>所据本：刘更生校注《灵枢经》（第 2 版），中国中医药出版社。其版权页的出版年与 ISBN 仍未核到（电子版版权信息只显示上架时间 2023-09-28）。</li>\n<li>等级：A。整理者与出版社明确，按本报告定级标准可给 A。</li>\n<li>卷次分歧：该本目录显示，《逆顺肥瘦》为第三十八篇，在「卷之七」。而《中国学术名著提要》（得到电子书，等级 B）引此句时注作「《灵枢》卷六《逆顺肥瘦》」。两说并存，不择一。</li>\n<li>篇序无分歧：各本均作第三十八篇。</li>\n<li>等级：原文 A；卷次 B（两说并存）。</li>\n</ul>\n<hr />\n<h2>三、《素问·金匮真言论》背腹阴阳</h2>\n<p>原文：「言人身之阴阳，则背为阳，腹为阴。」</p>\n<h3>3.1 前后文</h3>\n<blockquote>\n<p>夫言人之阴阳，则外为阳，内为阴。言人身之阴阳，则背为阳，腹为阴。言人身之脏腑中阴阳，则脏者为阴，腑者为阳。肝、心、脾、肺、肾五脏皆为阴，胆、胃、大肠、小肠、膀胱、三焦六腑皆为阳。</p>\n</blockquote>\n<p>出处：《素问·金匮真言论篇》。据得到电子书《〈黄帝内经〉之和：中医文化精神探原》《术与道》等多个本子，文字彼此一致，等级 B。</p>\n<h3>3.2 这一句在讲什么</h3>\n<p>这三句是递进的三层分类：先分外内，再分背腹，再分脏腑。三者都是「言⋯⋯之阴阳」这一句式的并列项，属同一套分类框架内的不同层次。</p>\n<p>同篇稍后另有一段，把这套分类具体落到脏腑：</p>\n<blockquote>\n<p>故背为阳，阳中之阳心也；背为阳，阳中之阴肺也。腹为阴，阴中之阴肾也；腹为阴，阴中之阳肝也；腹为阴，阴中之至阴脾也。</p>\n</blockquote>\n<p>出处：同上，据《灵素探源：〈黄帝内经〉的成书与中医生命观的构建》转引，等级 B。</p>\n<hr />\n<h2>四、《素问·四气调神大论》春夏养阳</h2>\n<p>原文所在的完整一段：</p>\n<blockquote>\n<p>夫四时阴阳者，万物之根本也。所以圣人春夏养阳，秋冬养阴，以从其根，故与万物沉浮于生长之门。逆其根，则伐其本，坏其真矣。故阴阳四时者，万物之终始也，死生之本也，逆之则灾害生，从之则苛疾不起，是谓得道。</p>\n</blockquote>\n<p>出处：《素问·四气调神大论篇》。据得到电子书《中医文化概论》《中医药文化研究》等多个本子，文字彼此一致，等级 B。</p>\n<p>异文三处：</p>\n<ul>\n<li>「万物之根本也」——有的本子在段首作此，有的本子段首作他文，而「万物之终始也，死生之本也」置于后段（如上引）。</li>\n<li>「所以圣人春夏养阳」——有的本子无「所以」二字。</li>\n<li>「故与万物沉浮于生长之门」——一作「与万物浮沉于生长之门」，字序不同。</li>\n</ul>\n<p>以上异文均未见有版本著录的校记，只列现象，不作判断。</p>\n<p>另需说明：《素问·上古天真论》另有「逆从阴阳，分别四时」一类文字，与本句不是同一处。</p>\n<hr />\n<h2>五、《素问·阴阳应象大论》积阳为天</h2>\n<p>原文所在的一小段：</p>\n<blockquote>\n<p>故积阳为天，积阴为地。阴静阳躁，阳生阴长，阳杀阴藏。阳化气，阴成形。寒极生热，热极生寒。寒气生浊，热气生清。清气在下，则生飧泄；浊气在上，则生䐜胀。此阴阳反作，病之逆从也。</p>\n</blockquote>\n<p>出处：《素问·阴阳应象大论篇》。据得到电子书《图解黄帝内经·素问》《四重证据法研究》《中医经典诵读手册》等多个本子，文字彼此一致，等级 B。</p>\n<p>说明：同篇稍后有「故清阳为天，浊阴为地」一句，与「积阳为天，积阴为地」是两处不同的表述，用字不同（积／清、阴／浊），位置也不同。引用时勿混。</p>\n<hr />\n<h2>六、《道德经》第四十二章与第七十六章</h2>\n<h3>6.1 第四十二章</h3>\n<p>王弼通行本：</p>\n<blockquote>\n<p>道生一，一生二，二生三，三生万物。万物负阴而抱阳，冲气以为和。</p>\n</blockquote>\n<p>出处：得到电子书《道德经讲义（国民阅读经典·典藏版）》《道德经沉思录》《老子智慧八十一讲》等，均作「冲气以为和」，等级 B。</p>\n<p>王弼本的可靠整理本线索（未见到实体书，等级 B）：《老子道德经注校释》，[魏]王弼注，楼宇烈校释，中华书局。2008 年 12 月第 1 版，ISBN 9787101063929；另有 2016 年 4 月版，ISBN 9787101116748，210 页，属「新编诸子集成（精装典藏本）」。该书以浙江书局刻明华亭张之象本为底本（据内容简介）。<strong>页码未核到。</strong></p>\n<p>帛书本异文：马王堆帛书甲本此句作「中气以为和」，通行本作「冲气以为和」。</p>\n<p>出处：据《长沙马王堆汉墓简帛集成》的说明（转引自《帛书老子注读》，等级 B）：「『中气』二字乙本已残去，北大本亦作『中气』，传本作『冲气』，『冲』或作『盅』。」</p>\n<p>郭店简本：无此章。</p>\n<h3>6.2 第七十六章</h3>\n<p>王弼通行本前四句：</p>\n<blockquote>\n<p>人之生也柔弱，其死也坚强。草木之生也柔脆，其死也枯槁。故坚强者死之徒，柔弱者生之徒。</p>\n</blockquote>\n<p>出处：得到电子书《中华典藏：道德经》《道德经全解》《道德经释读》等，此四句各本一致，等级 B。</p>\n<p>后段异文（只列与常见引用相关的两处）：</p>\n<ul>\n<li>「是以兵强则灭，木强则折」／「兵强则不胜，木强则共」——实质异文。</li>\n<li>「强大处下，柔弱处上」／一作「坚强处下」。</li>\n</ul>\n<p>郭店简本：无此章。</p>\n<hr />\n<h2>七、《易》卦爻自下而上</h2>\n<h3>7.1 经传依据</h3>\n<p>《系辞下》：</p>\n<blockquote>\n<p>《易》之为书也，原始要终，以为质也。六爻相杂，唯其时物也。其初难知，其上易知，本末也。初辞拟之，卒成之终。</p>\n</blockquote>\n<p>出处：《周易·系辞下》。据得到电子书《周易精讲》《易经与管理》《周易笔记》《人与经典·易经系辞传》等，文字彼此一致，等级 B。</p>\n<p>说明：「其初难知，其上易知，本末也」一句，历代注家一致解作初爻为本（始）、上爻为末（终）。《中国哲学通史》可直接印证：「初爻代表始，上爻代表终，中间四爻代表事物发展的中间阶段。」（等级 B）</p>\n<p>这是「从下往上」读法在经传里最直接的文字依据。因为「初」为本、「上」为末，本末的次序就是自下而上。</p>\n<p>《系辞上》「天尊地卑，乾坤定矣。卑高以陈，贵贱位矣」一句，注家有解作「卑在下、高在上，依次排列」的。但这是由「卑高」推出上下次序，属间接旁证。</p>\n<h3>7.2 爻题本身</h3>\n<p>阳爻依次为初九、九二、九三、九四、九五、上九；阴爻依次为初六、六二、六三、六四、六五、上六。</p>\n<p>出处：得到电子书《谈古论今说易经》《周易的智慧》《周易入门》等，说法一致，等级 B。</p>\n<p>说明：爻题本身即是「自下而上」这一读法的直接证据——第一爻称「初」，第六爻称「上」，中间四爻用二、三、四、五。这套命名只有在「自下而上计数」的前提下才成立。此为文本内部的结构证据，不需外部注疏支持。</p>\n<h3>7.3 一个容易混淆的点</h3>\n<p>《系辞下》同段还有「二与四同功而异位」「三与五同功而异位」的说法，讲的是爻位功能的比较，不是上下次序问题。</p>\n<hr />\n<h2>八、《道德经》五章核查</h2>\n<p>以下五条供网站「练习原则」页使用。只录原文与异文，不写这些句子与练习的任何对应。</p>\n<h3>8.1 第九章</h3>\n<p>要用的句子：「功遂身退，天之道。」</p>\n<h4>（一）王弼本这一句有没有「也」字（v5 重写）</h4>\n<p><strong>核查结果：王弼本作「功遂身退，天之道」，无「也」字；帛书甲、乙本均有「也」字。</strong></p>\n<p><strong>直接依据（A 级）</strong>：张松辉译注《帛书老子》（中华经典名著全本全注全译丛书），中华书局，2024 年 7 月，ISBN 9787101166491。其第九章原文对照：</p>\n<blockquote>\n<p>甲本　……功述身芮，天之道<strong>也</strong>。\n乙本　……功遂身退，天之道<strong>也</strong>。\n王本　……<strong>功遂身退，天之道</strong>。</p>\n</blockquote>\n<p>同书题解：「乙本、王本作『功遂身退，天之道』，甲本作『功述身芮，天之道也』。」</p>\n<p><strong>第二印证（A 级）</strong>：刘笑敢《老子古今：五种对勘与析评引论》，中国社会科学出版社，2006 年 5 月。其五种原文对照第九章：</p>\n<blockquote>\n<p>王9.5　功遂身退，天之道。\n帛9.5　功遂身退，天之道也。\n竹9.5　功遂身退，天之道也。</p>\n</blockquote>\n<p><strong>第三印证（B 级）</strong>：汪涌豪《老子百句》，译林出版社，2018 年 7 月，ISBN 9787544773256，第九章注⑤：「天之道也：指自然规律。『也』字今本缺，据帛书本补。」</p>\n<p><strong>关于汪涌豪本底本的说明（依老师第 3 条）</strong>：该书<strong>没有凡例、没有前言说明底本</strong>，自序只谈老子身世与成书问题。全书注释中多处出现「王弼本作⋯⋯」「王弼本缺此二字」一类判断，可见其校勘基准是王弼本，但<strong>书中未明文声明底本</strong>。因此本报告不把该书作为「王弼本无也字」的独立依据，只作旁证；直接依据改用张松辉本与刘笑敢本两个 A 级整理本。</p>\n<p><strong>对网站的直接结论</strong>：标「王弼本」写「功遂身退，天之道」；写「天之道也」是帛书本读法。两者都不错，但不能混标。</p>\n<h4>（二）四种写法的版本归属（v5 重定级）</h4>\n<div class=\"tblwrap\"><table>\n<thead>\n<tr>\n<th>写法</th>\n<th>版本系统</th>\n<th>等级</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>功遂身退</strong></td>\n<td>郭店楚简本、马王堆帛书本、北大汉简本、<strong>王弼本</strong></td>\n<td><strong>A</strong>（张松辉本、刘笑敢本）</td>\n</tr>\n<tr>\n<td><strong>功成名遂身退</strong></td>\n<td><strong>河上公本</strong></td>\n<td><strong>B</strong>（汪涌豪本注④；刘笑敢本河9.5 作「功成、名遂、身退，天之道」）</td>\n</tr>\n<tr>\n<td><strong>成名功遂身退</strong></td>\n<td><strong>傅奕本</strong></td>\n<td><strong>B</strong>（刘笑敢本傅9.5 作「成名功遂身退，天之道」；另有异说，见下）</td>\n</tr>\n<tr>\n<td><strong>名成功遂身退</strong></td>\n<td>想尔注本、敦煌甲本</td>\n<td><strong>C</strong>（单一网页转引）</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>傅奕本仍有异说，须并列</strong>：汪涌豪本注④称「河上公本、傅奕本及多种古本『功遂』作『功成名遂』」，与刘笑敢本所录傅奕本「成名功遂身退」语序不同。两说并存，本报告不判定。傅奕本这一行定 B，是因为有 A 级整理本（刘笑敢本）直接录出原文；但须注明另有异说。</p>\n<p><strong>河上公本</strong>：刘笑敢本河9.5 作「功成、名遂、身退，天之道」，与汪涌豪本「功成名遂」一致（仅标点分合不同）。两方一致，定 B。</p>\n<p><strong>想尔注本、敦煌甲本</strong>：仅见一《老子》注本（辽宁省营口市中级人民法院网站「国学」栏所载，2026-03），单一网页转引、整理者不明，定 C，不进结论。</p>\n<h4>（三）v2 所列「功遂退，天之道」的处理</h4>\n<p>本报告未能为这一写法找到任何版本归属。它出现在某电子书（非整理本，无校记），既无「身」字也无「也」字，与四个版本系统均不合，疑为脱字或排印问题。<strong>不建议采信。</strong></p>\n<h4>（四）本章前后文</h4>\n<blockquote>\n<p>持而盈之，不如其已；揣而锐之，不可长保。金玉满堂，莫之能守；富贵而骄，自遗其咎。</p>\n</blockquote>\n<p>异文（依 A 级材料重列）：</p>\n<div class=\"tblwrap\"><table>\n<thead>\n<tr>\n<th>位置</th>\n<th>各本</th>\n<th>等级</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>「金玉满堂」</td>\n<td>王本作「金玉满堂」；帛书本、郭店本作「金玉盈室」；河上公本作「金玉满堂」；傅奕本作「金玉满室」</td>\n<td><strong>A</strong>（刘笑敢本五种对勘）</td>\n</tr>\n<tr>\n<td>「揣而锐之」</td>\n<td>王本作「揣而梲之」；帛书本作「揣而允之」；郭店本作「湍而羣之」；河上公本作「揣而锐之」；傅奕本作「㱊而梲之」</td>\n<td><strong>A</strong>（同上）</td>\n</tr>\n<tr>\n<td>「富贵而骄，自遗其咎」</td>\n<td>王本作「自遣其咎」（刘笑敢本录）；帛书本、郭店本作「自遗咎也」</td>\n<td><strong>A</strong>（同上）</td>\n</tr>\n</tbody>\n</table></div>\n<p>说明：刘笑敢本录王本作「自遣其咎」，与通行本「自遗其咎」不同，属该本所据楼宇烈《王弼集校释》本的用字，本报告照录，不判断。</p>\n<h4>（五）网站若只用一句</h4>\n<p>据上：王弼本作「功遂身退，天之道」（无「也」）；帛书本、郭店本作「功遂身退，天之道也」。「功遂身退」四字是各早期本与王弼本的交集，可采性最高。末尾「也」字是否加，取决于所标版本：标王弼本则不加，标帛书本或郭店本则加。</p>\n<h3>8.2 第十六章</h3>\n<p>要用的句子：「夫物芸芸，各复归其根。归根曰静。」</p>\n<p>王弼通行本（据多个本子）：</p>\n<blockquote>\n<p>致虚极，守静笃。万物并作，吾以观复。夫物芸芸，各复归其根。归根曰静，是谓复命。复命曰常，知常曰明。不知常，妄作凶。</p>\n</blockquote>\n<p>异文（依 A 级材料重列，刘笑敢本五种对勘）：</p>\n<div class=\"tblwrap\"><table>\n<thead>\n<tr>\n<th>位置</th>\n<th>各本</th>\n<th>等级</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>「吾以观复」</td>\n<td>王本作「吾以观复」；河上公本、傅奕本作「吾以观其复」；帛书本作「吾以观其复也」</td>\n<td><strong>A</strong></td>\n</tr>\n<tr>\n<td>「夫物芸芸」</td>\n<td>王本作「夫物芸芸」；河上公本作「夫物芸芸」；傅奕本作「凡物紜紜」；帛书本作「天物魂魂」</td>\n<td><strong>A</strong></td>\n</tr>\n<tr>\n<td>「是谓复命」</td>\n<td>王本、河上公本作「是谓复命」；傅奕本作「靖曰复命」</td>\n<td><strong>A</strong></td>\n</tr>\n<tr>\n<td>「公乃王」</td>\n<td>王本、河上公本、傅奕本均作「公乃王」</td>\n<td><strong>A</strong></td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>关于「是谓复命／静曰复命」</strong>：汪涌豪《老子百句》注⑦：「静曰：王弼本及河上公本作『是谓』，今据景龙本、敦煌本、傅奕本及诸古本改。」（B 级）刘笑敢本五种对勘印证：王本、河本作「是谓复命」，傅奕本作「靖曰复命」（A 级）。两方一致，可定：<strong>王弼本作「是谓复命」，「静曰复命」是据景龙本、敦煌本、傅奕本改的读法。</strong></p>\n<p><strong>郭店简本此段（A 级，据刘笑敢本所录荆门市博物馆原整理者释文）</strong>：</p>\n<blockquote>\n<p>至虛，恆也；守中，篤也。萬物旁作，居以須復也。天道員員，各復其根。</p>\n</blockquote>\n<p><strong>与王弼本对照：</strong></p>\n<div class=\"tblwrap\"><table>\n<thead>\n<tr>\n<th>王弼本</th>\n<th>郭店本</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>致虚极，守静笃</td>\n<td>至虚，恒也；守中，笃也</td>\n</tr>\n<tr>\n<td>万物并作，吾以观复</td>\n<td>万物<strong>旁</strong>作，居以<strong>须</strong>复也</td>\n</tr>\n<tr>\n<td><strong>夫物芸芸</strong>，各复归其根</td>\n<td><strong>天道员员</strong>，各复其根</td>\n</tr>\n<tr>\n<td>归根曰静，是谓复命</td>\n<td><strong>无此下各句</strong></td>\n</tr>\n</tbody>\n</table></div>\n<p>由此可以明确回答：「夫物芸芸，各复归其根」这八个字，郭店本没有。「夫物芸芸」的位置，郭店本作「天道员员」。</p>\n<p>「员员」的隶定，各本不一（员员／圆圆／云云），属字形隶定层面的分歧，须见原书图版才能定，列入「待查」。</p>\n<p>另：郭店本此段止于「各复其根」，「归根曰静」「是谓复命」以下全部没有。研究者彭浩据此认为今本第十六章前后两段原本各自独立（《郭店楚简老子校读》），此为学者判断，本报告只作记录。</p>\n<h3>8.3 第四十二章</h3>\n<p>同 6.1。王弼本作「冲气以为和」，帛书甲本作「中气以为和」，郭店本无此章。</p>\n<h3>8.4 第四十八章</h3>\n<p>要用的句子：「为学日益，为道日损。损之又损，以至于无为。无为而无不为。」</p>\n<p>王弼通行本（据多个本子，文字全同）：</p>\n<blockquote>\n<p>为学日益，为道日损。损之又损，以至于无为。无为而无不为。取天下常以无事，及其有事，不足以取天下。</p>\n</blockquote>\n<p>出处：得到电子书《中华典藏：道德经》《道德经释读》《万物的经典》《生命第一课》等，等级 B。本章各本高度一致，未发现文字异文。</p>\n<p><strong>郭店简本此段（A 级，据刘笑敢本所录原整理者释文）</strong>：</p>\n<blockquote>\n<p>學者日益，為道者日損。損之或損，以至亡為也，亡為而亡不為。</p>\n</blockquote>\n<p><strong>逐句对照：</strong></p>\n<div class=\"tblwrap\"><table>\n<thead>\n<tr>\n<th>王弼本</th>\n<th>郭店本</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>为</strong>学日益</td>\n<td><strong>学者</strong>日益</td>\n</tr>\n<tr>\n<td><strong>为</strong>道日损</td>\n<td><strong>为道者</strong>日损</td>\n</tr>\n<tr>\n<td>损之又损</td>\n<td>损之<strong>或</strong>损</td>\n</tr>\n<tr>\n<td>以至<strong>于</strong>无为</td>\n<td>以至<strong>亡</strong>为<strong>也</strong></td>\n</tr>\n<tr>\n<td>无为而无不为</td>\n<td><strong>亡为而亡不为</strong></td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>郭店本这一段到此为止。</strong> 「取天下常以无事，及其有事，不足以取天下」一句，郭店本没有。</p>\n<h3>8.5 第六十四章</h3>\n<p>要用的句子：「合抱之木，生于毫末；九层之台，起于累土；千里之行，始于足下。」</p>\n<h4>（一）王弼本与传世各本的异文（依 A 级材料重列）</h4>\n<p>王弼通行本：</p>\n<blockquote>\n<p>其安易持，其未兆易谋；其脆易泮，其微易散。为之于未有，治之于未乱。合抱之木，生于毫末；九层之台，起于累土；千里之行，始于足下。</p>\n</blockquote>\n<p>刘笑敢本五种对勘（A 级）：</p>\n<div class=\"tblwrap\"><table>\n<thead>\n<tr>\n<th>位置</th>\n<th>王本</th>\n<th>河上公本</th>\n<th>傅奕本</th>\n<th>帛书本</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>台</td>\n<td>九<strong>层</strong>之台</td>\n<td>九<strong>层</strong>之台</td>\n<td>九<strong>成</strong>之台</td>\n<td>九<strong>成</strong>之台</td>\n</tr>\n<tr>\n<td>起／作</td>\n<td><strong>起</strong>于累土</td>\n<td><strong>起</strong>于累土</td>\n<td><strong>起</strong>于累土</td>\n<td><strong>作</strong>于蔂土</td>\n</tr>\n<tr>\n<td>末句</td>\n<td><strong>千里之行</strong>，始于足下</td>\n<td><strong>千里之行</strong>，始于足下</td>\n<td><strong>千里之行</strong>，始于足下</td>\n<td><strong>百千之高</strong>，始于足下</td>\n</tr>\n</tbody>\n</table></div>\n<h4>（二）郭店简本：这两句在原简上是残缺的（v5 新增，本条最要紧）</h4>\n<p><strong>据刘笑敢本所录荆门市博物馆原整理者释文（底本为文物出版社 1998 年《郭店楚墓竹简》），郭店甲组第六十四章作：</strong></p>\n<blockquote>\n<p>其安也，易也。其未兆也，易谋也。其脆也，易判也。其几也，易散也。为之于其亡有也，治之于其未乱。<strong>合□□□□□□□，九成之台甲□□□□□□□□□足下。</strong></p>\n</blockquote>\n<p><strong>关键事实：</strong></p>\n<ol>\n<li>「合抱之木，生于毫末」一句，简上只存「合」字与末字「末」，中间七字全缺。</li>\n<li>「九成之台」四字可辨。</li>\n<li>「九成之台」下有一「甲」字，整理者疑为「作」之误（荆门市博物馆 1998，116 页，据刘笑敢本引）。</li>\n<li>「百仞之高，始于足下」一句，简上只存「足下」二字，前面十字全缺。</li>\n</ol>\n<p><strong>因此：「百仞之高」不是郭店简上的原字，是后人据文义补的。</strong></p>\n<p>刘笑敢本对此有明确讨论（A 级）：</p>\n<blockquote>\n<p>「九層之臺」，傅奕本、帛書本、竹簡本作「九成」。李零讀竹簡本為「九層」。廖名春云：成、層義同，竹簡故書當作「成」（廖名春 2003，270）。竹簡本「九成之臺」下有一「甲」字，整理者云：疑為「作」之誤（荊門市博物館 1998，116）。李零云：古人恆以「起蓋」言營建之事，此字也有可能讀蓋（李零 2002，9）。</p>\n</blockquote>\n<p><strong>这一段说明三件事：</strong></p>\n<ul>\n<li>「九成／九层」的分歧，学界已有讨论：李零读作「九层」，廖名春主张简本故书作「成」。<strong>两说并存，本报告不判定。</strong></li>\n<li>「甲」字如何读，也有两说（「作」之误／读「盖」）。</li>\n<li>郭店简此处残缺，是讨论的前提。</li>\n</ul>\n<h4>（三）逐字分级（v5 复核后）</h4>\n<div class=\"tblwrap\"><table>\n<thead>\n<tr>\n<th>字句</th>\n<th>材料情况</th>\n<th>分级</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>「九成之台」（帛书本）</strong></td>\n<td>张松辉本甲本作「九成之台，作于羸土」，乙本作「九成之台，作于蔂土」；刘笑敢本帛书同；《国学研究》第四十一卷李开文亦作「九成之台」</td>\n<td><strong>B</strong>（两个 A 级整理本一致）</td>\n</tr>\n<tr>\n<td><strong>「百仁（仞）之高，台（始）于足下」（帛书甲本原字）</strong></td>\n<td>张松辉本甲本原文即作「百仁之高，台于足下」</td>\n<td><strong>B</strong>（A 级整理本）</td>\n</tr>\n<tr>\n<td><strong>「百千之高」（帛书乙本）</strong></td>\n<td>张松辉本乙本作「百千之高，始于足下」；刘笑敢本同</td>\n<td><strong>B</strong></td>\n</tr>\n<tr>\n<td><strong>「百仞之高，始于足下」（郭店本）</strong></td>\n<td><strong>原简残缺，只存「足下」二字。</strong>「百仞」为后人补读</td>\n<td><strong>降为「待查」</strong></td>\n</tr>\n<tr>\n<td><strong>「九层／九成」（郭店本）</strong></td>\n<td>原简作「九成」，但李零读「九层」、廖名春主张「成」。两说并存</td>\n<td><strong>待查</strong></td>\n</tr>\n<tr>\n<td><strong>「虆／羸／蔂／累土」</strong></td>\n<td>帛书甲本「羸土」、乙本「蔂土」（张松辉本、刘笑敢本一致）；郭店本此字残缺</td>\n<td>帛书本 <strong>B</strong>；郭店本 <strong>待查</strong></td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>v4 的「百仞之高（郭店）定 B」已撤回。</strong> 理由：v4 所据三个「独立来源」中，帛书复原本属 C 级（无版权页、混合复原），中英对照释文为转引，研读材料为普及读物。三者均不足以支撑「郭店简作百仞之高」这一判断。而 A 级材料（刘笑敢本所录原整理者释文）显示该句残缺。</p>\n<h4>（四）帛书甲本原文（v5 修正）</h4>\n<p><strong>帛书甲本（据张松辉本，A 级）</strong>：</p>\n<blockquote>\n<p>⋯⋯九成之台，作于羸土；<strong>百仁之高，台于足下</strong>。</p>\n</blockquote>\n<p>说明：「仁」读为「仞」，「台」读为「始」，均为整理小组的读法，非原字。等级 B。</p>\n<p><strong>帛书乙本（据张松辉本，A 级）</strong>：</p>\n<blockquote>\n<p>⋯⋯九成之台，作于蔂土；<strong>百千之高，始于足下</strong>。</p>\n</blockquote>\n<h4>（五）「千里之行」的跨版本情况</h4>\n<div class=\"tblwrap\"><table>\n<thead>\n<tr>\n<th>版本</th>\n<th>此句</th>\n<th>等级</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>王弼本、河上公本、傅奕本等传世本</td>\n<td>千里之行，始于足下</td>\n<td><strong>A</strong>（刘笑敢本五种对勘）</td>\n</tr>\n<tr>\n<td>郭店本</td>\n<td><strong>残缺</strong>，只存「足下」</td>\n<td><strong>A</strong>（原整理者释文）</td>\n</tr>\n<tr>\n<td>帛书甲本</td>\n<td><strong>百仁（仞）之高</strong>，台（始）于足下</td>\n<td><strong>B</strong></td>\n</tr>\n<tr>\n<td>帛书乙本</td>\n<td><strong>百千之高</strong>，始于足下</td>\n<td><strong>B</strong></td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>照实结论</strong>：本报告所核到的帛书甲、乙本，<strong>均不作「千里之行」</strong>（甲本作「百仁之高」，乙本作「百千之高」）。郭店简此处残缺，<strong>不能据以判断</strong>。传世各本（王弼、河上公、傅奕）一致作「千里之行」。</p>\n<p><strong>v4 结论第 12 条「郭店本作百仞之高」须撤回</strong>，改为：郭店简此处残缺，可辨者为「九成之台」「足下」；帛书甲本作「百仁（仞）之高」，乙本作「百千之高」；传世本作「千里之行」。</p>\n<h4>（六）郭店丙组</h4>\n<p>丙组第 4 组收第六十四章另一段，不含上引三句（据刘笑敢本所录原整理者释文，A 级）：</p>\n<blockquote>\n<p>為之者敗之，執之者失之。聖人無為，古（故）無敗也；無執，古（故）□□□。慎終若始，則無敗事喜（矣）。人之敗也，恆於其且成也敗之。是以□人欲不欲，不貴難得之貨；學不學，復衆之所過。是以能輔萬物之自然，而弗敢為。</p>\n</blockquote>\n<p>所以三句在不在郭店本里：在，在<strong>甲组</strong>，且<strong>残缺</strong>；丙组收的是本章后半，不含这三句。</p>\n<hr />\n<h2>结论</h2>\n<ol>\n<li>\n<p>「甲木参天，脱胎要火」「乙木虽柔⋯⋯藤萝系甲」两句确实出自《滴天髓》论十天干的部分，但所见全为网络转录，无一部有版本著录的整理本；异文并存，未能判定原貌。正文与注文的区分，本报告未做到。</p>\n</li>\n<li>\n<p>十干的字义有更早的经典出处（《史记·律书》《汉书·律历志》）；十干分刚柔两组，汉代《淮南子·天文训》已有明文，但原文用字是「刚柔」，不是「阴阳」。<strong>「甲为阳、乙为阴」这一层的更早出处，本报告未找到。</strong></p>\n</li>\n<li>\n<p>《五行大义》卷二有「论配支干」一篇，是查证此问题的正确去处，但该篇正文未核到。</p>\n</li>\n<li>\n<p>《灵枢·逆顺肥瘦》原文已据刘更生校注本核对，等级 A；篇序第三十八无分歧，卷次有「卷七」与「卷六」两说，并存。</p>\n</li>\n<li>\n<p>《素问》三条原文及上下文已录，异文只列现象。「积阳为天，积阴为地」与同篇「清阳为天，浊阴为地」是两处不同表述。</p>\n</li>\n<li>\n<p>《道德经》第四十二章王弼本「冲气」，帛书甲本「中气」。第七十六章「兵强则灭，木强则折」与「兵强则不胜，木强则共」为实质异文。郭店简本不含此两章。</p>\n</li>\n<li>\n<p>《易》爻自下而上读法的直接依据是《系辞下》「其初难知，其上易知，本末也」，加爻题本身的结构证据。</p>\n</li>\n<li>\n<p><strong>第九章：王弼本作「功遂身退，天之道」，无「也」字；帛书甲、乙本均有「也」字。</strong> 直接依据为张松辉译注《帛书老子》（中华书局，2024，ISBN 9787101166491）与刘笑敢《老子古今》（中国社会科学出版社，2006）两个 A 级整理本。版本归属：郭店本、帛书本、汉简本、王弼本均作「功遂身退」（A）；<strong>河上公本作「功成名遂」</strong>（B）；<strong>傅奕本作「成名功遂身退」</strong>（B，另有「功成名遂」异说，未判定）；想尔注本、敦煌甲本作「名成功遂」（<strong>C</strong>，单一网页转引，不进结论）。</p>\n</li>\n<li>\n<p>第十六章：王弼本作「是谓复命」（A，刘笑敢本五种对勘；B，汪涌豪本注⑦印证）。郭店本「夫物芸芸」作「天道员员」，且郭店本止于「各复其根」，「归根曰静」以下全无（A，原整理者释文）。</p>\n</li>\n<li>\n<p>第四十八章：「为学」郭店本作「学者」，「为道」作「为道者」，「损之又损」作「损之或损」（A，原整理者释文）。</p>\n</li>\n<li>\n<p><strong>第六十四章：郭店简此三句在原简上残缺。</strong> 「合抱之木，生于毫末」只存「合」「末」二字；「九成之台」可辨；「百仞之高，始于足下」只存「足下」二字（A，荆门市博物馆原整理者释文，据刘笑敢本）。<strong>「百仞之高」不是简上原字，是后人补读。</strong> 帛书本「九成之台」、帛书甲本「百仁（仞）之高，台（始）于足下」、帛书乙本「百千之高」三项为 B。</p>\n</li>\n<li>\n<p><strong>「千里之行」：帛书甲本作「百仁（仞）之高」，乙本作「百千之高」，均不作「千里之行」（B）；郭店简此处残缺，不能据以判断（A）。传世各本（王弼、河上公、傅奕）一致作「千里之行」（A）。</strong></p>\n</li>\n</ol>\n<hr />\n<h2>待查</h2>\n<ol>\n<li>\n<p>《滴天髓》十天干部分的通行标目（「天干论」「论天干宜忌」「论十干」诸名并存），未核到权威标目。</p>\n</li>\n<li>\n<p>《滴天髓》正文与注文如何区分——须见任铁樵《滴天髓阐微》或徐乐吾《滴天髓补注》实体书。</p>\n</li>\n<li>\n<p>《滴天髓》旧题宋·京图撰、明·刘基注这一说法的最早文献依据，未核到。</p>\n</li>\n<li>\n<p>「甲木参天，脱胎要火」一段的异文（刲／封、乘／成、宕／荡），未核到有校记的整理本。</p>\n</li>\n<li>\n<p><strong>《五行大义》卷二「论配支干」篇的正文原文</strong>——本报告最需补的一处。</p>\n</li>\n<li>\n<p>《淮南子·天文训》「凡日，甲刚乙柔⋯⋯」的中华书局点校本页码，未核到。</p>\n</li>\n<li>\n<p>《史记》卷二十五《律书》、《汉书》卷二十一上《律历志》释十干的中华书局点校本页码，未核到。</p>\n</li>\n<li>\n<p><strong>楼宇烈《老子道德经注校释》（中华书局）第九章的具体页码</strong>，未核到。所据底本为浙江书局刻明华亭张之象本（据内容简介），未见原书核验。</p>\n</li>\n<li>\n<p><strong>傅奕本第九章作「成名功遂」还是「功成名遂」</strong>：刘笑敢本录作「成名功遂身退」，汪涌豪本注④称傅奕本作「功成名遂」。两说冲突，须核傅奕本原文（如《道德经古本篇》）或高明《帛书老子校注》校记。</p>\n</li>\n<li>\n<p><strong>想尔注本、敦煌甲本第九章作「名成功遂身退」</strong>：现仅单一网页转引（C 级），须另有版本著录的材料印证。</p>\n</li>\n<li>\n<p><strong>彭浩《郭店楚简老子校读》</strong> 关于第十六章分段的论述，只见转引，未核到原书页码。</p>\n</li>\n<li>\n<p><strong>《郭店楚墓竹简》（文物出版社，1998 年 5 月第 1 版）第六十四章图版</strong>：本报告已据刘笑敢本所录原整理者释文，确认该处残缺；但「九成／九层」「虆／羸／蔂」等字的具体字形，仍须见图版。另可查《郭店楚墓竹简·老子甲》（文物出版社，2002 年 10 月，ISBN 9787501013661，69 页）；《郭店楚简老子校释》（廖名春，清华大学出版社，2003 年 6 月，ISBN 9787302056706，588 页）。三者本报告均未见到。</p>\n</li>\n<li>\n<p><strong>帛书甲本第六十四章「百仁」「台」二字的整理小组释文原文</strong>：已据张松辉本（A 级）核到原文作「百仁之高，台于足下」，但《马王堆汉墓帛书〔壹〕》（文物出版社，1980）或高明《帛书老子校注》（中华书局，1996）原书页码未核到。</p>\n</li>\n<li>\n<p>郭店本「天道员员」的隶定（员员／圆圆／云云），须见图版。</p>\n</li>\n<li>\n<p><strong>郭店简第六十四章「九成之台」下「甲」字的读法</strong>：整理者疑为「作」之误（1998，116），李零读「盖」（2002，9）。两说并存，未判定。</p>\n</li>\n<li>\n<p><strong>李零读竹简本为「九层」、廖名春主张「成」</strong>（据刘笑敢本引，廖名春 2003，270；李零 2002，9）：两文原书未核到。</p>\n</li>\n<li>\n<p>《长沙马王堆汉墓简帛集成》（中华书局，2014）中第六十四章、第四十二章的释文原文与图版，未核到。</p>\n</li>\n<li>\n<p>刘更生校注《灵枢经》（中国中医药出版社）的出版年与 ISBN，仍未核到。此条自 hand-acupoint 报告挂起至今。</p>\n</li>\n<li>\n<p>《灵枢》卷次「卷六／卷七」分歧的原因，未核到说明。</p>\n</li>\n<li>\n<p><strong>汪涌豪《老子百句》的底本</strong>：全书无凡例、无前言说明底本，自序亦未提。须查纸本版权页或出版说明。</p>\n</li>\n</ol>\n<hr />\n<h2>修订记录</h2>\n<p>v5 相对 v4 的实际改动，逐条对应如下：</p>\n<ol>\n<li>\n<p><strong>分级表新增 v5 细则一段</strong>（依老师第 2 条）：无版权页、无作者、无出版社、无底本说明的网络电子书一律 C 级；自行补足缺文、混合多版本拼成「复原文本」者，不得用作升级依据。</p>\n</li>\n<li>\n<p><strong>8.1（一）整节重写</strong>（依老师第 3 条）。v4 以汪涌豪本注⑤为唯一依据，v5 改为：直接依据用张松辉《帛书老子》（中华书局 2024，A 级）与刘笑敢《老子古今》（中国社会科学出版社 2006，A 级）两个整理本的原文对照；汪涌豪本降为旁证，并明确写出「该书无凡例、无前言说明底本，故不作独立依据」。</p>\n</li>\n<li>\n<p><strong>8.1（二）表格整体重定级</strong>（依老师第 1、2 条）。「功遂身退」升 A（两个 A 级整理本）；河上公本单列 B；傅奕本单列 B 并注明异说；想尔注本、敦煌甲本维持 C。<strong>傅奕本已从前半句删出，不再与河上公本并列。</strong></p>\n</li>\n<li>\n<p><strong>8.1（四）前后文异文改用 A 级材料重列</strong>（刘笑敢本五种对勘），原 v4 据法院网站（C 级）的「金玉满堂／盈室」「锐／群」两条，改为五种对勘原文，等级升 A。</p>\n</li>\n<li>\n<p><strong>8.2 异文表改用 A 级材料重列</strong>（刘笑敢本五种对勘），新增「夫物芸芸／凡物紜紜／天物魂魂」一行。</p>\n</li>\n<li>\n<p><strong>8.2 郭店本释文改用 A 级材料</strong>（刘笑敢本所录荆门市博物馆原整理者释文），并补出「万物旁作」「居以须复」两处与 v4 不同的用字。</p>\n</li>\n<li>\n<p><strong>8.4 郭店本释文改用 A 级材料</strong>，补出「损之或损」「亡为而亡不为」两处 v4 未列的异文。</p>\n</li>\n<li>\n<p><strong>8.5（二）整节新增</strong>（依老师第 2 条复核结果）：据刘笑敢本所录原整理者释文，确认郭店简第六十四章此三句残缺，列出「合□□□□□□□，九成之台甲□□□□□□□□□足下」原文，并引刘笑敢本对「九成／九层」「甲」字两说的讨论。</p>\n</li>\n<li>\n<p><strong>8.5（三）逐字分级表整体重做</strong>：「百仞之高（郭店）」由 B <strong>降为「待查」</strong>；「九成之台（帛书本）」「百仁（仞）之高（帛书甲本）」「百千之高（帛书乙本）」三项定 B，依据改为张松辉本与刘笑敢本两个 A 级整理本。</p>\n</li>\n<li>\n<p><strong>8.5（四）帛书甲、乙本原文改用 A 级材料</strong>，补出乙本「蔂土」与「百千之高」。</p>\n</li>\n<li>\n<p><strong>8.5（五）「千里之行」表重做</strong>：郭店本一栏由「百仞之高」改为「残缺，只存『足下』」；传世本一栏升 A。</p>\n</li>\n<li>\n<p><strong>8.5（六）郭店丙组释文改用 A 级材料</strong>，删去 v4 据 C 级转录的「古无远」一句及其存疑说明。</p>\n</li>\n<li>\n<p><strong>结论第 8、11、12 条重写</strong>：第 8 条按新分级重列四系统；第 11 条改为「郭店简残缺」；第 12 条撤回「郭店本作百仞之高」，改为「郭店简残缺，不能据以判断」。</p>\n</li>\n<li>\n<p><strong>待查新增第 15、16、20 条</strong>（「甲」字两说、李零与廖名春原文、汪涌豪本底本），原第 9 条起顺延调整。</p>\n</li>\n<li>\n<p><strong>英文摘要标点已全部改为半角</strong>（英文句子用半角，引用的中文原文保留中文标点），并补入郭店简残缺一项。</p>\n</li>\n</ol>\n<p><strong>未改动的部分</strong>：第一节《滴天髓》全部、第二节《灵枢》、第三节至第五节《素问》三条、第六节《道德经》42 与 76 章、第七节《易》爻读法、8.3 节——均与 v4 相同。</p>\n<hr />\n<h2>附录：等级 C 材料清单（不作出处引用）</h2>\n<ul>\n<li>网络转录的《滴天髓》十天干全段</li>\n<li>一《老子》注本（辽宁省营口市中级人民法院网站「国学」栏所载）——第九章、第六十四章异文的单一来源</li>\n<li>「帛书复原本」类网络电子书——<strong>无版权页、无作者、无出版社、无底本说明，且自行以傅奕本补足帛书缺文，属混合复原文本，不代表任何单一版本</strong></li>\n<li>「81 天《老子》学习」系列研读材料</li>\n<li>《五运六气学说在中医学的应用》所附十干对照表</li>\n<li>各类讲解「甲为参天大树、乙为花草藤蔓」的现代普及读物与视频转述</li>\n</ul>\n<hr />\n<h2 lang=\"en\">Abstract</h2>\n<p lang=\"en\">This report is a source check. It evaluates no therapeutic effect and offers no clinical advice.</p>\n<p>This version corrects two errors in the previous draft and reports one finding that affects the website directly.</p>\n<p>First, on chapter nine. The Wang Bi text reads 功遂身退，天之道 with no final 也; both Mawangdui manuscripts carry the 也. The direct evidence is now two properly edited editions rather than a single popular commentary: Zhang Songhui's annotated Mawangdui Laozi (Zhonghua Book Company, 2024, ISBN 9787101166491), which prints the three texts side by side, and Liu Xiaogan's Laozi Gujin (China Social Sciences Press, 2006), whose five-version collation shows the same. The Wang Yonghao volume cited in the previous draft has no editorial statement of its base text, so it is retained only as corroboration and is no longer treated as independent evidence. On the Fu Yi text, Liu Xiaogan prints 成名功遂身退 while Wang Yonghao reports 功成名遂; the conflict stands unresolved, and the Fu Yi line is now listed separately from the Heshang Gong line rather than merged with it.</p>\n<p>Second, on chapter sixty-four. The previous draft graded the Guodian reading 百仞之高，始于足下 as B on the strength of three sources. One of those sources is a web edition with no title page, no author, no publisher and no statement of base text, which openly fills lacunae in the silk manuscripts from the Fu Yi text; it is a composite reconstruction, not a witness to any single version, and cannot support an upgrade. The other two are a transcription and a popular reader. Checking instead against the original editorial transcription as reproduced in Liu Xiaogan's appendix, the Guodian slips at this point are damaged: only 合 and 末 survive of the first clause, 九成之臺 is legible, and only 足下 survives of the third. 百仞之高 is a later reconstruction, not a reading preserved on the slips. That item is therefore downgraded to open question, and the website statement attributing 百仞之高 to the Guodian slips should be withdrawn or reworded to say the passage is damaged there.</p>\n<p>The remaining chapter sixty-four items are graded B on the two edited editions: 九成之臺 in the silk manuscripts, 百仁之高，台于足下 in manuscript A with 仁 read as 仞 and 台 as 始 by the editorial group, and 百千之高 in manuscript B. Across manuscript A and manuscript B no witness reads 千里之行, which is the received reading shared by the Wang Bi, Heshang Gong and Fu Yi texts.</p>\n<p>The earlier sections are unchanged: the Ditiansui lines could not be separated into text and commentary; the Huainanzi gives 甲刚乙柔 in terms of hardness and softness rather than yin and yang; the Wuxing Dayi chapter that would settle the matter was not obtained; and the Ling Shu, Suwen and Xici material stands as before.</p>"}, {"slug": "check-hand-acupoints-imagery", "title": "手部穴位的意象与名称：一份文献出处核查", "en": "Images and names of the hand acupoints: a source check", "date": "2026-11-15", "ver": "v3.1", "summary": "《灵枢》为五输穴逐一写了位置，只有鱼际一处带取象说明；「列缺」作闪电解属文学语汇，未见古代医书据此释穴名。", "summaryEn": "The Ling Shu gives a location for each transport point, and only Yuji carries an image-based gloss; reading \"Lieque\" as lightning is literary usage, with no classical medical text applying it to the point name.", "html": "<p>本文为出处核查，不评价疗效，不提供诊疗建议。</p>\n<hr />\n<h2>来源分级表</h2>\n<div class=\"tblwrap\"><table>\n<thead>\n<tr>\n<th>等级</th>\n<th>定义</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>A</td>\n<td>读过原书全文、影印本，或有明确版本的整理本；国家标准据国家标准全文公开系统在线预览逐字核对</td>\n</tr>\n<tr>\n<td>B</td>\n<td>可信转引：学术论文或权威词条，且多个来源说法一致；或引文可靠但版本著录不全</td>\n</tr>\n<tr>\n<td>C</td>\n<td>只有单一网文，或尚未核到。C 级材料只入「待查」与「附录」，不进结论</td>\n</tr>\n</tbody>\n</table></div>\n<p>本报告所据国家标准原文，据截图逐字录入。页码：GB/T 12346-2021 正文第 8–39 页；GB/T 40997-2021 第 6–7 页。</p>\n<hr />\n<h2>正文</h2>\n<h3>一、五输穴的名称次第</h3>\n<p>《灵枢·九针十二原》：「五脏五腧，五五二十五腧；六腑六腧，六六三十六腧。经脉十二，络脉十五，凡二十七气以上下。所出为井，所溜为荥，所注为输，所行为经，所入为合，二十七气所行，皆在五腧也。」</p>\n<p>出处：《灵枢》卷一《九针十二原第一》。所据版本见本报告来源列表第 1 条。等级 A。</p>\n<p>说明：原文列出井、荥、输、经、合五个名称及其次序，未逐一定义。以泉源、小流、深潭、大河、入海逐一比附，是后世注家的解释，不是经文本身。杨上善《黄帝内经太素》注「井者，古者以泉源出水之处为井也」一语，本报告未核到原文，入「待查」。</p>\n<h3>二、手三阳经的根溜注入</h3>\n<p>《灵枢·根结》：「手太阳根于少泽，溜于阳谷，注于小海，入于天窗、支正也。手少阳根于关冲，溜于阳池，注于支沟，入于天牖、外关也。手阳明根于商阳，溜于合谷，注于阳溪，入于扶突、偏历也。此所谓十二经者，盛络皆当取之。」</p>\n<p>出处：《灵枢》卷二《根结第五》。等级 A。</p>\n<p><strong>关于「注于小海」与「注于少海」的异文</strong>：本报告所见网络上另有多个转录本此处作「注于少海」。两者是不同穴位：</p>\n<ul>\n<li>小海 SI8，手太阳小肠经。定位：「在肘后内侧，尺骨鹰嘴（即肘尖）与肱骨内上髁之间凹陷中。」（GB/T 12346-2021，5.6.8，第 15 页，等级 A）</li>\n<li>少海 HT3，手少阴心经。定位：「在肘前内侧，横平肘横纹，肱骨内上髁前缘。」（GB/T 12346-2021，5.5.3，第 14 页，等级 A）</li>\n</ul>\n<p>本报告只报告异文，不判断孰是。</p>\n<h3>三、劳宫、中冲的归经：两处照录</h3>\n<p><strong>国家标准</strong>：GB/T 12346-2021 将中冲、劳宫列于「5.9 手厥阴心包经穴」之下。</p>\n<ul>\n<li>中冲 PC9：「在手指，中指末端最高点。注：另一种定位：在手指，中指末节桡侧指甲根角侧上方 0.1 寸。」（5.9.9，第 28 页，等级 A）</li>\n<li>劳宫 PC8：「在手掌，横平第 3 掌指关节近端，第 2、3 掌骨之间偏于第 3 掌骨。注 1：握拳屈指时，中指尖点到处，第 3 掌骨桡侧。注 2：另一种定位：在手掌，横平第 3 掌指关节近端，第 3、4 掌骨之间偏于第 3 掌骨。」（5.9.8，第 28 页，等级 A）</li>\n</ul>\n<p><strong>《灵枢·本输》</strong>：「心出于中冲，中冲，手中指之端也，为井木；溜于劳宫，劳宫，掌中中指本节之内间也，为荥；注于大陵，大陵，掌后两骨之间方下者也，为输；行于间使，间使之道，两筋之间，三寸之中也，有过则至，无过则止，为经；入于曲泽，曲泽，肘内廉下陷者之中也，屈而得之，为合。手少阴经也。」</p>\n<p>出处：《灵枢》卷一《本输第二》。等级 A。</p>\n<p>说明：此段将中冲、劳宫归在「心」之下，末句并作「手少阴经也」。两处照录，本报告不作推论，不作调和。</p>\n<h3>四、鱼际与太渊</h3>\n<p><strong>鱼际 LU10</strong>：「在手掌，第 1 掌骨桡侧中点赤白肉际处。」（GB/T 12346-2021，5.1.10，第 8 页，等级 A）</p>\n<p>《灵枢·本输》：「肺出于少商，少商者，手大指端内侧也，为井木；溜于鱼际，鱼际者，手鱼也，为荥。」（等级 A）</p>\n<p>说明：五输穴在《本输》中各有位置描述，其中鱼际一处作「手鱼也」，以「手鱼」释穴名，是本篇中唯一带有取象说明的一条。清·黄元御《灵枢悬解》注「手鱼，手大指根丰肉，其形如鱼。际，边也」，为注文，非经文；本报告所据为转引，入「待查」。</p>\n<p><strong>太渊 LU9</strong>：「在腕前外侧，桡骨茎突与腕舟状骨之间，拇长展肌腱尺侧凹陷中。注：在腕掌侧远端横纹桡侧，桡动脉搏动处。」（GB/T 12346-2021，5.1.9，第 8 页，等级 A）</p>\n<p>《灵枢·本输》：「注于太渊，太渊，鱼后一寸陷者中也，为输。」（等级 A）</p>\n<p>说明：原文只讲位置，未释字义。</p>\n<h3>五、婴儿握固</h3>\n<p>《老子》第五十五章：「含德之厚，比于赤子……骨弱筋柔而握固。」</p>\n<p>出处：《老子》第五十五章。所据为王弼通行本，据多个网络转录本，文字彼此一致，等级 B。</p>\n<p>说明：原文只说婴儿筋骨柔弱而手握得紧，未说明手指如何安放，也未出现「固魂」一类说法。后世道教文献所记具体握法，本报告未核到原书，入「待查」。</p>\n<p><strong>关于郭店楚简本用字</strong>：有资料称郭店简此句用字与通行本不同。本报告未核到可靠整理本（含出版社、年份、页码）的释文，故不作表述，入「待查」。</p>\n<h3>六、经外奇穴：标准原文与标准自注</h3>\n<p>以下四条均据 GB/T 40997-2021《经外奇穴名称与定位》，等级 A。</p>\n<p><strong>外劳宫 EX-UE8</strong>（7.5.8，第 6 页）：「在手背，第 2、3 掌骨间，掌指关节后 0.5 寸（指寸）凹陷中。注：与劳宫（PC8）前后相对。」</p>\n<p><strong>八邪 EX-UE9</strong>（7.5.9，第 7 页）：「在手背，第 1～5 指间，指蹼缘后方赤白肉际处，左右共 8 穴。注：微握拳，第 1～5 指间缝纹端凹陷中。其中第 4、5 指间穴即液门（TE2）。」</p>\n<p><strong>四缝 EX-UE10</strong>（7.5.10，第 7 页）：「在手指，第 2～5 指掌面的近侧指间关节横纹的中央，一手 4 穴。」</p>\n<p><strong>十宣 EX-UE11</strong>（7.5.11，第 7 页）：「在手指，十指尖端，距指甲游离缘 0.1 寸（指寸），左右共 10 穴。注：其中中指尖端穴点即中冲（PC9）。」</p>\n<p>说明：以上三处交叉关系（外劳宫与劳宫前后相对；八邪第 4、5 指间穴即液门；十宣中指尖端穴点即中冲）为标准自身注明的，此处照录，不作推论。</p>\n<h3>七、列缺：三处文献中的用例</h3>\n<p><strong>《楚辞·远游》</strong>：「经营四方兮，周流六漠。上至列缺兮，降望大壑。」</p>\n<p><strong>司马相如《大人赋》</strong>：「贯列缺之倒景兮，涉丰隆之滂沛。」</p>\n<p><strong>李白《梦游天姥吟留别》</strong>：「列缺霹雳，丘峦崩摧。」</p>\n<p>出处说明：三处均为文学语汇。所据为多个网络转录本及通行总集，文字彼此一致；《远游》王逸注、《大人赋》在《史记》《汉书》中的本文与旧注，本报告未逐条核对版本页码，入「待查」。</p>\n<p>说明：三处「列缺」通行解作闪电或天隙（旧注未核，见「待查」第 5 条），属文学语汇。以之解释穴位命名，本报告未找到古代医书的依据。</p>\n<p><strong>列缺的穴位定位</strong>：「在前臂外侧，腕掌侧远端横纹上 1.5 寸，拇短伸肌腱与拇长展肌腱之间，拇长展肌腱沟的凹陷中。」（GB/T 12346-2021，5.1.7，第 8 页，等级 A）</p>\n<h3>八、关于穴名的解释</h3>\n<p>《灵枢·本输》为五脏六腑的五输穴逐一写了位置，如中冲「手中指之端也」、少商「手大指端内侧也」、合谷「在大指歧骨之间」、劳宫「掌中中指本节之内间也」。这些是位置描述，不是字义解释。</p>\n<p>其中只有鱼际一处带有取象说明（「鱼际者，手鱼也」，见第四节）。</p>\n<p>其余各穴的字义解释，经文里没有。本报告只找到现代辞书与普及读物，均为转引且未注作者、出版社、年份，等级 C，按规则不入正文，也不在本站列出。</p>\n<hr />\n<h2>结论</h2>\n<ol>\n<li>\n<p>《灵枢·九针十二原》以井、荥、输、经、合五名列出五腧穴的次第，原文只列名称，未逐一定义。</p>\n</li>\n<li>\n<p>《灵枢·根结》有手三阳经「根溜注入」一段，「手太阳根于少泽，溜于阳谷，注于小海，入于天窗、支正也」可据整理本直接引用；「小海」「少海」存在异文，涉及两个分属不同经脉的穴位，本报告只报告异文。</p>\n</li>\n<li>\n<p>劳宫、中冲的归经，GB/T 12346-2021 列在手厥阴心包经穴之下，《灵枢·本输》则作「心出于中冲……溜于劳宫」，两处并存，本报告照录不作调和。</p>\n</li>\n<li>\n<p>《老子》第五十五章「骨弱筋柔而握固」只描述婴儿手的形态，未说明手指如何安放。</p>\n</li>\n<li>\n<p>三处「列缺」通行解作闪电或天隙（旧注未核，见待查 5），属文学语汇；以之解释穴位命名，本报告未找到古代医书依据。</p>\n</li>\n<li>\n<p>外劳宫、八邪、四缝、十宣的定位与代号，均据 GB/T 40997-2021 原文录入；其中三处与经穴的交叉关系为标准自身注明。</p>\n</li>\n<li>\n<p>《灵枢·本输》为五输穴逐一写了位置描述，其中只有鱼际一处带有取象说明；其余穴名的字义，经文未作解释。</p>\n</li>\n</ol>\n<hr />\n<h2>待查</h2>\n<ol>\n<li>\n<p>本报告所据 GB/T 12346-2021 与 GB/T 40997-2021，为截图逐字录入（前者第 8–39 页，后者第 6–7 页）。标准正文其余部分（前言、引言、术语、第 5 章以前）未核。</p>\n</li>\n<li>\n<p>《灵枢·根结》「注于小海」与「注于少海」的异文，何者为各早期刻本原貌，未核。需对校《灵枢》早期刻本（如明·赵府居敬堂本、明·吴勉学校本）及《针灸甲乙经》相关文字。线索：《灵枢·本输》手太阳一段作「入于小海」，可一并参校。</p>\n</li>\n<li>\n<p>本报告所据《灵枢经》整理本的出版年与 ISBN 未核到。所读电子版版权信息仅显示：刘更生校注，中国中医药出版社，上架时间 2023-09-28。需核纸本版权页。</p>\n</li>\n<li>\n<p>杨上善《黄帝内经太素》注「井者，古者以泉源出水之处为井也」一语，未核到原文及版本卷次。</p>\n</li>\n<li>\n<p>清·黄元御《灵枢悬解》「手鱼，手大指根丰肉，其形如鱼。际，边也」一句，未核到原书卷次版本。</p>\n</li>\n<li>\n<p>郭店楚墓竹简《老子》第五十五章对应句的用字（有作「捉固」之说），未核到可靠整理本（含出版社、年份、页码）。</p>\n</li>\n<li>\n<p>《楚辞·远游》王逸注、《大人赋》旧注中有关「列缺」的注释原文，未核到具体版本与页码。</p>\n</li>\n<li>\n<p>《云笈七签》「握固」条原文、《道门通教必用集》所记握法，均未核到原书。</p>\n</li>\n<li>\n<p>现代通俗读物的作者、出版社、年份、页码，除已注明者外，均未核到，不在本站列出。</p>\n</li>\n</ol>\n<hr />\n<h2>修订记录</h2>\n<p>本版为 v3。以下逐条对应实际改动，未改动者不列。</p>\n<ol>\n<li>\n<p><strong>第二节「与该篇通例（足三阳『入于』皆取本经穴）一致」整句已删。</strong> v2 以此「通例」为异文判断附理由，该通例不成立：《灵枢·根结》足少阳一句作「入于天容、光明也」，天容为手太阳小肠经穴（SI17），非本经穴。且此句讨论的是「入于」，与「注于小海／少海」的异文无涉。异文现只报告，不附理由。</p>\n</li>\n<li>\n<p><strong>第八节已改写。</strong> v2 作「手部穴名中只有鱼际、太渊、劳宫在经典内有取象式或定位式描述」，不成立：《灵枢·本输》为五输穴逐一写了位置描述（中冲「手中指之端也」、少商「手大指端内侧也」、合谷「在大指歧骨之间」等）。v3 改为：《本输》为五输穴逐一写位置，其中只有鱼际一处带取象说明；其余穴名的字义，经文未作解释。结论相应增列第 7 条。</p>\n</li>\n<li>\n<p><strong>页码已统一。</strong> v2 开头与「待查」第 1 条的页码不一致。v3 统一为：GB/T 12346-2021 正文第 8–39 页，GB/T 40997-2021 第 6–7 页；录入方式写明「据截图逐字录入」。</p>\n</li>\n<li>\n<p><strong>结论 1 已删去无原文支撑的表述。</strong> v2 作「手部穴位最核心的意象体系是水流……描述经气自指端至肘部的流注」，「最核心的意象体系」与「自指端至肘部」均为解释，所引经文无此内容。v3 改为：以五名列出五腧穴的次第，原文只列名称，未逐一定义。英文摘要中 “from fingertip to elbow” 一并删除。</p>\n</li>\n<li>\n<p><strong>结论 4 已删去 C 级依据。</strong> v2 作「具体握法见于后世道教文献」，该依据为「待查」条目，尚未核到原书。v3 删除该句，仅保留原文所述范围。</p>\n</li>\n<li>\n<p><strong>结论 5 已降调。</strong> v2 作「均指闪电或天隙」。王逸注与《大人赋》旧注均未核，此字义为通行解释而非已核出处。v3 改为「通行解作闪电或天隙（旧注未核，见待查 5）」。正文第七节同步处理。</p>\n</li>\n<li>\n<p><strong>《灵枢》版本著录已更正。</strong> v2 将所读电子版著录为「田代华、刘更生整理，人民卫生出版社，2005 年 8 月」，实误。所读电子版版权信息为：<strong>刘更生校注，中国中医药出版社</strong>，上架时间 2023-09-28。v2 所报的人民卫生出版社 2005 年整理本，本报告并未亲眼读过，已删除。出版年与 ISBN 未核到，入「待查」第 3 条。</p>\n</li>\n<li>\n<p><strong>第一、三、四节经文等级由 B 升为 A。</strong> 所据《灵枢经》整理本与第二节同出一本，《九针十二原》《本输》两篇均据该本核对，v3 起标 A，版本信息见来源列表第 1 条。</p>\n</li>\n<li>\n<p><strong>来源列表第 9 条的具体网址已删，改为文字来源说明。</strong> 该网址指向标准信息平台首页，非 GB/T 40997-2021 条目页。v3 只写标准号、标准名称、条目号与页码，并注明据国家标准全文公开系统（openstd.samr.gov.cn）在线预览逐字核对，不放具体链接。v2 该条网址中全角冒号的问题随之消除。</p>\n</li>\n<li>\n<p><strong>英文摘要标点已全部改为半角。</strong></p>\n</li>\n<li>\n<p><strong>「待查」中原第 9 条（主报告读取失败、是否合并）已删。</strong> 该条为工作流程备注，不属于报告内容。</p>\n</li>\n<li>\n<p><strong>附录末段「关于四缝的意象与功用」整段已删。</strong> 该段即使意在说明不采用，仍将疗效表述写上了公开文本。按规则，疗效表述不出现在网站上。</p>\n</li>\n</ol>\n<hr />\n<h2>来源列表</h2>\n<p><strong>经文与文学文献</strong></p>\n<ol>\n<li>\n<p>《灵枢经》，刘更生校注，第 2 版，中国中医药出版社。本报告所引《九针十二原第一》（卷之一）、《本输第二》（卷之一）、《根结第五》（卷之二）三篇均据该本电子版核对。出版年与 ISBN 未核到（电子版版权信息仅显示上架时间 2023-09-28），见「待查」第 3 条。等级 A。</p>\n</li>\n<li>\n<p>《老子》第五十五章。王弼通行本，据多个网络转录本，文字彼此一致，等级 B。</p>\n</li>\n<li>\n<p>《楚辞·远游》。据通行总集，等级 B；王逸注未核，见「待查」第 7 条。</p>\n</li>\n<li>\n<p>汉·司马相如《大人赋》。据通行总集，等级 B；《史记》《汉书》本文及旧注未核，见「待查」第 7 条。</p>\n</li>\n<li>\n<p>唐·李白《梦游天姥吟留别》，见《李太白全集》。等级 B。</p>\n</li>\n</ol>\n<p><strong>国家标准</strong></p>\n<ol>\n<li>\n<p>GB/T 12346-2021《经穴名称与定位》，国家市场监督管理总局、国家标准化管理委员会发布，第 5 章。本报告所引条目与页码：5.1.7 列缺（第 8 页）、5.1.9 太渊（第 9 页）、5.1.10 鱼际（第 9 页）、5.1.11 少商（第 9 页）、5.2.1 商阳（第 9 页）、5.2.4 合谷（第 9 页）、5.2.5 阳溪（第 9 页）、5.2.7 温溜（第 9 页）、5.2.10 手三里（第 10 页）、5.2.11 曲池（第 10 页）、5.5.1 极泉（第 16 页）、5.5.3 少海（第 17 页）、5.5.9 少冲（第 17 页）、5.6.1 少泽（第 17 页）、5.6.5 阳谷（第 18 页）、5.6.7 支正（第 18 页）、5.6.8 小海（第 18 页）、5.6.16 天窗（第 19 页）、5.7.67 至阴（第 25 页）、5.8.1 涌泉（第 25 页）、5.9.2 天泉（第 27 页）、5.9.8 劳宫（第 28 页）、5.9.9 中冲（第 28 页）、5.10.1 关冲（第 28 页）、5.10.2 液门（第 28 页）、5.10.4 阳池（第 28 页）、5.10.5 外关（第 28 页）、5.10.6 支沟（第 28 页）、5.10.11 清泠渊（第 29 页）、5.10.12 消泺（第 29 页）、5.10.13 臑会（第 29 页）、5.10.14 肩髎（第 29 页）、5.10.15 天髎（第 29 页）、5.10.16 天牖（第 29 页）。据国家标准全文公开系统（openstd.samr.gov.cn）在线预览逐字核对，等级 A。</p>\n</li>\n<li>\n<p>GB/T 40997-2021《经外奇穴名称与定位》，国家市场监督管理总局、国家标准化管理委员会发布，第 7.5 节。本报告所引条目与页码：7.5.8 外劳宫（第 6 页）、7.5.9 八邪（第 7 页）、7.5.10 四缝（第 7 页）、7.5.11 十宣（第 7 页）。据国家标准全文公开系统（openstd.samr.gov.cn）在线预览逐字核对，等级 A。</p>\n</li>\n<li>\n<p>GB/T 22163-2008《腧穴定位图》。上述两条标准各条原文后附有「见 GB/T 22163—2008，图 4-8」一类图号，本报告所据截图右侧被切，未录。</p>\n</li>\n</ol>\n<hr />\n<h2 lang=\"en\">Abstract</h2>\n<p lang=\"en\">This report is a source check. It evaluates no therapeutic effect and offers no clinical advice.</p>\n<p>The Ling Shu, chapter 1, lists five categories of transport point – well, spring, stream, river, sea – and names their order; the text gives the names only, without defining them, and the familiar water comparisons belong to later commentary. A separate passage in chapter 5 sets out the root, glide, pour and entry points of the three hand yang channels; the line for the small intestine channel reads \"pours into Xiaohai\" in the edition consulted, while several online transcriptions read \"Shaohai\", a different point on a different channel, and the variant is reported here without resolution. For Laogong and Zhongchong, the national standard places both under the pericardium channel, whereas the Ling Shu places them under the heart and closes the passage with \"hand shaoyin channel\"; both are quoted side by side, without reconciliation. Chapter 2 of the Ling Shu supplies a location for each transport point, and only Yuji carries an image-based gloss, \"the fish of the hand\". Daodejing chapter 55 mentions an infant's firm grip without specifying finger placement. \"Lieque\" appears as lightning in the Chuci, in Sima Xiangru and in Li Bai, but no classical medical text was found using it to explain the point name. Locations of the four extra-meridian points follow GB/T 40997-2021 verbatim, including the cross-references the standard itself supplies.</p>\n<hr />\n<h2>v3.1 更正（2026-11-19）</h2>\n<p>四处国标页码改正：鱼际 5.1.10、太渊 5.1.9 是第 8 页（原作第 9 页）；少海 5.5.3 是第 14 页（原作第 17 页）；小海 5.6.8 是第 15 页（原作第 18 页）。依据：GB/T 12346-2021 全文 PDF 的印刷页码（PDF 第 n 页 = 印刷第 n−5 页）。原来的页码可能是在线预览系统的页序。定位文字本身没有改动。改正人：Claude。</p>"}, {"slug": "check-hypertension-spleen-phlegm", "title": "血压与「脾为生痰之源」：一份文献出处核查", "en": "Blood pressure and \"the spleen is the source of phlegm\": a source check", "date": "2026-11-15", "ver": "v2", "summary": "中医典籍里没有「血压」；「脾为生痰之源」出自《本草纲目》半夏条，原本在讲半夏。", "summaryEn": "Classical texts have no concept of blood pressure; \"the spleen is the source of phlegm\" comes from the Bencao Gangmu entry on banxia.", "html": "<p class=\"small\">2026-11-21 补注：本站只在事先定好的来源清单里找出处。文中网络平台的链接（公众号、电子书平台、问答网站、商品页）已撤下，只作线索，不作出处。所引后世医书（《本草纲目》《本草备要》《丹溪心法》《景岳全书》《医宗必读》《医宗金鉴》《素问病机气宜保命集》《本草衍义》）已列入清单，点校本页码逐条待核。</p>\n<hr />\n<h2>说明</h2>\n<p>本文是文献出处核查，只回答「这句话出自哪里、原文怎么说、是经文、注文、后世推演还是现代说法」。本文不评价任何疗法的效果，也不提供诊疗建议。血压问题请咨询医生。</p>\n<hr />\n<h2>结论</h2>\n<ol>\n<li>\n<p>中医古代文献中没有「血压」这一概念，也没有与之对应的物理量；把血压升高解释为「气血运行遇到阻力、身体为提高压力而加压」，是循环生理学的说法，不是中医典籍的说法。</p>\n</li>\n<li>\n<p>《灵枢·胀论》有「营气循脉，卫气逆为脉胀」一句，讲的是营卫失调导致脉胀，与「压力升高」不是同一件事；以「脉胀」作为高血压的中医病名，是现代学者的提议，不是古代通行用法。</p>\n</li>\n<li>\n<p>「脾为生痰之源，肺为贮痰之器」的措辞出自李时珍《本草纲目》草部第十七卷半夏【发明】项，原文作「脾无留湿不生痰，故脾为生痰之源，肺为贮痰之器」；这句话原本是在解释半夏的药理，不是一篇论痰的专论。</p>\n</li>\n<li>\n<p>同一段落中，李时珍引王好古「半夏能泄痰之标，不能泄痰之本。泄本者，泄肾也」，「痰之本在肾」与「脾为生痰之源」在《本草纲目》原文中是并存的两种说法，不是互相否定的异说。</p>\n</li>\n<li>\n<p>「脾湿生痰」的思想早于李时珍，金代刘完素《素问病机气宜保命集·咳嗽论》已有「脾湿动而为痰」的表述；通行把这句话归于李中梓《医宗必读》，但李氏自述「先哲云」，他也是在引前人。</p>\n</li>\n<li>\n<p>「风眩」是现代国家标准确定的中医病名，不是古代病名；现行标准为 GB/T 16751.1-2023，该版中「风眩」的定义本文未核到原文。</p>\n</li>\n</ol>\n<hr />\n<h2>被核查的说法</h2>\n<p>以下是一段流传的说法，本文逐句核查。原文如下（分句编号为本文所加）：</p>\n<blockquote>\n<p>（1）血压升高不只是数字，是气血运行遇到阻力的系统反应。\n（2）一处阻力可能在肝：肝气郁结，气机不畅，郁久化火，火性上冲。\n（3）另一处阻力可能在脾：脾虚生湿，湿聚成痰，痰湿阻塞通道。\n（4）当肝的上冲之火与脾的痰湿阻滞同时存在，气血运行的道路就不再清楚。身体为了继续推动运行，可能表现出更高的压力。\n（5）高血压不是简单的「火太大」，也不是单纯的「水太多」；它常常像是木不舒、土不运、痰火交阻后，身体为了维持通行而付出的代价。</p>\n</blockquote>\n<p>这段文字的写作者与出处，本文未能确认，以下按「一段流传的说法」处理。</p>\n<hr />\n<h2>逐句核查</h2>\n<h3>第（1）句：血压升高不只是数字，是气血运行遇到阻力的系统反应</h3>\n<p><strong>原文</strong>：《灵枢·胀论》：「营气循脉，卫气逆为脉胀；卫气并脉循分为肤胀。」</p>\n<p><strong>出处</strong>：《灵枢》卷六第三十五篇《胀论》。所据版本见文末「关于版本等级」的说明；本篇文字各通行本一致，未见他本异文。</p>\n<p><strong>类别</strong>：经文（所引原文为经文；「阻力」一词不是经文用语）</p>\n<p><strong>等级</strong>：B</p>\n<p><strong>结论</strong>：需要改写。核实得出：「脉胀」原文存在，讲的是营气行于脉中、卫气逆行于脉外而致脉胀。判断得出：「阻力」不是中医典籍中的概念，中医典籍中亦无「压力」这一物理量。若要保留这一句的意思，可引「脉胀」，并说明这是中医的说法；若要保留「阻力」，应标明这是现代循环生理学的说法。</p>\n<hr />\n<h3>第（2）句：一处阻力可能在肝：肝气郁结，气机不畅，郁久化火，火性上冲</h3>\n<p><strong>原文一</strong>：《素问·至真要大论》：「诸风掉眩，皆属于肝。」</p>\n<p><strong>出处</strong>：《素问》卷二十二《至真要大论》。所据版本见文末「关于版本等级」的说明。</p>\n<p><strong>类别</strong>：经文</p>\n<p><strong>等级</strong>：B</p>\n<p><strong>结论</strong>：成立，但需限定。核实得出：原文存在，多个来源引文一致。判断得出：此句所管辖的是「掉眩」即摇动、眩晕这一类症状，不是「血压」。原文把眩晕划归肝，不是把血压划归肝。</p>\n<p><strong>原文二</strong>：《丹溪心法·六郁》：「气血冲和，万病不生，一有怫郁，诸病生焉。故人身诸病，多生于郁。」</p>\n<p><strong>出处</strong>：元·朱震亨《丹溪心法》卷三《六郁》。所据为通行整理本，未核原书影印。</p>\n<p><strong>类别</strong>：后世推演</p>\n<p><strong>等级</strong>：B（转引，多个来源引文一致，未核原书影印本）</p>\n<p><strong>结论</strong>：成立，但需限定。核实得出：原文存在。判断得出：朱震亨讲的是「郁」能生百病，六郁为气、血、痰、湿、热、食，未直接说「肝气郁结→郁久化火→火性上冲」。</p>\n<p><strong>原文三</strong>：《素问·举痛论》：「怒则气上……思则气结。」</p>\n<p><strong>出处</strong>：《素问》卷十一《举痛论》。所据版本见文末「关于版本等级」的说明。</p>\n<p><strong>类别</strong>：经文</p>\n<p><strong>等级</strong>：B</p>\n<p><strong>结论</strong>：成立。核实得出：原文存在，讲情绪改变气的方向。</p>\n<p><strong>关于「郁久化火，火性上冲」</strong>：本文未核到任何一部经典直接写有这一完整表述。</p>\n<p><strong>类别</strong>：后世推演</p>\n<p><strong>等级</strong>：C（未核到原文，仅见于现代教材与科普）</p>\n<p><strong>结论</strong>：未核到。判断得出：这一表述可视为《举痛论》「怒则气上」与朱震亨「痰因火动」两条的接续，但接续者是后世医家，不是某一部经的原话。</p>\n<hr />\n<h3>第（3）句：另一处阻力可能在脾：脾虚生湿，湿聚成痰，痰湿阻塞通道</h3>\n<p><strong>原文一</strong>：《素问·至真要大论》：「诸湿肿满，皆属于脾。」</p>\n<p><strong>出处</strong>：《素问》卷二十二《至真要大论》。</p>\n<p><strong>类别</strong>：经文</p>\n<p><strong>等级</strong>：B</p>\n<p><strong>结论</strong>：成立。核实得出：原文存在。判断得出：此句中的「满」即胀、即塞，与「阻塞」的意思相近，比「诸风掉眩」一句更贴近本句论点。</p>\n<p><strong>原文二</strong>：《景岳全书》：「痰即人之津液，无非水谷之所化……若化失其正，则脏腑病，津液败而气血即成痰涎。」</p>\n<p><strong>出处</strong>：明·张介宾《景岳全书·痰饮》。所据为通行整理本，未核原书影印。</p>\n<p><strong>类别</strong>：后世推演</p>\n<p><strong>等级</strong>：B（转引，多个来源引文一致，未核原书影印本）</p>\n<p><strong>结论</strong>：成立。核实得出：原文存在。判断得出：此句讲痰的来源是津液「化失其正」，即身体自己生成的产物，不是外来的阻塞物。</p>\n<p><strong>原文三</strong>：「脾为生痰之源，肺为贮痰之器。」</p>\n<p><strong>出处</strong>：见下文「专题」一节。</p>\n<p><strong>类别</strong>：后世推演</p>\n<p><strong>等级</strong>：A</p>\n<p><strong>结论</strong>：成立，但出处需按专题一节的结论书写。</p>\n<hr />\n<h3>第（4）句：身体为了继续推动运行，可能表现出更高的压力</h3>\n<p><strong>原文</strong>：本文未核到任何中医典籍有与此对应的表述。</p>\n<p><strong>出处</strong>：无。</p>\n<p><strong>类别</strong>：现代说法</p>\n<p><strong>等级</strong>：C（未核到中医典籍依据）</p>\n<p><strong>结论</strong>：需要改写。判断得出：这一表述对应的是循环生理学中的外周阻力与血压关系，其理论前提是十七世纪以后的血液循环学说。中医典籍中既无「血压」概念，也无「压力」这一物理量。若要保留此意，应明确标注为现代生理学的说法，与中医的「脉胀」分开陈述。</p>\n<hr />\n<h3>第（5）句：痰火交阻</h3>\n<p><strong>原文</strong>：《医宗金鉴·杂病心法·中风》：「痰火内发病心官。」注：「心病痰火，轻则舌强难语，重则痰壅神昏。」</p>\n<p><strong>出处</strong>：清·吴谦等《医宗金鉴》卷三十九《杂病心法要诀·中风》。所据为辞书转引，未核原书卷次影印本。</p>\n<p><strong>类别</strong>：后世推演</p>\n<p><strong>等级</strong>：B</p>\n<p><strong>结论</strong>：成立，但需限定。核实得出：「痰火」一词有出处。判断得出：其传统用法主要见于癫狂、不寐、中风、惊悸等神志病，用于眩晕、血压者较少。「痰火交阻」作为连用的证候名，本文未核到古代出处；现代高血压常见证型分类中亦无此型。</p>\n<hr />\n<h2>专题：「脾为生痰之源」的谱系</h2>\n<h3>一、按年代排列</h3>\n<div class=\"tblwrap\"><table>\n<thead>\n<tr>\n<th>年代</th>\n<th>作者与文献</th>\n<th>原文</th>\n<th>该条说的是什么</th>\n<th>类别</th>\n<th>等级</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>北宋·政和六年（1116）成书，宣和元年（1119）首刊</td>\n<td>寇宗奭《本草衍义》，此据《本草纲目》半夏【发明】项引「宗奭曰」</td>\n<td>「脾恶湿，湿则濡困，困则不能治水。」</td>\n<td>脾恶湿，湿困则不能治水。<strong>未出现「痰」字</strong></td>\n<td>后世推演</td>\n<td>A（据《本草纲目》引文）；《本草衍义》通行本作「不能制水」，一字之异，见下文第四节</td>\n</tr>\n<tr>\n<td>金·大定二十六年（1186）成书</td>\n<td>刘完素《素问病机气宜保命集·咳嗽论》</td>\n<td>「咳谓无痰而有声，肺气伤而不清也；嗽是无声而有痰，脾湿动而为痰也；咳嗽谓有痰而有声，盖因伤于肺气，动于脾湿，咳而为嗽也。」</td>\n<td>脾湿动而为痰。<strong>「脾湿→痰」的因果链在此完整</strong></td>\n<td>后世推演</td>\n<td>B</td>\n</tr>\n<tr>\n<td>元（李时珍所引，生卒年待考）</td>\n<td>王好古语，见《本草纲目》半夏【发明】项引「好古曰」</td>\n<td>「《经》云肾主五液，化为五湿。自入为唾，入肝为泣，入心为汗，入脾为痰，入肺为涕。有痰曰嗽，无痰曰咳。痰者，因咳而动脾之湿也。半夏能泄痰之标，不能泄痰之本。泄本者，泄肾也。」</td>\n<td>入脾为痰；痰之本在肾</td>\n<td>后世推演</td>\n<td>A（据《本草纲目》引文）</td>\n</tr>\n<tr>\n<td>明·万历年间成书刊行</td>\n<td>李时珍《本草纲目》草部第十七卷半夏【发明】项</td>\n<td>「脾无留湿不生痰，故脾为生痰之源，肺为贮痰之器。」</td>\n<td>脾有留湿则生痰</td>\n<td>后世推演</td>\n<td>A</td>\n</tr>\n<tr>\n<td>明·崇祯十年（1637）</td>\n<td>李中梓《医宗必读·痰饮》</td>\n<td>「按痰之为病，十常六七，而内经叙痰饮四条，皆因湿土为害，故先哲云『脾为生痰之源』……脾复健运之常，而痰自化矣。」</td>\n<td>只引前半句，无「肺为贮痰之器」</td>\n<td>后世推演</td>\n<td>B（转引，引文完整）</td>\n</tr>\n<tr>\n<td>清·康熙三十三年（1694）增订</td>\n<td>汪昂《本草备要》半夏条</td>\n<td>「时珍曰：脾无湿不生痰，故脾为生痰之源，肺为贮痰之器。」</td>\n<td>同李时珍，无「留」字</td>\n<td>后世推演</td>\n<td>A</td>\n</tr>\n</tbody>\n</table></div>\n<p>关于寇宗奭一行的说明：寇宗奭早于刘完素约七十年，但他说的是「脾恶湿」与「湿困不能治水」，未及「生痰」二字。因此按年代他应列在首行，按论点的完整程度他尚未构成「脾湿生痰」的表述。结论第 5 条说「脾湿生痰的思想早于李时珍，可追至刘完素」，所指是「脾湿→痰」这一因果链的首次明确表述，与寇宗奭的「脾恶湿」不是一个层面的命题。</p>\n<h3>二、这句话的语境：它原本在讲半夏</h3>\n<p>《本草纲目》半夏【发明】项不是一篇论痰的专论，而是一味药的药理讨论。李时珍在这一项下依次引述甄权、苏颂、成无己、王好古、寇宗奭、赵继宗、汪机七家之说，最后以「时珍曰」作结。「脾无留湿不生痰，故脾为生痰之源，肺为贮痰之器」是这一串引述的收束句，其功能是解释半夏为什么能治痰。</p>\n<p>后世把这句话从半夏条中抽出，作为独立的病机纲领使用，这一「搬家」是后世完成的，不是李时珍完成的。因此引用时写作「李时珍论痰」并不准确，写作「李时珍论半夏时说」才与原文相符。</p>\n<h3>三、「痰之本在肾」就在同一段里</h3>\n<p>李时珍在同一项下引王好古语，其中有「半夏能泄痰之标，不能泄痰之本。泄本者，泄肾也」。也就是说，「痰之本在肾」与「脾为生痰之源」在《本草纲目》原文中是同一段落中并存的两种说法。</p>\n<p>韩国学者윤기령等的研究指出，后世曾出现「生痰之源为肾」「贮痰之器为胃」的主张，并认为「肾为生痰之本」可以成立。该文摘要称「이 문장의 원 출전은 『本草綱目』」（这句话的原出处是《本草纲目》），与本文所据原文一致。</p>\n<h3>四、「留」字与「治／制」异文</h3>\n<p>汪昂《本草备要》引作「脾无湿不生痰」，无「留」字；《本草纲目》原文作「脾无留湿不生痰」，有「留」字。二者相差一字。本文所据《本草纲目》为中华书局 2021 年整理本，该本已加标点、用简体字，「留」字在此本中明确印出，可以确认。汪昂所据底本是否脱此字，本文未核。</p>\n<p>寇宗奭语，《本草纲目》引作「困则不能治水」，《本草衍义》通行本作「困则不能制水」。此一字之异，须对校万历年间初刻的金陵本等早期刻本方能判断，本文未作判断。</p>\n<hr />\n<h2>「血压」与「风眩」</h2>\n<h3>一、中医古代没有「血压」这个概念</h3>\n<p>中医古代文献中没有「血压」一词，也没有与之对应的物理量。中医描述血行的用语是「通」「不通」「逆」「乱」「胀」，不是「压力高低」。以「阻力—加压」解释血压，其理论前提是十七世纪以后的血液循环学说。</p>\n<h3>二、「风眩」是现代国家标准确定的病名</h3>\n<p>「风眩」作为高血压对应的中医病名，见于国家标准《中医临床诊疗术语》。该标准现行版本为 GB/T 16751.1-2023《中医临床诊疗术语 第1部分：疾病》，代替 GB/T 16751.1-1997，标准状态为「现行」，主管部门为国家中医药局，发布单位为国家市场监督管理总局、国家标准化管理委员会。</p>\n<p>同一标准系列各部分版本年份不同：第1部分疾病为 2023 年版，第2部分证候为 2021 年版，第3部分治法为 2023 年版。引用时须写明具体部分与年份，仅写「GB/T 16751」会产生歧义。</p>\n<h3>三、2023 版「风眩」定义未核到</h3>\n<p>本文未取得 GB/T 16751.1-2023 正文，因此该版中「风眩」的定义未核到。已废止的 1997 年版曾将「风眩」定义为「以眩晕、头痛、血压升高、脉弦等为主要表现的眩晕类疾病」，但该版已废止，本文不以之代替现行版定义。</p>\n<h3>四、「脉胀」作为病名是现代提议</h3>\n<p>以《灵枢·胀论》「脉胀」作为高血压的中医病名，是现代学者的提议，不是古代通行用法，也不是国家标准中的病名。本文未核到该提议的原始论文，仅见于现代文献转述。</p>\n<hr />\n<h2>关于版本等级</h2>\n<p>本文等级定义：A 为读过原书全文、影印本，或有明确版本的整理本；B 为可信转引，即学术论文或权威词条，且多个来源说法一致；C 为只有单一网文，或尚未核到。</p>\n<p>《素问》与《灵枢》的引文，本文标为 B 级而非 A 级。原因是：所据为多个网络转录本，彼此文字一致，但未取得某一具体整理本的版权页信息，无法按 A 级要求标明出版社与年份。这一点在 v1 中标注有误，v2 更正。</p>\n<p>《本草纲目》一处标为 A 级，依据是所据为中华书局 2021 年整理本（全本插图版，全五册），版次明确，且「留」字在该本中明确印出。需说明的是，本文所据为该本电子版，未核纸本影印，故凡涉及版本异文的问题（如「治水／制水」），本文一律不作判断。</p>\n<p>《本草备要》一处标为 A 级，依据是所据为中国中医药出版社「中医临床必读丛书」整理本电子版，版次明确。同样未核纸本影印。</p>\n<hr />\n<h2>网上常见的错误归属</h2>\n<h3>一、「痰即有形之火，火即无形之痰」被标为《景岳全书》</h3>\n<p>正确情况：此句见于清·程杏轩《医述》卷十〈杂证汇参〉引，标注为「汪庵」，即汪昂。本文完整查阅汪昂《本草备要》半夏条全文，未见此句，该条汪昂自按为「湿必得火，方结为痰」，意思相近而非原句。此句的确切出处，本文未核到，标为待考。</p>\n<p>《景岳全书》中与此相关的原句是「痰即人之津液，无非水谷之所化……若化失其正，则脏腑病，津液败而气血即成痰涎」，讲的是痰的来源，与「痰火互化」不是同一论点。</p>\n<h3>二、「病机十九条」被当作篇名</h3>\n<p>正确情况：《素问》无「病机十九条」这一篇名。所谓「病机十九条」，是后人对《素问·至真要大论》中一段论病机文字的概括称呼。引用时应写作「《素问·至真要大论》」，不宜写作「《素问·病机十九条》」。</p>\n<h3>三、「脾为生痰之源」被单独归于李中梓</h3>\n<p>正确情况：李中梓《医宗必读·痰饮》原文作「故先哲云『脾为生痰之源』」，他自述是引前人，且只引了前半句。该句措辞出自李时珍《本草纲目》，思想更早可追至刘完素。详见专题一节。</p>\n<h3>四、《素问病机气宜保命集》的作者归属</h3>\n<p>本文所据通行整理本（人民卫生出版社「中医临床必读丛书」本等）题「金·刘完素撰」。另有资料称此书「旧题金河间刘完素撰，实为金张元素撰」，并称李时珍作《本草纲目》时已辨明出于张元素之手。此说本文未核到原始依据，亦未核到学界通行意见，故本文引用该书时仍按通行整理本题刘完素，并在此说明存在异说。</p>\n<hr />\n<h2>未解决的问题</h2>\n<ol>\n<li>\n<p>GB/T 16751.1-2023 正文未取得，「风眩」在现行版中的定义未核到。已核到的仅为标准信息页（标准号、名称、状态、主管部门、发布单位），未含正文条文。</p>\n</li>\n<li>\n<p>《本草纲目》「治水」与《本草衍义》「制水」的异文，须对校万历年间初刻的金陵本等早期刻本方能判断。本文所据为中华书局 2021 年整理本，不能用于判断版本异文。</p>\n</li>\n<li>\n<p>汪昂《本草备要》所据《本草纲目》底本是否脱「留」字，未核。</p>\n</li>\n<li>\n<p>王好古此说见于《汤液本草》何卷何条，《本草纲目》仅标「好古曰」，未注出处，本文未核到。</p>\n</li>\n<li>\n<p>甄权《药性论》原书已佚，今存辑佚本，本文所引甄权语系据《本草纲目》转引，未核辑佚本。</p>\n</li>\n<li>\n<p>「痰即有形之火，火即无形之痰」的确切出处未核到。本文查阅汪昂《本草备要》半夏条全文未见此句，仅见于《医述》转引。</p>\n</li>\n<li>\n<p>「郁久化火，火性上冲」作为固定表述的最早文献出处未核到。</p>\n</li>\n<li>\n<p>以「脉胀」为高血压中医病名的提议，其原始论文未核到。</p>\n</li>\n<li>\n<p>韩国学者윤기령等论文全文未取得。已尝试以下入口，均未成功：KCI 论文详情页（可读摘要）、KCI 原文 PDF 直连（读取失败）、jkmc.jams.or.kr 所载 PDF 下载地址（返回 Page Not Found）、DBpia 检索页（仅返回机构认证提示）、KoreaScience 检索（返回 404）。KCI 全文为机构订阅制。该文注 11 所引《本草纲目》的卷次与版本，本文未见。</p>\n</li>\n<li>\n<p>《素问病机气宜保命集》作者归属的异说（张元素说），其原始依据未核到。</p>\n</li>\n<li>\n<p>《素问》《灵枢》所据的具体整理本版权页信息未核，故相关引文仅标 B 级。</p>\n</li>\n</ol>\n<hr />\n<h2>修订记录</h2>\n<p>本版为 v2，在 v1 基础上修订如下：</p>\n<ol>\n<li>\n<p>年代表次序调整。寇宗奭为北宋人，《本草衍义》成书于政和六年（1116），首刊于宣和元年（1119），早于刘完素约七十年，v1 将其列在王好古之后，与「按年代排列」的标题不符。本版移至首行，并增「该条说的是什么」一栏，标明寇氏所论为「脾恶湿」与「湿困不能治水」，未出现「痰」字。结论第 5 条不因此改动，因该条所指为「脾湿→痰」因果链的首次明确表述。</p>\n</li>\n<li>\n<p>李中梓引文改正。v1 作「先哲云：脾为生痰之源，肺为贮痰之器」，补入了后半句，与所据转引不符。所据国家中医药管理局名词术语规范推广项目审核认证的词条，引文原作「按痰之为病，十常六七，而内经叙痰饮四条，皆因湿土为害，故先哲云『脾为生痰之源』……脾复健运之常，而痰自化矣」，只有前半句。本版按转引原样照录，并加注说明李氏只引前半句。</p>\n</li>\n<li>\n<p>《素问》《灵枢》引文的等级由 A 降为 B。v1 标为「通行整理本」而给 A 级，与本文自定的 A 级标准不符。本版降为 B，并在新增的「关于版本等级」一节说明理由。</p>\n</li>\n<li>\n<p>「1593 初刻」改为「万历年间初刻」，与正文其他地方写法一致。</p>\n</li>\n<li>\n<p>网址与英文摘要中的全角标点改为半角。v1 中网址写作「<a href=\"https://」\" rel=\"noopener\">https://」</a>，导致链接无法打开。</p>\n</li>\n<li>\n<p>未解决问题第 9 条补充已尝试的入口清单。v1 仅写「全文未取得」，本版列明五个入口及各自结果。</p>\n</li>\n<li>\n<p>新增「关于版本等级」一节，说明 A、B 两级在本报告中的实际适用情况，并声明所据古籍电子本均未核纸本影印。</p>\n</li>\n<li>\n<p>此前一版曾判断「汪昂引错更可能」，后因未核到《本草纲目》原文而撤回该判断，并称「老师的解释链在年代上完全成立」。本版不再作此表述。本版依据中华书局 2021 年整理本《本草纲目》原文，确认原文有「留」字，汪昂引文无「留」字，二者相差一字；汪昂是否脱字，本版不作判断。</p>\n</li>\n<li>\n<p>此前一版曾将《本草纲目》半夏【发明】项中的「〔权〕」认作陶弘景。本版更正为唐·甄权（约 541—643），《药性论》作者。《本草纲目》引书体例中，陶弘景标作「弘景」或「隐居」，不作「权」。</p>\n</li>\n<li>\n<p>此前一版曾引 GB/T 16751.1-1997 的「风眩」定义。本版确认该版已于 2023 年 3 月 24 日废止，现行版为 GB/T 16751.1-2023，并因未取得 2023 版正文，不再引用 1997 版定义代替。</p>\n</li>\n<li>\n<p>此前一版曾将「痰即有形之火，火即无形之痰」标为汪昂语。本版说明该句仅见于《医述》转引，汪昂《本草备要》半夏条全文未见此句，改标为待考。</p>\n</li>\n<li>\n<p>此前一版曾将「病机十九条」写作篇名。本版更正为《素问·至真要大论》中的一段文字，非篇名。</p>\n</li>\n<li>\n<p>此前一版曾以「老师的短文」指称被核查文本。本版统一改为「一段流传的说法」，因该文本的写作者与出处未能确认。</p>\n</li>\n<li>\n<p>本版新增《素问病机气宜保命集》作者归属异说一项，列入「网上常见的错误归属」与「未解决的问题」。</p>\n</li>\n<li>\n<p>本版新增韩国学者论文的完整书目信息与页码。</p>\n</li>\n</ol>\n<hr />\n<h2>来源列表</h2>\n<p><strong>古籍与整理本</strong></p>\n<ol>\n<li>\n<p>《黄帝内经·素问》，卷十一《举痛论》、卷二十二《至真要大论》。所据为多个网络转录本，文字彼此一致，未取得具体整理本版权页信息，等级 B。</p>\n</li>\n<li>\n<p>《黄帝内经·灵枢》，卷六第三十五篇《胀论》。所据为多个网络转录本，文字彼此一致，未取得具体整理本版权页信息，等级 B。</p>\n</li>\n<li>\n<p>金·刘完素《素问病机气宜保命集》，卷上《咳嗽论》。成书于金大定二十六年（1186），初刊于南宋淳祐十一年（1251）。据「中医临床必读丛书」整理本（人民卫生出版社）整理说明，该本据明万历二十九年（1601）吴勉学校步月楼刻《古今医统正脉全书》本整理：（网络平台链接，已撤下；只作线索，不作出处）（访问日期 2026-11-15）。引文据网络转录本，多个来源一致，等级 B。</p>\n</li>\n<li>\n<p>元·朱震亨《丹溪心法》，卷三《六郁》。所据为通行整理本，未核原书影印，等级 B。</p>\n</li>\n<li>\n<p>明·李时珍《本草纲目》（全本插图版，全五册），中华书局，2021 年 9 月，电子书，草部第十七卷·半夏·【发明】项。万历年间成书刊行。所据为该本电子版，未核纸本影印，等级 A。</p>\n</li>\n<li>\n<p>明·张介宾《景岳全书·痰饮》。所据为通行整理本，未核原书影印，等级 B。</p>\n</li>\n<li>\n<p>明·李中梓《医宗必读·痰饮》，崇祯十年（1637）。本文所据为转引，引文完整，等级 B。转引来源见第 16 条。</p>\n</li>\n<li>\n<p>清·汪昂《本草备要》半夏条。初刊于康熙二十二年（1683），增订于康熙三十三年（1694）。据「中医临床必读丛书」整理本电子版：（网络平台链接，已撤下；只作线索，不作出处）（访问日期 2026-11-15）。未核纸本影印，等级 A。</p>\n</li>\n<li>\n<p>清·吴谦等《医宗金鉴》，卷三十九《杂病心法要诀·中风》。本文所据为辞书转引，等级 B。</p>\n</li>\n<li>\n<p>清·程杏轩《医述》，卷十〈杂证汇参〉。本文所据为转引，等级 B。</p>\n</li>\n<li>\n<p>宋·寇宗奭《本草衍义》半夏条，政和六年（1116）成书，宣和元年（1119）首刊。本文所据为转引，作「困则不能制水」，等级 B。</p>\n</li>\n</ol>\n<p><strong>国家标准</strong></p>\n<ol>\n<li>\n<p>GB/T 16751.1-2023《中医临床诊疗术语 第1部分：疾病》，国家市场监督管理总局、国家标准化管理委员会发布，主管部门国家中医药局，标准状态「现行」。标准信息页：<a href=\"https://openstd.samr.gov.cn/bzgk/gb/newGbInfo?hcno=7377FB06FF43DC321BB6A4BF7DAA7F39\" rel=\"noopener\">https://openstd.samr.gov.cn/bzgk/gb/newGbInfo?hcno=7377FB06FF43DC321BB6A4BF7DAA7F39</a>（访问日期 2026-11-15）。正文未取得。</p>\n</li>\n<li>\n<p>GB/T 16751.2-2021《中医临床诊疗术语 第2部分：证候》；GB/T 16751.3-2023《中医临床诊疗术语 第3部分：治法》。据国家标准解读课程页面所列：<a href=\"https://cc.sacinfo.org.cn/course?id=8a6dd8719aa00a18019b6ff6340b1d20\" rel=\"noopener\">https://cc.sacinfo.org.cn/course?id=8a6dd8719aa00a18019b6ff6340b1d20</a>（访问日期 2026-11-15）。</p>\n</li>\n<li>\n<p>GB/T 16751.1-1997《中医临床诊疗术语 疾病部分》，已于 2023 年 3 月 24 日废止。本文仅作版本沿革说明，不引用其条文。</p>\n</li>\n</ol>\n<p><strong>学术论文</strong></p>\n<ol>\n<li>윤기령、장우창、백유상、정창현，〈「脾爲生痰之源， 肺爲貯痰之器.」의 의미에 대한 고찰〉，《대한한의학원전학회지》（The Journal of Korean Medical Classics），2018，31(3)，109–122 页。DOI: <a href=\"https://doi.org/10.14369/jkmc.2018.31.3.109\" rel=\"noopener\">https://doi.org/10.14369/jkmc.2018.31.3.109</a>。KCI 编号 ART002374393。摘要页：<a href=\"https://www.kci.go.kr/kciportal/ci/sereArticleSearch/ciSereArtiView.kci?sereArticleSearchBean.artiId=ART002374393\" rel=\"noopener\">https://www.kci.go.kr/kciportal/ci/sereArticleSearch/ciSereArtiView.kci?sereArticleSearchBean.artiId=ART002374393</a>（访问日期 2026-11-15）。全文未取得，已尝试入口见「未解决的问题」第 9 条。</li>\n</ol>\n<p><strong>词条与网页资料</strong></p>\n<ol>\n<li>\n<p>「脾为生痰之源」词条，国家中医药管理局名词术语规范推广项目审核认证，解读引《医宗必读·痰饮》原文：「按痰之为病，十常六七，而内经叙痰饮四条，皆因湿土为害，故先哲云『脾为生痰之源』……脾复健运之常，而痰自化矣。」<a href=\"https://m.dayi.org.cn/term/800120.html\" rel=\"noopener\">https://m.dayi.org.cn/term/800120.html</a>（访问日期 2026-11-15）。</p>\n</li>\n<li>\n<p>〈经典导读丨《素问病机气宜保命集》（刘完素）〉，微信公众号文章，载该书成书于南宋淳熙十三年丙午（金大定二十六年，1186），初刊于南宋淳祐十一年辛亥（1251）。（网络平台链接，已撤下；只作线索，不作出处）（访问日期 2026-11-15）。</p>\n</li>\n<li>\n<p>《素问病机气宜保命集》图书信息页，载「旧题金河间刘完素撰，实为金张元素撰」之说。（网络平台链接，已撤下；只作线索，不作出处）（访问日期 2026-11-15）。</p>\n</li>\n<li>\n<p>《本草衍义》图书信息页，载「宋·寇宗奭撰，成书于宋政和六年（1116 年）」。（网络平台链接，已撤下；只作线索，不作出处）（访问日期 2026-11-15）。</p>\n</li>\n<li>\n<p>《图经衍义本草》条目，载「北宋寇宗奭撰于政和六年（1116）。首刊于宣和元年（1119）」。（网络平台链接，已撤下；只作线索，不作出处）（访问日期 2026-11-15）。</p>\n</li>\n<li>\n<p>甄权生平资料，载其约生于南朝梁大同七年（541），卒于唐贞观十七年（643），著《药性论》。安徽省卫生健康委员会网站：<a href=\"https://wjw.ah.gov.cn/ztzl/zyygljzt/zyyztsy/yswh/58206511.html\" rel=\"noopener\">https://wjw.ah.gov.cn/ztzl/zyygljzt/zyyztsy/yswh/58206511.html</a>（访问日期 2026-11-15）。</p>\n</li>\n<li>\n<p>《灵枢·胀论》原文「营气循脉，卫气逆为脉胀；卫气并脉循分为肤胀」，古诗文网：（网络平台链接，已撤下；只作线索，不作出处）（访问日期 2026-11-15）。此条仅作辅助印证，等级不计。</p>\n</li>\n<li>\n<p>方药中〈论病机十九条及其运用规律〉，载「病机十九条」出自《素问·至真要大论》。（网络平台链接，已撤下；只作线索，不作出处）（访问日期 2026-11-15）。</p>\n</li>\n<li>\n<p>〈痰火互化玄机辨〉，将「痰即有形之火，火即无形之痰」标为《景岳全书》语，本文列为错误归属例证。（网络平台链接，已撤下；只作线索，不作出处）（访问日期 2026-11-15）。</p>\n</li>\n<li>\n<p>〈「痰浊」是养生的大敌〉，引《景岳全书》「痰即人之津液……若化失其正，则脏腑病，津液败而气血即成痰涎」。（网络平台链接，已撤下；只作线索，不作出处）（访问日期 2026-11-15）。</p>\n</li>\n<li>\n<p>〈咳嗽〉，载刘完素《素问病机气宜保命集·咳嗽论》咳与嗽分论原文。（网络平台链接，已撤下；只作线索，不作出处）（访问日期 2026-11-15）。</p>\n</li>\n</ol>\n<hr />\n<h2 lang=\"en\">Abstract</h2>\n<p lang=\"en\">This report examines the textual sources behind a widely circulated statement that explains elevated blood pressure as a systemic response to obstruction in the movement of qi and blood. Three findings are central. First, classical Chinese medical texts contain no concept of blood pressure and no physical quantity corresponding to pressure; the notion that the body raises pressure to overcome resistance belongs to circulatory physiology, not to the Chinese medical corpus. The nearest classical analogue is a line in the Ling Shu, chapter 35, stating that when nutritive qi moves within the vessels and defensive qi runs counter to them, vessel distension results. Second, the sentence \"the spleen is the source of phlegm, the lung is the vessel of phlegm\" appears in Li Shizhen's Bencao Gangmu, chapter 17, in the discussion of the drug banxia, where it concludes a survey of seven earlier authors; the phrase \"the root of phlegm lies in the kidney,\" quoted there from Wang Haogu, stands alongside it rather than contradicting it. Third, the idea that spleen dampness generates phlegm predates Li Shizhen by four centuries, appearing verbatim in Liu Wansu's work of 1186. The modern standard disease name \"wind dizziness\" is examined, and its definition in the current 2023 standard was not obtained. Common misattributions circulating online are listed with corrections or marked as unresolved.</p>"}, {"slug": "check-corrections", "title": "更正记录", "en": "Corrections", "date": "2026-11-19", "ver": "v1", "summary": "网站上改过的事实性内容：改了什么、为什么、依据。改正公开保留，不悄悄覆盖。", "summaryEn": "Every factual correction made on this site: what changed, why, and on what basis. Corrections are kept in the open, not quietly overwritten.", "html": "<p>本文为出处核查，不评价疗效，不提供诊疗建议。</p>\n<p>这里记下网站上改过的事实性内容：改了什么、为什么改、依据是什么。改正不悄悄覆盖，都留在这里。最新的在最下面。</p>\n<div class=\"tblwrap\"><table>\n<thead><tr><th>日期</th><th>哪里</th><th>改了什么</th><th>为什么</th><th>依据</th></tr></thead>\n<tbody>\n<tr><td>2026-11-17</td><td>风池</td><td>WHO 英文由 anterior 改回 posterior region of the neck。</td><td>早期草稿把 posterior 写成 anterior，两个词是相反的部位。</td><td>WHO 2008；风池核查报告</td></tr>\n<tr><td>2026-11-17 / 18</td><td>风池</td><td>中文分区由「颈后区」改为国标原文「在项部」。</td><td>国标原文是「在项部」。</td><td>GB/T 12346-2021 3.6.20（第 4 页）、5.11.20（第 25 页），A</td></tr>\n<tr><td>2026-11-18</td><td>八髎</td><td>分区词曾据转述改为「骶区」，同日核对国标原文后改回「骶部」；会阳改回「在臀部」。</td><td>转述和原文不一致时，以原文为准。</td><td>GB/T 12346-2021 5.7.31–5.7.34（第 18 页），附录 B 表 B.1（第 32 页），A</td></tr>\n<tr><td>2026-11-19</td><td>八髎</td><td>页面标签和「用手怎么找」里剩下的「骶区」，也改为「骶部」。</td><td>网站要用国标自己的词。</td><td>同上</td></tr>\n<tr><td>2026-11-19</td><td>高弓步、站立下轮、战士三</td><td>练习里感觉到的点由太溪改为太白。</td><td>在身体里感觉到的是太白（足内侧，第1跖趾关节近端），不是太溪（内踝后）。原来的记录写错了穴。</td><td>练习记录；太白 GB/T 12346-2021 5.4.3（第 13 页），A</td></tr>\n<tr><td>2026-11-19</td><td>商阳</td><td>从下犬式移到狮身人面式 → 海豹式。</td><td>下犬式里没有体会；狮身人面式里有。</td><td>练习记录</td></tr>\n<tr><td>2026-11-19</td><td>血海 → 膝盖内侧</td><td>站立下轮、树式、蛙式、鞍式原来写血海，改为「膝盖内侧」这一片地方。</td><td>在体式里感觉到的是膝盖骨内侧边上的一个窝，国标里那里没有穴位；血海在它上方大约三指宽。不是穴位，就照实写成身体的地方。</td><td>练习记录；血海 GB/T 12346-2021 5.4.10（第 13 页），A</td></tr>\n<tr><td>2026-11-19</td><td>大包</td><td>定位原文去掉多出来的「在」：「……第6肋间隙，腋中线上。」</td><td>录入时多了一个字。</td><td>GB/T 12346-2021 5.4.21（第 14 页），A</td></tr>\n<tr><td>2026-11-19</td><td>24 个穴位页</td><td>「标准原注」原来是我们的白话转述，改为国标逐字原文（「国标原注」）；正文数字两边的空格去掉，与国标一致；每条加条号、页码、等级。</td><td>承诺是逐字引用。</td><td>GB/T 12346-2021 全文 PDF，印刷页码</td></tr>\n<tr><td>2026-11-19</td><td>大椎</td><td>页码由「第 36 页」改为第 28 页。</td><td>36 是 PDF 文件的页序，不是印刷页码。</td><td>GB/T 12346-2021 5.13.14（第 28 页），A</td></tr>\n<tr><td>2026-11-19</td><td>手部穴位核查</td><td>四处国标页码更正：鱼际、太渊 9→8，少海 17→14，小海 18→15；报告升 v3.1。</td><td>同上，页序和印刷页码混了。</td><td>同上</td></tr>\n<tr><td>2026-11-19</td><td>穴位页、原文页</td><td>古文下面的英文译文拿掉，古文只给中文。</td><td>原文不翻译，这是网站自己说过的话。</td><td>—</td></tr>\n<tr><td>2026-11-19</td><td>上焦、中焦、下焦</td><td>删去写出功效说法的一句（即使原意是说「不采用」）。</td><td>疗效说法不出现在公开页面上。</td><td>—</td></tr>\n<tr><td>2026-11-19</td><td>穴位页 WHO 英文</td><td>「checked against the WHO text」改为「page in the WHO text not yet checked」。</td><td>WHO 原文的页码还没有核到。</td><td>—</td></tr>\n</tbody></table></div>\n<p>看到写错的地方，欢迎在任何一页「留一片叶子」告诉我们。</p>"}];
function checksView(){
 return `<section><h2 class="sec">核查<span class="en">Source checks</span></h2><p class="note">一句流传的话，出自哪里、原文怎么说、是经文、注文、后世推演，还是现代说法。每一条都写明版本和来源，读者可以自己核回去。这里只核出处，不评价任何疗法的效果，也不提供诊疗建议。<span class="en" style="display:block;margin-top:4px">Where a circulating claim comes from, what the original text says, and whether it is a classic, a commentary, a later elaboration or a modern idea. Every item names its edition and source so readers can check it themselves. These pages check sources only; they do not judge any treatment or give medical advice.</span></p>
 <div class="rows">${CHECKS.map(c=>`<button class="rowbtn" data-check="${c.slug}"><span class="name">${esc(c.title)}<span class="en" style="display:block">${esc(c.en)}</span></span><span class="small" style="display:block;grid-column:1/-1">${esc(c.summary||'')}</span>${c.summaryEn?`<span class="small en" style="display:block;grid-column:1/-1">${esc(c.summaryEn)}</span>`:''}<span class="small" style="grid-column:1/-1">${esc(c.date)} · ${esc(c.ver)}${PUBLIC?'':' · '+esc(c.by)}</span></button>`).join('')}</div></section>`;
}
function checkView(slug){
 const c=CHECKS.find(x=>x.slug===slug);if(!c)return '<p class="note">没有这一篇。</p>';
 return `<article class="page check">${PUBLIC?'':'<button class="back" data-back>← 返回</button>'}<h2 class="cktitle">${esc(c.title)}</h2><p class="small">${esc(c.en)} · ${esc(c.date)} · ${esc(c.ver)}${PUBLIC?'':' · 核查人 · Checked by：'+esc(c.by)}${PUBLIC?'':` · <a href="https://weidingpractice.com/${c.slug}.html" target="_blank" rel="noopener">网站上的这一页 ↗</a>`}</p>${c.html}</article>`;
}

let AUS_DB={};let AUSTIN=[],AUS_ALL=[],AUS_META={};
function buildAustin(){
 const docs=Object.entries(AUS_DB).map(([id,d])=>({id,...d}));
 const over={};docs.filter(d=>d.orig).forEach(d=>{over[d.orig]=d});
 AUS_META={};
 AUSTIN=AUSTIN_BASE.map(g=>({...g,items:[]}));
 const gOf=id=>AUSTIN.find(g=>g.id===id)||AUSTIN[0];
 AUSTIN_BASE.forEach(g=>g.items.forEach(it=>{const o=over[it[0]];
  if(o&&o.hidden){AUS_META[it[0]]={doc:o.id,orig:it[0],hidden:true};return}
  const row=o?[o.label||it[0],o.quote??it[1],o.src??it[2],it[3],o.when??it[4]??'']:[...it];
  gOf(o&&o.group||g.id).items.push(row);AUS_META[row[0]]={doc:o?o.id:'',orig:it[0],edited:!!o}}));
 docs.filter(d=>!d.orig&&!d.hidden).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0)).forEach(d=>{const row=[d.label,d.quote||'',d.src||'',d.k||'v',d.when||''];gOf(d.group).items.push(row);AUS_META[d.label]={doc:d.id,orig:'',mine:true}});
 AUS_ALL=AUSTIN.flatMap(g=>g.items);
 FOCUS.austin=FOCUS.ausFocus.map(h=>AUS_ALL.find(a=>a[0]===h||(AUS_META[a[0]]||{}).orig===h)).filter(Boolean);
}

 const it=h?AUS_ALL.find(a=>a[0]===h):null;const meta=h?AUS_META[h]||{}:{};
 const g=h?AUSTIN.find(g=>g.items.includes(it)):AUSTIN[0];
 return `<form id="ausf" class="ausf" data-h="${esc(h||'')}">
 <div class="field"><label for="af-q">他说的话 <span class="hint">英文原话</span></label><textarea id="af-q" rows="3" lang="en">${esc(it?it[1]:'')}</textarea></div>
 <div class="field"><label for="af-l">标题 <span class="hint">取他话里的几个词</span></label><input id="af-l" type="text" lang="en" value="${esc(it?it[0]:'')}"></div>
 <div class="field"><label for="af-w">何时 <span class="hint">他在哪一刻说的</span></label><input id="af-w" type="text" value="${esc(it?it[4]||'':'')}"></div>

 <p class="ausfbtn"><button type="submit">存</button> <button type="button" data-auscancel="1">取消</button>${h?` <button type="button" data-ausdel="1">${meta.mine?'删掉':'从句库里拿掉'}</button>`:''}${h&&meta.edited?` <button type="button" data-ausreset="1">恢复原样</button>`:''} <span class="small" id="af-msg"></span></p></form>`;

function wireAustin(){
 const v=document.querySelector('.ausview');if(!v||v.dataset.w)return;v.dataset.w=1;
 const host=()=>document.getElementById('ausform');
 const save=async(id,data)=>{if(!db){alertMsg('还没保存：登录 claude.ai 后打开这一页。');return false}
  try{await db.collection('austin').doc(id).set({...data,updatedAt:Date.now()});return true}catch(e){alertMsg(e&&e.code==='permission_denied'?'没有保存：你需要这一页的编辑权限。':'刚才没存上，再试一次。');return false}};
 const alertMsg=t=>{const m=document.getElementById('af-msg');if(m)m.textContent=t};
 v.addEventListener('click',async e=>{
  const ed=e.target.closest('[data-ausedit]'),ad=e.target.closest('[data-ausadd]');
  if(ed||ad){const hh=ed?ed.dataset.ausedit:'';
   let box=host();if(ed){box=document.createElement('div');box.id='ausform';document.getElementById('ausform')?.remove();ed.closest('dd').after(box)}else{document.getElementById('ausform')?.remove();box=document.createElement('div');box.id='ausform';ad.closest('p').after(box)}
   box.innerHTML=ausFormHtml(hh);box.querySelector('textarea').focus();return}
  const f=e.target.closest('#ausf');if(!f)return;const h=f.dataset.h;const meta=AUS_META[h]||{};
  if(e.target.closest('[data-auscancel]')){render();return}
  if(e.target.closest('[data-ausdel]')){
   if(meta.mine){if(db){try{await db.collection('austin').doc(meta.doc).delete()}catch(_){}}}
   else{const id=meta.doc||('o-'+Date.now().toString(36));await save(id,{orig:meta.orig||h,hidden:true,createdAt:Date.now()})}
   return}
  if(e.target.closest('[data-ausreset]')){if(db&&meta.doc){try{await db.collection('austin').doc(meta.doc).delete()}catch(_){}}return}
 });
 v.addEventListener('submit',async e=>{const f=e.target.closest('#ausf');if(!f)return;e.preventDefault();
  const q=f.querySelector('#af-q').value.trim();let l=f.querySelector('#af-l').value.trim();
  if(!q&&!l){alertMsg('先写他说的话。');return}

  const _old=f.dataset.edit&&ENTRIES.find(x=>x.id===f.dataset.edit);

  const btn=f.querySelector('button[type=submit]');btn.disabled=true;
  try{const eid=f.dataset.edit;if(eid){const old=ENTRIES.find(x=>x.id===eid);await db.collection('entries').doc(eid).set({...doc,createdAt:old&&old.createdAt?old.createdAt:doc.createdAt,...(old&&old.confirm?{confirm:true}:{}),...(!doc.chain&&old&&old.chain?{chain:old.chain}:{})});location.hash=editReturn||'log';editReturn='';return}
   await db.collection('entries').add(doc);
   store.set('pfp-session',doc.session);store.set('pfp-phase',doc.phase);store.set('pfp-when',doc.when);store.set('pfp-meal',doc.meal);store.set('pfp-mode',doc.mode);
   store.set('pfp-day',JSON.stringify({date:doc.date,intent:doc.intent,state:doc.state,diet:doc.diet,bowel:doc.bowel,cycle:doc.cycle,wake:doc.wake,jaw:doc.jaw}));
   ['f-mind','f-quote','f-variant','f-focus','f-cue'].forEach(id=>document.getElementById(id).value='');
   lkMoves=[];const _lp=document.getElementById('lk-path');if(_lp)_lp.innerHTML=lkPathHtml();f.querySelectorAll('.lk input').forEach(r=>{r.checked=r.name==='lk-seen'&&r.value==='self'});
   document.getElementById('f-point').value='';

   document.getElementById('toast').textContent=`已保存：${doc.pose} · ${doc.cue||(P[doc.point]?P[doc.point].zh:(doc.focus||'意象'))}。接着记下一条。`;
  }catch(e){document.getElementById('toast').textContent=e&&e.code==='permission_denied'?'没有保存：你需要这一页的编辑权限。':'没有保存，请再试一次。'}
  finally{btn.disabled=false}
 });
 f.querySelectorAll('input[name="f-mode"]').forEach(r=>r.addEventListener('change',()=>{f.dataset.mode=r.value}));
 const mic=document.getElementById('mic');
 if(dict&&mic){mic.hidden=false;
  mic.onclick=()=>{if(mic.dataset.on){dict.stop().catch(()=>{});return}
   dict.start().catch(e=>{if(e&&e.code==='not_granted'){mic.hidden=true}});};
 }
}

 const d=e.target.closest('[data-del]');if(d&&db){const id=d.dataset.del;
  if(pendingDel!==id){pendingDel=id;render();return}
  pendingDel=null;try{await db.collection('entries').doc(id).delete()}catch(err){statusEl.hidden=false;statusEl.textContent='没有删除：你需要这一页的编辑权限。'}}
});
document.getElementById('filepick').addEventListener('change',async ev=>{
 const file=ev.target.files&&ev.target.files[0];ev.target.value='';if(!file||!pendingUp||!assets||!db)return;
 const [k,slot]=pendingUp.split('|');pendingUp='';
 busy=`${k}|${slot}|正在处理和上传……`;render();
 try{
  let bmp;try{bmp=await createImageBitmap(file,{imageOrientation:'from-image'})}catch(_){bmp=await createImageBitmap(file)}
  const max=1600,sc=Math.min(1,max/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas');c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  const blob=await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('encode')),'image/jpeg',0.86));
  const r=await assets.upload(blob);
  const prev=PHOTOS[k]||{},old=prev[slot];
  await db.collection('photos').doc(k).set({...prev,[slot]:r.id,updatedAt:Date.now()});
  if(old&&old!==r.id){assets.delete(old).catch(()=>{})}
  busy=`${k}|${slot}|已上传。`;
 }catch(e){busy=`${k}|${slot}|没有上传成功，请再试一次。`}
 render();
});

(async()=>{

 },err=>{clearTimeout(timer);statusEl.hidden=false;statusEl.textContent='练习记录暂时读不到。索引照常可以看。'});
