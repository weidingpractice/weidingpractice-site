const SEQ={"seated":{"note":"课前","poses":[{"id":"chant","zh":"唱诵","en":"Chanting","pts":[["laogong","felt"]],"cue":"中指放在劳宫，声音立刻变得柔和、轻。","cueEn":"Rest the middle finger on Laogong, and the voice turns soft and light at once.","notes":[["","2026 年 9 月阴瑜伽教师培训，每次上课前有 10 分钟唱诵。我发现，只要把中指放在劳宫，我的声音立马变得柔和、轻，非常奇妙。","","During the Yin teacher training in September 2026, each class opened with ten minutes of chanting. I found that once I rested my middle finger on Laogong, my voice turned soft and light straight away. It was remarkable."]],"edited":false},{"id":"daoist","sa":"","zh":"三段道家呼吸","en":"Three-part Daoist Breath","pts":[],"lines":[["gv","felt"],["cv","felt"]],"felt":true,"cue":"一吸一呼，带着手臂、头和背一起动；做 2 分钟或 20 分钟都可以。","cueEn":"Each breath in and out moves the arms, head and back together; it works for two minutes or twenty.","notes":[["来源","这是 Austin Ince 在阴瑜伽教师培训里教的一段热身小串联。这个名字在阴瑜伽老师之间通用，最早由谁编排，还没查到。下面是我用自己的话写的步骤。","Source","A short warm-up sequence Austin Ince teaches in his Yin teacher training. The name is shared among Yin teachers; who first put it together, I have not yet found. The steps below are in my own words."],["坐法","跪坐在脚跟上（金刚坐 Vajrasana）。也可以盘腿坐、坐在椅子上，或者在脚趾蹲（toe squat）里做。","How to sit","Kneel and sit on your heels (Vajrasana). You can also sit cross-legged, sit on a chair, or do it in a toe squat."],["1 呼","双手放回身体两侧。","1 Out","Let the hands rest by your sides."],["2 吸","头向后，背微微后弯，双臂举过头顶。","2 In","Take the head back, arch the back a little, and lift the arms overhead."],["3 呼","下巴收向胸口，屈肘把双手带到头后，紧接着把双手向两侧推开。两个动作在同一口呼气里完成。","3 Out","Chin to chest, bend the elbows to bring the hands behind the head, then straight away push them out to the sides. Both moves happen on the same out-breath."],["4 吸","头向后，屈肘让指尖碰到肩膀，胸口上提，让肺吸满。","4 In","Take the head back, bend the elbows so the fingertips touch the shoulders, lift the chest and fill the lungs."],["5 呼","下巴收向胸口，掌心向前推；双手往前走的时候，背拱圆。","5 Out","Chin to chest, push the palms forward; as the hands travel forward, round the back."],["6 吸","头向后，双臂向上伸过头顶，背后弯。","6 In","Take the head back, reach the arms overhead, and arch the back."],["7 呼","下巴落下，向前折叠进婴儿式，双臂放在身体两侧的地上。","7 Out","Bring the chin down and fold forward into Child's Pose, arms on the floor by your sides."],["再吸","坐起来，在同一口吸气里直接开始下一轮。","In again","Come up to sitting and begin the next round on the same in-breath."],["几轮","重复 3 到 5 轮，每轮都在婴儿式里结束。最后一次婴儿式，双臂向前伸直，像一次深深的拜伏，可以从这里接别的体式。","How many","Repeat three to five rounds, ending each in Child's Pose. In the last one, stretch the arms forward like a deep bow; you can flow on into other postures from there."],["什么时候用","热身，单独练，收尾，冥想之前都可以。","When to use it","As a warm-up, as a practice on its own, to close, or before meditation."],["我的体会","有一天我连下犬式都做不下去，身体一做就紧张。做了这个小串联，神经系统很快就安静下来。","What I noticed","One day even Downward Dog felt like too much, and my body tensed at the thought. After this short sequence, my nervous system settled quickly."]],"edited":false}]},"allfours":{"note":"三个平面：前后、左右、旋转","poses":[{"id":"wrist","zh":"四足四向手位","en":"Four hand positions on all fours","pts":[["laogong","felt"]],"cue":"四足，手指朝前、朝外、朝膝盖、两手指尖相对。手放好不动，转的是肩膀和骨盆。","cueEn":"On all fours, set the fingers forward, then out, then toward the knees, then fingertips facing each other. The hands stay put; what circles is the shoulders and the pelvis.","notes":[["不是手腕在绕环。","手放好就不动。每换一个手的方向，肩膀和骨盆在上面转圈，手腕只是被带着换了角度。","It isn't the wrists circling.","Once the hands are placed, they stay. With each new hand direction, the shoulders and pelvis circle above them; the wrists only change angle because of it."],["注意力放在掌心。","放在劳宫，不放在十个手指上。","Attention in the palm.","On Laogong, not on all ten fingers."]],"edited":false},{"id":"catcow","sa":"Mārjaryāsana – Bitilāsana","zh":"猫牛式","en":"Cat–Cow","plane":"前后","pts":[["mingmen","maybe"]],"cue":"","edited":false},{"id":"hipsway","zh":"四足摆髋 → 绕臀","en":"Hip sways → circles","plane":"左右，再画圈","pts":[["baohuang","maybe"],["zhibian","maybe"]],"cue":"把觉知放在两个半球的当中，很深的那个点。","cueEn":"Rest your attention deep in the centre of each half of the buttocks.","notes":[["先左右，再画圈。","一般先左右摆，pathway 是先左后右；走顺了以后，自然而然就会去画圈。","Side to side, then circles.","Start by swaying left and right; once the path runs smoothly, you begin to draw circles without trying."],["觉知放在哪里。","画圈的时候，可以把觉知放在耻骨（pubic bone）。耻骨在正中，画正中，连着它的两个半球自然画得更顺。也可以把觉知放在两个半球的当中那两个点：耻骨是它们中间的那个点，两个半球是从它延伸出去的。","Where to rest your attention.","As you circle, you can rest your attention on the pubic bone. It sits at the centre, so when you circle from the centre, the two halves connected to it follow more smoothly. Or rest it on the two points at the centre of each half: the pubic bone is the point between them, and the two halves extend out from it."],["是一个球，不是一个圆。","人是三维的结构。你绕的时候，是一个圆球，不是平面上的圆形；是 3D，不是 2D。所以觉知放在球的当中：两个半球的当中，很深的一个点。不是臀部外侧那块骨头后面的窝，是在内侧。","A sphere, not a circle.","The body is three-dimensional. As you circle, you trace a sphere, not a flat circle: 3D, not 2D. So rest your attention at the centre of the sphere, the deep point in the middle of each half of the buttocks. Not the hollow behind the bony point on the outside of the hip; it lies further in."],["两个点，更能激起腰椎的觉知。","我个人的感觉是：把觉知放在两个半球当中的那两个点，更能激起腰椎的觉知。这完全就是 alignment 了。","Two points wake up the lumbar spine.","My own feeling: resting attention on the two points at the centre of each half wakes up awareness of the lumbar spine more. That is alignment itself."],["这是一个意象。","更多的其实是个意象，不一定要对到哪个穴位。跟人说\"两个半球的当中\"，他会明白。","It's an image.","It works more as an image than as a point. Tell someone \"the centre of each half\" and they understand."],["肠胃也动了。","绕臀时感觉最强烈的就是两个半球当中那个很深的点，同时有肠胃的蠕动。","The gut moves too.","During the circles, the deep point in the middle of each half feels strongest, and the gut starts to move."]],"felt":true,"imageNote":"这个体式的觉知是一个意象，不是一个穴位。下面两个穴位只是位置在这附近，按位置推测，标「可能」。","edited":false},{"id":"thread","sa":"Pārśva Bālāsana","zh":"穿针式","en":"Thread the Needle","plane":"旋转","pts":[["dabao","felt"]],"cue":"让侧肋那一片在动作里铺开。","cueEn":"Let the side ribs spread out as you move.","edited":false}]},"yinwarm":{"note":"阴式体式，开始时的热身","poses":[{"id":"cattail","zh":"猫拽尾式","en":"Cat Pulling Its Tail","sa":"阴瑜伽体式，没有梵文名","pts":[]},{"id":"snail","zh":"犁式 / 蜗牛式","en":"Plough / Snail","sa":"Halāsana（阴瑜伽叫 Snail）","pts":[]},{"id":"sphinx","sa":"Sālamba Bhujaṅgāsana（海豹式是阴瑜伽名称，无梵文）","zh":"狮身人面式 → 海豹式","en":"Sphinx → Seal","pts":[["dantian","felt"],["qugu","maybe"],["baliao","maybe"],["shangyang","felt"]],"extraMer":["ren"],"cue":"耻骨压向地面，从下丹田吸气，整个脊柱往上延长。","cueEn":"Press the pubic bone into the floor, breathe in from the lower dantian, and let the whole spine lengthen upward.","notes":[["逆腹式看幅度。","狮身人面式后弯不强，可以慢慢练浅浅的逆腹式；海豹式后弯更强，幅度太大，就不练逆腹式。","Reverse belly breathing depends on the range.","Sphinx is a mild backbend, so shallow reverse belly breathing can be practised slowly. Seal bends further; the range is too big for it."],["早上 7 到 9 点。","我把意识放在食指，也就是大肠经，感觉到肠胃在蠕动。","Mornings, 7 to 9.","I rest my attention in the index finger, on the Large Intestine channel, and I feel my gut start to move."]],"edited":false},{"id":"chintuck","sa":"","zh":"收下巴","en":"Chin tuck","pts":[["dazhui","felt"],["fengfu","felt"]],"cue":"从大椎沿着一条线，一直到风府。","cueEn":"One line from Dazhui all the way up to Fengfu.","notes":[["怎么做。","平躺，膝盖弯曲，头下不垫，或只垫一条薄毛巾。轻轻点头，像在说「嗯」：下巴往喉咙方向收，后脑勺贴着地面往上拉长。手指摸着脖子两侧，那两条大肌肉不绷紧。停 5 到 10 秒，放松。做几次。","How to do it.","Lie on your back, knees bent, no pillow or just a thin towel. Nod gently, as if saying \"mm\": draw the chin towards the throat and let the back of the head lengthen up along the floor. Keep your fingers on the two big muscles at the sides of the neck; they stay soft. Hold 5 to 10 seconds, then let go. A few times."],["幅度很小。","是「收」，不是低头。全程不应该痛；手臂发麻、头晕，就停下。","A very small movement.","It is a tuck, not a bow of the head. It should never hurt; if your arm goes numb or you feel dizzy, stop."],["放在哪里。","热身里：肩 → 收下巴 → 头部转动 → 侧倾 → 脊柱。融心式（下巴点地）待得久之后：躺下做几次，短，浅。","Where it goes.","In the warm-up: shoulders → chin tuck → head movements → side bends → spine. After a long Melting Heart with the chin on the floor: lie down and do a few, short and shallow."],["2026-11-20，第一次。","从大椎沿着一条线一直到风府，很明显。感觉一开始是从很像心脏那块地方，很深沉地升上来。","20 November 2026, the first time.","From Dazhui, one clear line all the way up to Fengfu. At first it felt as if it rose, deep and slow, from somewhere like the heart."]],"edited":false},{"id":"headturn","zh":"头部转动","en":"Head movements","sa":"","pts":[["fengchi","felt"],["dazhui","felt"]]}]},"flow":{"poses":[{"id":"dd","sa":"Adho Mukha Śvānāsana","zh":"下犬式","en":"Downward Dog","pts":[["laogong","felt"],["yongquan","felt"],["yunmen","felt"],["jianwo","felt"],["kuagen","felt"]],"cue":"手指间像夹着一根烟的宽度，力线不断。","cueEn":"Fingers apart by the width of a cigarette; the line of force never breaks.","notes":[["","指间留缝，但缝不大。","","Leave a gap between your fingers, but not a wide one."],["掌心微含。","不用力压平","Palms slightly hollow.","Don't press them flat."],["一条路从下面上来。","气从涌泉起，经腿、腰、脊，一路走到手指尖和掌心。手不主动往外推，而是被这条路上来的力带着伸开——这就是顺抽。","One path rises from below.","It starts at Yongquan (KI1), the hollow behind the ball of the foot, and travels up through the legs, the lower back and pelvis (yao in Chinese), and on up the spine, all the way to the fingertips and the palms. The hands don't push out by themselves; what rises along this path carries them open. In tai chi this is shun chou, reeling the silk outward."],["回来也是原路。","手指和掌心往回吸，力气经手臂、腰、腿，回到涌泉——这就是逆抽。","The way back is the same path.","Fingers and palms draw in, and the force returns through the arms, the lower back and pelvis, and the legs to Yongquan. This is ni chou, reeling the silk inward."],["关键在“转”，不在“拉”。","手上不是直线往外伸，而是带一点旋转，像拧。但往哪个方向拧，没有定数：有时往上推，有时往下推，力一直在调整，很精微。手其实没有动，只是力一直在调整。太注重方向，就教条了。","It's a spiral, not a pull.","The hands don't stretch out in a straight line; there is a slight spiral, like a screw. But which way it turns isn't fixed: sometimes you push up, sometimes down, and the force keeps adjusting, very finely. The hands themselves don't move; only the force keeps adjusting. Hold on to a direction and it becomes a rule."],["核心是肩窝。","怎么知道没有卡住？首先，力是使得上的；然后到肩胛骨这边，不管是上回旋、内回旋还是怎么样，肩窝这块地方是空的，关节不能卡住。感受到肩窝没有被卡住，就可以了。","The key is the shoulder hollow.","How do you know nothing is stuck? First, you feel the force flowing through, unbroken, the way a river runs. Then at the shoulder blade, whether it is rotating upward, inward or any other way, the hollow at the front of the shoulder (around Yunmen, LU2) feels empty. The joint isn't jammed. If you can feel the shoulder hollow isn't stuck, that is enough."],["力要连续。","抽猛了，力就断；抽得太浅，力又出不来。要做到不猛不断，全程连着。","Keep it continuous.","Reel too hard and the silk snaps; too lightly and nothing comes. Not forced, not broken, joined all the way through."],["头朝下的时候。","视线放在双手之间或垫子中间，不往下看；停留短一点，不憋气，下颌放松：牙齿分开，嘴唇轻合。","With the head down.","Look between your hands or at the middle of the mat, not further down. Stay briefly, keep breathing, and soften the jaw: teeth apart, lips lightly closed."]],"cmp":[["tian-chousi-fangxiang","",""],["tian-chousi-lu","",""],["wu-tunan-chousi","",""],["huang-shunchou","",""],["huang-nichou","",""]],"src":[["taijiquanlun-sanwu","讲三条不能犯的毛病：","Three faults to avoid:"],["lingshu-yingqi-xu","食指和肠胃：经气从肺经交到大肠经，再交到胃经，这是路线图：","Index finger and gut: the route map, Lung to Large Intestine to Stomach:"],["zhenjiu-daquan-shichen","时辰是后世的配属：当令，不是停留两小时：","The hour chart is a later time association: a period of emphasis, not two hours of residence:"]],"edited":false},{"id":"chat","sa":"Caturaṅga Daṇḍāsana","zh":"四柱支撑","en":"Chaturanga","pts":[["laogong","felt"],["yunmen","felt"],["jianwo","felt"],["kuagen","felt"],["zhongfu","maybe"],["yemen","maybe"]],"cue":"手指放在地上就可以，注意力放在劳宫的力线上。","cueEn":"Just place your fingers on the floor and rest your attention on the line from Laogong.","notes":[["注意力在劳宫的力线上。","手指放在地上就可以了，但注意力要放在劳宫，放在劳宫的力线上，这样手腕到肩膀的力线就非常顺。","Attention on the Laogong line.","Just place your fingers on the floor, and rest your attention on Laogong, on the line that runs from it. The line from wrist to shoulder then runs very smoothly."],["肩窝很重要。","真的不是方向的问题，而是要把觉知放在肩窝，呼吸要到肩窝。可能不只是云门，还有更深一点的点。","The shoulder hollow matters.","It really isn't about direction. Rest your attention in the shoulder hollow and breathe into it. It may be more than Yunmen; there is a deeper spot too."]],"edited":false}]},"standing":{"poses":[{"id":"lunge","sa":"Aṣṭa Candrāsana","zh":"高弓步","en":"High Lunge","pts":[["huantiao","felt"],["kuagen","felt"],["taibai","felt"],["yongquan","felt"]],"cue":"进入时守环跳，后腿守太白。","cueEn":"Going in, hold Huantiao; in the back leg, hold Taibai.","notes":[["用后腿的力。","觉知放在涌泉。涌泉一旦对上太白，你就知道该怎么用后腿的力了，alignment 也有了。","Use the back leg.","Rest your attention on Yongquan. Once Yongquan lines up with Taibai, you know how to use the back leg, and the alignment arrives with it."],["转换时用哪个点。","从高弓步到战士三、到站立扭转，用环跳；从高弓步到战士二，是转臀，觉知放在臀部正中心最深的点。","Which point in which transition.","From High Lunge to Warrior III, or to a standing twist, use Huantiao. From High Lunge to Warrior II you turn the hips, so rest your attention at the deepest point in the centre of each buttock."]],"edited":false},{"id":"prayer","sa":"弓步里：Parivṛtta Añjaneyāsana / Parivṛtta Aṣṭa Candrāsana · 幻椅式里：Parivṛtta Utkaṭāsana","zh":"合掌扭转","en":"Prayer Twist","pts":[["zhongjiao","maybe"],["laogong","felt"],["yemen","felt"]],"cue":"一只手的劳宫贴住另一只手的液门。不用转那么深，呼吸很好。","cueEn":"Press the Laogong of one hand against the Yemen of the other. No need to twist so deep; the breath is good.","edited":false},{"id":"w2tri","sa":"Vīrabhadrāsana II · Utthita Trikoṇāsana","zh":"战士二、三角式","en":"Warrior II, Triangle","pts":[["huantiao","felt"]],"cue":"留意臀部外后方的那个窝。","cueEn":"Notice the hollow at the back and outside of the hip.","edited":false},{"id":"revtri","sa":"Parivṛtta Trikoṇāsana","zh":"三角扭转式","en":"Revolved Triangle","pts":[["laogong","felt"],["baliao","felt"],["shenque","felt"],["mingmen","maybe"]],"felt":true,"cue":"劳宫放在骶骨上，和前面的肚脐成对。","cueEn":"Rest Laogong on the sacrum and pair it with the navel in front.","notes":[["劳宫放在骶骨上，不是命门。","我把手的劳宫放在骶骨上。昨天也试了命门，放命门太高了，会让我的肩膀不舒服。","Laogong on the sacrum, not Mingmen.","I rest the Laogong of my hand on the sacrum. Yesterday I tried Mingmen too; it sits too high and makes my shoulder uncomfortable."],["其实是一个呼吸练习。","放在骶骨上，感觉做的其实是一个呼吸练习，你很平静，你会知道自己的臀部是 aligned，两条腿也在对的方向。","It is really a breathing practice.","With the hand on the sacrum, it becomes a breathing practice. You grow calm, and you know your hips are aligned and both legs point the right way."],["前后成对。","劳宫放在骶骨上面，再和前面的肚脐成对，这样呼吸的时候你就会觉得前后对上了。除了左右，身体还有前后。","Front and back, in a pair.","Rest Laogong on the sacrum and pair it with the navel in front; as you breathe, front and back line up. The body has front and back, not only left and right."],["幅度永远不是重点。","你可以转得深，也可以转得浅，这跟你的身体条件、练习的时间长度有关。我们练的永远不是幅度，而是觉知、呼吸的深度，呼吸到骶骨。","Range is never the point.","You can twist deep or shallow; that depends on your body and how long you have practised. You never practise range. You practise awareness and the depth of the breath, breathing down into the sacrum."]],"imageNote":"手掌盖在骶骨上，覆盖的正是左右成对的八髎；前面配的是肚脐（神阙）。按位置说，骶骨正前方更接近气海、关元，练习里用的是肚脐。","edited":false},{"id":"skandasana","sa":"Skandāsana","zh":"侧蹲转换","en":"Warrior II → Skandasana","pts":[["baohuang","maybe"],["zhibian","maybe"]],"felt":true,"cue":"转臀下去，把骶骨这块后侧区域拉开。","cueEn":"Turn the hips as you lower, spreading the back of the sacrum.","notes":[["转臀下去。","Skandasana 是转臀下去，把骶骨这块后侧区域拉开。你只有转，才可以不卡着。","Turn the hips and lower.","In Skandasana you turn the hips and lower, opening the back of the sacrum. Only when you turn do you stop getting stuck."]],"imageNote":"转臀时觉知放在臀部正中心最深的点，是意象；胞肓、秩边只是位置在附近，标「可能」。","edited":false},{"id":"standbend","sa":"Ūrdhva Dhanurāsana（从站立下）","zh":"站立下轮","en":"Standing drop-back to Wheel","pts":[["yongquan","felt"],["taibai","felt"],["xinei","felt"],["kuagen","felt"],["shangjiao","felt"],["chongmen","maybe"],["qichong","maybe"]],"felt":true,"cue":"涌泉、太白、膝盖内侧，再到腹股沟前面。","cueEn":"Yongquan, Taibai, the inner knee, then the front of the groin.","notes":[["后弯的力线。","站立下轮的力线是从涌泉到太白到膝盖内侧，再到腹股沟前面的那个穴位。这个力线又对了，而且都是成对出现的。","The backbend line.","In a standing drop-back, the line runs from Yongquan to Taibai to the inner knee, then to the point at the front of the groin. The line works again, and every point comes in a pair."]],"imageNote":"腹股沟前面的点有两个候选：冲门（SP12，脾经）和气冲（ST30，胃经，在前侧链上）。还要在垫子上分辨。","edited":false},{"id":"chair","sa":"Utkaṭāsana","zh":"幻椅式","en":"Chair","pts":[["dantian","felt"],["qihai","felt"]],"cue":"吸气从下丹田沿脊柱往上。","cueEn":"Breathe in from the lower dantian and up along the spine.","src":[["nanjing-66-dongqi","起点：脐下肾间动气，就是后世所说的下丹田一带。《难经》说它是十二经的根本：","The starting point: the moving qi between the kidneys below the navel, the area later called the lower dantian. The Classic of Difficulties calls it the root of the twelve channels:"],["nanjing-28-du","路线：督脉从下极出发，沿脊柱里面往上：","The route: the Governing Vessel starts at the base and rises inside the spine:"],["xinggong-jifa","太极拳的说法：力从脊柱发出：","In tai chi: force issues from the spine:"]],"edited":false}]},"balance":{"poses":[{"id":"eagle","sa":"Garuḍāsana（手臂）","zh":"鹰式手臂缠绕","en":"Eagle arms","pts":[["yuji","felt"]],"cue":"不是掌心相对：下方的手按住上方手的鱼际。","cueEn":"Instead of pressing palm to palm, let the lower hand press the Yuji point of the upper hand.","notes":[["下方的手按上方手的鱼际。","手臂缠好以后，我不把两个掌心相对，而是用下方那只手，去按上方那只手的鱼际。","The lower hand presses the upper hand's Yuji.","Once the arms are wrapped, I don't bring the palms together. I use the lower hand to press Yuji on the upper hand."],["呼吸到了上后背。","按住鱼际，能明显感觉到呼吸到了上后背，肩胛骨打开，非常明显。","The breath reaches the upper back.","Pressing Yuji, I clearly feel the breath reach the upper back, and the shoulder blades open."],["教课时。","我让学生做这个体式、体会这个穴位，再加上按鱼际这句提示，就能听到学生的呼气明显变长。","In class.","When I teach this pose and ask students to feel this point, adding the cue to press Yuji, I can hear their exhales grow noticeably longer."]],"edited":false},{"id":"w3","sa":"Vīrabhadrāsana III · Parivṛtta Ardha Candrāsana","zh":"战士三、扭转半月","en":"Warrior III, Revolved Half Moon","pts":[["kuagen","felt"],["yongquan","felt"],["taibai","felt"]],"cue":"支撑脚守涌泉，后腿守太白，两个点同时在。","cueEn":"Hold Yongquan in the standing foot and Taibai in the back leg, both at once.","edited":false},{"id":"tree","sa":"Vṛkṣāsana","zh":"树式","en":"Tree","pts":[["yongquan","felt"],["xinei","felt"],["yunmen","felt"],["jianwo","felt"]],"cue":"脚心是水，大腿内侧是土，肩窝是金。","cueEn":"The sole is water, the inner thigh is earth, the shoulder hollow is metal.","edited":false}]},"floor":{"poses":[{"id":"frog","sa":"","zh":"青蛙式","en":"Frog","pts":[["xinei","felt"],["kuagen","felt"]],"felt":true,"extraMer":["liver","kidney"],"src":[["lingshu-jingmai-spleen","《灵枢》写的脾经走向：从大脚趾内侧，沿脚内侧、内踝前、胫骨后，上到膝和大腿内侧前缘，入腹：","The Spleen channel as the Lingshu traces it: from the inside of the big toe, along the inner foot, in front of the inner ankle, behind the shin, up the front edge of the inner knee and thigh, into the belly:"]],"cue":"额头或下巴落地，头可以转向一边，不挤压脖子。意放在膝盖内侧和腹股沟的窝。","cueEn":"Rest the forehead or chin down, or turn the head to one side so the neck is not squeezed. Rest your attention on the inner knee and the hollow of the groin.","notes":[["我的体会（11-14）","有一天，一低头就感觉头部胀，心里慌，做不了倒立。身体自己想做婴儿式，额头压着印堂左右轻轻晃，然后自动进了青蛙式。膝盖内侧和腹股沟的窝最明显，脚内侧也有感觉，是一整条力线。头转向一边，不挤压脖子，停留 2 到 3 分钟，然后身体往前趴一点，很舒服。","What I noticed (14 Nov)","One day, every time I lowered my head, my head felt full and pressured and I felt panicky inside; inversions were out. My body wanted Child's Pose: forehead on Yintang, rolling gently side to side, and then it moved into Frog on its own. The inner knee and the groin hollow were clearest; the inner foot too, one whole line. Head turned to one side so the neck was free, two to three minutes, then a little forward. It felt good."],["三条线放在一起","我感觉到的线：脚内侧 → 小腿内侧 → 膝盖内侧 → 大腿内侧 → 腹股沟的窝。我们对《灵枢·经脉》脾经循行的转述：从大脚趾内侧起，过内踝前，沿胫骨后上行，经膝和大腿内侧前缘，入腹。Myers 的深前线：足底深层、小腿深层、膝内侧、内收肌、骨盆。三条线落在同一片区域，这是我身体里感受到的巧合。大腿内侧并排走着脾、肝、肾三条经，我感觉到的是哪一条，还要再分辨。","Three lines side by side","The line I felt: inner foot, inner calf, inner knee, inner thigh, the groin hollow. Our paraphrase of the Spleen channel route in the Lingshu: from the inside of the big toe, in front of the inner ankle, up behind the shin, along the front edge of the inner knee and thigh, into the belly. Myers's Deep Front Line: deep sole, deep calf, inner knee, adductors, pelvis. The three lines meet in one region: a coincidence I felt in my own body. Three channels run side by side up the inner thigh; which one I felt, I still have to tell apart."]],"cmp":[],"edited":false},{"id":"saddle","sa":"Supta Vīrāsana（阴瑜伽叫 Saddle）","zh":"鞍式","en":"Saddle Pose","pts":[["xinei","felt"]],"extraMer":["st"],"cue":"感受膝盖内侧没有挤压，体会滋养的感受。","cueEn":"Feel that the inner knee is not squeezed, and notice the sense of nourishment there.","cmp":[],"notes":[["我最 struggle 的体式。","我大腿前侧非常紧，所以每天都做。往下躺的时候，躺在抱枕上，减少后弯的幅度。","My hardest pose.","The fronts of my thighs are very tight, so I do it every day. When I lie back, I lie on a bolster to make the backbend smaller."],["在正常的活动范围里做。","很多人觉得这个体式伤膝盖。我的做法是：在膝盖正常的活动范围（range of movement）里做。","Stay within the normal range.","Many people think this pose hurts the knees. My way is to stay within the knee's normal range of movement."],["整条前侧链的 extension。","拉伸的是从脚背开始的整个身体前侧：大腿前侧、hips 前侧；手臂打开，作用到肩膀前侧；头往后仰，颈椎、甚至额头都在里面。","An extension of the whole front chain.","It stretches the whole front of the body, from the tops of the feet: the front thighs, the front of the hips. Open your arms and it reaches the front of the shoulders; tip your head back and it reaches the neck, even the forehead."],["注意力放在膝盖内侧。","感受膝盖内侧没有挤压，体会滋养的感受。","Rest your attention on the inner knee.","Feel that the inner knee is not squeezed, and notice the sense of nourishment there."],["膝盖之间的距离。","传统教法是两膝之间一个拳头的距离。下去时特别不舒服，可以加到两个、甚至三个拳头。改变的只是长度：你的身体前侧要 travel 的那段长度，和每个人的身体条件有关。","The space between the knees.","Traditionally you keep one fist between the knees. If going down feels very uncomfortable, widen it to two or even three fists. You change only the length: how far the front of your body travels, which depends on each body."],["饭后可以做。","吃完饭我做的第一个练习就是鞍式。我饭后做，感觉肠胃在动。","After meals is fine.","Saddle is the first thing I practise after eating. When I do, I feel my gut moving."]],"edited":false},{"id":"butterfly","sa":"Baddha Koṇāsana（阴瑜伽叫 Butterfly）","zh":"蝴蝶式","en":"Butterfly","pts":[["yongquan","felt"]],"cue":"手心落在脚心上。","cueEn":"Rest the palms on the soles.","edited":false},{"id":"bridge","sa":"Setu Bandha Sarvāṅgāsana","zh":"桥式","en":"Bridge","pts":[["kuagen","felt"],["dantian","felt"],["xiajiao","maybe"],["shangjiao","maybe"],["mingmen","maybe"]],"cue":"","edited":false}]},"closing":{"poses":[{"id":"child","sa":"Bālāsana","zh":"婴儿式","en":"Child's Pose","pts":[["yintang","felt"]],"cue":"额头点地，慢慢左右转动额头。","cueEn":"Rest your forehead on the floor and roll it slowly from side to side.","notes":[["我的发现（2026-11-13）。","头部有压力的这几天，在婴儿式里额头点地，慢慢转动额头，头觉得轻了一些。","My discovery (13 Nov 2026).","On days when my head felt pressure, resting my forehead on the floor in Child's Pose and rolling it slowly, my head felt a little lighter."],["转的时候碰到哪里。","正中是印堂；往两边转，压过眉毛上方的阳白（胆经），再往外接近太阳穴。额头往上一点，是神庭、上星（督脉）。","What it touches as it rolls.","At the centre, Yintang; rolling to either side passes over Yangbai above the eyebrows (Gallbladder channel) and towards the temples. A little higher on the forehead lie Shenting and Shangxing (Governing Vessel)."]],"edited":false},{"id":"palming","zh":"劳宫捂眼","en":"Palming with Laogong","pts":[["laogong","felt"]],"cue":"双手搓热，掌心劳宫轻轻盖在闭着的眼睛上，停一分钟，不压。","cueEn":"Rub your palms warm and rest Laogong lightly over your closed eyes for a minute, without pressing.","notes":[["什么时候做。","练完以后；也可以在下犬式、犁式这类头朝下的体式之后，或者看屏幕很久以后。","When.","After practice; also after head-down poses such as Downward Dog and Plough, or after long screen time."],["怎么做。","手掌微微拱起，掌根落在颧骨上，掌心对着眼睛，不碰眼球。眼睛在掌心的暗处休息。","How.","Cup the palms slightly, heels of the hands on the cheekbones, the hollow of each palm over an eye without touching the eyeball. Let the eyes rest in the dark."],["试一试。","劳宫能让唱诵的声音变柔和；看看它能不能让眼睛也柔和下来：眼睛后面的压力、太阳穴的紧，有没有松一点。没有变化也记下来。","Try it.","Laogong softens the voice in chanting; see whether it softens the eyes too: the pressure behind them, the tightness at the temples. If nothing changes, write that down too."]],"edited":false}]}};

const PRINCIPLES=[
 {zh:'先说用的是哪张图。',status:'待验证',text:'同一片身体，在不同的图上有不同的名字。讲到一个部位，先说用的是哪张图：穴位图（气海、关元）、内丹图（丹田、小周天）、三焦图（下焦）。两张图的形容词不互借：「聚、充实、气足」是丹田的词；「通、不通、顺、堵、壅」是三焦的词。虚实寒热两边都用，不能拿来分。同一个「满」字，丹田满是练出来的，下焦胀满是病。不说「下焦饱满」，也不说「丹田通畅」。还有一张图要单独标：王唯工的脉波谐波是一个物理模型。从它推出来的话，比如「上焦属胆经」「奇经八脉属三焦经」，只能写成他的推论，不能当中医常识。',en:'Say which map you are using.',enText:'One stretch of the body carries different names on different maps. When you name a place, first say which map you mean: the acupoint map (Qihai, Guanyuan), the inner-alchemy map (dantian, Microcosmic Orbit), or the Sanjiao map (lower jiao). The maps don\'t share adjectives. Gathered, filled and abundant belong to the dantian; flowing, blocked, smooth, stuck and congested belong to the Sanjiao. Both maps use empty and full, cold and hot, so those words can\'t tell them apart. The same word full means progress in the dantian and illness in the lower jiao. Never call the lower jiao full, and never call the dantian unblocked. One more map needs its own label: Wang Wei-kung\'s pulse harmonics are a physical model. Claims drawn from it, such as "the upper jiao belongs to the Gallbladder channel" or "the eight extraordinary vessels belong to the Triple Burner channel", are his inferences, never common TCM knowledge.'},
 {zh:'穴位的名字就是口令。',text:'穴位名字是意象，不是编号。中国人读到「血海」两个字，身体就知道那里该是饱满、开阔、不被挤压的，练习就能做对；换成 SP10，什么都不会发生。就像「枯藤老树昏鸦，小桥流水人家」，几个意象并排放，意境就出来了。树式里「脚心是水，大腿内侧是土，肩窝是金」也是这样：意象并置，身体自己找对。这是这套系统对懂中文的人格外奇妙的地方。但这只对中国人成立：意象要靠母语才有反应，对西方人，穴位名字当口令完全不可行，英文译名也带不出这个反应。',en:'The point\'s name is the cue.',enText:'A point name is an image, not a number. Reading the two characters of Xuehai, "Sea of Blood", a Chinese speaker\'s body knows that place should feel full, open and unsqueezed, and the practice comes out right; SP10 does nothing. It works like classical Chinese poetry, where images set side by side create the mood. The Tree cue does the same: the sole is water, the inner thigh is earth, the shoulder hollow is metal. For readers of Chinese, this is what makes the system uncanny. But it holds only for them: an image needs your mother tongue to land. For Western students, a point name does not work as a cue at all, and the English translations do not bring that response back.',status:'有体会',from:['saddle','tree'],date:'2026-11-14'},
 {zh:'练和教用意象，记录用解剖语言。',text:'意和形分开。意是你做的：觉知放在哪个点，加一个意向（转、沉、延伸，或者只是放着）。形是身体实际怎么动的：用 Austin 讲义的词描述（平面、方向、动作）。告诉身体往哪个方向转，对我无效：髋可以前倾、后倾、旋转、平移，真实的转动是几个平面一起动一点，脑子算不出来。把意放在臀部正中那个点，想着转，身体自己就会配好，跟幅度、身体条件和腿的位置都有关。所以解剖语言用来事后描述和画图，不用来指挥身体。',en:'Practise and teach with images; record in anatomical terms.',enText:'Keep intent and form apart. Intent is what you do: where your attention rests, plus an intention (turn, sink, lengthen, or simply rest there). Form is how the body actually moved, described afterwards in the terms of Austin\'s anatomy handbook: plane, direction, movement. Telling my body which direction to turn does not work for me: the hip can tilt forward or back, rotate and shift, and a real turn mixes several planes at once, more than the mind can compute. Rest the intent on the centre point of the buttock, think "turn", and the body sorts it out by itself, depending on range, build and where the legs are. So anatomical language describes and maps; it does not command.',status:'有体会',from:['sphinx','skandasana'],date:'2026-11-14'},
 {zh:'幅度永远不是重点。',text:'转得深还是浅，跟身体条件、练习时间长短有关。我们练的永远不是幅度，而是觉知和呼吸的深度。',en:'Range is never the point.',enText:'How deep you go depends on your body and how long you have practised. You never practise range; you practise awareness and the depth of the breath.',status:'有体会',from:['revtri'],date:'2026-11-11'},
 {zh:'注意力点要成对。',text:'要做好 alignment，就把注意力放在成对的两个点上。左右成对：两条腿，屁股两边，肩胛骨两边，手两边。前后也成对：劳宫放在骶骨上，和前面的肚脐成对，呼吸时前后就对上了。只放一个点，身体还是找不到 alignment。内外也成对（11-12）：同一条腿上，大腿根内侧的窝（胯根，inner groin）和外侧的环跳成对，是窝和内外的对称。',en:'Attention points come in pairs.',enText:'To find alignment, rest your attention on points that come in pairs. Left and right: two legs, two sides of the buttocks, two shoulder blades, two hands. Front and back too: rest Laogong on the sacrum and pair it with the navel, and as you breathe, front and back line up. With one point, the body still can\'t find its alignment. Inside and outside pair up too (12 Nov): on the same leg, the hollow at the inner groin pairs with Huantiao on the outside, a hollow matched across the hip.',status:'有体会',from:['hipsway','revtri','standbend'],date:'2026-11-11'},
 {zh:'transition 要转臀，转才不卡。',text:'臀部是可以转的，而且一定要转。大多数人的 transition 不转臀部，这是个很大的问题。两个提示：高弓步到战士二；战士二到 Skandasana。',en:'Turn the hips in transitions.',enText:'The hips can turn, and they must. Most people keep the hips still in transitions, and that is a big problem. Two cues: High Lunge to Warrior II; Warrior II to Skandasana.',status:'有体会',from:['lunge','skandasana'],date:'2026-11-11'},

  if(!po.cue&&e.quote)po.cue=e.quote;
 }
 return out;
}

const GLOSSARY=[["气", "qi", "The vital breath or energy the classics describe moving through the body. Here it is a word for what you feel move with breath and attention, not a measurable substance.", "经典里在身体里运行的「气」。这里用来说呼吸和注意力带动的那种流动感，不当作可以测量的东西。"], ["气海", "Qihai · Sea of Qi", "Two different places share this name. (1) The point Qihai CV6, on the front midline 1.5 cun below the navel (GB/T 12346-2021). (2) In the Lingshu, the Sea of Qi is in the chest: \"Wuwei\" (ch. 56) says the great qi that gathers and does not move on collects in the chest, is called the Sea of Qi, comes out of the lungs and follows the throat; \"Hailun\" (ch. 33) names Danzhong as the sea of qi. Same name, not the same place. The two Lingshu pages are at the foot of By body place, on the acupoint map.", "同一个名字，两个地方。一、气海穴 CV6：前正中线上，脐下一寸半（GB/T 12346-2021）。二、《灵枢》里的气海在胸中：《五味》「其大气之抟而不行者，积于胸中，命曰气海，出于肺，循喉咽，故呼则出，吸则入」；《海论》「膻中者，为气之海」。名字一样，不是一个地方。两叶原叶在「按身体找」的穴位地图最下面。"], ["宗气", "Zong qi · Gathering qi", "Lingshu, \"Xieke\" (ch. 71): when grain enters the stomach, its dregs, its fluids and the zong qi part into three paths; the zong qi collects in the chest, comes out through the throat, threads the heart vessels and moves the breath. The Sea of Qi of \"Wuwei\" is also in the chest; see Qihai. The page is at the foot of By body place, on the acupoint map.", "《灵枢·邪客》：「五谷入于胃也，其糟粕、津液、宗气，分为三隧。故宗气积于胸中，出于喉咙，以贯心脉，而行呼吸焉。」同在胸中的，还有《五味》说的气海，见「气海」。原叶在「按身体找」的穴位地图最下面。"], ["咽 · 喉咙", "Yan and houlong · two passages in the throat", "The Lingshu, \"Youhui wuyan\" (ch. 69), keeps them apart: yan (with hou) is the road for food and drink; houlong is where the breath goes up and down. The same chapter names the parts of the voice: the epiglottis is the door of the voice, the lips its fan, the tongue its trigger, the uvula its gate; the back of the nasal passage is where the breath divides; and the hyoid, moved by the spirit, works the tongue. In \"Jingmai\", the Spleen channel runs beside the yan to the root of the tongue, and a branch of the Heart channel runs up beside the yan. The pages are at the foot of By body place, on the acupoint map.", "《灵枢·忧恚无言》把它们分开：「咽喉者，水谷之道也；喉咙者，气之所以上下者也。」同一篇接着说：「会厌者，音声之户也；口唇者，音声之扇也；舌者，音声之机也；悬雍垂者，音声之关也；颃颡者，分气之所泄也；横骨者，神气所使，主发舌者也。」《经脉》里，脾经「挟咽，连舌本，散舌下」；心经的支脉「从心系上挟咽」。原叶在「按身体找」的穴位地图最下面。"], ["穴位", "Point (acupoint)", "A named place on the body, usually a small hollow. In these notes you never press it; you rest your attention there. The code after the name (GB20, LU10) is the international standard code: letters for the channel, a number for its place on it.", "身体上有名字的地方，多半是一个小窝。在这些笔记里，不按，只把注意力放在那里。名字后面的代码（GB20、LU10）是国际标准编号：字母是经络，数字是在这条经上的位置。"], ["区域", "Area", "A larger stretch of the body that is not a single point, such as the dantian, the kua root or the three jiao. You cover it with your palm instead of looking for a spot.", "比一个穴位大的一片，不是一个点，比如丹田、胯根、三焦。用整个手掌盖住，不去找一个点。"], ["经络", "Channel (meridian)", "A pathway the classics describe, not just a line between points. Each runs inside the body for a stretch, where it belongs to one zang or fu organ and links with another; its surface stretch passes from point to point. The course follows the text of the Lingshu, \"Jingmai\". On the map the surface stretch is a solid line and the stretch inside the body a faint one. Twelve main channels are named after organs, plus the Governing Vessel up the back and the Conception Vessel up the front.", "经典里描述的通路，不只是穴位的连线。每一条都有一段走在身体里面，「属」一个藏或府，「络」另一个；体表的那一段，一站一站经过穴位。走向以《灵枢·经脉》原文为准。地图上，体表的一段画实线，走在身体里面的一段画淡线。十二正经以脏腑命名，另有沿背后正中上行的督脉、沿前面正中上行的任脉。"], ["颜色", "Colour", "Two passages in the classics speak of the colours of the channels. Suwen, \"Jingluo lun\": The Yellow Emperor asked: \"When the network vessels show, their five colours differ, blue-green, yellow, red, white and black. Why?\" Qi Bo replied: \"The channels have constant colours; the network vessels change without constancy.\" The Emperor asked: \"What are the constant colours of the channels?\" Qi Bo said: \"Heart red, lungs white, liver blue-green, spleen yellow, kidneys black; each matches the colour of its channel.\" The Emperor asked: \"Do the yin and yang network vessels also match their channels?\" Qi Bo said: \"The colour of the yin network vessels matches their channel; the colour of the yang network vessels changes without constancy, moving with the four seasons.\" Lingshu, \"Wuyin wuwei\": \"... hand shaoyin, stores the heart, colour red ... foot shaoyin, stores the kidneys, colour black ... foot taiyin, stores the spleen, colour yellow ... hand taiyin, stores the lungs, colour white ... foot jueyin, stores the liver, colour blue-green ...\" The Suwen follows the copy held by Kyoto University Library (RB00002950, image 243); the Lingshu follows the 1339 woodblock, juan 10, which writes da for tai in the lung line. Both pages are below, under \"The pages\".", "经典里讲经络的颜色，有这两段原文。《素问·经络论》：「黄帝问曰：夫络脉之见也，其五色各异，青黄赤白黑不同，其故何也？岐伯对曰：经有常色而络无常变也。帝曰：经之常色何如？岐伯曰：心赤，肺白，肝青，脾黄，肾黑，皆亦应其经脉之色也。帝曰：络之阴阳，亦应其经乎？岐伯曰：阴络之色应其经，阳络之色变无常，随四时而行也。」《灵枢·五音五味》：「……手少阴，藏心，色赤……足少阴，藏肾，色黑……足太阴，藏脾，色黄……手大阴，藏肺，色白……足厥阴，藏肝，色青……」《素问》据京都大学附属图书馆藏《重广补注黄帝内经素问》（RB00002950，第 243 页）；《灵枢》据元刻本卷十，肺一句元刻本作「手大阴」。两叶原图见下面「原叶」。"], ["藏", "Zang (our image: a lake)", "The five zang: heart, liver, spleen, lungs, kidneys. The Suwen, \"Wuzang bielun\", says they store essence and qi and do not let it out, so they are full but never solid. We draw each as a lake: full of water, yet not solid. \"Lake\" is our image, not a word from the classic. The quotation follows a modern typeset edition whose base text is Gu Congde's 1550 reprint of the Song edition; the characters of the original woodblock are still to be checked.", "心、肝、脾、肺、肾，五个藏。《素问·五藏别论》：「所谓五藏者，藏精气而不泻也，故满而不能实。」装满的是精气，不是实实在在的东西，所以满，却不实。我们把它画成一片湖：满满一湖水，却不是实心的。湖是我们的意象，不是原文的词。原文据排印本（底本明顾从德翻宋本），原刻字形待核。"], ["府", "Fu (our image: a valley)", "The six fu: gallbladder, stomach, small intestine, large intestine, bladder, sanjiao. The same chapter says they pass things on and do not store them, so they are filled but never full. What passes through is solid, but it keeps moving, so a fu is never full. We draw each as a valley: things flow through it. \"Valley\" is our image too. The same chapter also names six \"extraordinary fu\": brain, marrow, bone, vessels, gallbladder, uterus. The gallbladder is in both lists; that is the text as it stands.", "胆、胃、小肠、大肠、膀胱、三焦，六个府。同一篇：「六府者，传化物而不藏，故实而不能满也。」经过的东西是实的，但一直在走，不停留，所以永远不满。我们把它画成一道山谷：东西从中间流过去。谷也是我们的意象。同一篇另有「奇恒之府」六个：脑、髓、骨、脉、胆、女子胞。胆在两处都有，这是原文本来的样子。"], ["属 · 络 · 表里", "Belongs to, links with; paired organs", "When the Lingshu traces each channel, it says the channel belongs to one organ and links with another. It belongs to its own organ and links with its partner. The Heart channel belongs to the heart system and links with the small intestine; the Small Intestine channel does the reverse. So a lake and a valley become a pair, joined by two channels. This pairing is called biao-li, outside and inside.", "《灵枢·经脉》写每条经的走向时，都说它「属」一个藏或府、「络」另一个。属，是这条经自己的那一个；络，是和它成对的那一个。心经「出属心系，下膈络小肠」；小肠经「入缺盆络心……抵胃属小肠」，倒过来。一湖一谷就这样成了一对，两条经把它们连在一起，叫表里。"], ["心包", "Pericardium", "The layer around the heart. The Lingshu gives it a channel of its own, named \"the vessel of the heart's master, hand jueyin, the pericardium\", paired with the sanjiao. The \"Wuzang bielun\" lists five zang and six fu, and the pericardium is in neither list. So it has a channel but is not one of the five lakes; the map draws no lake for it.", "心外面的一层。《灵枢·经脉》给它单列一条经，名字是「心主手厥阴心包络之脉」，和三焦成对。《五藏别论》讲五藏、六府，心包都不在里面。所以它有经，却不在五个湖里，地图上不给它画湖。"], ["寸", "cun", "A body-relative inch used to locate points: about the width of your own thumb. Because it is measured on your own body, it fits you.", "找穴位用的「同身寸」：大约是你自己大拇指的宽度。用自己的身体量，所以合你自己的身体。"], ["丹田", "Dantian", "A word found on more than one map. The reliable text of the Huangdi Neijing does not use it; the received Suwen has it once, in the later-added chapter \"Benbing lun\", and there it means the upper dantian in the head. The Daoist Huangting jing links it with breathing: \"breathing out and in, it passes in and out of the dantian\". Later acupuncture books, from the Song on, use \"dantian\" as another name for the point Guanyuan, placing it two or three cun below the navel; the books do not agree on the number. These notes mean the lower dantian: the area under your palm below the navel.", "这个词在不止一张地图上。《黄帝内经》可靠的本文里没有「丹田」；今本《素问》只在后人补入的遗篇《本病论》里出现一次，指头部的上丹田。道家的《黄庭经》把它和呼吸连在一起：「嘘吸庐外，出入丹田」。宋以后的针灸书又把「丹田」当作关元穴的别名，在脐下二寸或三寸，几种说法并存。这里说的是下丹田：肚脐以下、手掌盖住的那一片。"], ["三焦", "Sanjiao (the three jiao)", "One of the six fu organs, with no organ of its own: a set of passages for water and qi in three sections. Upper jiao: the chest. Middle jiao: the upper belly. Lower jiao: the lower belly and pelvis. The Sanjiao channel, on the outside of the arm, is a separate thing.", "六腑之一，没有自己的实体器官：一套管水、管气的通道，分三段。上焦是胸，中焦是上腹，下焦是下腹和盆腔。手臂外侧的三焦经是另一回事。"], ["胯根", "Kua root", "A word from practice, our own: no book source for it has been found yet. It means the hollow at the front of the inner thigh, just below the groin crease, where the leg joins the trunk. Its anatomical name will be added once checked against the book.", "练习里的说法，是我们自己的话：还没有找到书里的出处。指大腿根前内侧、腹股沟折痕下面凹下去的那一片，腿接进躯干的地方。解剖上的名称，对过书再补。"], ["有体会 / 可能", "Felt / possible", "Felt: I have tested this point in this pose in my own body. Possible: a guess from where it sits, still to be tested.", "有体会：我在自己身体里试过，这个体式里这个点有用。可能：按位置推测，还没试过。"], ["经与注", "Scripture and commentary", "A line from the classic itself, or a later scholar's note on it. The notes always say which, because a commentary is not the classic.", "经文本身，还是后人的注解。笔记里每次都标明，因为注不是经。"], ["待核", "To be checked", "A source not yet checked against the original edition. It stays visible, marked, until it is.", "还没有对过原书和版本的出处。先放着，标明待核，核过再去掉。"], ["导引", "Daoyin", "Ancient Chinese movement done with the breath. The Daoyin Tu silk painting from Mawangdui Tomb 3 (2nd century BCE) shows more than forty figures, with pictures but no text; the Yinshu bamboo slips from Zhangjiashan describe methods in words, with no pictures, so the two complement each other. The earliest written mention is in the Zhuangzi (\"Ke Yi\"): \"Blowing and breathing, expelling the old and taking in the new, hanging like a bear and stretching like a bird: all this is only for long life.\" But Zhuangzi goes on to rank higher still the person who lives long without daoyin; he cites it as a contrast, not a recommendation. In English, \"Taoist Yoga\" means two different things. One is a source of Yin Yoga: its content comes from Paulie Zink's Taoist Yoga, and its form and name took shape with Paul Grilley and Sarah Powers. The other is the English title of Zhao Bichen's Xingming fajue mingzhi, a book on inner alchemy, unrelated to postures.", "古代中国的呼吸配合动作。马王堆三号汉墓出土的《导引图》（公元前 2 世纪）绘有四十多个人物姿态，有图无文；张家山汉简《引书》用文字记述具体方法，有文无图，两者正好互补。最早的文字记载在《庄子·刻意》（原文作「道引」）：「吹呴呼吸，吐故纳新，熊经鸟申，为寿而已矣。」不过庄子接着说，更高的是「不道引而寿」：他是拿导引作对照，不是在推荐它。英文的「Taoist Yoga」指两样不同的东西：一是阴瑜伽的来源，阴瑜伽的内容来自 Paulie Zink 的 Taoist Yoga，形式和名称成形于 Paul Grilley 与 Sarah Powers；二是赵避尘《性命法诀明指》的英译书名，讲内丹，和身体动作无关。"], ["哪张图", "Which map", "The same stretch of body goes by different names on different maps. To go from Shanghai to Beijing by plane, you need only a metro map to reach the airport; by car you need a road map; on foot, a street map. The way is the same; the map changes. These notes use six maps: the medical classics (Lingshu, Suwen, Nanjing and the national standards); cultivation and martial arts (Daoist inner-alchemy books, taiji books); modern anatomy; the everyday body (words like inner knee or shoulder hollow, which everyone can place); yoga and modern practice; and our own words (what is felt in practice, always marked as such). Each word sits on one map, and each sentence speaks from one map.", "同一片身体，在不同的地图上有不同的名字。从上海去北京：坐飞机，你只要一张地铁图，把你送到机场；开车，要一张路网图；走路，又要一张街道图。路还是那条路，用的地图不同。这里用六张地图：医经（《灵枢》《素问》《难经》和国家标准）；修炼和功法（道家内丹书、太极拳书）；现代解剖；日常身体（膝盖内侧、肩窝这种谁都知道在哪里的说法）；瑜伽和现代练习；还有我们自己的话（练习里的体会，每次都标明）。每个词只放在一张地图上，一句话只站在一张地图上说。"]];
const DAO=[{"zh": "观察，不寻找。", "en": "Observe; don't search.", "t": "练习里只是看着身体在发生什么，不去找我想要的那个感觉。去找，就总能找到；只是看着，才看见真正在发生的。所以我的记录宁可模糊一点、实时一点，也不把身体变成精确的实验田。", "te": "In practice I just watch what the body is doing, without hunting for the feeling I want. Search and you will always find it; only by watching do you see what is really happening. So I keep my notes loose and in the moment, rather than turning my body into a precise experiment.", "status": "wei", "src": null}, {"zh": "不催形，等路。", "en": "Don't rush the shape. Wait for the pathway.", "t": "慢慢来不是拖延，是给身体时间重新组织。能力也许已经有了，只是路还没有出来。", "te": "Taking your time is not delay. It gives the body time to reorganise. The capacity may already be there; the pathway is not yet open.", "status": "wei", "src": ["《道德经》第六十四章 · 王弼本", "合抱之木，生于毫末；九层之台，起于累土；千里之行，始于足下。", "checked", "郭店简此处残缺"]}, {"zh": "往阳是加，往阴是减。", "en": "Toward yang, add. Toward yin, let go.", "t": "往阳走，每一步多一个要求：着地少一点，力臂长一点，动作叠一层。往阴走，就一个一个拿掉，最后回到地面，什么都不做。", "te": "Toward yang, each step adds one demand: less contact, a longer lever, one more action. Toward yin, take them away one by one until you are back on the floor, doing nothing.", "status": "wei", "src": ["《道德经》第四十八章 · 王弼本", "为学日益，为道日损。损之又损，以至于无为。无为而无不为。", "checked", "郭店简作「学者日益，为道者日损。损之或损，以至亡为也」"]}, {"zh": "阴中有阳，阳中有阴。", "en": "Yang within yin, yin within yang.", "t": "一个体式是阴还是阳，差别在意，在你怎么练。同一个龙式，停着放松是阴，流动起来就是阳。没有一个体式只是阴，或者只是阳。", "te": "Whether a pose is yin or yang depends on intention: how you practise it. The same Dragon is yin held softly and yang in flow. No pose is only yin or only yang.", "status": "wei", "src": ["《道德经》第四十二章 · 王弼本", "万物负阴而抱阳，冲气以为和。", "checked", "帛书甲本作「中气以为和」"]}, {"zh": "往阴走，就回到根。", "en": "Going yin, you return to the root.", "t": "往阳走，路会分叉，所有单腿平衡都是树式往上长出的枝；往阴走，路会收拢，最后都回到地面。", "te": "Going yang, the path branches: every one-legged balance grows out of Tree. Going yin, the paths gather, and all of them come back to the floor.", "status": "wei", "src": ["《道德经》第十六章 · 王弼本", "夫物芸芸，各复归其根。归根曰静。", "checked", "郭店简无「夫物芸芸」，止于「各复其根」，其下无「归根曰静」"]}, {"zh": "身体要停，就停。", "en": "When the body asks to stop, stop.", "t": "倒立凳不需要技巧，也不需要肌肉用力。以前我能在上面像小孩一样翻着玩，有几天做不到了，我意识到需要停下来。", "te": "The headstand stool needs no skill and no muscular effort. I used to tumble on it like a child; on the days I couldn't, I knew I had to stop.", "status": "wei", "src": ["《道德经》第九章 · 王弼本", "功遂身退，天之道。", "checked", "帛书本句末有「也」"]}, {"zh": "从下一口气重新开始。", "en": "Begin again from the next breath.", "t": "走神了，回到呼吸；断了，从下一口气接上。练习就是一次又一次地重新开始。", "te": "When the mind wanders, come back to the breath; when practice breaks, pick it up from the next breath. Practice is starting again, and again.", "status": "wei", "src": null}];
const DAO_CHECK="check-yin-yang-sources";
function glossaryView(){return `<section><h2 class="sec">词汇<span class="en">Words used in these notes</span></h2><p class="note">这些笔记里反复出现的词，各说一句。<span class="en" style="display:block;margin-top:4px">One short explanation for each word that keeps coming up.</span></p>${GLOSSARY.map(([zh,en,de,dz])=>`<div class="mer"><h3>${esc(zh)}<span class="en">${esc(en)}</span></h3><p style="margin:0">${esc(dz)}</p><span class="en" style="display:block;color:var(--muted);font-size:14px;margin-top:4px">${esc(de)}</span></div>`).join('')}</section>`}
function daoBlock(){const show=d=>d.status!=='draft'||!PUBLIC;
 return `<section><h2 class="sec">底色：意<span class="en">The ground: intention</span></h2><p class="note">形是瑜伽的，意是道的。下面几条讲怎么练，在每一个体式里都成立。原文只放中文。<span class="en" style="display:block;margin-top:4px">The shapes come from yoga; the intention comes from the Dao. These hold in every pose. Classical texts stay in Chinese.</span></p>${DAO.filter(show).map(d=>{const sr=d.src&&(d.src[2]==='checked'||!PUBLIC)?`<div class="src"><span class="book">${esc(d.src[0])}${d.src[2]==='checked'?'':' <span class="todo">原文待核</span>'}${d.src[3]?' · '+esc(d.src[3]):''}</span><span class="text">${esc(d.src[1])}</span><span class="small"><button type="button" class="linkbtn" data-check="${DAO_CHECK}">版本核查 · Source check</button></span></div>`:'';return `<div class="mer"><h3>${esc(d.zh)}<span class="en">${esc(d.en)}</span>${d.status==='draft'?' <span class="todo">草稿 · draft</span>':''}</h3><p style="margin:0">${esc(d.t)}</p><span class="en" style="display:block;color:var(--muted);font-size:14px;margin-top:4px">${esc(d.te)}</span>${sr}</div>`}).join('')}</section>`}
function principlesView(){return `<section><p class="note">体式页记的是一个体式里发生了什么；这里记的是在很多体式里都成立的规律。<span class="en" style="display:block;margin-top:4px">Each pose page records what happens in that pose. This page records what holds across many poses.</span></p></section>`+principlesBlock()+daoBlock()}
function principlesBlock(){

function buildPoseDim(){
 const B={};const byZh=x=>Object.values(B).find(b=>b.zh===x||b.zh.split(' / ').includes(x)||(b.alias||[]).includes(x));
 const add=(id,o)=>{B[id]={id,alias:[],parts:[],...(B[id]||{}),...o}};
 for(const [pk] of PHASES)for(const p of SEQ[pk]?.poses||[])add(p.id,{zh:p.zh,en:p.en||'',layer:SEQ_LAYER[p.id]});
 add('eagle',{group:'hands'});add('palming',{group:'hands'});add('chant',{group:'voice'});
 for(const [k,al] of Object.entries(POSE_ALIAS_BASE)){const b=B[k]||byZh(k);if(b)b.alias=[...new Set([...b.alias,...al])]}
 for(const [n,lab,hint,names] of POSE_LAYERS)for(const x of [...names,...(n===6?['半倒立']:[])]){const b=byZh(x);if(b){if(b.layer===undefined&&!b.group)b.layer=n}else add(hid(x),{zh:x,layer:n})}
 for(const [g,names] of [['seq',POSE_EXTRA[2]],['voice',POSE_VOICE[2]]])for(const x of names){const b=byZh(x);if(b)b.group=g;else add(hid(x),{zh:x,group:g})}
 for(const [k,al] of Object.entries(POSE_ALIAS_BASE)){const b=B[k]||byZh(k);if(b)b.alias=[...new Set([...b.alias,...al])]}
 for(const [id,o] of Object.entries(SEQ_ORIG))if(B[id]&&o.zh0&&o.zh0!==B[id].zh)B[id].alias=[...new Set([...(B[id].alias||[]),o.zh0])];
 for(const [id,zh,o] of POSE_ROWS_BASE)add(id,{zh,...o,alias:o.alias||[]});
 // Wei's edits
 for(const [id,d] of Object.entries(POSE_DB)){if(d.deleted){delete B[id];continue}add(id,{...d,edited:true});if(!B[id].zh)delete B[id]}
 NAME2ID={};for(const b of Object.values(B)){for(const x of [b.zh,...b.zh.split(' / '),...(b.alias||[])])if(x&&!(x in NAME2ID))NAME2ID[x]=b.id}
 for(const b of Object.values(B)){
  // parts may be written as names; turn them into ids
  b.parts=(b.parts||[]).map(x=>B[x]?x:NAME2ID[x]||NAME2ID[normName(x)]||x);
  if(!b.parts.length&&/→|；|、/.test(b.zh)){const ps=b.zh.replace(/（[^）]*）/g,'').split(/\s*(?:→|；|;|、)\s*/).map(x=>NAME2ID[x.trim()]).filter(Boolean);if(ps.length>1)b.parts=ps}
 }
 for(const b of Object.values(B))if(b.layer===undefined&&!b.group&&b.parts.length){const ls=b.parts.map(x=>B[x]?.layer).filter(x=>typeof x==='number');if(ls.length)b.layer=Math.max(...ls)}
 for(const b of Object.values(B))if(b.layer===0&&!b.sub)b.sub=PRONE.some(k=>b.zh.includes(k))?'俯':'仰';
 PDIM=B;
}

async function savePoseDim(id,patch){

 if(!db){msg('现在连不上数据库，没存上。');return}
 const cur=POSE_DB[id]||{};
 try{await db.collection('poses').doc(id).set({...cur,...patch,updatedAt:Date.now()});msg('已保存 · '+nowHM())}catch(e){msg(e&&e.code==='permission_denied'?'没有保存：你需要这一页的编辑权限。':'刚才没存上，再试一次。')}
}
document.addEventListener('change',async e=>{

  else if(f==='sub')await savePoseDim(id,{sub:v});

 }
});

const KNOBS_HTML="<section id=\"knobs\"><h2>同一个体式，往阴，往阳<span class=\"en\">One pose, toward yin or toward yang</span></h2>\n<p class=\"note\">上面的梯子是换体式。这里是不换体式，只改一处，它就变阴或变阳。往阳是多一个要求，往阴是少一个。<span class=\"en\" lang=\"en\"> · The ladder above changes the pose. Here the pose stays the same; change one thing and it turns more yin or more yang. Toward yang adds a demand; toward yin takes one away.</span></p>\n<div class=\"knobs\"><div class=\"knob\"><h3>着地<span class=\"en\" lang=\"en\">Contact</span></h3><p class=\"ky\"><span class=\"kl\">往阴 · Yin</span>树式：抬起的脚，脚尖点地<span class=\"en\" lang=\"en\">Tree: the lifted foot rests its toes on the floor</span></p><p class=\"ka\"><span class=\"kl\">往阳 · Yang</span>树式：抬起的脚完全离地<span class=\"en\" lang=\"en\">Tree: the lifted foot leaves the floor</span></p></div><div class=\"knob\"><h3>手臂<span class=\"en\" lang=\"en\">Arms</span></h3><p class=\"ky\"><span class=\"kl\">往阴 · Yin</span>树式：双手合掌在胸前<span class=\"en\" lang=\"en\">Tree: palms together at the chest</span></p><p class=\"ka\"><span class=\"kl\">往阳 · Yang</span>树式：双手举过头顶<span class=\"en\" lang=\"en\">Tree: arms raised overhead</span></p></div><div class=\"knob\"><h3>多一个动作<span class=\"en\" lang=\"en\">One more action</span></h3><p class=\"ky\"><span class=\"kl\">往阴 · Yin</span>战士三：回到树式<span class=\"en\" lang=\"en\">Warrior 3: come back to Tree</span></p><p class=\"ka\"><span class=\"kl\">往阳 · Yang</span>树式：身体前倾、后腿往后伸，成了战士三<span class=\"en\" lang=\"en\">Tree: tip forward and reach the back leg out; now it is Warrior 3</span></p></div><div class=\"knob\"><h3>脊柱<span class=\"en\" lang=\"en\">Spine</span></h3><p class=\"ky\"><span class=\"kl\">往阴 · Yin</span>猫牛式：拱背，是猫<span class=\"en\" lang=\"en\">Cat-cow: round the back, the cat</span></p><p class=\"ka\"><span class=\"kl\">往阳 · Yang</span>猫牛式：塌腰抬头，是牛<span class=\"en\" lang=\"en\">Cat-cow: drop the belly and lift the head, the cow</span></p></div><div class=\"knob\"><h3>辅具<span class=\"en\" lang=\"en\">Props</span></h3><p class=\"ky\" /* The entry: one breath, then three ways in. The same entry opens the site (weidingpractice.com) and, once a day, this log. */
const ENTRY={"css": "#entry{--night:#0b1312;--deep:#101c1a;--moss:#1d2e2a;--mist:#c9d6cf;--ink:#e6ece8;--muted:#8fa29b;--water:#7cc7bd;--seal:#c8664f;\n --display:\"Spectral\",\"Yishen Serif SC\",\"Songti SC\",\"Noto Serif CJK SC\",Georgia,serif;--body:\"Inter\",\"PingFang SC\",\"Hiragino Sans GB\",system-ui,sans-serif;color-scheme:dark}#entry{position:fixed;inset:0;z-index:1000;background:var(--night);color:var(--ink);margin:0;font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}#entry #stage{position:fixed;inset:0;touch-action:none;cursor:pointer}#entry canvas{position:absolute;inset:0;width:100%;height:100%;display:block}#entry .skip{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);right:max(16px,env(safe-area-inset-right,0px));z-index:5;\n font:500 12px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);background:none;border:1px solid rgba(143,162,155,.35);border-radius:999px;padding:9px 14px;cursor:pointer}#entry .skip:hover{color:var(--ink);border-color:var(--muted)}#entry .prompt{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 16vh);text-align:center;z-index:3;pointer-events:none;\n padding-inline:max(16px,env(safe-area-inset-left,0px));transition:opacity .9s ease}#entry .prompt .zh{font:300 22px/1.4 var(--display);letter-spacing:.18em}#entry .prompt .en{font:300 italic 15px/1.4 var(--display);color:var(--muted);margin-top:6px;letter-spacing:.04em}#entry .prompt .hint{font:400 12px/1.4 var(--body);color:var(--muted);margin-top:18px;letter-spacing:.12em;opacity:0;transition:opacity 1.2s}#entry .prompt .hint.on{opacity:.8}#entry .gate{position:fixed;inset:0;z-index:4;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:28px;\n padding:calc(env(safe-area-inset-top,0px) + 64px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 32px) max(16px,env(safe-area-inset-left,0px));\n opacity:0;pointer-events:none;transition:opacity 1.6s ease}#entry .gate.on{opacity:1;pointer-events:auto}#entry .title{text-align:center}#entry .title h1{margin:0;font:300 clamp(38px,9vw,64px)/1.05 var(--display);letter-spacing:.22em;text-wrap:balance}#entry .title .en{display:block;margin-top:12px;font:300 italic clamp(16px,3.6vw,20px)/1.3 var(--display);color:var(--muted);letter-spacing:.06em}#entry .title p{margin:18px auto 0;max-width:30ch;font:300 15px/1.7 var(--display);color:var(--mist)}#entry .paths{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:min(720px,100%)}#entry .path{display:flex;flex-direction:column;gap:4px;padding:16px 16px 14px;border:1px solid rgba(201,214,207,.16);border-radius:4px;\n background:rgba(16,28,26,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:var(--ink);text-decoration:none;\n opacity:0;transform:translateY(8px);transition:opacity .9s ease,transform .9s ease,border-color .3s}#entry .gate.on .path{opacity:1;transform:none}#entry .gate.on .path:nth-child(2){transition-delay:.15s}#entry .gate.on .path:nth-child(3){transition-delay:.3s}#entry .path:hover,#entry .path:focus-visible{border-color:var(--water);outline:none}#entry .path .k{font:500 11px/1 var(--body);letter-spacing:.16em;color:var(--water);text-transform:uppercase}#entry .path .z{font:400 19px/1.3 var(--display);letter-spacing:.08em}#entry .path .e{font:300 italic 14px/1.3 var(--display);color:var(--muted)}#entry .path.play{border-color:rgba(200,102,79,.45)}#entry .path.play .k{color:var(--seal)}#entry .foot{font:400 11px/1.6 var(--body);color:var(--muted);letter-spacing:.08em;text-align:center;max-width:46ch}@media (max-width:640px){#entry .paths{grid-template-columns:1fr}#entry .path{flex-direction:row;align-items:baseline;flex-wrap:wrap;column-gap:10px;padding:13px 14px}#entry .path .k{width:100%}}@media (prefers-reduced-motion:reduce){#entry .gate,#entry .path,#entry .prompt{transition:none}}", "html": "<div id=\"entry\"><div id=\"stage\" role=\"button\" aria-label=\"按住吸气，松开呼气。Hold to breathe in, release to breathe out.\" tabindex=\"0\"><canvas id=\"c\"><\/canvas><\/div>\n<button class=\"skip\" id=\"skip\" type=\"button\">直接进入 · Enter<\/button>\n<div class=\"prompt\" id=\"prompt\" aria-live=\"polite\">\n <div class=\"zh\">按住，吸一口气<\/div>\n <div class=\"en\">Hold, and breathe in<\/div>\n <div class=\"hint\" id=\"hint\">或者轻点一下 · or just tap<\/div>\n<\/div>\n<main class=\"gate\" id=\"gate\" aria-hidden=\"true\">\n <div class=\"title\">\n  <h1>以身观身<\/h1><span class=\"en\">Seeing Through One Body<\/span>\n  <p>一个人的身体，走进一片林子。<br><span style=\"color:var(--muted);font-style:italic\">One body, walking into a forest.<\/span><\/p>\n <\/div>\n <nav class=\"paths\" aria-label=\"三条路 · Three ways in\">\n  <a class=\"path\" data-go=\"place\" href=\"points.html#place\"><span class=\"k\">身体地图 · The body map<\/span><span class=\"z\">三腔、脊柱、关节<\/span><span class=\"e\">Cavities, spine, joints<\/span><\/a>\n  <a class=\"path\" data-go=\"point\" href=\"points.html#point\"><span class=\"k\">穴位地图 · The acupoint map<\/span><span class=\"z\">有名字的地方<\/span><span class=\"e\">The named places<\/span><\/a>\n  <a class=\"path play\" data-go=\"forest\" href=\"play/\"><span class=\"k\">林子 · Play<\/span><span class=\"z\">两个人，一片林子<\/span><span class=\"e\">Two walkers, one forest<\/span><\/a>\n <\/nav>\n <p class=\"foot\">练习笔记。每一句都写明出处，不作诊断。<br>Practice notes. Every claim names its source; nothing here is a diagnosis.<\/p>\n<\/main><\/div>", "js": "\n(()=>{\nconst root=document.getElementById('entry');const cv=document.getElementById('c'),cx=cv.getContext('2d');\nconst stage=document.getElementById('stage'),prompt=document.getElementById('prompt'),hint=document.getElementById('hint'),gate=document.getElementById('gate');\nlet W=0,H=0,DPR=1,trees=[],motes=[];\nconst reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;\nfunction rnd(a,b){return a+Math.random()*(b-a)}\nfunction build(){\n DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0);\n trees=[];\n for(let layer=0;layer<4;layer++){ // 0 far, 3 near\n  const n=Math.round((W/90)*(1.6-layer*0.3));\n  for(let i=0;i<n;i++){const x=rnd(-40,W+40);const w=(2+layer*3.2)*rnd(.7,1.4);\n   const br=[];const k=Math.floor(rnd(1,4));for(let j=0;j<k;j++)br.push({y:rnd(.15,.6),dir:Math.random()<.5?-1:1,len:rnd(18,60)*(1+layer*.6),ang:rnd(.5,1.1)});\n   trees.push({x,w,layer,lean:rnd(-.015,.015),br,seed:Math.random()})}\n }\n trees.sort((a,b)=>a.layer-b.layer);\n motes=Array.from({length:Math.round(W*H/18000)},()=>({x:rnd(0,W),y:rnd(0,H),r:rnd(.4,1.4),v:rnd(.05,.25),p:Math.random()*6}));\n}\nbuild();addEventListener('resize',()=>{if(alive)build()});\n\n// breath state: 0..1 inhale amount; phase: wait | in | out | done\nlet breath=0,phase='wait',reveal=0,t0=performance.now(),holdStart=0,lastIdle=performance.now();\nconst MAX_IN=4200; // a long inhale caps itself; the visitor never waits on us\nfunction inhale(){if(phase==='done')return;phase='in';holdStart=performance.now();hint.classList.remove('on');prompt.querySelector('.zh').textContent='松开，呼气';prompt.querySelector('.en').textContent='Release, and breathe out'}\nfunction exhale(quick){if(phase!=='in'&&!quick)return;if(phase==='done')return;phase='out';if(quick)breath=Math.max(breath,.55);prompt.style.opacity=0}\nfunction finish(){if(phase==='done'&&reveal>=1)return;phase='done';reveal=Math.max(reveal,.001);prompt.style.opacity=0;gate.classList.add('on');gate.setAttribute('aria-hidden','false');stage.style.cursor='default';\n try{sessionStorage.setItem('forest-entered','1')}catch(e){}}\nlet down=false,downAt=0;\nstage.addEventListener('pointerdown',e=>{if(phase==='done')return;down=true;downAt=performance.now();inhale()});\naddEventListener('pointerup',()=>{if(!down)return;down=false;const dt=performance.now()-downAt;exhale(dt<350)});\naddEventListener('pointercancel',()=>{if(down){down=false;exhale(true)}});\nstage.addEventListener('keydown',e=>{if((e.key===' '||e.key==='Enter')&&!e.repeat){e.preventDefault();inhale()}});\nstage.addEventListener('keyup',e=>{if(e.key===' '||e.key==='Enter'){exhale(true)}});\ndocument.getElementById('skip').addEventListener('click',()=>{breath=1;finish();reveal=1;if(window.__entryGo)window.__entryGo('')});\nroot.querySelectorAll('[data-go]').forEach(a=>a.addEventListener('click',e=>{if(window.__entryGo){e.preventDefault();window.__entryGo(a.dataset.go)}}));\nlet alive=true;window.__entryStop=()=>{alive=false};\nsetTimeout(()=>{if(phase==='wait')hint.classList.add('on')},3500);\nif(reduce){breath=1;reveal=1;finish()}\n\nfunction draw(now){\n const t=(now-t0)/1000;\n if(phase==='in'){breath=Math.min(1,breath+(1/ (MAX_IN/1000))/60*1.0);if(now-holdStart>MAX_IN)exhale(false)}\n if(phase==='out'){breath=Math.max(0,breath-0.018);reveal=Math.min(1,reveal+0.02);if(reveal>=.55&&!gate.classList.contains('on'))finish()}\n if(phase==='done'){reveal=Math.min(1,reveal+0.02)}\n const clear=Math.max(reveal,breath*.6); // how far the fog has lifted\n // sky\n const g=cx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0a1211');g.addColorStop(.55,'#0f1b19');g.addColorStop(1,'#152420');\n cx.fillStyle=g;cx.fillRect(0,0,W,H);\n // a pale light behind the trees, rising with the breath\n const lx=W/2,ly=H*.44;const lr=Math.max(W,H)*(.18+.35*clear);\n const lg=cx.createRadialGradient(lx,ly,0,lx,ly,lr);lg.addColorStop(0,`rgba(201,214,207,${.10+.14*clear})`);lg.addColorStop(1,'rgba(201,214,207,0)');\n cx.fillStyle=lg;cx.fillRect(0,0,W,H);\n // trees: far layers paler, near layers darker; they rise from the ground as the fog lifts\n const ground=H*.86;\n for(const tr of trees){\n  const depth=tr.layer/3;const sway=Math.sin(t*.4+tr.seed*6)*(1+tr.layer)*.6;\n  const rise=Math.min(1,clear*1.3+.25-depth*.15);const top=ground-(H*(.55+depth*.5))*Math.max(.15,rise);\n  const a=(.25+depth*.6)*(.35+.65*Math.min(1,clear+.3));\n  const c=tr.layer<2?`rgba(70,98,90,${a*.55})`:`rgba(8,14,13,${a})`;\n  cx.fillStyle=c;cx.strokeStyle=c;\n  const xb=tr.x+(tr.layer-1.5)*(breath*6),xt=xb+tr.lean*H+sway;\n  cx.beginPath();cx.moveTo(xb-tr.w/2,H);cx.lineTo(xt-tr.w*.18,top);cx.lineTo(xt+tr.w*.18,top);cx.lineTo(xb+tr.w/2,H);cx.closePath();cx.fill();\n  cx.lineWidth=Math.max(.6,tr.w*.18);\n  for(const b of tr.br){const by=top+(ground-top)*b.y;const bx=xb+(xt-xb)*(1-b.y);\n   cx.beginPath();cx.moveTo(bx,by);cx.lineTo(bx+b.dir*b.len*Math.cos(b.ang)*rise,by-b.len*Math.sin(b.ang)*rise);cx.stroke()}\n }\n // fog bands, thinning with the breath\n for(let i=0;i<5;i++){const y=H*(.35+i*.13)+Math.sin(t*.15+i)*14;const fa=(.30-i*.03)*(1-clear*.85);\n  const fg=cx.createLinearGradient(0,y-90,0,y+90);fg.addColorStop(0,'rgba(201,214,207,0)');fg.addColorStop(.5,`rgba(201,214,207,${fa})`);fg.addColorStop(1,'rgba(201,214,207,0)');\n  cx.fillStyle=fg;cx.fillRect(0,y-90,W,180)}\n // motes drifting up\n for(const m of motes){m.y-=m.v*(1+breath*2);m.x+=Math.sin(t+m.p)*.12;if(m.y<-5){m.y=H+5;m.x=rnd(0,W)}\n  cx.fillStyle=`rgba(201,214,207,${.15+.35*clear})`;cx.beginPath();cx.arc(m.x,m.y,m.r,0,6.3);cx.fill()}\n // the breath point\n if(phase!=='done'||reveal<1){const pr=6+breath*Math.min(W,H)*.09+Math.sin(t*1.6)*(phase==='wait'?2:0);const pa=(1-reveal)*(.5+.5*breath);\n  const pg=cx.createRadialGradient(W/2,H*.44,0,W/2,H*.44,pr*3);pg.addColorStop(0,`rgba(230,236,232,${.85*pa})`);pg.addColorStop(.25,`rgba(124,199,189,${.35*pa})`);pg.addColorStop(1,'rgba(124,199,189,0)');\n  cx.fillStyle=pg;cx.beginPath();cx.arc(W/2,H*.44,pr*3,0,6.3);cx.fill()}\n // ground shadow and a quiet vignette\n const gg=cx.createLinearGradient(0,ground-40,0,H);gg.addColorStop(0,'rgba(7,12,11,0)');gg.addColorStop(1,'rgba(7,12,11,.95)');cx.fillStyle=gg;cx.fillRect(0,ground-40,W,H);\n const vg=cx.createRadialGradient(W/2,H/2,Math.min(W,H)*.3,W/2,H/2,Math.max(W,H)*.75);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.55)');cx.fillStyle=vg;cx.fillRect(0,0,W,H);\n if(alive)requestAnimationFrame(draw);\n}\nrequestAnimationFrame(draw);\n})();\n", "fonts": ""};
function mountEntry(){
 if(PUBLIC||document.getElementById('entry'))return;
 const day=new Date().toISOString().slice(0,10);try{if(localStorage.getItem('entry-day')===day)return}catch(_){return}
 if(!document.querySelector('link[href*="Spectral:ital,wght@0,300"]'))document.head.insertAdjacentHTML('beforeend',ENTRY.fonts);
 const st=document.createElement('style');st.id='entry-css';st.textContent=ENTRY.css;document.head.appendChild(st);
 document.body.insertAdjacentHTML('beforeend',ENTRY.html);
 window.__entryGo=kind=>{try{localStorage.setItem('entry-day',day)}catch(_){}
  if(window.__entryStop)window.__entryStop();const el=document.getElementById('entry');if(el)el.remove();st.remove();
  if(kind==='place'||kind==='point'){BODY_DOOR=kind;try{localStorage.setItem('pfp-body-door',kind)}catch(_){}if(location.hash==='#by-body')render();else location.hash='by-body'}
  else if(kind==='forest'){location.hash='forest'}};
 try{new Function(ENTRY.js)()}catch(e){window.__entryGo('')}}
/* 11-21 内外镜像：网站没有入口门，日志也不要；首页就是林子。 */
if(typeof window!=='undefined'&&!(window.__PUBLIC))history.replaceState(null,'','#forest'); // 11-22: every open starts at the forest, not the last page viewed
/* One structure, two visibilities. The public site is this same page with PUBLIC on: private parts are dropped and one line says the path is still being built. Nothing else differs. */
const PUBLIC=!!(typeof window!=='undefined'&&window.__PUBLIC);
const BUILDING='<p class="small building">这条路还在修。<span class="en" lang="en">This path is still being built.</span></p>';
let PV_HIT=false;
function pv(html){if(!PUBLIC)return html;if(html&&String(html).trim())PV_HIT=true;return ''}
/* 按身体找, two doors. Door 1: points, by search and by channel. Door 2: places in the body, after Yin Chaowen's line: breath (the three cavities), spine, then the limbs from near to far, then head and neck. Empty slots are named in grey and filled one by one. BODY_GROUPS stays as it is for forms and the site. */
const BODY_PLACES=[
 ['三腔','The three cavities','三腔是装着内脏的腔：胸腔里主要是心和肺，腹腔里主要是脾胃、肝胆和肠，盆腔里主要是膀胱、生殖器官和直肠。穴位地图里的上焦、中焦、下焦和它们大致对应，但说的是两套语言。','The three cavities hold the organs: chiefly heart and lungs in the chest, stomach, spleen, liver, gallbladder and intestines in the abdomen, bladder, reproductive organs and rectum in the pelvis. The upper, middle and lower jiao on the acupoint map roughly match them, in another language.',
  [['胸腔','Thoracic cavity',['xiongqiang']],['腹腔','Abdominal cavity',['fuqiang']],['盆腔','Pelvic cavity',['penqiang']]]],
 ['脊柱','Spine','','',
  [['颈','Neck',[]],['上背','Upper back',['xiangxia']],['腰','Lower back',[]],['骶骨区域','Sacral region',[]]]],
 ['上肢','Arm','从近到远：肩、肘、腕、手。','From near to far: shoulder, elbow, wrist, hand.',
  [['肩','Shoulder',['jianwo']],['肘','Elbow',[]],['腕','Wrist',[]],['手','Hand',[]],['手指','Fingers',[]]]],
 ['下肢','Leg','从近到远：髋、膝、踝、足。','From near to far: hip, knee, ankle, foot.',
  [['髋','Hip',['kuagen']],['膝','Knee',['xinei']],['踝','Ankle',[]],['足','Foot',[]],['足弓','Arch',[]],['脚趾','Toes',[]]]],
 ['头','Head','','',[['头','Head',[]]]]];
/* Two maps, two languages, one forest. A body place on the 身体地图 has no number; an acupoint has a name and a code. The TCM areas (丹田, 三焦, 八髎) belong to the acupoint map. Links between the maps say only "this stretch also has", never that one is the other. */
const BODY_MAP=new Set(['xiangxia','jianwo','kuagen','xinei','xiongqiang','fuqiang','penqiang']);
const TCM_REGIONS=['dantian','shangjiao','zhongjiao','xiajiao','baliao'];
const MAP_LINKS={xiangxia:['dazhui'],jianwo:['yunmen','zhongfu'],kuagen:['chongmen','qichong'],xinei:['xuehai'],xiongqiang:['shangjiao'],fuqiang:['zhongjiao','shenque','qihai','dantian'],penqiang:['xiajiao','qihai','dantian','baliao']};
function mapLinkBlock(k){
 if(BODY_MAP.has(k)){const ks=(MAP_LINKS[k]||[]).filter(x=>P[x]);if(!ks.length)return '';
  return `<p class="small maplink">穴位地图里，这一带有：${ks.map(x=>`<button type="button" class="linkbtn" data-p="${x}">${esc(P[x].zh)} ${esc(P[x].py||'')} ${esc(P[x].code)}</button>`).join('　')}<span class="en" style="display:block">On the acupoint map, this stretch also has these points.</span></p>`}
 const at=Object.entries(MAP_LINKS).filter(([,v])=>v.includes(k)).map(([b])=>b).filter(b=>P[b]);
 return at.length?`<p class="small maplink">身体地图里，它在：${at.map(b=>`<button type="button" class="linkbtn" data-p="${b}">${esc(P[b].zh)} ${esc(P[b].py||'')}</button>`).join('　')}<span class="en" style="display:block">On the body map, it lies in this place.</span></p>`:''}

const ORIG_PAGES={"youhui": {"file": "pages/lingshu-yuan-youhui-69.jpg", "hl": [0.43, 0.09, 0.37, 0.82], "page": 30, "zh": "《灵枢·忧恚无言》", "en": "Lingshu, Youhui wuyan: the parts of the voice", "alt": "元刻本《灵枢》忧恚无言第六十九", "cap": "元刻本《黄帝素问灵枢集注》第 2 册，忧恚无言第六十九。国家图书馆藏，archive.org（nlc-892-412004000772-383328）阅读器第 30 页。此本作「何气出行」，通行本作「何气不行」", "text": "人之卒然忧恚而言无音者，何道之塞，何气出行，使音不彰？……咽喉者，水谷之道也；喉咙者，气之所以上下者也；会厌者，音声之户也；口唇者，音声之扇也；舌者，音声之机也；悬雍垂者，音声之关也；颃颡者，分气之所泄也；横骨者，神气所使，主发舌者也。"}, "xieke": {"file": "pages/lingshu-yuan-xieke-71.jpg", "hl": [0.8, 0.09, 0.15, 0.82], "page": 31, "zh": "《灵枢·邪客》宗气", "en": "Lingshu, Xieke: the zong qi", "alt": "元刻本《灵枢》邪客第七十一", "cap": "同一刻本第 2 册，邪客第七十一。archive.org（nlc-892-412004000772-383328）阅读器第 31 页", "text": "五谷入于胃也，其糟粕、津液、宗气，分为三隧。故宗气积于胸中，出于喉咙，以贯心脉，而行呼吸焉。"}, "wuwei-qihai": {"file": "pages/lingshu-yuan-wuwei-56.jpg", "hl": [0.35, 0.08, 0.23, 0.84], "page": 16, "zh": "《灵枢·五味》气海", "en": "Lingshu, Wuwei: the Sea of Qi", "alt": "元刻本《灵枢》五味第五十六", "cap": "元后至元五年（1339）胡氏古林书堂刻本《黄帝素问灵枢集注》第 2 册，五味第五十六。国家图书馆藏，archive.org（nlc-892-412004000772-383328）阅读器第 16 页", "text": "其大气之抟而不行者，积于胸中，命曰气海，出于肺，循喉咽，故呼则出，吸则入。"}, "hailun": {"file": "pages/lingshu-yuan-hailun-33.jpg", "hl": [0.3, 0.08, 0.345, 0.84], "page": 57, "zh": "《灵枢·海论》四海", "en": "Lingshu, Hailun: the four seas", "alt": "元刻本《灵枢》海论第三十三", "cap": "同一刻本第 1 册，海论第三十三，跨两叶。archive.org（nlc-892-412004000772-383329）阅读器第 57 页", "text": "人有髓海，有血海，有气海，有水谷之海……胃者水谷之海……冲脉者为十二经之海……膻中者为气之海……脑为髓之海……气海有余者，气满胸中，悗息面赤；气海不足，则气少不足以言。"}, "lung": {"file": "pages/lingshu-yuan-juan3-lung.jpg", "hl": [0.218, 0, 0.279, 1], "page": 26, "zh": "肺经", "en": "Lung channel", "text": "肺手太阴之脉，起于中焦，下络大肠，还循胃口，上膈属肺，从肺系横出腋下，下循臑内，行少阴心主之前，下肘中，循臂内上骨下廉，入寸口，上鱼，循鱼际，出大指之端；其支者，从腕后直出次指内廉，出其端。"}, "li": {"file": "pages/lingshu-yuan-juan3-large-intestine.jpg", "hl": [0.366, 0, 0.34, 1], "page": 27, "zh": "大肠经", "en": "Large Intestine channel", "text": "大肠手阳明之脉，起于大指次指之端，循指上廉，出合谷两骨之间，上入两筋之中，循臂上廉，入肘外廉，上臑外前廉，上肩，出髃骨之前廉，上出于柱骨之会上，下入缺盆，络肺，下膈，属大肠；其支者，从缺盆上颈，贯颊，入下齿中，还出挟口，交人中，左之右，右之左，上挟鼻孔。"}, "st": {"file": "pages/lingshu-yuan-juan3-stomach.jpg", "hl": [0.172, 0, 0.496, 1], "page": 27, "zh": "胃经", "en": "Stomach channel", "text": "胃足阳明之脉，起于鼻之交頞中，旁纳太阳之脉，下循鼻外，入上齿中，还出挟口环唇，下交承浆，却循颐后下廉，出大迎，循颊车，上耳前，过客主人，循发际，至额颅；其支者，从大迎前下人迎，循喉咙，入缺盆，下膈，属胃，络脾；其直者，从缺盆下乳内廉，下挟脐，入气街中；其支者，起于胃口，下循腹里，下至气街中而合，以下髀关，抵伏兔，下膝膑中，下循胫外廉，下足跗，入中指内间；其支者，下廉三寸而别，下入中指外间；其支者，别跗上，入大指间，出其端。"}, "spleen": {"file": "pages/lingshu-yuan-juan3-spleen.jpg", "hl": [0.765, 0, 0.235, 1], "page": "27–28", "zh": "脾经", "en": "Spleen channel", "text": "脾足太阴之脉，起于大指之端，循指内侧白肉际，过核骨后，上内踝前廉，上踹内，循胫骨后，交出厥阴之前，上膝股内前廉，入腹，属脾，络胃，上膈，挟咽，连舌本，散舌下；其支者，复从胃，别上膈，注心中。"}, "heart": {"file": "pages/lingshu-yuan-juan3-heart.jpg", "hl": [0.161, 0, 0.284, 1], "page": 28, "zh": "心经", "en": "Heart channel", "text": "心手少阴之脉，起于心中，出属心系，下膈络小肠；其支者，从心系上挟咽，系目系；其直者，复从心系却上肺，下出腋下，下循臑内后廉，行太阴心主之后，下肘内，循臂内后廉，抵掌后脫骨之端，入掌内后廉，循小指之内，出其端。"}, "si": {"file": "pages/lingshu-yuan-juan3-small-intestine.jpg", "hl": [0.619, 0, 0.297, 1], "page": 28, "zh": "小肠经", "en": "Small Intestine channel", "text": "小肠手太阳之脉，起于小指之端，循手外侧上腕，出踝中，直上循臂骨下廉，出肘内侧两筋之间，上循臑外后廉，出肩解，绕肩胛，交肩上，入缺盆，络心，循咽，下膈，抵胃，属小肠；其支者，从缺盆循颈上颊，至目锐眦，却入耳中；其支者，别颊上䪼，抵鼻，至目内眦，斜络于颧。"}, "bl": {"file": "pages/lingshu-yuan-juan3-bladder.jpg", "hl": [0, 0, 0.478, 1], "page": "28–29", "zh": "膀胱经", "en": "Bladder channel", "text": "膀胱足太阳之脉，起于目内眦，上额，交巅；其支者，从巅至耳上角；其直者，从巅入络脑，还出别下项，循肩髆内，挟脊，抵腰中，入循膂，络肾，属膀胱；其支者，从腰中下挟脊，贯臀，入腘中；其支者，从髆内左右别下贯胛，挟脊内，过髀枢，循髀外，从后廉下合腘中，以下贯踹内，出外踝之后，循京骨，至小指外侧。"}, "ki": {"file": "pages/lingshu-yuan-juan3-kidney.jpg", "hl": [0.323, 0, 0.258, 1], "page": 29, "zh": "肾经", "en": "Kidney channel", "text": "肾足少阴之脉，起于小指之下，邪走足心，出于然谷之下，循内踝之后，别入跟中，以上踹内，出腘内廉，上股内后廉，贯脊，属肾，络膀胱；其直者，从肾上贯肝膈，入肺中，循喉咙，挟舌本；其支者，从肺出络心，注胸中。"}, "pc": {"file": "pages/lingshu-yuan-juan3-pericardium.jpg", "hl": [0.562, 0, 0.358, 1], "page": 29, "zh": "心包经", "en": "Pericardium channel", "text": "心主手厥阴心包络之脉，起于胸中，出属心包络，下膈，历络三焦；其支者，循胸出胁，下腋三寸，上抵腋下，循臑内，行太阴少阴之间，入肘中，下臂，行两筋之间，入掌中，循中指出其端；其支者，别掌中，循小指次指出其端。"}, "te": {"file": "pages/lingshu-yuan-juan3-sanjiao.jpg", "hl": [0, 0, 0.455, 1], "page": "29–30", "zh": "三焦经", "en": "Sanjiao channel", "text": "三焦手少阳之脉，起于小指次指之端，上出两指之间，循手表腕，出臂外两骨之间，上贯肘，循臑外上肩，而交出足少阳之后，入缺盆，布膻中，散落心包，下膈，循属三焦；其支者，从膻中上出缺盆，上项，系耳后直上，出耳上角，以屈下颊至䪼；其支者，从耳后入耳中，出走耳前，过客主人前，交颊，至目锐眦。"}, "gb": {"file": "pages/lingshu-yuan-juan3-gallbladder.jpg", "hl": [0.063, 0, 0.566, 1], "page": 30, "zh": "胆经", "en": "Gallbladder channel", "text": "胆足少阳之脉，起于目锐眦，上抵头角，下耳后，循颈行手少阳之前，至肩上，却交出手少阳之后，入缺盆；其支者，从耳后入耳中，出走耳前，至目锐眦后；其支者，别锐眦，下大迎，合于手少阳，抵于䪼，下加颊车，下颈合缺盆，以下胸中，贯膈，络肝，属胆，循胁里，出气街，绕毛际，横入髀厌中；其直者，从缺盆下腋，循胸，过季胁，下合髀厌中，以下循髀阳，出膝外廉，下外辅骨之前，直下抵绝骨之端，下出外踝之前，循足跗上，入小指次指之间；其支者，别跗上，入大指之间，循大指歧骨内，出其端，还贯爪甲，出三毛。"}, "lr": {"file": "pages/lingshu-yuan-juan3-liver.jpg", "hl": [0.411, 0, 0.324, 1], "page": 30, "zh": "肝经", "en": "Liver channel", "text": "肝足厥阴之脉，起于大指丛毛之际，上循足跗上廉，去内踝一寸，上踝八寸，交出太阴之后，上腘内廉，循股阴，入毛中，过阴器，抵小腹，挟胃，属肝，络胆，上贯膈，布胁肋，循喉咙之后，上入颃颡，连目系，上出额，与督脉会于巅；其支者，从目系下颊里，环唇内；其支者，复从肝别贯膈，上注肺。"}, "gv": {"file": "pages/nanjing-benyi-28-dumai.jpg", "hl": [0.4, 0.18, 0.27, 0.81], "page": 57, "zh": "督脉", "en": "Governing vessel", "alt": "《醫學統宗難經本義補遺》卷上 · 二十八難", "cap": "明末刊《醫學統宗難經本義補遺》卷上，二十八难。京都大学附属図書館 Main Library, Kyoto University 藏（RB00020118，第 57 页）", "text": "然督脉者，起於下極之俞，竝於脊裏，上至風府，入屬於腦。"}, "cv": {"file": "pages/nanjing-benyi-28-dumai.jpg", "hl": [0.32, 0.18, 0.16, 0.81], "page": 57, "zh": "任脉", "en": "Conception vessel", "alt": "《醫學統宗難經本義補遺》卷上 · 二十八難", "cap": "同一叶，紧接督脉那一句。明末刊《醫學統宗難經本義補遺》卷上，二十八难。京都大学附属図書館 Main Library, Kyoto University 藏（RB00020118，第 57 页）", "text": "任脉者，起於中極之下，以上毛際，循腹裏，上關元，至咽喉。"}, "color-suwen": {"file": "pages/suwen-ansei-jingluolun.jpg", "hl": [0.271, 0.116, 0.422, 0.88], "page": 243, "zh": "颜色 · 《素问·经络论》", "en": "Colour · Suwen, Jingluo lun", "alt": "京都大学藏《重广补注黄帝内经素问》· 经络论", "cap": "《重广补注黄帝内经素问》卷十五《经络论篇第五十七》。京都大学附属図書館 Main Library, Kyoto University 藏（RB00002950，第 243 页）", "text": "黄帝问曰：夫络脉之见也，其五色各异，青黄赤白黑不同，其故何也？岐伯对曰：经有常色而络无常变也。帝曰：经之常色何如？岐伯曰：心赤，肺白，肝青，脾黄，肾黑，皆亦应其经脉之色也。帝曰：络之阴阳，亦应其经乎？岐伯曰：阴络之色应其经，阳络之色变无常，随四时而行也。"}, "color-lingshu": {"file": "pages/lingshu-yuan-juan10-wuyinwuwei.jpg", "hl": [0.022, 0, 0.401, 1], "page": 26, "zh": "颜色 · 《灵枢·五音五味》", "en": "Colour · Lingshu, Wuyin wuwei", "alt": "元刻本《灵枢》卷十 · 五音五味", "cap": "元刻本《灵枢》卷十《五音五味第六十五》，国家图书馆藏，影像见 archive.org（nlc-892-412004000772-383328），第二册 PDF 第 27 页", "text": "上徵与右徵同，谷麦，畜羊，果杏，手少阴，藏心，色赤，味苦，时夏。上羽与大羽同，谷大豆，畜彘，果栗，足少阴，藏肾，色黑，味咸，时冬。上宫与大宫同，谷稷，畜牛，果枣，足太阴，藏脾，色黄，味甘，时季夏。上商与右商同，谷黍，畜鸡，果桃，手大阴，藏肺，色白，味辛，时秋。上角与大角同，谷麻，畜犬，果李，足厥阴，藏肝，色青，味酸，时春。"}};
/* 11-21: the pages themselves. We read the Yuan woodblock (1339); the page is shown beside the words we took from it. */
function origPages(){const src=f=>PUBLIC?'/'+f:f;
 return `<section><h2 class="sec">原叶<span class="en">The pages</span></h2><p class="small">元胡氏古林书堂刻本《灵枢》（1339）卷三《经脉》，国家图书馆藏，影像见 archive.org（nlc-892-412004000772-383329）。框里是我们读的那几行，下面是逐字录文。督脉、任脉不在《经脉》篇里，那一叶来自《难经》刻本；词汇「颜色」「气海」「宗气」「咽 · 喉咙」引的几叶也在这里。都见图下说明。<span class="en" style="display:block">The Lingshu printed by the Hu family's Gulin Shutang in 1339, juan 3, "Jingmai", held by the National Library of China; scans on archive.org. The frame marks the lines we read; our transcription is below. The governing and conception vessels are not in "Jingmai"; their page comes from a print of the Nanjing. The pages quoted in the glossary under "Colour", "Qihai", "Zong qi" and "Yan and houlong" are here too. Each is noted under its image.</span></p>${Object.values(ORIG_PAGES).map(o=>`<figure class="origpage"><div class="pg"><img src="${src(o.file)}" alt="${o.zh}原文，${o.alt||'元刻本《灵枢》卷三'}" loading="lazy"><span class="hl" style="left:${o.hl[0]*100}%;top:${o.hl[1]*100}%;width:${o.hl[2]*100}%;height:${o.hl[3]*100}%"></span></div><figcaption><b>${o.zh}</b> <span class="en">${o.en}</span><span class="small" style="display:block">${o.cap?o.cap:`archive.org 阅读器第 ${o.page} 页 · reader page ${o.page}`}</span><span style="display:block;margin-top:6px">「${esc(o.text)}」</span></figcaption></figure>`).join('')}</section>`}
function zangfuLayers(){
 const q=t=>`「${esc(t)}」`;
 const pairs=ZF_PAIRS.map(([a,ae,b,be,ca,ta,cb,tb])=>`<div class="mer zfpair"><h3>${esc(a)}<span class="en">${a==='心包'?'pericardium · no lake':'lake · '+ae}</span> · ${esc(b)}<span class="en">valley · ${be}</span></h3><p class="small" style="margin:0">${ca}${q(ta)}</p><p class="small" style="margin:0">${cb}${q(tb)}</p></div>`).join('');
 const CHN={'心':['心经','Heart'],'肺':['肺经','Lung'],'大':['大肠经','Large Intestine'],'胃':['胃经','Stomach'],'脾':['脾经','Spleen'],'小':['小肠经','Small Intestine'],'膀':['膀胱经','Bladder'],'肾':['肾经','Kidney'],'包':['心包经','Pericardium'],'焦':['三焦经','Sanjiao'],'胆':['胆经','Gallbladder'],'肝':['肝经','Liver'],'督':['督脉','Governing vessel'],'任':['任脉','Conception vessel']};const places=ZF_PLACES.map(([z,inner,gz,ge,ch])=>`<div class="mer"><h3>${esc(z)}${inner?' <span class="small areatag">里 · inside</span>':''} <span class="small">${(ch||'').split(' ').filter(Boolean).map(c=>CHN[c][0]+' '+CHN[c][1]).join(' · ')}</span></h3><p style="margin:0">${esc(gz)}</p><span class="en" style="display:block;color:var(--muted);font-size:14px;margin-top:4px">${esc(ge)}</span></div>`).join('');
 return `<section><h2 class="sec">湖与谷<span class="en">Lakes and valleys</span></h2><p class="small">藏是湖，府是谷。湖和谷是我们的说法，原文里没有这两个字。每一行是一湖一谷，两条经把它们连起来：一条属这个、络那个，另一条倒过来。原文据《灵枢·经脉》：肺经、大肠经、胃经、脾经、心经、小肠经据元刻本原叶，其余据排印本与《类经》卷七对读，元刻本待核。<span class="en" style="display:block">A zang organ is a lake, a fu organ a valley: our images, not words from the classic. Each row is a lake and its valley, joined by two channels, each belonging to one and linking with the other. Text from the Lingshu, "Jingmai": the Lung, Large Intestine, Stomach, Spleen, Heart and Small Intestine channels read on the Yuan woodblock page, the rest from modern editions, still to be checked against it.</span></p>${pairs}</section>`
 +`<section><h2 class="sec">地方<span class="en">Places</span></h2><p class="small">经络原文里走过的地方，用原文的词，旁边写今天的说法。标「里」的在身体里面，后面写着是哪条经经过。现在有肺经、大肠经、胃经、脾经、心经、小肠经，以后每画一条经，就把它的地方加进来。<span class="en" style="display:block">The places the channels pass, in the classic's own words, with today's words beside them. Those marked "inside" lie within the body; each names the channels that pass it. So far the Lung, Large Intestine, Stomach, Spleen, Heart and Small Intestine channels; each new channel will add its own.</span></p>${places}</section>`}
function bodyView(){
 const PLACE_EN={'下腹':'lower belly','侧肋':'side ribs','头侧':'temple','手背':'back of the hand','掌心':'palm','肩前':'front of the shoulder','胸':'chest','脚底':'sole','脚背':'top of the foot','脚踝':'ankle','足内侧':'inner foot','腰':'lower back','腹':'belly','腹股沟':'groin','膝盖':'knee','臀':'buttock','颈':'neck','额':'forehead','食指':'index finger','骶骨':'sacrum','髋':'hip'};
 const merEn=m=>m==='sjfu'?'Sanjiao':(MER[m].en||'');
