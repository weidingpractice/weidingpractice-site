:root{--night:#0b1312;--deep:#101c1a;--moss:#1d2e2a;--mist:#c9d6cf;--ink:#e6ece8;--muted:#8fa29b;--water:#7cc7bd;--seal:#c8664f;--glass:rgba(13,22,21,.86);--line:rgba(201,214,207,.16);
 --display:"Spectral","Yishen Serif SC","Songti SC","Noto Serif CJK SC",Georgia,serif;--body:"Inter","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;color-scheme:dark}

.light:focus-visible .ring{opacity:1}

.lantern.on{opacity:1}

.light.stone.known .core{fill:#3a4a45}

.chanlab{font-family:var(--display);font-size:13px;letter-spacing:.12em;color:var(--muted);margin:12px 0 0}

/* card */
#card{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom,0px));transform:translate(-50%,24px);width:min(440px,calc(100% - 28px));box-sizing:border-box;
 background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:16px;padding:14px 20px 14px;opacity:0;pointer-events:none;transition:opacity .5s,transform .5s;z-index:20}

#card.top{top:calc(10px + env(safe-area-inset-top,0px));bottom:auto;left:14px;transform:translateY(-24px);width:auto;right:14px;max-width:440px;padding:12px 16px}

#card.top.on{transform:none}#card.top h2{font-size:22px}#card.top .say{font-size:15px!important;margin-top:6px}#card.top .say .e{font-size:13px}#card.top .row{margin-top:8px}#card.top .x{top:4px;right:4px}
@media (min-width:900px){#card.top{left:auto;right:max(28px,env(safe-area-inset-right,0px));top:auto;bottom:28px;transform:translateY(24px)}#card.top.on{transform:none}#card{left:auto;right:max(28px,env(safe-area-inset-right,0px));bottom:28px;transform:translateY(24px)}#card.on{transform:none}}
#card h2{font-family:var(--display);font-weight:400;font-size:26px;margin:0;letter-spacing:.04em;text-wrap:balance}
#card .sub{color:var(--muted);font-size:13px;margin:4px 0 0;letter-spacing:.02em}

#card .say{font-family:var(--display);font-size:18px;line-height:1.55;margin:14px 0 0}

#card .find{font-size:14px;line-height:1.6;margin:12px 0 0;color:var(--mist)}
#card .find .e{display:block;color:var(--muted);font-size:13px}
#card .ways{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0}
#card .chip{font:inherit;font-size:13px;color:var(--ink);background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:999px;padding:5px 11px;cursor:pointer}
#card .chip.more{color:var(--muted)}
#card .chip:hover,#card .chip:focus-visible{border-color:var(--water);outline:none}
#card .chip .e{color:var(--muted);margin-left:6px;font-size:12px}
#card .go{display:inline-block;margin-top:16px;color:var(--water);text-decoration:none;font-size:14px;letter-spacing:.03em;border-bottom:1px solid rgba(124,199,189,.35);padding-bottom:2px}
#card .x{position:absolute;top:10px;right:10px;background:none;border:0;color:var(--muted);font-size:22px;width:36px;height:36px;cursor:pointer;border-radius:50%}
#card .x:focus-visible{outline:1px solid var(--water)}
#card .z+.e,.drawer .count .z+.e,.go .z+.e{margin-left:.45em}#card .say .e,#card .find .e{margin-left:0}
body.zh .e{display:none!important}body.en .z{display:none!important}
body.en #card .z+.e,body.en .z+.e{margin-left:0!important}
body.en #card .first .e{font-family:var(--display);font-size:19px;line-height:1.5;color:var(--ink);margin:0}
body.en #card .say .e{font-style:normal;color:var(--ink);font-size:18px;margin:0}
body.en #card .find .e{color:var(--mist);font-size:14px}
body.zh #idle .sep,body.en #idle .sep{display:none}
#card .lg{margin-left:auto;font:inherit;font-size:12px;letter-spacing:.06em;color:var(--muted);background:none;border:1px solid var(--line);border-radius:999px;padding:4px 10px;cursor:pointer}
#card .lg:focus-visible{outline:1px solid var(--water)}
#card .ways.txt{gap:4px 14px;margin-top:10px}#card .ways.txt .chip{border:0;background:none;padding:2px 0;font-size:14px;color:var(--mist);text-decoration:underline;text-decoration-color:rgba(201,214,207,.3);text-underline-offset:4px}
#card .row.end{align-items:center;gap:16px}
#card .trail{display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px;margin:0 36px 8px 0;font-size:13px;line-height:1.5}.trail .tc{background:none;border:0;padding:2px 0;color:var(--water);font:inherit;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-color:rgba(124,199,189,.35)}.trail .tc.here{color:var(--ink);text-decoration:none;cursor:default}.trail .ts{color:var(--muted)}.inarea{margin:0 36px 10px 0;font-size:14px;color:var(--mist)}.inarea .chip{margin-left:4px}.areachip{border-style:dashed}body.en .clwrap .cl{display:none}.inlog #corner{display:none!important}.stepper{display:flex;justify-content:space-between;gap:8px;margin:4px 0 10px}.side{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}.side .lab{margin:0 0 6px}.side .chip{margin:0 6px 6px 0}.bk{display:block;background:none;border:0;padding:0 0 6px;color:var(--water);font:inherit;font-size:14px;cursor:pointer;text-align:left}
#card .lab{margin:12px 0 0;font-size:11px;letter-spacing:.18em;color:var(--water);text-transform:uppercase}
.light.was .core{fill:#fff}.light.was .halo{opacity:1!important}.light.was{opacity:1!important}
#card .row.end{position:sticky;bottom:-12px;margin:12px -16px -12px;padding:10px 16px 12px;background:rgb(13,22,21);border-top:1px solid rgba(201,214,207,.12);z-index:2}#card .row.end .go{margin-top:0}

/* corner */
#corner{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));z-index:30;height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--glass);color:var(--ink);font:inherit;font-size:14px;letter-spacing:.04em;cursor:pointer;opacity:0;transition:opacity 2s,border-color .3s}

#corner svg{width:20px;height:20px}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(320px,86vw);background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-left:1px solid var(--line);z-index:40;transform:translateX(105%);transition:transform .45s ease;
 padding:calc(64px + env(safe-area-inset-top,0px)) max(22px,env(safe-area-inset-right,0px)) 24px 22px;box-sizing:border-box;overflow:auto}
.drawer.on{transform:none}

.drawer a .e,.drawer button.l .e{font-size:15px}
.drawer a:hover,.drawer a:focus-visible,.drawer button.l:focus-visible{color:var(--water);outline:none}
.drawer .count{color:var(--muted);font-size:13px;margin:0}
.lang{display:flex;gap:6px}.lang button{font:inherit;font-size:13px;color:var(--muted);background:none;border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer}
.lang button[aria-pressed=true]{color:var(--ink);border-color:var(--water)}
#veil{position:fixed;inset:0;z-index:35;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .4s}#veil.on{opacity:1;pointer-events:auto}

#idle{position:fixed;left:0;right:0;top:calc(64px + env(safe-area-inset-top,0px));text-align:center;color:var(--ink);font-family:var(--display);font-size:19px;letter-spacing:.12em;line-height:1.5;opacity:0;transition:opacity 2s;pointer-events:none;z-index:5;text-shadow:0 0 18px rgba(124,199,189,.55)}
#idle .e{display:block;font-style:italic;font-size:15px;letter-spacing:.04em;color:var(--mist)}#idle .z{display:block}body.en #idle .z,body.zh #idle .e{display:none!important}
#idle.on{opacity:1}
/* the forest breathes: all lights, one slow rhythm (no words needed) */
@keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}
.light:not(.stone) .halo{animation:breathe 5.5s ease-in-out infinite}
/* first visit: the light in your palm (劳宫) calls you */
@keyframes invite{0%,100%{opacity:.75;transform:scale(1)}50%{opacity:1;transform:scale(1.7)}}
.light.invite .halo{transform-box:fill-box;transform-origin:center;animation:invite 2.4s ease-in-out infinite}
.light.invite .core{fill:#fff}
#entry .gate{display:none!important}
#entry{transition:opacity 1.8s ease}
#entry.out{opacity:0;pointer-events:none}
@media (prefers-reduced-motion: reduce){.light .halo,.light.invite .halo{animation:none!important}#map,.path,#card,.drawer,.lantern,#entry{transition:none!important}}


/* stars (11-20) */
.light .rays{fill:#fffbe9;opacity:0;transform-box:fill-box;transform-origin:center;pointer-events:none}
#lights .light.star{opacity:1!important}
#lights .light.star .core{fill:#fff}
#lights .light.star .halo{opacity:1!important;transform-box:fill-box;transform-origin:center;animation:starpulse 2.2s ease-in-out infinite}
#lights .light.star .rays{opacity:.95;animation:twinkle 2.2s ease-in-out infinite;filter:url(#glow)}
#lights .light.nearstar{opacity:1!important}
#lights .light.nearstar .halo{opacity:.9!important;animation:breathe 2.6s ease-in-out infinite}
#lights .light.nearstar .rays{opacity:.7;transform:scale(.6);animation:twinkle2 2.6s ease-in-out infinite}
#lights .light.peek .rays{opacity:1;transform:scale(.8)}.light.peek .halo{opacity:1!important}

<script>
const DATA={"poses": [{"id": "chant", "slug": "chanting", "zh": "唱诵", "en": "Chanting", "layer": null, "pts": [["laogong", "felt"]], "cue": "中指放在劳宫，声音立刻变得柔和、轻。", "cueEn": "Rest the middle finger on Laogong, and the voice turns soft and light at once.", "notes": [["2026 年 9 月阴瑜伽教师培训，每次上课前有 10 分钟唱诵。我发现，只要把中指放在劳宫，我的声音立马变得柔和、轻，非常奇妙。", "During the Yin teacher training in September 2026, each class opened with ten minutes of chanting. I found that once I rested my middle finger on Laogong, my voice turned soft and light straight away. It was remarkable."]]}, {"id": "daoist", "slug": "three-part-daoist-breath", "zh": "三段道家呼吸", "en": "Three-part Daoist Breath", "layer": 1, "pts": [], "cue": "一吸一呼，带着手臂、头和背一起动；做 2 分钟或 20 分钟都可以。", "cueEn": "Each breath in and out moves the arms, head and back together; it works for two minutes or twenty.", "notes": [["这是 Austin Ince 在阴瑜伽教师培训里教的一段热身小串联。这个名字在阴瑜伽老师之间通用，最早由谁编排，还没查到。下面是我用自己的话写的步骤。", "A short warm-up sequence Austin Ince teaches in his Yin teacher training. The name is shared among Yin teachers; who first put it together, I have not yet found. The steps below are in my own words."], ["跪坐在脚跟上（金刚坐 Vajrasana）。也可以盘腿坐、坐在椅子上，或者在脚趾蹲（toe squat）里做。", "Kneel and sit on your heels (Vajrasana). You can also sit cross-legged, sit on a chair, or do it in a toe squat."], ["双手放回身体两侧。", "Let the hands rest by your sides."], ["头向后，背微微后弯，双臂举过头顶。", "Take the head back, arch the back a little, and lift the arms overhead."], ["下巴收向胸口，屈肘把双手带到头后，紧接着把双手向两侧推开。两个动作在同一口呼气里完成。", "Chin to chest, bend the elbows to bring the hands behind the head, then straight away push them out to the sides. Both moves happen on the same out-breath."], ["头向后，屈肘让指尖碰到肩膀，胸口上提，让肺吸满。", "Take the head back, bend the elbows so the fingertips touch the shoulders, lift the chest and fill the lungs."], ["下巴收向胸口，掌心向前推；双手往前走的时候，背拱圆。", "Chin to chest, push the palms forward; as the hands travel forward, round the back."], ["头向后，双臂向上伸过头顶，背后弯。", "Take the head back, reach the arms overhead, and arch the back."], ["下巴落下，向前折叠进婴儿式，双臂放在身体两侧的地上。", "Bring the chin down and fold forward into Child's Pose, arms on the floor by your sides."], ["坐起来，在同一口吸气里直接开始下一轮。", "Come up to sitting and begin the next round on the same in-breath."], ["重复 3 到 5 轮，每轮都在婴儿式里结束。最后一次婴儿式，双臂向前伸直，像一次深深的拜伏，可以从这里接别的体式。", "Repeat three to five rounds, ending each in Child's Pose. In the last one, stretch the arms forward like a deep bow; you can flow on into other postures from there."], ["热身，单独练，收尾，冥想之前都可以。", "As a warm-up, as a practice on its own, to close, or before meditation."], ["有一天我连下犬式都做不下去，身体一做就紧张。做了这个小串联，神经系统很快就安静下来。", "One day even Downward Dog felt like too much, and my body tensed at the thought. After this short sequence, my nervous system settled quickly."]], "lines": [["gv", "felt"], ["cv", "felt"]]}, {"id": "wrist", "slug": "wrist-circles", "zh": "四足四向手位", "en": "Four hand positions on all fours", "layer": 2, "pts": [["laogong", "felt"]], "cue": "四足，手指朝前、朝外、朝膝盖、两手指尖相对。手放好不动，转的是肩膀和骨盆。", "cueEn": "On all fours, set the fingers forward, then out, then toward the knees, then fingertips facing each other. The hands stay put; what circles is the shoulders and the pelvis.", "notes": [["手放好就不动。每换一个手的方向，肩膀和骨盆在上面转圈，手腕只是被带着换了角度。", "Once the hands are placed, they stay. With each new hand direction, the shoulders and pelvis circle above them; the wrists only change angle because of it."], ["放在劳宫，不放在十个手指上。", "On Laogong, not on all ten fingers."]]}, {"id": "catcow", "slug": "cat-cow", "zh": "猫牛式", "en": "Cat–Cow", "layer": 2, "pts": [["mingmen", "maybe"]], "cue": "", "cueEn": "", "notes": []}, {"id": "hipsway", "slug": "hip-circles", "zh": "四足摆髋 → 绕臀", "en": "Hip sways → circles", "layer": 2, "pts": [["baohuang", "maybe"], ["zhibian", "maybe"]], "cue": "把觉知放在两个半球的当中，很深的那个点。", "cueEn": "Rest your attention deep in the centre of each half of the buttocks.", "notes": [["一般先左右摆，pathway 是先左后右；走顺了以后，自然而然就会去画圈。", "Start by swaying left and right; once the path runs smoothly, you begin to draw circles without trying."], ["画圈的时候，可以把觉知放在耻骨（pubic bone）。耻骨在正中，画正中，连着它的两个半球自然画得更顺。也可以把觉知放在两个半球的当中那两个点：耻骨是它们中间的那个点，两个半球是从它延伸出去的。", "As you circle, you can rest your attention on the pubic bone. It sits at the centre, so when you circle from the centre, the two halves connected to it follow more smoothly. Or rest it on the two points at the centre of each half: the pubic bone is the point between them, and the two halves extend out from it."], ["人是三维的结构。你绕的时候，是一个圆球，不是平面上的圆形；是 3D，不是 2D。所以觉知放在球的当中：两个半球的当中，很深的一个点。不是臀部外侧那块骨头后面的窝，是在内侧。", "The body is three-dimensional. As you circle, you trace a sphere, not a flat circle: 3D, not 2D. So rest your attention at the centre of the sphere, the deep point in the middle of each half of the buttocks. Not the hollow behind the bony point on the outside of the hip; it lies further in."], ["我个人的感觉是：把觉知放在两个半球当中的那两个点，更能激起腰椎的觉知。这完全就是 alignment 了。", "My own feeling: resting attention on the two points at the centre of each half wakes up awareness of the lumbar spine more. That is alignment itself."], ["更多的其实是个意象，不一定要对到哪个穴位。跟人说\"两个半球的当中\"，他会明白。", "It works more as an image than as a point. Tell someone \"the centre of each half\" and they understand."], ["绕臀时感觉最强烈的就是两个半球当中那个很深的点，同时有肠胃的蠕动。", "During the circles, the deep point in the middle of each half feels strongest, and the gut starts to move."]]}, {"id": "thread", "slug": "thread-the-needle", "zh": "穿针式", "en": "Thread the Needle", "layer": 2, "pts": [["dabao", "felt"]], "cue": "让侧肋那一片在动作里铺开。", "cueEn": "Let the side ribs spread out as you move.", "notes": []}, {"id": "sphinx", "slug": "sphinx-seal", "zh": "狮身人面式 → 海豹式", "en": "Sphinx → Seal", "layer": 0, "pts": [["dantian", "felt"], ["qugu", "maybe"], ["baliao", "maybe"], ["shangyang", "felt"]], "cue": "耻骨压向地面，从下丹田吸气，整个脊柱往上延长。", "cueEn": "Press the pubic bone into the floor, breathe in from the lower dantian, and let the whole spine lengthen upward.", "notes": [["狮身人面式后弯不强，可以慢慢练浅浅的逆腹式；海豹式后弯更强，幅度太大，就不练逆腹式。", "Sphinx is a mild backbend, so shallow reverse belly breathing can be practised slowly. Seal bends further; the range is too big for it."], ["我把意识放在食指，也就是大肠经，感觉到肠胃在蠕动。", "I rest my attention in the index finger, on the Large Intestine channel, and I feel my gut start to move."]]}, {"id": "dd", "slug": "downward-dog", "zh": "下犬式", "en": "Downward Dog", "layer": 3, "pts": [["laogong", "felt"], ["yongquan", "felt"], ["yunmen", "felt"], ["jianwo", "felt"], ["kuagen", "felt"]], "cue": "手指间像夹着一根烟的宽度，力线不断。", "cueEn": "Fingers apart by the width of a cigarette; the line of force never breaks.", "notes": [["指间留缝，但缝不大。", "Leave a gap between your fingers, but not a wide one."], ["不用力压平", "Don't press them flat."], ["气从涌泉起，经腿、腰、脊，一路走到手指尖和手心。手不主动往外推，而是被这条路上来的力带着伸开——这就是顺抽。", "It starts at Yongquan (KI1), the hollow behind the ball of the foot, and travels up through the legs, the lower back and pelvis (yao in Chinese), and on up the spine, all the way to the fingertips and the palms. The hands don't push out by themselves; what rises along this path carries them open. In tai chi this is shun chou, reeling the silk outward."], ["手指和手心往回吸，力气经手臂、腰、腿，回到涌泉——这就是逆抽。", "Fingers and palms draw in, and the force returns through the arms, the lower back and pelvis, and the legs to Yongquan. This is ni chou, reeling the silk inward."], ["手上不是直线往外伸，而是带一点旋转，像拧。但往哪个方向拧，没有定数：有时往上推，有时往下推，力一直在调整，很精微。手其实没有动，只是力一直在调整。太注重方向，就教条了。", "The hands don't stretch out in a straight line; there is a slight spiral, like a screw. But which way it turns isn't fixed: sometimes you push up, sometimes down, and the force keeps adjusting, very finely. The hands themselves don't move; only the force keeps adjusting. Hold on to a direction and it becomes a rule."], ["怎么知道没有卡住？首先，力是使得上的；然后到肩胛骨这边，不管是上回旋、内回旋还是怎么样，肩窝这块地方是空的，关节不能卡住。感受到肩窝没有被卡住，就可以了。", "How do you know nothing is stuck? First, you feel the force flowing through, unbroken, the way a river runs. Then at the shoulder blade, whether it is rotating upward, inward or any other way, the hollow at the front of the shoulder (around Yunmen, LU2) feels empty. The joint isn't jammed. If you can feel the shoulder hollow isn't stuck, that is enough."], ["抽猛了，力就断；抽得太浅，力又出不来。要做到不猛不断，全程连着。", "Reel too hard and the silk snaps; too lightly and nothing comes. Not forced, not broken, joined all the way through."], ["视线放在双手之间或垫子中间，不往下看；停留短一点，不憋气，下颌放松：牙齿分开，嘴唇轻合。", "Look between your hands or at the middle of the mat, not further down. Stay briefly, keep breathing, and soften the jaw: teeth apart, lips lightly closed."]]}, {"id": "chat", "slug": "chaturanga", "zh": "四柱支撑", "en": "Chaturanga", "layer": 3, "pts": [["laogong", "felt"], ["yunmen", "felt"], ["jianwo", "felt"], ["kuagen", "felt"], ["zhongfu", "maybe"], ["yemen", "maybe"]], "cue": "手指放在地上就可以，注意力放在劳宫的力线上。", "cueEn": "Just place your fingers on the floor and rest your attention on the line from Laogong.", "notes": [["手指放在地上就可以了，但注意力要放在劳宫，放在劳宫的力线上，这样手腕到肩膀的力线就非常顺。", "Just place your fingers on the floor, and rest your attention on Laogong, on the line that runs from it. The line from wrist to shoulder then runs very smoothly."], ["真的不是方向的问题，而是要把觉知放在肩窝，呼吸要到肩窝。可能不只是云门，还有更深一点的点。", "It really isn't about direction. Rest your attention in the shoulder hollow and breathe into it. It may be more than Yunmen; there is a deeper spot too."]]}, {"id": "lunge", "slug": "high-lunge", "zh": "高弓步", "en": "High Lunge", "layer": 4, "pts": [["huantiao", "felt"], ["kuagen", "felt"], ["taibai", "felt"], ["yongquan", "felt"], ["yingu", "felt"]], "cue": "进入时守环跳，后腿守涌泉；涌泉往下、往内，太白就有了。", "cueEn": "Going in, hold Huantiao; in the back leg, hold Yongquan. Let it sink down and in, and Taibai comes with it.", "notes": [["觉知放在涌泉，alignment 也有了。", "Rest your attention on Yongquan, and the alignment arrives with it."], ["从高弓步到战士三、到站立扭转，用环跳；从高弓步到战士二，是转臀，觉知放在臀部正中最深的点。", "From High Lunge to Warrior III, or to a standing twist, use Huantiao. From High Lunge to Warrior II you turn the hips, so rest your attention at the deepest point in the centre of each buttock."]]}, {"id": "prayer", "slug": "prayer-twist", "zh": "合掌扭转", "en": "Prayer Twist", "layer": 4, "pts": [["zhongjiao", "maybe"], ["laogong", "felt"], ["yemen", "felt"]], "cue": "一只手的劳宫贴住另一只手的液门。不用转那么深，呼吸很好。", "cueEn": "Press the Laogong of one hand against the Yemen of the other. No need to twist so deep; the breath is good.", "notes": []}, {"id": "w2tri", "slug": "warrior-2-triangle", "zh": "战士二、三角式", "en": "Warrior II, Triangle", "layer": 4, "pts": [["huantiao", "felt"]], "cue": "留意臀部外后方的那个窝。", "cueEn": "Notice the hollow at the back and outside of the hip.", "notes": []}, {"id": "revtri", "slug": "revolved-triangle", "zh": "三角扭转式", "en": "Revolved Triangle", "layer": 4, "pts": [["laogong", "felt"], ["baliao", "felt"], ["shenque", "felt"], ["mingmen", "maybe"]], "cue": "劳宫放在骶骨上，和前面的肚脐成对。", "cueEn": "Rest Laogong on the sacrum and pair it with the navel in front.", "notes": [["我把手的劳宫放在骶骨上。昨天也试了命门，放命门太高了，会让我的肩膀不舒服。", "I rest the Laogong of my hand on the sacrum. Yesterday I tried Mingmen too; it sits too high and makes my shoulder uncomfortable."], ["放在骶骨上，感觉做的其实是一个呼吸练习，你很平静，你会知道自己的臀部是 aligned，两条腿也在对的方向。", "With the hand on the sacrum, it becomes a breathing practice. You grow calm, and you know your hips are aligned and both legs point the right way."], ["劳宫放在骶骨上面，再和前面的肚脐成对，这样呼吸的时候你就会觉得前后对上了。除了左右，身体还有前后。", "Rest Laogong on the sacrum and pair it with the navel in front; as you breathe, front and back line up. The body has front and back, not only left and right."], ["你可以转得深，也可以转得浅，这跟你的身体条件、练习的时间长度有关。我们练的永远不是幅度，而是觉知、呼吸的深度，呼吸到骶骨。", "You can twist deep or shallow; that depends on your body and how long you have practised. You never practise range. You practise awareness and the depth of the breath, breathing down into the sacrum."]]}, {"id": "skandasana", "slug": "skandasana", "zh": "侧蹲转换", "en": "Warrior II → Skandasana", "layer": 4, "pts": [["baohuang", "maybe"], ["zhibian", "maybe"]], "cue": "转臀下去，把骶骨这块后侧区域拉开。", "cueEn": "Turn the hips as you lower, spreading the back of the sacrum.", "notes": [["Skandasana 是转臀下去，把骶骨这块后侧区域拉开。你只有转，才可以不卡着。", "In Skandasana you turn the hips and lower, opening the back of the sacrum. Only when you turn do you stop getting stuck."]]}, {"id": "standbend", "slug": "standing-backbend", "zh": "站立下轮", "en": "Standing drop-back to Wheel", "layer": 4, "pts": [["yongquan", "felt"], ["taibai", "felt"], ["xinei", "felt"], ["kuagen", "felt"], ["shangjiao", "felt"], ["chongmen", "maybe"], ["qichong", "maybe"]], "cue": "涌泉、太白、膝盖内侧，再到胯根前面。", "cueEn": "Yongquan, Taibai, the inner knee, then the front of the groin.", "notes": [["站立下轮的力线是从涌泉到太白到膝盖内侧，再到胯根前面的那个穴位。这个力线就有了。", "In a standing drop-back, the line runs from Yongquan to Taibai to the inner knee, then to the point at the front of the groin. The pathway emerges."]]}, {"id": "chair", "slug": "chair-pose", "zh": "幻椅式", "en": "Chair", "layer": 4, "pts": [["dantian", "felt"], ["qihai", "felt"]], "cue": "吸气从下丹田沿脊柱往上。", "cueEn": "Breathe in from the lower dantian and up along the spine.", "notes": []}, {"id": "eagle", "slug": "eagle-arms", "zh": "鹰式手臂缠绕", "en": "Eagle arms", "layer": null, "pts": [["yuji", "felt"]], "cue": "不是掌心相对：下方的手按住上方手的鱼际。", "cueEn": "Instead of pressing palm to palm, let the lower hand press the Yuji point of the upper hand.", "notes": [["手臂缠好以后，我不把两个掌心相对，而是用下方那只手，去按上方那只手的鱼际。", "Once the arms are wrapped, I don't bring the palms together. I use the lower hand to press Yuji on the upper hand."], ["按住鱼际，能明显感觉到呼吸到了上后背，肩胛骨打开，非常明显。", "Pressing Yuji, I clearly feel the breath reach the upper back, and the shoulder blades open."], ["我让学生做这个体式、体会这个穴位，再加上按鱼际这句提示，就能听到学生的呼气明显变长。", "When I teach this pose and ask students to feel this point, adding the cue to press Yuji, I can hear their exhales grow noticeably longer."]]}, {"id": "w3", "slug": "warrior-3", "zh": "战士三、扭转半月", "en": "Warrior III, Revolved Half Moon", "layer": 5, "pts": [["kuagen", "felt"], ["yongquan", "felt"], ["taibai", "felt"]], "cue": "支撑脚守涌泉，后腿守太白，两个点同时在。", "cueEn": "Hold Yongquan in the standing foot and Taibai in the back leg, both at once.", "notes": []}, {"id": "tree", "slug": "tree-pose", "zh": "树式", "en": "Tree", "layer": 5, "pts": [["yongquan", "felt"], ["xinei", "felt"], ["yunmen", "felt"]], "notes": []}, {"id": "frog", "slug": "frog", "zh": "青蛙式", "en": "Frog", "layer": 2, "pts": [["xinei", "felt"], ["kuagen", "felt"]], "cue": "额头或下巴落地，头可以转向一边，不挤压脖子。意放在膝盖内侧和胯根。", "cueEn": "Rest the forehead or chin down, or turn the head to one side so the neck is not squeezed. Rest your attention on the inner knee and the hollow of the groin.", "notes": [["有一天，一低头就感觉头部胀，心里慌，做不了倒立。身体自己想做婴儿式，额头压着印堂左右轻轻晃，然后自动进了青蛙式。膝盖内侧和胯根最明显，脚内侧也有感觉，是一整条力线。头转向一边，不挤压脖子，停留 2 到 3 分钟，然后身体往前趴一点，很舒服。", "One day, every time I lowered my head, my head felt full and pressured and I felt panicky inside; inversions were out. My body wanted Child's Pose: forehead on Yintang, rolling gently side to side, and then it moved into Frog on its own. The inner knee and the groin hollow were clearest; the inner foot too, one whole line. Head turned to one side so the neck was free, two to three minutes, then a little forward. It felt good."], ["我感觉到的线：脚内侧 → 小腿内侧 → 膝盖内侧 → 大腿内侧 → 胯根。《灵枢》的脾经：从大脚趾内侧起，过内踝前，沿胫骨后上行，经膝和大腿内侧前缘，入腹。Myers 的深前线：足底深层、小腿深层、膝内侧、内收肌、骨盆。三条线落在同一片区域，这是我身体里感受到的巧合。大腿内侧并排走着脾、肝、肾三条经，我感觉到的是哪一条，还要再分辨。", "The line I felt: inner foot, inner calf, inner knee, inner thigh, the groin hollow. The Spleen channel in the Lingshu: from the inside of the big toe, in front of the inner ankle, up behind the shin, along the front edge of the inner knee and thigh, into the belly. Myers's Deep Front Line: deep sole, deep calf, inner knee, adductors, pelvis. The three lines meet in one region: a coincidence I felt in my own body. Three channels run side by side up the inner thigh; which one I felt, I still have to tell apart."]]}, {"id": "saddle", "slug": "saddle", "zh": "鞍式", "en": "Saddle Pose", "layer": 1, "pts": [["xinei", "felt"]], "cue": "感受膝盖内侧没有挤压，体会滋养的感受。", "cueEn": "Feel that the inner knee is not squeezed, and notice the sense of nourishment there.", "notes": [["我大腿前侧非常紧，所以每天都做。往下躺的时候，躺在抱枕上，减少后弯的幅度。", "The fronts of my thighs are very tight, so I do it every day. When I lie back, I lie on a bolster to make the backbend smaller."], ["很多人觉得这个体式伤膝盖。我的做法是：在膝盖正常的活动范围（range of movement）里做。", "Many people think this pose hurts the knees. My way is to stay within the knee's normal range of movement."], ["拉伸的是从脚背开始的整个身体前侧：大腿前侧、hips 前侧；手臂打开，作用到肩膀前侧；头往后仰，颈椎、甚至额头都在里面。", "It stretches the whole front of the body, from the tops of the feet: the front thighs, the front of the hips. Open your arms and it reaches the front of the shoulders; tip your head back and it reaches the neck, even the forehead."], ["感受膝盖内侧没有挤压，体会滋养的感受。", "Feel that the inner knee is not squeezed, and notice the sense of nourishment there."], ["传统教法是两膝之间一个拳头的距离。下去时特别不舒服，可以加到两个、甚至三个拳头。改变的只是长度：你的身体前侧要 travel 的那段长度，和每个人的身体条件有关。", "Traditionally you keep one fist between the knees. If going down feels very uncomfortable, widen it to two or even three fists. You change only the length: how far the front of your body travels, which depends on each body."], ["吃完饭我做的第一个练习就是鞍式。我饭后做，感觉肠胃在动。", "Saddle is the first thing I practise after eating. When I do, I feel my gut moving."]]}, {"id": "butterfly", "slug": "butterfly", "zh": "蝴蝶式", "en": "Butterfly", "layer": 1, "pts": [["yongquan", "felt"]], "cue": "手心落在大脚球后面一点上。", "cueEn": "Rest the palms just behind the balls of the big toes.", "notes": []}, {"id": "bridge", "slug": "bridge", "zh": "桥式", "en": "Bridge", "layer": 0, "pts": [["kuagen", "felt"], ["dantian", "felt"], ["xiajiao", "maybe"], ["shangjiao", "maybe"], ["mingmen", "maybe"]], "cue": "", "cueEn": "", "notes": []}, {"id": "child", "slug": "childs-pose", "zh": "婴儿式", "en": "Child's Pose", "layer": 2, "pts": [["yintang", "felt"]], "cue": "额头点地，慢慢左右转动额头。", "cueEn": "Rest your forehead on the floor and roll it slowly from side to side.", "notes": [["头部有压力的这几天，在婴儿式里额头点地，慢慢转动额头，头觉得轻了一些。", "On days when my head felt pressure, resting my forehead on the floor in Child's Pose and rolling it slowly my head felt a little lighter."], ["正中是印堂；往两边转，压过眉毛上方的阳白（胆经），再往外接近太阳穴。额头往上一点，是神庭、上星（督脉）。", "At the centre, Yintang; rolling to either side passes over Yangbai above the eyebrows (Gallbladder channel) and towards the temples. A little higher on the forehead lie Shenting and Shangxing (Governing Vessel)."]]}, {"id": "palming", "slug": "palming", "zh": "劳宫捂眼", "en": "Palming with Laogong", "layer": null, "pts": [["laogong", "felt"]], "cue": "双手搓热，手心劳宫轻轻盖在闭着的眼睛上，停一分钟，不压。", "cueEn": "Rub your palms warm and rest Laogong lightly over your closed eyes for a minute, without pressing.", "notes": [["练完以后；也可以在下犬式、犁式这类头朝下的体式之后，或者看屏幕很久以后。", "After practice; also after head-down poses such as Downward Dog and Plough, or after long screen time."], ["手掌微微拱起，掌根落在颧骨上，掌心对着眼睛，不碰眼球。眼睛在掌心的暗处休息。", "Cup the palms slightly, heels of the hands on the cheekbones, the hollow of each palm over an eye without touching the eyeball. Let the eyes rest in the dark."], ["劳宫能让唱诵的声音变柔和；看看它能不能让眼睛也柔和下来：眼睛后面的压力、太阳穴的紧，有没有松一点。没有变化也记下来。", "Laogong softens the voice in chanting; see whether it softens the eyes too: the pressure behind them, the tightness at the temples. If nothing changes, write that down too."]]}, {"id": "chintuck", "slug": "chintuck", "zh": "收下巴", "en": "Chin tuck", "layer": null, "pts": [["dazhui", "felt"], ["fengfu", "felt"]], "cue": "从大椎沿着一条线，一直到风府。", "cueEn": "One line from Dazhui all the way up to Fengfu.", "notes": [["怎么做。 平躺，膝盖弯曲，头下不垫，或只垫一条薄毛巾。轻轻点头，像在说「嗯」：下巴往喉咙方向收，后脑勺贴着地面往上拉长。手指摸着脖子两侧，那两条大肌肉不绷紧。停 5 到 10 秒，放松。做几次。", "How to do it. Lie on your back, knees bent, no pillow or just a thin towel. Nod gently, as if saying \"mm\": draw the chin towards the throat and let the back of the head lengthen up along the floor. Keep your fingers on the two big muscles at the sides of the neck; they stay soft. Hold 5 to 10 seconds, then let go. A few times."], ["幅度很小。 是「收」，不是低头。全程不应该痛；手臂发麻、头晕，就停下。", "A very small movement. It is a tuck, not a bow of the head. It should never hurt; if your arm goes numb or you feel dizzy, stop."], ["放在哪里。 热身里：肩 → 收下巴 → 头部转动 → 侧倾 → 脊柱。融心式（下巴点地）待得久之后：躺下做几次，短，浅。", "Where it goes. In the warm-up: shoulders → chin tuck → head movements → side bends → spine. After a long Melting Heart with the chin on the floor: lie down and do a few, short and shallow."], ["2026-11-20，第一次。 从大椎沿着一条线一直到风府，很明显。感觉一开始是从很像心脏那块地方，很深沉地升上来。", "20 November 2026, the first time. From Dazhui, one clear line all the way up to Fengfu. At first it felt as if it rose, deep and slow, from somewhere like the heart."]]}], "pts": {"baliao": {"zh": "八髎", "py": "Baliao", "code": "BL31–34", "en": "Baliao", "find": "站着，双手叉腰，拇指在后。拇指往后、往中间滑，碰到脊柱。拇指不动，手掌往下翻，贴着后腰。中指往下的这一片就是骶部，八髎都在里面。", "findEn": "Stand with hands on hips, thumbs behind. Slide the thumbs back and in until they meet the spine. Keep the thumbs there and turn the palms down onto the lower back. The area under your middle fingers and below is the sacrum; the eight Baliao points are all in it.", "slug": "baliao", "map": "med", "shape": "area"}, "baohuang": {"zh": "胞肓", "py": "Baohuang", "code": "BL53", "en": "Baohuang", "find": "站着。先找腰窝：后腰最下面，脊柱两边各有一个小凹窝。右手放到背后，手指朝下，手掌贴在屁股上半部、靠外边。手往上挪，让手腕这一头和腰窝一样高。手掌最上面靠外的这一片，胞肓就在里面。", "findEn": "Stand. First find the dimples: at the very bottom of your lower back there is a small hollow on each side of the spine. Put your right hand behind you, fingers pointing down, palm on the upper, outer part of the buttock. Move the hand up until the wrist end is level with the dimples. Baohuang lies in the area at the top outer corner of your palm.", "slug": "baohuang", "map": "med", "shape": "point"}, "chongmen": {"zh": "冲门", "py": "Chongmen", "code": "SP12", "en": "Chongmen", "find": "半躺或平躺，腿伸直。右手食指和中指并拢，放在右边大腿根的折痕上，从外侧骨盆那块骨头旁边开始。沿折痕慢慢往里、往下移，找到一跳一跳的地方。从跳的地方往外挪一个手指宽，还在折痕里。", "findEn": "Lie back, legs straight. Put your right index and middle fingers together on the crease at the top of your right thigh, beside the hip bone. Slide along the crease, inward and down, until you feel a beat. Then move one finger-width outward, still in the crease.", "slug": "chongmen", "map": "med", "shape": "point"}, "dabao": {"zh": "大包", "py": "Dabao", "code": "SP21", "en": "Dabao", "find": "坐着，左手臂举过头顶。右手手掌横放，手指并拢，食指一边贴着左腋窝正中。往下量两个手掌宽。用中指指肚在那里摸，会摸到两根骨头之间的一道软缝，就是这一片。", "findEn": "Sit and raise your left arm over your head. Lay your right hand flat and sideways, fingers together, index-finger edge against the middle of your left armpit. Measure down two hand-widths. Feel there with the pad of your middle finger: a soft groove between two ribs. That is the place.", "slug": "dabao", "map": "med", "shape": "point"}, "dantian": {"zh": "丹田", "py": "Dantian", "code": "Area", "en": "Lower Dantian", "find": "手掌横放在肚脐下面，掌心对着小腹。手掌盖住的这一片，就是下丹田。它不是一个点，是一片区域。", "findEn": "Lay your palm across your belly just below the navel. The area under your hand is the lower dantian. It is an area, not a point.", "slug": "dantian", "map": "cult", "shape": "area"}, "huantiao": {"zh": "环跳", "py": "Huantiao", "code": "GB30", "en": "Huantiao", "find": "左侧躺，下面的腿伸直，上面的右腿屈髋屈膝。右手摸到屁股外侧最凸的那块骨头。右手拇指第一个关节压在这块骨头的最高点上，拇指尖指向尾骨。拇指尖落下的地方，差不多就是环跳。", "findEn": "Lie on your left side, lower leg straight, right leg bent at hip and knee. With your right hand, find the most prominent bone on the outside of your hip. Press the first joint of your right thumb onto the highest point of that bone, with your thumb tip pointing towards your tailbone. Where the thumb tip lands is roughly Huantiao.", "slug": "huantiao", "map": "med", "shape": "point"}, "kuagen": {"zh": "胯根", "py": "Kua root", "code": "Area", "en": "Kua root · inner groin", "find": "坐着，屈膝，膝盖往外打开。同侧手的中指放进大腿根和小腹相连的那条折痕。手掌盖住的这一片就是胯根。中指往深处轻轻探，会摸到一条往下凹的槽。", "findEn": "Sit with your knee bent and dropped open to the side. Lay the middle finger of the same-side hand in the crease where the thigh meets the belly. The area under your palm is the kua root. Let the middle finger feel gently deeper: there is a groove that dips down.", "slug": "kuagen", "map": "ours", "shape": "area"}, "laogong": {"zh": "劳宫", "py": "Laogong", "code": "PC8", "en": "Laogong", "find": "轻轻握拳，中指尖碰到手心的地方。", "findEn": "Make a loose fist: where the tip of your middle finger meets the palm.", "slug": "laogong", "map": "med", "shape": "point"}, "mingmen": {"zh": "命门", "py": "Mingmen", "code": "GV4", "en": "Mingmen", "find": "先找到肚脐。从肚脐正对着往后，到后腰脊柱的正中。用中指指肚摸，正对的地方有一个凹陷。", "findEn": "Find your navel first. Go straight back from it to the middle of the spine in your lower back. Feel with the pad of your middle finger: right there is a small hollow.", "slug": "mingmen", "map": "med", "shape": "point"}, "qichong": {"zh": "气冲", "py": "Qichong", "code": "ST30", "en": "Qichong", "find": "平躺。中指从肚脐沿中线往下滑，滑到下腹最下面那块横着的硬骨，停在它上边。食指、中指、无名指并拢竖放，从这里往外量三个手指宽。那里能摸到一跳一跳的，就是。", "findEn": "Lie on your back. Slide your middle finger down the midline from the navel to the hard crosswise bone at the bottom of the belly, and stop on its upper edge. Put the index, middle and ring fingers together, pointing up and down, and measure three finger-widths out from there. Where you feel a beat is the point.", "slug": "qichong", "map": "med", "shape": "point"}, "qihai": {"zh": "气海", "py": "Qihai", "code": "CV6", "en": "Qihai", "find": "食指和中指并拢，放在肚脐正下方，两指的下沿。", "findEn": "Two fingers together just below the navel: the point is at their lower edge.", "slug": "qihai", "map": "med", "shape": "point"}, "qugu": {"zh": "曲骨", "py": "Qugu", "code": "CV2", "en": "Qugu", "find": "中指从肚脐沿着中线往下滑。滑到下腹最下面那块横着的硬骨。它上边缘的正中间。", "findEn": "Slide your middle finger down the midline from the navel. Stop at the hard bone at the bottom of the belly. The centre of its upper edge.", "slug": "qugu", "map": "med", "shape": "point"}, "shangjiao": {"zh": "上焦", "py": "Shangjiao", "code": "Area", "en": "Upper jiao", "find": "手掌平放在胸骨上，两乳之间。手掌盖住的胸腔这一片，就是上焦。", "findEn": "Lay your palm flat on your breastbone, between the breasts. The chest under your hand is the upper jiao.", "slug": "shangjiao", "map": "med", "shape": "area"}, "shangyang": {"zh": "商阳", "py": "Shangyang", "code": "LI1", "en": "Shangyang", "find": "食指伸直，指甲朝上。看指甲靠大拇指那一边、靠近手指根的那个角。同一只手的拇指指甲尖，放在这个角外面紧挨着的地方，不压在指甲上。", "findEn": "Straighten your index finger, nail up. Look at the corner of the nail on the thumb side, nearest the base of the finger. Put the tip of the thumbnail of the same hand just outside that corner, right beside it, not on the nail.", "slug": "shangyang", "map": "med", "shape": "point"}, "shenque": {"zh": "神阙", "py": "Shenque", "code": "CV8", "en": "Shenque", "find": "肚脐正中。", "findEn": "The centre of the navel.", "slug": "shenque", "map": "med", "shape": "point"}, "taibai": {"zh": "太白", "py": "Taibai", "code": "SP3", "en": "Taibai", "find": "坐着，看脚内侧。大脚趾根部后面有一块鼓起的骨头。从这块骨头往脚跟方向摸，刚过骨头就有一个小窝，在脚底和脚背颜色交界的那条边上。", "findEn": "Sit and look at the inside of your foot. Behind the base of the big toe is a bony bump. Feel from it toward the heel: just past the bone is a small hollow, on the line where the colour of the sole meets the colour of the top of the foot.", "slug": "taibai", "map": "med", "shape": "point"}, "xiajiao": {"zh": "下焦", "py": "Xiajiao", "code": "Area", "en": "Lower jiao", "find": "手掌放在肚脐以下，一直到耻骨。这一片，连同盆腔，是下焦。", "findEn": "Rest your palm below your navel, down to the pubic bone. This area, with the pelvis behind it, is the lower jiao.", "slug": "xiajiao", "map": "med", "shape": "area"}, "xinei": {"also": ["KI10"], "zh": "膝盖内侧", "py": "Inner knee", "code": "Area", "en": "Inner knee", "find": "坐着，翘起二郎腿。用对侧的手盖住上面那条腿的膝盖，掌心正对膝盖骨。手自然地盖上去，大拇指根那块肉下面，膝盖骨内侧边上，会摸到一个窝。", "findEn": "Sit and cross one leg over the other. Cover the top knee with the opposite hand, palm right over the kneecap. Let it rest there naturally: under the fleshy pad at the base of your thumb, beside the inner edge of the kneecap, you will feel a hollow.", "slug": "inner-knee", "map": "body", "shape": "area", "other": [["med", "脾、肝、肾三条经，在膝盖和大腿内侧并排往上走（《灵枢·经脉》）。膝盖附近有名字的穴位：膝上是血海 SP10；膝下是阴陵泉 SP9；膝内侧、腘横纹的内端是曲泉 LR8；膝后内侧是阴谷 KI10。定位照 GB/T 12346-2021。", "The Spleen, Liver and Kidney channels run side by side up the inner knee and thigh (Lingshu, \"Jingmai\"). Named points near the knee: Xuehai SP10 above it; Yinlingquan SP9 below it; Ququan LR8 at the inner end of the knee crease; Yingu KI10 at the back of the inner knee. Locations as in GB/T 12346-2021."]]}, "yemen": {"zh": "液门", "py": "Yemen", "code": "TE2", "en": "Yemen", "find": "手背朝上，无名指和小指之间的指缝，往手腕方向一点点的小窝。", "findEn": "Back of the hand: the small hollow just behind the web between ring and little fingers.", "slug": "yemen", "map": "med", "shape": "point"}, "yintang": {"zh": "印堂", "py": "Yintang", "code": "GV24+", "en": "Yintang", "find": "两眉头连线的正中。", "findEn": "Midway between the inner ends of the eyebrows.", "slug": "yintang", "map": "med", "shape": "point"}, "yingu": {"zh": "阴谷", "py": "Yingu", "code": "KI10", "en": "Yingu", "find": "坐在椅子上，两只脚踩在地上。左手手掌盖住右膝的内侧。右脚跟往地上踩，再往椅子那边拖，脚不用真的动：左手中指下面会凸起一条硬硬的筋。中指从这条筋往膝盖后面的窝里走一点点，一离开筋，就落进紧挨着它的一个小窝。差不多就是阴谷。摸一摸，稍软稍凹的那一点就是。", "findEn": "Sit on a chair, both feet on the floor. Cover the inner side of your right knee with your left palm. Press your right heel into the floor and pull it back towards the chair, without actually moving the foot: a firm cord stands out under your left middle finger. Move your middle finger just a little from the cord into the hollow at the back of the knee: as soon as it comes off the cord, it drops into a small hollow right beside it. That is roughly Yingu. Feel around: the slightly soft, slightly hollow spot is it.", "slug": "yingu", "map": "med", "shape": "point"}, "kunlun": {"zh": "昆仑", "py": "Kunlun", "code": "BL60", "en": "Kunlun", "find": "坐在椅子上，两只脚踩地。摸到脚踝外侧凸出来的那块骨头。从它最鼓的那一点，往脚后跟的方向滑。指头会掉进骨头和后面那根粗筋中间的小坑。差不多就是昆仑。", "findEn": "Sit on a chair, both feet on the floor. Find the bone that sticks out on the outside of your ankle. From its highest point, slide towards your heel. Feel your finger drop into the small hollow between the bone and the thick cord behind it. That is roughly Kunlun.", "slug": "kunlun", "map": "med", "shape": "point"}, "yongquan": {"zh": "涌泉", "py": "Yongquan", "code": "KI1", "en": "Yongquan", "find": "脚趾往下蜷，脚底前面那块肉的正后方会凹下去一个小窝。", "findEn": "Curl your toes: the small hollow just behind the ball of the foot.", "slug": "yongquan", "map": "med", "shape": "point"}, "yuji": {"zh": "鱼际", "py": "Yuji", "code": "LU10", "en": "Yuji", "find": "手掌朝上。大拇指下面有一根骨头，沿着它找到中间。手指在这里从手心往侧边摸过去：手心的皮肤软，翻到侧边就变硬、变紧了。软变硬的那条线上，就是。", "findEn": "Palm up. Under the thumb runs a bone; find the middle of it. There, feel from the palm toward the side of the hand: the palm skin is soft, and as you come round the edge it turns firmer and tighter. The point is on that line where soft turns firm.", "slug": "yuji", "map": "med", "shape": "point"}, "yunmen": {"zh": "云门", "py": "Yunmen", "code": "LU2", "en": "Yunmen", "find": "手叉腰，锁骨外端下面会出现一个窝。", "findEn": "Hands on hips: a hollow appears just below the outer end of the collarbone.", "slug": "yunmen", "map": "med", "shape": "point"}, "zhibian": {"zh": "秩边", "py": "Zhibian", "code": "BL54", "en": "Zhibian", "find": "站着，右手像插进裤子后口袋那样，手掌贴在屁股上，手指朝下。中指尖和尾骨一样高，不要更低。手掌盖住的这一片，秩边就在里面。", "findEn": "Stand and put your right hand as if into the back pocket of your trousers: palm on the buttock, fingers pointing down. Keep the tip of your middle finger level with your tailbone, no lower. Zhibian lies in the area under your palm.", "slug": "zhibian", "map": "med", "shape": "point"}, "zhongfu": {"zh": "中府", "py": "Zhongfu", "code": "LU1", "en": "Zhongfu", "find": "右手中指，放在左边锁骨靠肩膀那一头的下面。往下一个大拇指宽，再往胸口里挪一点。那一片里最凹、最深的地方。", "findEn": "Right middle finger under the outer end of the left collarbone, near the shoulder. Move down one thumb-width, then a little in towards the chest. The deepest, most hollow spot there.", "slug": "zhongfu", "map": "med", "shape": "point"}, "zhongjiao": {"zh": "中焦", "py": "Zhongjiao", "code": "Area", "en": "Middle jiao", "find": "手掌放在胸骨下端和肚脐之间，也就是上腹。这一片是中焦。", "findEn": "Rest your palm between the bottom of your breastbone and your navel, on the upper belly. This is the middle jiao.", "slug": "zhongjiao", "map": "med", "shape": "area"}, "dazhui": {"zh": "大椎", "py": "Dazhui", "code": "GV14", "en": "Dazhui", "find": "低头，后颈根最突出的那块骨头（第 7 颈椎）。它下面的那个凹陷，在脊柱正中，就是大椎。", "findEn": "Bow your head: the bone that stands out most at the root of the neck is the seventh cervical vertebra. The hollow just below it, on the midline, is Dazhui.", "slug": "dazhui", "map": "med", "shape": "point"}, "fengfu": {"zh": "风府", "py": "Fengfu", "code": "GV16", "en": "Fengfu", "find": "一只手，中指指腹放在脖子后面发际线的正中，往上推。推到后脑勺那块骨头挡住手指的地方，手指下面那个小凹陷就是风府。", "findEn": "One hand: put the pad of your middle finger on the hairline at the middle of the back of your neck and push upwards. Where the bone at the back of your skull stops the finger, the small hollow under it is Fengfu.", "slug": "fengfu", "map": "med", "shape": "point"}, "jianwo": {"zh": "肩窝", "py": "Shoulder hollow", "code": "Area", "en": "Shoulder hollow", "slug": "shoulder-hollow", "map": "body", "shape": "area", "find": "锁骨外端下面、肩前那个凹下去的窝。手掌轻轻盖住，盖住的这一片就是肩窝。", "findEn": "The hollow under the outer end of the collarbone, at the front of the shoulder. Cover it lightly with your palm; the area under your hand is the shoulder hollow.", "other": [["med", "云门 LU2 在锁骨下窝的凹陷里；中府 LU1 在它外侧，横平第 1 肋间隙。定位照 GB/T 12346-2021。", "Yunmen LU2 lies in the hollow below the collarbone; Zhongfu LU1 lies just outside it, level with the first intercostal space. Locations as in GB/T 12346-2021."]]}, "xiongqiang": {"zh": "胸腔", "py": "Thoracic cavity", "code": "Area", "en": "Thoracic cavity", "slug": "thoracic-cavity", "map": "body", "shape": "area", "find": "手掌平放在胸骨上。掌心对着的里面，肋骨围起来的这一片，就是胸腔。", "findEn": "Lay your palm flat on your breastbone. Inside, behind it, the space your ribs wrap around is the thoracic cavity.", "other": [["anat", "Thoracic cavity，里面有胸膜腔和心包腔。见Austin Ince《The Art of Letting Go》阴瑜伽师资培训讲义，第 16 页。", "Thoracic cavity; it holds the pleural cavities and the pericardial cavity. Austin Ince, The Art of Letting Go, Yin Yoga teacher training manual, p. 16."], ["med", "《灵枢·五味》：「其大气之抟而不行者，积于胸中，命曰气海，出于肺，循喉咽，故呼则出，吸则入。」《灵枢·海论》：「膻中者，为气之海。」这里的气海在胸中，和脐下的气海穴 CV6 同名，不是一个地方。三焦图上，这一片在上焦。", "The Lingshu (\"Wuwei\", ch. 56) calls the great qi gathered in the chest the Sea of Qi, and says it comes out of the lungs and follows the throat; the Lingshu (\"Hailun\", ch. 33) calls Danzhong the sea of qi. This Sea of Qi is in the chest: it shares its name with the point Qihai CV6 below the navel, but it is not the same place. On the Sanjiao map, this stretch is the upper jiao."]], "nopage": true}, "fuqiang": {"zh": "腹腔", "py": "Abdominal cavity", "code": "Area", "en": "Abdominal cavity", "slug": "abdominal-cavity", "map": "body", "shape": "area", "find": "手掌平放在肚子上，肚脐在掌心下面。掌心对着的里面，这一大片就是腹腔。它往下和盆腔连着，中间没有隔开。", "findEn": "Lay your palm flat on your belly, navel under the centre of your palm. Inside, behind it, this large space is the abdominal cavity. Below, it runs on into the pelvic cavity with nothing dividing them.", "other": [["anat", "Abdominal cavity，里面有腹部的腹膜腔。腹腔和盆腔的腹膜腔是相连的。见Austin Ince《The Art of Letting Go》阴瑜伽师资培训讲义，第 16 页。", "Abdominal cavity; it holds the peritoneal cavity of the abdomen, which is connected with that of the pelvis. Austin Ince, The Art of Letting Go, Yin Yoga teacher training manual, p. 16."], ["med", "肚脐是神阙 CV8。三焦图上，肚脐以上这一片是中焦。肚脐下面有气海 CV6（脐下一寸半）、关元 CV4（脐下三寸），定位照 GB/T 12346-2021；它们里面对着腹腔下部和盆腔，两腔相连。", "The navel is Shenque CV8. On the Sanjiao map, the stretch above the navel is the middle jiao. Below the navel lie Qihai CV6 (1.5 cun below) and Guanyuan CV4 (3 cun below), located as in GB/T 12346-2021; behind them lie the lower abdominal cavity and the pelvic cavity, which are connected."], ["cult", "修炼的书把肚脐下面这一片叫下丹田。", "Books on cultivation call the stretch below the navel the lower dantian."]], "nopage": true}, "penqiang": {"zh": "盆腔", "py": "Pelvic cavity", "code": "Area", "en": "Pelvic cavity", "slug": "pelvic-cavity", "map": "body", "shape": "area", "find": "一只手掌放在肚脐下面、耻骨上面，另一只手掌放在背后的骶骨上。两只手中间、骨盆围起来的这一片，就是盆腔。", "findEn": "One palm below your navel, above the pubic bone; the other on your sacrum at the back. Between your hands, the space your pelvis wraps around is the pelvic cavity.", "other": [["anat", "Pelvic cavity，里面有盆部的腹膜腔，和腹腔的腹膜腔相连。见Austin Ince《The Art of Letting Go》阴瑜伽师资培训讲义，第 16 页。", "Pelvic cavity; it holds the peritoneal cavity of the pelvis, which is connected with that of the abdomen. Austin Ince, The Art of Letting Go, Yin Yoga teacher training manual, p. 16."], ["med", "三焦图上，肚脐以下到耻骨这一片，连同盆腔，是下焦。背后骶骨上的八髎，在盆腔的后面。", "On the Sanjiao map, the stretch from the navel down to the pubic bone, with the pelvic cavity behind it, is the lower jiao. The Baliao on the sacrum lie at the back of the pelvic cavity."], ["cult", "修炼的书把肚脐下面这一片叫下丹田。", "Books on cultivation call the stretch below the navel the lower dantian."]], "nopage": true}}, "journal": [{"slug": "journal-yang-habits-in-yin", "title": "Noticing My Yang Habits in Yin", "summary": "I had changed the duration, but not the way I was practising.", "n": 1}], "maps": {"med": ["医经", "Medical classics"], "cult": ["修炼和功法", "Cultivation and martial arts"], "anat": ["现代解剖", "Modern anatomy"], "body": ["日常身体", "Everyday body"], "ours": ["我们自己的话", "Our own words"], "yoga": ["瑜伽和现代练习", "Yoga and modern practice"]}};

the tendons of extensor hallucis longus and extensor digitorum longus."}, {"zh": "冲阳", "py": "Chongyang", "code": "ST42", "clause": "5.3.42", "loc": "在足背，第2跖骨基底部与中间楔状骨关节处，可触及足背动脉。", "at": [458, 1532], "seg": 13, "locEn": "On the top of the foot, at the joint between the base of the 2nd metatarsal and the intermediate cuneiform, where the dorsal artery of the foot can be felt."}, {"zh": "陷谷", "py": "Xiangu", "code": "ST43", "clause": "5.3.43", "loc": "在足背，第2、3跖骨间，第2跖趾关节近端凹陷中。", "at": [456, 1562], "seg": 14, "locEn": "On the top of the foot, between the 2nd and 3rd metatarsals, in the hollow proximal to the 2nd toe joint."}, {"zh": "内庭", "py": "Neiting", "code": "ST44", "clause": "5.3.44", "loc": "在足背，第2、3趾间，趾蹼缘后方赤白肉际处。", "at": [456, 1590], "seg": 14, "locEn": "On the top of the foot, between the 2nd and 3rd toes, just behind the edge of the web, at the border of the red and white skin."}, {"zh": "厉兑", "py": "Lidui", "code": "ST45", "clause": "5.3.45", "loc": "在足趾，第2趾末节外侧，趾甲根角侧后方0.1寸。", "at": [454, 1608], "seg": 14, "locEn": "On the 2nd toe, on the outer side of the last segment, 0.1 cun beside and behind the corner at the base of the nail."}], "breaks": [8], "text": "胃足阳明之脉，起于鼻之交頞中，旁纳太阳之脉，下循鼻外，入上齿中，还出挟口环唇，下交承浆，却循颐后下廉，出大迎，循颊车，上耳前，过客主人，循发际，至额颅；其支者，从大迎前下人迎，循喉咙，入缺盆，下膈，属胃，络脾；其直者，从缺盆下乳内廉，下挟脐，入气街中；其支者，起于胃口，下循腹里，下至气街中而合，以下髀关，抵伏兔，下膝膑中，下循胫外廉，下足跗，入中指内间；其支者，下廉三寸而别，下入中指外间；其支者，别跗上，入大指间，出其端。", "src": "《灵枢·经脉》，元胡氏古林书堂刻本（1339），卷三", "note": "元刻本作「起於鼻」；「旁纳」下有夹注「一本作约字」；「下廉三寸而别」，通行本作「下膝三寸而别」。", "segs": {"1": ["起于鼻之交頞中，旁纳太阳之脉", "从鼻根两眼之间起，旁边收进膀胱经。", "It begins at the root of the nose between the eyes, taking in the Bladder channel beside it."], "2": ["下循鼻外", "沿着鼻子外侧往下。", "Down along the outside of the nose."], "3": ["入上齿中，还出挟口环唇", "进入上牙，再出来，夹着嘴，绕着嘴唇。", "Into the upper teeth, then out again, along the mouth and around the lips."], "4": ["下交承浆，却循颐后下廉，出大迎", "往下在承浆交会，退回沿着下巴后面的下缘，出到大迎。", "Down to meet at Chengjiang, back along the lower edge behind the chin, out at Daying."], "5": ["循颊车，上耳前，过客主人", "沿着颊车，上到耳前，经过客主人。", "Along the jaw, up in front of the ear, past Kezhuren."], "6": ["循发际，至额颅", "沿着发际，到额头。", "Along the hairline to the forehead."], "7": ["其支者，从大迎前下人迎，循喉咙，入缺盆", "一支从大迎前面往下到人迎，沿着喉咙，进入缺盆。", "A branch goes from in front of Daying down to Renying, along the throat, into the hollow above the collarbone."], "8": ["下膈，属胃，络脾", "往下穿过膈，属于胃，络着脾。", "Down through the diaphragm; it belongs to the stomach and links with the spleen."], "9": ["其直者，从缺盆下乳内廉，下挟脐，入气街中", "主干从缺盆往下，经过乳头内侧，往下夹着肚脐，进入气街。", "The main line goes down from that hollow, along the inner edge of the breast, beside the navel, into Qijie."], "10": ["其支者，起于胃口，下循腹里，下至气街中而合", "一支从胃口起，沿着腹里往下，到气街和主干会合。", "A branch begins at the mouth of the stomach, runs down inside the belly, and joins the main line at Qijie."], "11": ["以下髀关，抵伏兔", "从这里往下到髀关，抵到伏兔。", "From there down to Biguan, reaching Futu on the thigh."], "12": ["下膝膑中", "往下到膝盖骨的中间。", "Down into the middle of the kneecap."], "13": ["下循胫外廉，下足跗", "沿着小腿骨的外缘往下，到脚背。", "Down the outer edge of the shin, to the top of the foot."], "14": ["入中指内间", "进入中趾的内侧。", "Into the inner side of the middle toe."], "15": ["其支者，下廉三寸而别，下入中指外间", "一支在膝下三寸分出来，往下进入中趾的外侧。", "A branch parts three cun below the knee and goes down into the outer side of the middle toe."], "16": ["其支者，别跗上，入大指间，出其端", "一支从脚背分出来，进入大脚趾，出到趾尖。", "A branch parts on the top of the foot, enters the big toe, and comes out at its tip."]}, "page": {"file": "pages/lingshu-yuan-juan3-stomach.jpg", "hl": [0.172, 0, 0.496, 1], "n": 27}, "inner": [{"p": [[482, 154], [492, 160], [500, 160]]}, {"p": [[452, 270], [468, 400], [490, 506]]}, {"p": [[490, 506], [486, 530], [482, 548]]}, {"p": [[482, 548], [506, 552], [528, 552]]}, {"p": [[500, 524], [478, 700], [458, 884]]}], "branch": [{"p": [[500, 132], [490, 128], [482, 136]]}, {"p": [[488, 168], [500, 182], [482, 190], [474, 186]]}, {"p": [[474, 186], [480, 212], [484, 234]]}, {"p": [[464, 150], [466, 118], [474, 96], [500, 86]]}, {"p": [[442, 1264], [436, 1420], [446, 16 颊上䪼，抵鼻，至目内眦，斜络于颧", "一支从面颊分出来，上到眼眶下，抵到鼻，到内眼角，斜着络到颧骨。", "A branch parts at the cheek, rises below the eye, reaches the nose and the inner corner of the eye, and links slantwise with the cheekbone."]}, "page": {"file": "pages/lingshu-yuan-juan3-small-intestine.jpg", "hl": [0.619, 0, 0.297, 1], "n": 28}, "inner": [{"p": [[452, 270], [478, 372], [500, 452]]}, {"p": [[500, 452], [504, 330], [500, 236]], "mid": true}, {"p": [[500, 236], [492, 380], [490, 506]], "mid": true}, {"p": [[490, 506], [486, 530], [482, 548]], "mid": true}, {"p": [[482, 548], [496, 640], [500, 712]], "mid": true}], "branch": [{"p": [[458, 276], [456, 272], [452, 270]]}, {"p": [[474, 150], [468, 128], [456, 140]]}, {"p": [[470, 170], [484, 150], [492, 140], [490, 128]]}], "places": [{"zh": "缺盆", "en": "hollow above the collarbone", "kind": "place", "at": [452, 270]}, {"zh": "心", "en": "heart", "kind": "lake", "at": [500, 452], "mid": true, "color": "#a8452c"}, {"zh": "咽", "en": "throat", "kind": "place", "at": [500, 236], "mid": true}, {"zh": "膈", "en": "diaphragm", "kind": "place", "at": [490, 506], "mid": true}, {"zh": "胃", "en": "stomach", "kind": "valley", "at": [482, 548], "mid": true, "color": "#c4a670"}, {"zh": "小肠", "en": "small intestine", "kind": "valley", "at": [500, 712], "mid": true, "color": "#b9805a"}, {"zh": "目锐眦", "en": "outer corner of the eye", "kind": "place", "at": [468, 128]}]}, {"id": "bl", "zh": "足太阳膀胱经", "en": "Bladder channel (foot taiyang)", "color": "#56698a", "st": [{"zh": "睛明", "py": "Jingming", "code": "BL1", "clause": "5.7.1", "loc": "在面部，目内眦内上方眶内侧壁凹陷中。", "at": [490, 128], "seg": 1, "locEn": "On the face, in the hollow on the inner wall of the eye socket, just above and inside the inner corner of the eye."}, {"zh": "攒竹", "py": "Cuanzhu", "code": "BL2", "clause": "5.7.2", "loc": "在面部，眉头凹陷中，额切迹处。", "at": [488, 114], "seg": 2, "locEn": "On the face, in the hollow at the inner end of the eyebrow, at the frontal notch."}, {"zh": "眉冲", "py": "Meichong", "code": "BL3", "clau s of the 12th thoracic vertebra, 3 cun lateral to the posterior midline."}, {"zh": "肓门", "py": "Huangmen", "code": "BL51", "clause": "5.7.51", "loc": "在腰部，第1腰椎棘突下，后正中线旁开3寸。", "at": [452, 600], "seg": 11, "back": true, "locEn": "On the lower back, below the spinous process of the 1st lumbar vertebra, 3 cun lateral to the posterior midline."}, {"zh": "志室", "py": "Zhishi", "code": "BL52", "clause": "5.7.52", "loc": "在腰部，第2腰椎棘突下，后正中线旁开3寸。", "at": [448, 628], "seg": 11, "back": true, "locEn": "On the lower back, below the spinous process of the 2nd lumbar vertebra, 3 cun lateral to the posterior midline."}, {"zh": "胞肓", "py": "Baohuang", "code": "BL53", "clause": "5.7.53", "loc": "在臀部，横平第2骶后孔，骶正中嵴旁开3寸。", "at": [454, 862], "seg": 12, "back": true, "key": "baohuang", "locEn": "On the buttock, level with the 2nd posterior sacral foramen, 3 cun lateral to the median sacral crest."}, {"zh": "秩边", "py": "Zhibian", "code": "BL54", "clause": "5.7.54", "loc": "在臀部，横平第4骶后孔，骶正中嵴旁开3寸。", "at": [452, 946], "seg": 12, "back": true, "key": "zhibian", "locEn": "On the buttock, level with the 4th posterior sacral foramen, 3 cun lateral to the median sacral crest."}, {"zh": "合阳", "py": "Heyang", "code": "BL55", "clause": "5.7.55", "loc": "在小腿后侧，腘横纹下2寸，腓肠肌内、外侧头之间。", "at": [452, 1234], "seg": 14, "back": true, "locEn": "On the back of the lower leg, 2 cun below the knee crease, between the inner and outer heads of gastrocnemius."}, {"zh": "承筋", "py": "Chengjin", "code": "BL56", "clause": "5.7.56", "loc": "在小腿后侧，腘横纹下5寸，腓肠肌两肌腹之间。", "at": [454, 1290], "seg": 14, "back": true, "locEn": "On the back of the lower leg, 5 cun below the knee crease, between the two bellies of gastrocnemius."}, {"zh": "承山", "py": "Chengshan", "code": "BL57", "clause": "5.7.57", "loc": "在小腿后侧，腓肠肌两肌腹与跟腱交角处。", "at": [456, 1340], "seg": 14, "back": true, "locEn": "On the back of the lower leg, where the two bellies of gastrocnemius meet the Achilles tendon."}, {"zh": "飞扬", "py": "Feiyang", "code": "BL58", "clause": "5.7.58", "loc": "在小腿后外侧，腓肠肌外下缘与跟腱移行处，约当昆仑（BL60）直上7寸。", "at": [446, 1372], "seg": 15, "back": true, "locEn": "On the back and outer side of the lower leg, where the lower outer edge of gastrocnemius becomes the Achilles tendon, about 7 cun straight above Kunlun (BL60)."}, {"zh": "跗阳", "py": "Fuyang", "code": "BL59", "clause": "5.7.59", "loc": "在小腿后外侧，昆仑（BL60）直上3寸，腓骨与跟腱之间。", "at": [444, 1430], "seg": 15, "back": true, "locEn": "On the back and outer side of the lower leg, 3 cun straight above Kunlun (BL60), between the fibula and the Achilles tendon."}, {"zh": "昆仑", "py": "Kunlun", "code": "BL60", "clause": "5.7.60", "loc": "在踝后外侧，外踝尖与跟腱之间的凹陷中。", "at": [440, 1484], "seg": 15, "back": true, "locEn": "On the back and outer side of the ankle, in the hollow between the tip of the outer ankle bone and the Achilles tendon.", "find": "坐在椅子上，两只脚踩地。摸到脚踝外侧凸出来的那块骨头。从它最鼓的那一点，往脚后跟的方向滑。指头会掉进骨头和后面那根粗筋中间的小坑。差不多就是昆仑。", "findEn": "Sit on a chair, both feet on the floor. Find the bone that sticks out on the outside of your ankle. From its highest point, slide towards your heel. Feel your finger drop into the small hollow between the bone and the thick cord behind it. That is roughly Kunlun."}, {"zh": "仆参", "py": "Pucan", "code": "BL61", "clause": "5.7.61", "loc": "在足外侧，昆仑（BL60）直下，跟骨外侧，赤白肉际处。", "at": [442, 1512], "seg": 16, "back": true, "locEn": "On the outer side of the foot, straight below Kunlun (BL60), on the outer side of the heel bone, at the border of the red and white skin."}, {"zh": "申脉", "py": "Shenmai", "code": "BL62", "clause": "5.7.62", "loc": "在足外侧，外踝尖直下，外踝下缘与跟骨之间凹陷中。", "at": [434, 1500], "seg": 16, "locEn": "On the outer side of the foot, straight below the tip of the outer ankle bone, in the hollow between the lower edge of the ankle bone and the heel bone."}, {"zh": "金门", "py": "Jinmen", "code": "BL63", "clause": "5.7.63", "loc": "在足背，外踝前缘直下，第5跖骨粗隆后方，骰骨下缘凹陷中。", "at": [438, 1532], "seg": 16, "locEn": "On the top of the foot, straight below the front edge of the outer ankle bone, behind the tuberosity of the 5th metatarsal, in the hollow at the lower edge of the cuboid."}, {"zh": "京骨", "py": "Jinggu", "code": "BL64", "clause": "5.7.64", "loc": "在足外侧，第5跖骨粗隆前下方，赤白肉际处。", "at": [440, 1556], "seg": 16, "locEn": "On the outer side of the foot, in front of and below the tuberosity of the 5th metatarsal, at the border of the red and white skin."}, {"zh": "束骨", "py": "Shugu", "code": "BL65", "clause": "5.7.65", "loc": "在足外侧，第5跖趾关节的近端，赤白肉际处。", "at": [442, 1580], "seg": 17, "locEn": "On the outer side of the foot, proximal to the 5th toe joint, at the border of the red and white skin."}, {"zh": "足通谷", "py": "Zutonggu", "code": "BL66", "clause": "5.7.66", "loc": "在足趾，第5跖趾关节的远端，赤白肉际处。", "at": [444, 1598], "seg": 17, "locEn": "On the little toe, distal to the 5th toe joint, at the border of the red and white skin."}, {"zh": "至阴", "py": "Zhiyin", "code": "BL67", "clause": "5.7.67", "loc": "在足趾，小趾末节外侧，趾甲根角侧后方0.1寸。", "at": [446, 1612], "seg": 17, "locEn": "On the little toe, on the outer side of the last segment, 0.1 cun beside and behind the corner at the base of the nail."}], "breaks": [30, 40, 54], "text": "膀胱足太阳之脉，起于目内眦，上额，交巅；其支者，从巅至耳上角；其直者，从巅入络脑，还出别下项，循肩髆内，挟脊，抵腰中，入循膂，络肾，属膀胱；其支者，从腰中下挟脊，贯臀，入腘中；其支者，从髆内左右别下贯胛，挟脊内，过髀枢，循髀外，从后廉下合腘中，以下贯踹内，出外踝之后，循京骨，至小指外侧。", "src": "《灵枢·经脉》，元胡氏古林书堂刻本（1339），卷三", "note": "元刻本作「贯踹内」，通行本作「贯腨内」。原文跨页：最后一行「後循京骨至小指外側」在下一页。除了脸上开头五站，都在背面，点「转身」看。", "segs": {"1": ["起于目内眦", "从内眼角起。", "It begins at the inner corner of the eye."], "2": ["上额", "往上到额头。", "Up over the forehead."], "3": ["交巅", "在头顶交会。", "Meeting at the crown of the head."], "4": ["其支者，从巅至耳上角", "一支从头顶到耳朵上角。", "A branch goes from the crown to the upper corner of the ear."], "5": ["其直者，从巅入络脑", "主干从头顶进去，络着脑。", "The main line goes in from the crown and links with the brain."], "6": ["还出别下项", "再出来，分开往下走到后颈。", "Out again, parting to run down the back of the neck."], "7": ["循肩髆内，挟脊，抵腰中", "沿着肩胛骨内侧，夹着脊柱，到腰的中间。", "Along the inner side of the shoulder blades, beside the spine, down to the middle of the low back."], "8": ["入循膂，络肾，属膀胱", "沿着脊旁的肌肉进去，络着肾，属于膀胱。", "In along the muscles beside the spine, linking with the kidneys, belonging to the bladder."], "9": ["其支者，从腰中下挟脊，贯臀，入腘中", "一支从腰中往下，夹着脊柱，穿过臀部，进入膝盖后面的窝。", "A branch goes down from the low back beside the spine, through the buttock, into the hollow behind the knee."], "10": ["其支者，从髆内左右别下贯胛", "一支从肩胛骨内侧，左右分开，往下穿过肩胛。", "A branch parts left and right from the inner side of the shoulder blades and runs down through them."], "11": ["挟脊内", "夹着脊柱的里侧。", "Along the inside of the spine."], "12": ["过髀枢", "经过髋关节。", "Past the hip joint."], "13": ["循髀外，从后廉下合腘中", "沿着大腿外侧，从后边往下，在膝盖后面的窝里会合。", "Along the outer thigh, down its back edge, joining in the hollow behind the knee."], "14": ["以下贯踹内", "从这里往下穿过小腿肚。", "From there down through the calf."], "15": ["出外踝之后", "出到外踝的后面。", "Out behind the outer ankle bone."], "16": ["循京骨", "沿着京骨（脚外侧那块凸起的骨头）。", "Along Jinggu, the knob on the outer edge of the foot."], "17": ["至小指外侧", "到小脚趾的外侧。", "To the outer side of the little toe."]}, "page": {"file": "pages/lingshu-yuan-juan3-bladder.jpg", "hl": [0, 0, 0.478, 1], "n": "28–29"}, "inner": [{"p": [[490, 108], [496, 110], [500, 112]]}, {"p": [[478, 628], [472, 636], [466, 644]]}, {"p": [[466, 644], [484, 760], [500, 866]]}], "branch": [{"p": [[490, 92], [474, 104], [458, 126]], "back": true}, {"p": [[452, 946], [372, 912], [392, 1000], [420, 1100], [450, 1198]], "back": true}], "places": [{"zh": "脑", "en": "brain", "kind": "place", "at": [500, 112], "mid": true}, {"zh": "肾", "en": "kidneys", "kind": "lake", "at": [466, 644], "color": "#2a3a55"}, {"zh": "膀胱", "en": "bladder", "kind": "valley", "at": [500, 866], "mid": true, "color": "#56698a"}, {"zh": "耳上角", "en": "upper corner of the ear", "kind": "place", "at": [458, 126]}]}, {"id": "ki", "zh": "足少阴肾经", "en": "Kidney channel (foot shaoyin)", "color": "#2a3a55", "breaks": [10], "text": "肾足少阴之脉，起于小指之下，邪走足心，出于然谷之下，循内踝之后，别入跟中，以上踹内，出腘内廉，上股内后廉，贯脊，属肾，络膀胱；其直者，从肾上贯肝膈，入肺中，循喉咙，挟舌本；其支者，从肺出络心，注胸中。", "src": "《灵枢·经脉》，元胡氏古林书堂刻本（1339），卷三", "note": "元刻本作「邪走足心」（邪通斜）、「以上踹内」（通行本作「腨」）。原文没有写腹部和胸前那一排穴；那是后来定下的体表位置，原文说的是经从脊里上到肾、肝、肺。", "st": [{"zh": "涌泉", "py": "Yongquan", "code": "KI1", "clause": "5.8.1", "loc": "在足底，屈足卷趾时足心最凹陷中。", "at": [440, 1598], "seg": 2, "key": "yongquan", "locEn": "On the sole, at the deepest hollow of the sole when the foot is flexed and the toes curled."}, {"zh": "然谷", "py": "Rangu", "code": "KI2", "clause": "5.8.2", "loc": "在足内侧，足舟骨粗隆下方，赤白肉际处。", "at": [474, 1530], "seg": 3, "locEn": "On the inner side of the foot, below the tuberosity of the navicular, at the border of the red and white skin."}, {"zh": "太溪", "py": "Taixi", "code": "KI3", "clause": "5.8.3", "loc": "在踝后内侧，内踝尖与跟腱之间的凹陷中。", "at": [480, 1488], "seg": 4, "back": true, "locEn": "On the back and inner side of the ankle, in the hollow between the tip of the inner ankle bone and the Achilles tendon."}, {"zh": "大钟", "py": "Dazhong", "code": "KI4", "clause": "5.8.4", "loc": "在足内侧，内踝后下方，跟骨上缘，跟腱附着部内侧前缘凹陷中。", "at": [484, 1504], "seg": 5, "back": true, "locEn": "On the inner side of the foot, behind and below the inner ankle bone, at the upper edge of the heel bone, in the hollow at the front inner edge of the Achilles tendon's attachment."}, {"zh": "水泉", "py": "Shuiquan", "code": "KI5", "clause": "5.8.5", "loc": "在足内侧，太溪（KI3）直下1寸，跟骨结节内侧凹陷中。", "at": [480, 1520], "seg": 5, "back": true, "locEn": "On the inner side of the foot, 1 cun straight below Taixi (KI3), in the hollow on the inner side of the heel-bone tuberosity."}, {"zh": "照海", "py": "Zhaohai", "code": "KI6", "clause": "5.8.6", "loc": "在足内侧，内踝尖下1寸，内踝下缘边际凹陷中。", "at": [470, 1508], "seg": 4, "locEn": "On the inner side of the foot, 1 cun below the tip of the inner ankle bone, in the hollow at its lower edge."}, {"zh": "复溜", "py": "Fuliu", "code": "KI7", "clause": "5.8.7", "loc": "在小腿后内侧，内踝尖上2寸，跟腱的前缘。", "at": [484, 1430], "seg": 6, "back": true, "locEn": "On the back and inner side of the lower leg, 2 cun above the tip of the inner ankle bone, at the front edge of the Achilles tendon."}, {"zh": "交信", "py": "Jiaoxin", "code": "KI8", "clause": "5.8.8", "loc": "在小腿内侧，内踝尖上2寸，胫骨内侧缘后际凹陷中。", "at": [472, 1426], "seg": 6, "locEn": "On the inner side of the lower leg, 2 cun above the tip of the inner ankle bone, in the hollow just behind the inner edge of the shinbone."}, {"zh": "筑宾", "py": "Zhubin", "code": "KI9", "clause": "5.8.9", "loc": "在小腿后内侧，太溪（KI3）直上5寸，比目鱼肌与跟腱之间。", "at": [482, 1340], "seg": 6, "back": true, "locEn": "On the back and inner side of the lower leg, 5 cun straight above Taixi (KI3), between soleus and the Achilles tendon."}, {"zh": "阴谷", "py": "Yingu", "code": "KI10", "clause": "5.8.10", "loc": "在膝后内侧，腘横纹上，半腱肌肌腱外侧缘。", "at": [474, 1212], "seg": 7, "back": true, "locEn": "On the back and inner side of the knee, on the knee crease, at the outer edge of the semitendinosus tendon.", "find": "坐在椅子上，两只脚踩在地上。左手手掌盖住右膝的内侧。右脚跟往地上踩，再往椅子那边拖，脚不用真的动：左手中指下面会凸起一条硬硬的筋。中指从这条筋往膝盖后面的窝里走一点点，一离开筋，就落进紧挨着它的一个小窝。差不多就是阴谷。摸一摸，稍软稍凹的那一点就是。", "findEn": "Sit on a chair, both feet on the floor. Cover the inner side of your right knee with your left palm. Press your right heel into the floor and pull it back towards the chair, without actually moving the foot: a firm cord stands out under your left middle finger. Move your middle finger just a little from the cord into the hollow at the back of the knee: as soon as it comes off the cord, it drops into a small hollow right beside it. That is roughly Yingu. Feel around: the slightly soft, slightly hollow spot is it."}, {"zh": "横骨", "py": "Henggu", "code": "KI11", "clause": "5.8.11", "loc": "在下腹部，脐中下5寸，前正中线旁开0.5寸。", "at": [488, 872], "seg": 9, "locEn": "On the lower abdomen, 5 cun below the centre of the navel, 0.5 cun lateral to the anterior midline."}, {"zh": "大赫", "py": "Dahe", "code": "KI12", "clause": "5.8.12", "loc": "在下腹部，脐中下4寸，前正中线旁开0.5寸。", "at": [488, 834], "seg": 9, "locEn": "On the lower abdomen, 4 cun below the centre of the navel, 0.5 cun lateral to the anterior midline."}, {"zh": "气穴", "py": "Qixue", "code": "KI13", "clause": "5.8.13", "loc": "在下腹部，脐中下3寸，前正中线旁开0.5寸。", "at": [488, 796], "seg": 9, "locEn": "On the lower abdomen, 3 cun below the centre of the navel, 0.5 cun lateral to the anterior midline."}, {"zh": "四满", "py": "Siman", "code": "KI14", "clause": "5.8.14", "loc": "在下腹部，脐中下2寸，前正中线旁开0.5寸。", "at": [488, 758], "seg": 9, "locEn": "On the lower abdomen, 2 cun below the centre of the navel, 0.5 cun lateral to the anterior midline."}, {"zh": "中注", "py": "Zhongzhu", "code": "KI15", "clause": "5.8.15", "loc": "在下腹部，脐中下1寸，前正中线旁开0.5寸。", "at": [488, 721], "seg": 9, "locEn": "On the lower abdomen, 1 cun below the centre of the navel, 0.5 cun lateral to the anterior midline."}, {"zh": "肓俞", "py": "Huangshu", "code": "KI16", "clause": "5.8.16", "loc": "在上腹部，脐中旁开0.5寸。", "at": [488, 684], "seg": 9, "locEn": "On the upper abdomen, 0.5 cun lateral to the centre of the navel."}, {"zh": "商曲", "py": "Shangqu", "code": "KI17", "clause": "5.8.17", "loc": "在上腹部，脐中上2寸，前正中线旁开0.5寸。", "at": [488, 628], "seg": 10, "locEn": "On the upper abdomen, 2 cun above the centre of the navel, 0.5 cun lateral to the anterior midline."}, {"zh": "石关", "py": "Shiguan", "code": "KI18", "clause": "5.8.18", "loc": "在上腹部，脐中上3寸，前正中线旁开0.5寸。", "at": [488, 600], "seg": 10, "locEn": "On the upper abdomen, 3 cun above the centre of the navel, 0.5 cun lateral to the anterior midline."}, {"zh": "阴都", "py": "Yindu", "code": "KI19", "clause": "5.8.19", "loc": "在上腹部，脐中上4寸，前正中线旁开0.5寸。", "at": [488, 572], "seg": 10, "locEn": "On the upper abdomen, 4 cun above the centre of the navel, 0.5 cun lateral to the anterior midline."}, {"zh": "腹通谷", "py": "Futonggu", "code": "KI20", "clause": "5.8.20", "loc": "在上腹部，脐中上5寸，前正中线旁开0.5寸。", "at": [488, 544], "seg": 10, "locEn": "On the upper abdomen, 5 cun above the centre of the navel, 0.5 cun lateral to the anterior midline."}, {"zh": "幽门", "py": "Youmen", "code": "KI21", "clause": "5.8.21", "loc": "在上腹部，脐中上6寸，前正中线旁开0.5寸。", "at": [488, 516], "seg": 10, "locEn": "On the upper abdomen, 6 cun above the centre of the navel, 0.5 cun lateral to the anterior midline."}, {"zh": "步廊", "py": "Bulang", "code": "KI22", "clause": "5.8.22", "loc": "在前胸部，第5肋间隙，前正中线旁开2寸。", "at": [462, 406], "seg": 11, "locEn": "On the front of the chest, in the 5th intercostal space, 2 cun lateral to the anterior midline."}, {"zh": "神封", "py": "Shenfeng", "code": "KI23", "clause": "5.8.23", "loc": "在前胸部，第4肋间隙，前正中线旁开2寸。", "at": [462, 384], "seg": 11, "locEn": "On the front of the chest, in the 4th intercostal space, 2 cun lateral to the anterior midline."}, {"zh": "灵墟", "py": "Lingxu", "code": "KI24", "clause": "5.8.24", "loc": "在前胸部，第3肋间隙，前正中线旁开2寸。", "at": [462, 362], "seg": 11, "locEn": "On the front of the chest, in the 3rd intercostal space, 2 cun lateral to the anterior midline."}, {"zh": "神藏", "py": "Shencang", "code": "KI25", "clause": "5.8.25", "loc": "在前胸部，第2肋间隙，前正中线旁开2寸。", "at": [462, 340], "seg": 11, "locEn": "On the front of the chest, in the 2nd intercostal space, 2 cun lateral to the anterior midline."}, {"zh": "彧中", "py": "Yuzhong", "code": "KI26", "clause": "5.8.26", "loc": "在前胸部，第1肋间隙，前正中线旁开2寸。", "at": [462, 318], "seg": 11, "locEn": "On the front of the chest, in the 1st intercostal space, 2 cun lateral to the anterior midline."}, {"zh": "俞府", "py": "Shufu", "code": "KI27", "clause": "5.8.27", "loc": "在前胸部，锁骨下缘，前正中线旁开2寸。", "at": [462, 300], "seg": 11, "locEn": "On the front of the chest, at the lower edge of the collarbone, 2 cun lateral to the anterior midline."}], "segs": {"1": ["起于小指之下", "从小脚趾下面起。", "It begins beneath the little toe."], "2": ["邪走足心", "斜着走到大脚球后面一点。「邪」就是「斜」。", "Slanting across to the centre of the sole."], "3": ["出于然谷之下", "出到然谷的下面。然谷在内踝前下方，脚内侧那块凸起的骨头下。", "Out below Rangu, under the bony knob on the inner side of the foot, in front of and below the ankle."], "4": ["循内踝之后", "沿着内踝的后面。", "Along behind the inner ankle bone."], "5": ["别入跟中", "分出一支，进到脚跟里。", "A part turns off into the heel."], "6": ["以上踹内", "从这里往上，走小腿肚的内侧。", "From there up the inner side of the calf."], "7": ["出腘内廉", "出到膝盖后面那个窝的内侧边。", "Out at the inner edge of the hollow behind the knee."], "8": ["上股内后廉", "往上沿着大腿内侧靠后的边。", "Up the back edge of the inner thigh."], "9": ["贯脊，属肾，络膀胱", "穿过脊柱，属于肾，络着膀胱。", "Through the spine, belonging to the kidneys, linking with the bladder."], "10": ["其直者，从肾上贯肝膈", "主干从肾往上，穿过肝和膈。", "The main line goes up from the kidneys, through the liver and the diaphragm."], "11": ["入肺中", "进到肺里。", "Into the lungs."], "12": ["循喉咙，挟舌本", "沿着喉咙，夹着舌根。", "Along the throat, beside the root of the tongue."], "13": ["其支者，从肺出络心，注胸中", "一支从肺出来，络着心，注到胸中。", "A branch comes out of the lungs, links with the heart, and pours into the middle of the chest."]}, "page": {"file": "pages/lingshu-yuan-juan3-kidney.jpg", "hl": [0.323, 0, 0.258, 1], "n": 29}, "inner": [{"p": [[428, 1614], [434, 1606], [440, 1598]]}, {"p": [[474, 1212], [482, 1040], [498, 920], [492, 780], [466, 644]]}, {"p": [[466, 644], [470, 770], [500, 866]]}, {"p": [[466, 644], [468, 612], [470, 580]], "mid": true}, {"p": [[534, 644], [504, 604], [470, 580]], "mid": true}, {"p": [[470, 580], [482, 540], [490, 506]], "mid": true}, {"p": [[490, 506], [468, 452], [446, 400]]}, {"p": [[446, 400], [476, 300], [500, 240]]}, {"p": [[500, 240], [500, 204], [500, 170]], "mid": true}, {"p": [[446, 400], [472, 432], [500, 452]]}, {"p": [[500, 452], [500, 418], [500, 384]], "mid": true}], "branch": [], "places": [{"zh": "肾", "en": "kidneys", "kind": "lake", "at": [466, 644], "color": "#2a3a55"}, {"zh": "膀胱", "en": "bladder", "kind": "valley", "at": [500, 866], "mid": true, "color": "#56698a"}, {"zh": "肝", "en": "liver", "kind": "lake", "at": [470, 580], "mid": true, "color": "#45553c"}, {"zh": "膈", "en": "diaphragm", "kind": "place", "at": [490, 506], "mid": true}, {"zh": "肺", "en": "lungs", "kind": "lake", "at": [446, 400], "color": "#5a6266"}, {"zh": "喉咙", "en": "throat", "kind": "place", "at": [500, 240], "mid": true}, {"zh": "舌本", "en": "root of the tongue", "kind": "place", "at": [500, 170], "mid": true}, {"zh": "心", "en": "heart", "kind": "lake", "at": [500, 452], "mid": true, "color": "#a8452c"}, {"zh": "胸中", "en": "middle of the chest", "kind": "place", "at": [500, 384], "mid": true}]}, {"id": "pc", "zh": "手厥阴心包经", "en": "Pericardium channel (hand jueyin)", "color": "#7a4a3a", "text": "心主手厥阴心包络之脉，起于胸中，出属心包络，下膈，历络三焦；其支者，循胸出胁，下腋三寸，上抵腋下，循臑内，行太阴少阴之间，入肘中，下臂，行两筋之间，入掌中，循中指出其端；其支者，别掌中，循小指次指出其端。", "src": "《灵枢·经脉》，元胡氏古林书堂刻本（1339），卷三", "note": "元刻本作「历络三膲」，通行本作「三焦」。「小指次指」是小指旁边那个指头，就是无名指。", "st": [{"zh": "天池", "py": "Tianchi", "code": "PC1", "clause": "5.9.1", "loc": "在前胸部，第4肋间隙，前正中线旁开5寸。", "at": [406, 384], "seg": 5, "locEn": "On the front of the chest, in the 4th intercostal space, 5 cun lateral to the anterior midline.", "find": "找到一侧锁骨，取它的中点。从这里直直往下，到差不多乳头的高度，摸到那里的一条肋缝。在这条肋缝里往外移一个拇指的宽度，手指下的小凹就是天池。", "findEn": "Find one collarbone and take its midpoint. Go straight down from there to about the height of the nipple, and feel for the gap between two ribs. In that gap, move out one thumb-width: the small hollow under your finger is Tianchi."}, {"zh": "天泉", "py": "Tianquan", "code": "PC2", "clause": "5.9.2", "loc": "在臂前侧，腋前纹头下2寸，肱二头肌的长、短头之间。", "at": [348, 428], "seg": 7, "locEn": "On the front of the upper arm, 2 cun below the end of the front armpit fold, between the long and short heads of the biceps.", "find": "一只手臂平举，和肩同高。腋窝前面那块肉，就是胸口连到手臂、能一把捏住的那块。另一只手放到这块肉上，四指并拢，自然弯曲：小指放在靠胸口的那头，食指放在腋窝结束的地方。手的方向不变，整只手顺着手臂往手肘方向平移，让小指落到刚才食指的位置。中指下面差不多就是天泉。摸一摸，稍软稍凹的那一点就是。", "findEn": "Raise one arm to shoulder height. At the front of that armpit there is a piece of flesh you can grab in one pinch, where your chest joins your arm. Put your other hand on it, four fingers together and relaxed: little finger at the chest end, index finger where the armpit ends. Keeping the hand the same way round, slide it along the arm towards the elbow until your little finger is where your index finger was. Tianquan is roughly under your middle finger. Feel around: the slightly soft, slightly hollow spot is it."}, {"zh": "曲泽", "py": "Quze", "code": "PC3", "clause": "5.9.3", "loc": "在肘前侧，肘横纹上，肱二头肌腱的尺侧缘凹陷中。", "at": [330, 600], "seg": 8, "locEn": "On the front of the elbow, on the elbow crease, in the hollow at the ulnar edge of the biceps tendon.", "find": "一只手臂往前伸，掌心朝上，手肘微微弯一点。另一只手托住这只手肘，拇指放在手肘里面那个弯的正中。前面这只手握一下拳，那里会绷起一条硬硬的筋，拇指先摸到它。拇指往小指那边挪一点点，一离开这条筋，就落进紧挨着筋的一个小窝。差不多就是曲泽。摸一摸，稍软稍凹的那一点就是。", "findEn": "Hold one arm out in front, palm up, elbow slightly bent. Cup that elbow with your other hand, thumb in the middle of the inside of the elbow. Make a fist with the outstretched hand: a firm cord stands out there. Find it with your thumb. Move your thumb just a little towards the little-finger side: as soon as it comes off the cord, it drops into a small hollow right beside it. That is roughly Quze. Feel around: the slightly soft, slightly hollow spot is it."}, {"zh": "郄门", "py": "Ximen", "code": "PC4", "clause": "5.9.4", "loc": "在前臂前侧，腕掌侧远端横纹上5寸，掌长肌腱与桡侧腕屈肌腱之间。", "at": [310, 731], "seg": 9, "locEn": "On the front of the forearm, 5 cun above the distal palmar wrist crease, between the tendons of palmaris longus and flexor carpi radialis.", "find": "一只手臂往前伸，掌心朝上，握拳，拳头往身体方向走一点。手腕上会绷起两条筋，中间是一条沟。另一只手的拇指放进这条沟，沿着沟往手肘方向走，走到前臂的正中间，也就是手掌和手腕交界的地方到手肘里面那个弯的一半，再往回退一个拇指宽。差不多就是郄门。摸一摸，稍软稍凹的那一点就是。", "findEn": "Hold one arm out in front, palm up. Make a fist and bring it a little towards your body: two cords stand out at the wrist, with a groove between them. Put the thumb of your other hand in the groove and follow it up towards the elbow, to the middle of the forearm, halfway between where the palm meets the wrist and the inside of the elbow. Then come back one thumb-width. That is roughly Ximen. Feel around: the slightly soft, slightly hollow spot is it."}, {"zh": "间使", "py": "Jianshi", "code": "PC5", "clause": "5.9.5", "loc": "在前臂前侧，腕掌侧远端横纹上3寸，掌长肌腱与桡侧腕屈肌腱之间。", "at": [307, 768], "seg": 9, "locEn": "On the front of the forearm, 3 cun above the distal palmar wrist crease, between the tendons of palmaris longus and flexor carpi radialis.", "find": "一只手臂往前伸，掌心朝上，握拳，拳头往身体方向走一点。手腕上会绷起两条筋，中间是一条沟。另一只手四指并拢，小指放在手掌和手腕交界的地方，其余三指挨着往手肘方向排开。食指压着的那段沟里，差不多就是间使。摸一摸，稍软稍凹的那一点就是。", "findEn": "Hold one arm out in front, palm up. Make a fist and bring it a little towards your body: two cords stand out at the wrist, with a groove between them. Put the four fingers of your other hand together on that wrist: little finger where the palm meets the wrist, the other three lined up beside it towards the elbow. The groove under your index finger is roughly Jianshi. Feel around: the slightly soft, slightly hollow spot is it."}, {"zh": "内关", "py": "Neiguan", "code": "PC6", "clause": "5.9.6", "loc": "在前臂前侧，腕掌侧远端横纹上2寸，掌长肌腱与桡侧腕屈肌腱之间。", "at": [306, 787], "seg": 9, "locEn": "On the front of the forearm, 2 cun above the distal palmar wrist crease, between the tendons of palmaris longus and flexor carpi radialis."}, {"zh": "大陵", "py": "Daling", "code": "PC7", "clause": "5.9.7", "loc": "在腕前侧，腕掌侧远端横纹中，掌长肌腱与桡侧腕屈肌腱之间。", "at": [305, 824], "seg": 9, "locEn": "On the front of the wrist, on the distal palmar wrist crease, between the tendons of palmaris longus and flexor carpi radialis."}, {"zh": "劳宫", "py": "Laogong", "code": "PC8", "clause": "5.9.8", "loc": "在手掌，横平第3掌指关节近端，第2、3掌骨之间偏于第3掌骨。", "at": [316, 872], "seg": 10, "key": "laogong", "locEn": "On the palm, level with the proximal side of the 3rd knuckle, between the 2nd and 3rd metacarpals, closer to the 3rd."}, {"zh": "中冲", "py": "Zhongchong", "code": "PC9", "clause": "5.9.9", "loc": "在手指，中指末端最高点。", "at": [302, 946], "seg": 11, "locEn": "On the middle finger, at the highest point of its tip."}], "segs": {"1": ["起于胸中", "从胸的中间起。", "It begins in the middle of the chest."], "2": ["出属心包络", "出来，属于心包络。", "It comes out and belongs to the pericardium."], "3": ["下膈，历络三焦", "往下穿过膈，一路络着上焦、中焦、下焦。", "Down through the diaphragm, linking in turn with the upper, middle and lower burners."], "4": ["其支者，循胸出胁", "一支沿着胸，从胁部出来。", "A branch runs along the chest and comes out at the side of the ribs."], "5": ["下腋三寸", "在腋下三寸的地方。", "Three cun below the armpit."], "6": ["上抵腋下", "往上到腋下。", "Up to the armpit."], "7": ["循臑内，行太阴少阴之间", "沿着上臂内侧，走在肺经和心经中间。", "Along the inner upper arm, between the lung and heart channels."], "8": ["入肘中", "进到肘窝中间。", "Into the middle of the elbow."], "9": ["下臂，行两筋之间", "往下走前臂，在两条筋中间。", "Down the forearm, between the two tendons."], "10": ["入掌中", "进到掌心。", "Into the centre of the palm."], "11": ["循中指出其端", "沿着中指，出到指尖。", "Along the middle finger, out at its tip."], "12": ["其支者，别掌中，循小指次指出其端", "一支从掌心分出，沿着无名指，出到指尖。", "A branch parts from the palm and runs along the ring finger to its tip."]}, "page": {"file": "pages/lingshu-yuan-juan3-pericardium.jpg", "hl": [0.562, 0, 0.358, 1], "n": 29}, "inner": [{"p": [[500, 384], [512, 410], [522, 440]], "mid": true}, {"p": [[522, 440], [506, 476], [490, 506]], "mid": true}, {"p": [[490, 506], [500, 560], [512, 680], [506, 800]], "mid": true}, {"p": [[500, 384], [452, 392], [406, 384]]}], "branch": [{"p": [[316, 872], [320, 906], [322, 938]]}], "places": [{"zh": "胸中", "en": "middle of the chest", "kind": "place", "at": [500, 384], "mid": true}, {"zh": "心包", "en": "pericardium", "kind": "lake", "at": [522, 440], "mid": true, "color": "#7a4a3a"}, {"zh": "膈", "en": "diaphragm", "kind": "place", "at": [490, 506], "mid": true}, {"zh": "三焦", "en": "sanjiao", "kind": "valley", "at": [506, 800], "mid": true, "color": "#b89a86"}]}, {"id": "te", "zh": "手少阳三焦经", "en": "Sanjiao channel (hand shaoyang)", "color": "#b89a86", "breaks": [15], "text": "三焦手少阳之脉，起于小指次指之端，上出两指之间，循手表腕，出臂外两骨之间，上贯肘，循臑外上肩，而交出足少阳之后，入缺盆，布膻中，散落心包，下膈，循属三焦；其支者，从膻中上出缺盆，上项，系耳后直上，出耳上角，以屈下颊至䪼；其支者，从耳后入耳中，出走耳前，过客主人前，交颊，至目锐眦。", "src": "《灵枢·经脉》，元胡氏古林书堂刻本（1339），卷三", "note": "同一页上，心包经刻作「三膲」，三焦经自己刻作「三焦」。原文跨页：最后「交頰至目銳眥」在下一页。手臂和肩上的站在背面，点「转身」看。", "st": [{"zh": "关冲", "py": "Guanchong", "code": "TE1", "clause": "5.10.1", "loc": "在手指，第4指末节尺侧，指甲根角侧上方0.1寸。", "at": [326, 934], "seg": 1, "l
