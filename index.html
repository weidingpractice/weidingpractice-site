<style>

#corner{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));z-index:30;width:44px;height:44px;border-radius:50%;border:1px solid transparent;background:none;color:var(--muted);cursor:pointer;opacity:0;transition:opacity 2s,border-color .3s}

 padding:calc(64px + env(safe-area-inset-top,0px)) max(22px,env(safe-area-inset-right,0px)) 24px 22px;box-sizing:border-box;overflow:auto}

/* the forest breathes: all lights, one slow rhythm (no words needed) */
@keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}
.light:not(.stone) .halo{animation:breathe 5.5s ease-in-out infinite}

.chg.peek .inner{opacity:.95;stroke-width:4}.chg.peek .lake{opacity:.45}.chg.peek .valley{opacity:.95;stroke-width:4}.chg.peek .place{opacity:1;stroke-width:2.5}.chg.peek .plab{opacity:1}

body.peeking #lights .stone.inpeek .core{fill:#f3d2c6}body.peeking #lights .stone.inpeek .ring{stroke:#e39a84;opacity:1}
#lights .stone.chanstone .core{fill:#7a4a3e}
body.peeking #lights .stone.here .core{fill:#fff;r:8}body.peeking #lights .stone.here .ring{stroke:#fff;stroke-width:3;transform-box:fill-box;transform-origin:center;animation:starpulse 2.2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){body.peeking #lights .stone.here .ring{animation:none}}
#card .orig{margin-top:14px;border-top:1px solid rgba(255,255,255,.08);padding-top:10px}#card .orig .cl{font-size:17px;line-height:1.7;margin:4px 0}

@keyframes starpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}

<script>
const DATA={"poses": [{"id": "chant", "slug": "chanting", "zh": "唱诵", "en": "Chanting", "layer": null, "pts": [["laogong", "felt"]], "cue": "中指放在劳宫，声音立刻变得柔和、轻。", "cueEn": "Rest the middle finger on Laogong, and the voice turns soft and light at once.", "notes": [["2026 年 9 月阴瑜伽教师培训，每次上课前有 10 分钟唱诵。我发现，只要把中指放在劳宫，我的声音立马变得柔和、轻，非常奇妙。", "During the Yin teacher training in September 2026, each class opened with ten minutes of chanting. I found that once I rested my middle finger on Laogong, my voice turned soft and light straight away. It was remarkable."]]}, {"id": "daoist", "slug": "three-part-daoist-breath", "zh": "三段道家呼吸", "en": "Three-part Daoist Breath", "layer": 1, "pts": [], "cue": "一吸一呼，带着手臂、头和背一起动；做 2 分钟或 20 分钟都可以。", "cueEn": "Each breath in and out moves the arms, head and back together; it works for two minutes or twenty.", "notes": [["这是 Austin Ince 在阴瑜伽教师培训里教的一段热身小串联。这个名字在阴瑜伽老师之间通用，最早由谁编排，还没查到。下面是我用自己的话写的步骤。", "A short warm-up sequence Austin Ince teaches in his Yin teacher training. The name is shared among Yin teachers; who first put it together, I have not yet found. The steps below are in my own words."], ["跪坐在脚跟上（金刚坐 Vajrasana）。也可以盘腿坐、坐在椅子上，或者在脚趾蹲（toe squat）里做。", "Kneel and sit on your heels (Vajrasana). You can also sit cross-legged, sit on a chair, or do it in a toe squat."], ["双手放回身体两侧。", "Let the hands rest by your sides."], ["头向后，背微微后弯，双臂举过头顶。", "Take the head back, arch the back a little, and lift the arms overhead."], ["下巴收向胸口，屈肘把双手带到头后，紧接着把双手向两侧推开。两个动作在同一口呼气里完成。", "Chin to chest, bend the elbows to bring the hands behind the head, then straight away push them out to the sides. Both moves happen on the same out-breath."], ["头向后，屈肘让指尖碰到肩膀，胸口上提，让肺吸满。", "Take the head back, bend the elbows so the fingertips touch the shoulders, lift the chest and fill the lungs."], ["下巴收向胸口，掌心向前推；双手往前走的时候，背拱圆。", "Chin to chest, push the palms forward; as the hands travel forward, round the back."], ["头向后，双臂向上伸过头顶，背后弯。", "Take the head back, reach the arms overhead, and arch the back."], ["下巴落下，向前折叠进婴儿式，双臂放在身体两侧的地上。", "Bring the chin down and fold forward into Child's Pose, arms on the floor by your sides."], ["坐起来，在同一口吸气里直接开始下一轮。", "Come up to sitting and begin the next round on the same in-breath."], ["重复 3 到 5 轮，每轮都在婴儿式里结束。最后一次婴儿式，双臂向前伸直，像一次深深的拜伏，可以从这里接别的体式。", "Repeat three to five rounds, ending each in Child's Pose. In the last one, stretch the arms forward like a deep bow; you can flow on into other postures from there."], ["热身，单独练，收尾，冥想之前都可以。", "As a warm-up, as a practice on its own, to close, or before meditation."], ["有一天我连下犬式都做不下去，身体一做就紧张。做了这个小串联，神经系统很快就安静下来。", "One day even Downward Dog felt like too much, and my body tensed at the thought. After this short sequence, my nervous system settled quickly."]]}, {"id": "wrist", "slug": "wrist-circles", "zh": "四足四向手位", "en": "Four hand positions on all fours", "layer": 2, "pts": [["laogong", "felt"]], "cue": "四足，手指朝前、朝外、朝膝盖、两手指尖相对。手放好不动，转的是肩膀和骨盆。", "cueEn": "On all fours, set the fingers forward, then out, then toward the knees, then fingertips facing each other. The hands stay put; what circles is the shoulders and the pelvis.", "notes": [["手放好就不动。每换一个手的方向，肩膀和骨盆在上面转圈，手腕只是被带着换了角度。", "Once the hands are placed, they stay. With each new hand direction, the shoulders and pelvis circle above them; the wrists only change angle because of it."], ["放在劳宫，不放在十个手指上。", "On Laogong, not on all ten fingers."]]}, {"id": "catcow", "slug": "cat-cow", "zh": "猫牛式", "en": "Cat–Cow", "layer": 2, "pts": [["mingmen", "maybe"]], "cue": "", "cueEn": "", "notes": []}, {"id": "hipsway", "slug": "hip-circles", "zh": "四足摆髋 → 绕臀", "en": "Hip sways → circles", "layer": 2, "pts": [["baohuang", "maybe"], ["zhibian", "maybe"]], "cue": "把觉知放在两个半球的当中，很深的那个点。", "cueEn": "Rest your attention deep in the centre of each half of the buttocks.", "notes": [["一般先左右摆，pathway 是先左后右；走顺了以后，自然而然就会去画圈。", "Start by swaying left and right; once the path runs smoothly, you begin to draw circles without trying."], ["画圈的时候，可以把觉知放在耻骨（pubic bone）。耻骨在正中，画正中，连着它的两个半球自然画得更顺。也可以把觉知放在两个半球的当中那两个点：耻骨是它们中间的那个点，两个半球是从它延伸出去的。", "As you circle, you can rest your attention on the pubic bone. It sits at the centre, so when you circle from the centre, the two halves connected to it follow more smoothly. Or rest it on the two points at the centre of each half: the pubic bone is the point between them, and the two halves extend out from it."], ["人是三维的结构。你绕的时候，是一个圆球，不是平面上的圆形；是 3D，不是 2D。所以觉知放在球的当中：两个半球的当中，很深的一个点。不是臀部外侧那块骨头后面的窝，是在内侧。", "The body is three-dimensional. As you circle, you trace a sphere, not a flat circle: 3D, not 2D. So rest your attention at the centre of the sphere, the deep point in the middle of each half of the buttocks. Not the hollow behind the bony point on the outside of the hip; it lies further in."], ["我个人的感觉是：把觉知放在两个半球当中的那两个点，更能激起腰椎的觉知。这完全就是 alignment 了。", "My own feeling: resting attention on the two points at the centre of each half wakes up awareness of the lumbar spine more. That is alignment itself."], ["更多的其实是个意象，不一定要对到哪个穴位。跟人说\"两个半球的当中\"，他会明白。", "It works more as an image than as a point. Tell someone \"the centre of each half\" and they understand."], ["绕臀时感觉最强烈的就是两个半球当中那个很深的点，同时有肠胃的蠕动。", "During the circles, the deep point in the middle of each half feels strongest, and the gut starts to move."]]}, {"id": "thread", "slug": "thread-the-needle", "zh": "穿针式", "en": "Thread the Needle", "layer": 2, "pts": [["dabao", "felt"]], "cue": "让侧肋那一片在动作里铺开。", "cueEn": "Let the side ribs spread out as you move.", "notes": []}, {"id": "sphinx", "slug": "sphinx-seal", "zh": "狮身人面式 → 海豹式", "en": "Sphinx → Seal", "layer": 0, "pts": [["dantian", "felt"], ["qugu", "maybe"], ["baliao", "maybe"], ["shangyang", "felt"]], "cue": "耻骨压向地面，从下丹田吸气，整个脊柱往上延长。", "cueEn": "Press the pubic bone into the floor, breathe in from the lower dantian, and let the whole spine lengthen upward.", "notes": [["狮身人面式后弯不强，可以慢慢练浅浅的逆腹式；海豹式后弯更强，幅度太大，就不练逆腹式。", "Sphinx is a mild backbend, so shallow reverse belly breathing can be practised slowly. Seal bends further; the range is too big for it."], ["我把意识放在食指，也就是大肠经，感觉到肠胃在蠕动。", "I rest my attention in the index finger, on the Large Intestine channel, and I feel my gut start to move."]]}, {"id": "dd", "slug": "downward-dog", "zh": "下犬式", "en": "Downward Dog", "layer": 3, "pts": [["laogong", "felt"], ["yongquan", "felt"], ["yunmen", "felt"], ["kuagen", "felt"]], "cue": "手指间像夹着一根烟的宽度，力线不断。", "cueEn": "Fingers apart by the width of a cigarette; the line of force never breaks.", "notes": [["指间留缝，但缝不大。", "Leave a gap between your fingers, but not a wide one."], ["不用力压平", "Don't press them flat."], ["气从涌泉起，经腿、腰、脊，一路走到手指尖和掌心。手不主动往外推，而是被这条路上来的力带着伸开——这就是顺抽。", "It starts at Yongquan (KI1), the hollow behind the ball of the foot, and travels up through the legs, the lower back and pelvis (yao in Chinese), and on up the spine, all the way to the fingertips and the palms. The hands don't push out by themselves; what rises along this path carries them open. In tai chi this is shun chou, reeling the silk outward."], ["手指和掌心往回吸，力气经手臂、腰、腿，回到涌泉——这就是逆抽。", "Fingers and palms draw in, and the force returns through the arms, the lower back and pelvis, and the legs to Yongquan. This is ni chou, reeling the silk inward."], ["手上不是直线往外伸，而是带一点旋转，像拧。但往哪个方向拧，没有定数：有时往上推，有时往下推，力一直在调整，很精微。手其实没有动，只是力一直在调整。太注重方向，就教条了。", "The hands don't stretch out in a straight line; there is a slight spiral, like a screw. But which way it turns isn't fixed: sometimes you push up, sometimes down, and the force keeps adjusting, very finely. The hands themselves don't move; only the force keeps adjusting. Hold on to a direction and it becomes a rule."], ["怎么知道没有卡住？首先，力是使得上的；然后到肩胛骨这边，不管是上回旋、内回旋还是怎么样，肩窝这块地方是空的，关节不能卡住。感受到肩窝没有被卡住，就可以了。", "How do you know nothing is stuck? First, you feel the force flowing through, unbroken, the way a river runs. Then at the shoulder blade, whether it is rotating upward, inward or any other way, the hollow at the front of the shoulder (around Yunmen, LU2) feels empty. The joint isn't jammed. If you can feel the shoulder hollow isn't stuck, that is enough."], ["抽猛了，力就断；抽得太浅，力又出不来。要做到不猛不断，全程连着。", "Reel too hard and the silk snaps; too lightly and nothing comes. Not forced, not broken, joined all the way through."], ["视线放在双手之间或垫子中间，不往下看；停留短一点，不憋气，下颌放松：牙齿分开，嘴唇轻合。", "Look between your hands or at the middle of the mat, not further down. Stay briefly, keep breathing, and soften the jaw: teeth apart, lips lightly closed."]]}, {"id": "chat", "slug": "chaturanga", "zh": "四柱支撑", "en": "Chaturanga", "layer": 3, "pts": [["laogong", "felt"], ["yunmen", "felt"], ["kuagen", "felt"], ["zhongfu", "maybe"], ["yemen", "maybe"]], "cue": "手指放在地上就可以，注意力放在劳宫的力线上。", "cueEn": "Just place your fingers on the floor and rest your attention on the line from Laogong.", "notes": [["手指放在地上就可以了，但注意力要放在劳宫，放在劳宫的力线上，这样手腕到肩膀的力线就非常顺。", "Just place your fingers on the floor, and rest your attention on Laogong, on the line that runs from it. The line from wrist to shoulder then runs very smoothly."], ["真的不是方向的问题，而是要把觉知放在肩窝，呼吸要到肩窝。可能不只是云门，还有更深一点的点。", "It really isn't about direction. Rest your attention in the shoulder hollow and breathe into it. It may be more than Yunmen; there is a deeper spot too."]]}, {"id": "lunge", "slug": "high-lunge", "zh": "高弓步", "en": "High Lunge", "layer": 4, "pts": [["huantiao", "felt"], ["kuagen", "felt"], ["taibai", "felt"], ["yongquan", "felt"]], "cue": "进入时守环跳，后腿守涌泉。", "cueEn": "Going in, hold Huantiao; in the back leg, hold Yongquan.", "notes": [["觉知放在涌泉，alignment 也有了。", "Rest your attention on Yongquan, and the alignment arrives with it."], ["从高弓步到战士三、到站立扭转，用环跳；从高弓步到战士二，是转臀，觉知放在臀部正中心最深的点。", "From High Lunge to Warrior III, or to a standing twist, use Huantiao. From High Lunge to Warrior II you turn the hips, so rest your attention at the deepest point in the centre of each buttock."]]}, {"id": "prayer", "slug": "prayer-twist", "zh": "合掌扭转", "en": "Prayer Twist", "layer": 4, "pts": [["zhongjiao", "maybe"], ["laogong", "felt"], ["yemen", "felt"]], "cue": "一只手的劳宫贴住另一只手的液门。不用转那么深，呼吸很好。", "cueEn": "Press the Laogong of one hand against the Yemen of the other. No need to twist so deep; the breath is good.", "notes": []}, {"id": "w2tri", "slug": "warrior-2-triangle", "zh": "战士二、三角式", "en": "Warrior II, Triangle", "layer": 4, "pts": [["huantiao", "felt"]], "cue": "留意臀部外后方的那个窝。", "cueEn": "Notice the hollow at the back and outside of the hip.", "notes": []}, {"id": "revtri", "slug": "revolved-triangle", "zh": "三角扭转式", "en": "Revolved Triangle", "layer": 4, "pts": [["laogong", "felt"], ["baliao", "felt"], ["shenque", "felt"], ["mingmen", "maybe"]], "cue": "劳宫放在骶骨上，和前面的肚脐成对。", "cueEn": "Rest Laogong on the sacrum and pair it with the navel in front.", "notes": [["我把手的劳宫放在骶骨上。昨天也试了命门，放命门太高了，会让我的肩膀不舒服。", "I rest the Laogong of my hand on the sacrum. Yesterday I tried Mingmen too; it sits too high and makes my shoulder uncomfortable."], ["放在骶骨上，感觉做的其实是一个呼吸练习，你很平静，你会知道自己的臀部是 aligned，两条腿也在对的方向。", "With the hand on the sacrum, it becomes a breathing practice. You grow calm, and you know your hips are aligned and both legs point the right way."], ["劳宫放在骶骨上面，再和前面的肚脐成对，这样呼吸的时候你就会觉得前后对上了。除了左右，身体还有前后。", "Rest Laogong on the sacrum and pair it with the navel in front; as you breathe, front and back line up. The body has front and back, not only left and right."], ["你可以转得深，也可以转得浅，这跟你的身体条件、练习的时间长度有关。我们练的永远不是幅度，而是觉知、呼吸的深度，呼吸到骶骨。", "You can twist deep or shallow; that depends on your body and how long you have practised. You never practise range. You practise awareness and the depth of the breath, breathing down into the sacrum."]]}, {"id": "skandasana", "slug": "skandasana", "zh": "侧蹲转换", "en": "Warrior II → Skandasana", "layer": 4, "pts": [["baohuang", "maybe"], ["zhibian", "maybe"]], "cue": "转臀下去，把骶骨这块后侧区域拉开。", "cueEn": "Turn the hips as you lower, spreading the back of the sacrum.", "notes": [["Skandasana 是转臀下去，把骶骨这块后侧区域拉开。你只有转，才可以不卡着。", "In Skandasana you turn the hips and lower, opening the back of the sacrum. Only when you turn do you stop getting stuck."]]}, {"id": "standbend", "slug": "standing-backbend", "zh": "站立下轮", "en": "Standing drop-back to Wheel", "layer": 4, "pts": [["yongquan", "felt"], ["taibai", "felt"], ["xinei", "felt"], ["kuagen", "felt"], ["shangjiao", "felt"], ["chongmen", "maybe"], ["qichong", "maybe"]], "cue": "涌泉、太白、膝盖内侧，再到腹股沟前面。", "cueEn": "Yongquan, Taibai, the inner knee, then the front of the groin.", "notes": [["站立下轮的力线是从涌泉到太白到膝盖内侧，再到腹股沟前面的那个穴位。这个力线就有了。", "In a standing drop-back, the line runs from Yongquan to Taibai to the inner knee, then to the point at the front of the groin. The pathway emerges."]]}, {"id": "chair", "slug": "chair-pose", "zh": "幻椅式", "en": "Chair", "layer": 4, "pts": [["dantian", "felt"], ["qihai", "felt"]], "cue": "吸气从下丹田沿脊柱往上。", "cueEn": "Breathe in from the lower dantian and up along the spine.", "notes": []}, {"id": "eagle", "slug": "eagle-arms", "zh": "鹰式手臂缠绕", "en": "Eagle arms", "layer": null, "pts": [["yuji", "felt"]], "cue": "不是掌心相对：下方的手按住上方手的鱼际。", "cueEn": "Instead of pressing palm to palm, let the lower hand press the Yuji point of the upper hand.", "notes": [["手臂缠好以后，我不把两个掌心相对，而是用下方那只手，去按上方那只手的鱼际。", "Once the arms are wrapped, I don't bring the palms together. I use the lower hand to press Yuji on the upper hand."], ["按住鱼际，能明显感觉到呼吸到了上后背，肩胛骨打开，非常明显。", "Pressing Yuji, I clearly feel the breath reach the upper back, and the shoulder blades open."], ["我让学生做这个体式、体会这个穴位，再加上按鱼际这句提示，就能听到学生的呼气明显变长。", "When I teach this pose and ask students to feel this point, adding the cue to press Yuji, I can hear their exhales grow noticeably longer."]]}, {"id": "w3", "slug": "warrior-3", "zh": "战士三、扭转半月", "en": "Warrior III, Revolved Half Moon", "layer": 5, "pts": [["kuagen", "felt"], ["yongquan", "felt"], ["taibai", "felt"]], "cue": "支撑脚守涌泉，后腿守太白，两个点同时在。", "cueEn": "Hold Yongquan in the standing foot and Taibai in the back leg, both at once.", "notes": []}, {"id": "tree", "slug": "tree-pose", "zh": "树式", "en": "Tree", "layer": 5, "pts": [["yongquan", "felt"], ["xinei", "felt"], ["yunmen", "felt"]], "cue": "脚心是水，大腿内侧是土，肩窝是金。", "cueEn": "The sole is water, the inner thigh is earth, the shoulder hollow is metal.", "notes": []}, {"id": "frog", "slug": "frog", "zh": "青蛙式", "en": "Frog", "layer": 2, "pts": [["xinei", "felt"], ["kuagen", "felt"]], "cue": "额头或下巴落地，头可以转向一边，不挤压脖子。意放在膝盖内侧和腹股沟的窝。", "cueEn": "Rest the forehead or chin down, or turn the head to one side so the neck is not squeezed. Rest your attention on the inner knee and the hollow of the groin.", "notes": [["有一天，一低头就感觉头部胀，心里慌，做不了倒立。身体自己想做婴儿式，额头压着印堂左右轻轻晃，然后自动进了青蛙式。膝盖内侧和腹股沟的窝最明显，脚内侧也有感觉，是一整条力线。头转向一边，不挤压脖子，停留 2 到 3 分钟，然后身体往前趴一点，很舒服。", "One day, every time I lowered my head, my head felt full and pressured and I felt panicky inside; inversions were out. My body wanted Child's Pose: forehead on Yintang, rolling gently side to side, and then it moved into Frog on its own. The inner knee and the groin hollow were clearest; the inner foot too, one whole line. Head turned to one side so the neck was free, two to three minutes, then a little forward. It felt good."], ["我感觉到的线：脚内侧 → 小腿内侧 → 膝盖内侧 → 大腿内侧 → 腹股沟的窝。《灵枢》的脾经：从大脚趾内侧起，过内踝前，沿胫骨后上行，经膝和大腿内侧前缘，入腹。Myers 的深前线：足底深层、小腿深层、膝内侧、内收肌、骨盆。三条线落在同一片区域，这是我身体里感受到的巧合。大腿内侧并排走着脾、肝、肾三条经，我感觉到的是哪一条，还要再分辨。", "The line I felt: inner foot, inner calf, inner knee, inner thigh, the groin hollow. The Spleen channel in the Lingshu: from the inside of the big toe, in front of the inner ankle, up behind the shin, along the front edge of the inner knee and thigh, into the belly. Myers's Deep Front Line: deep sole, deep calf, inner knee, adductors, pelvis. The three lines meet in one region: a coincidence I felt in my own body. Three channels run side by side up the inner thigh; which one I felt, I still have to tell apart."]]}, {"id": "saddle", "slug": "saddle", "zh": "鞍式", "en": "Saddle Pose", "layer": 1, "pts": [["xinei", "felt"]], "cue": "感受膝盖内侧没有挤压，体会滋养的感受。", "cueEn": "Feel that the inner knee is not squeezed, and notice the sense of nourishment there.", "notes": [["我大腿前侧非常紧，所以每天都做。往下躺的时候，躺在抱枕上，减少后弯的幅度。", "The fronts of my thighs are very tight, so I do it every day. When I lie back, I lie on a bolster to make the backbend smaller."], ["很多人觉得这个体式伤膝盖。我的做法是：在膝盖正常的活动范围（range of movement）里做。", "Many people think this pose hurts the knees. My way is to stay within the knee's normal range of movement."], ["拉伸的是从脚背开始的整个身体前侧：大腿前侧、hips 前侧；手臂打开，作用到肩膀前侧；头往后仰，颈椎、甚至额头都在里面。", "It stretches the whole front of the body, from the tops of the feet: the front thighs, the front of the hips. Open your arms and it reaches the front of the shoulders; tip your head back and it reaches the neck, even the forehead."], ["感受膝盖内侧没有挤压，体会滋养的感受。", "Feel that the inner knee is not squeezed, and notice the sense of nourishment there."], ["传统教法是两膝之间一个拳头的距离。下去时特别不舒服，可以加到两个、甚至三个拳头。改变的只是长度：你的身体前侧要 travel 的那段长度，和每个人的身体条件有关。", "Traditionally you keep one fist between the knees. If going down feels very uncomfortable, widen it to two or even three fists. You change only the length: how far the front of your body travels, which depends on each body."], ["吃完饭我做的第一个练习就是鞍式。我饭后做，感觉肠胃在动。", "Saddle is the first thing I practise after eating. When I do, I feel my gut moving."]]}, {"id": "butterfly", "slug": "butterfly", "zh": "蝴蝶式", "en": "Butterfly", "layer": 1, "pts": [["yongquan", "felt"]], "cue": "手心落在脚心上。", "cueEn": "Rest the palms on the soles.", "notes": []}, {"id": "bridge", "slug": "bridge", "zh": "桥式", "en": "Bridge", "layer": 0, "pts": [["kuagen", "felt"], ["dantian", "felt"], ["xiajiao", "maybe"], ["shangjiao", "maybe"], ["mingmen", "maybe"]], "cue": "", "cueEn": "", "notes": []}, {"id": "child", "slug": "childs-pose", "zh": "婴儿式", "en": "Child's Pose", "layer": 2, "pts": [["yintang", "felt"]], "cue": "额头点地，慢慢左右转动额头。", "cueEn": "Rest your forehead on the floor and roll it slowly from side to side.", "notes": [["头部有压力的这几天，在婴儿式里额头点地，慢慢转动额头，头觉得轻了一些。", "On days when my head felt pressure, resting my forehead on the floor in Child's Pose and rolling it slowly my head felt a little lighter."], ["正中是印堂；往两边转，压过眉毛上方的阳白（胆经），再往外接近太阳穴。额头往上一点，是神庭、上星（督脉）。", "At the centre, Yintang; rolling to either side passes over Yangbai above the eyebrows (Gallbladder channel) and towards the temples. A little higher on the forehead lie Shenting and Shangxing (Governing Vessel)."]]}, {"id": "palming", "slug": "palming", "zh": "劳宫捂眼", "en": "Palming with Laogong", "layer": null, "pts": [["laogong", "felt"]], "cue": "双手搓热，掌心劳宫轻轻盖在闭着的眼睛上，停一分钟，不压。", "cueEn": "Rub your palms warm and rest Laogong lightly over your closed eyes for a minute, without pressing.", "notes": [["练完以后；也可以在下犬式、犁式这类头朝下的体式之后，或者看屏幕很久以后。", "After practice; also after head-down poses such as Downward Dog and Plough, or after long screen time."], ["手掌微微拱起，掌根落在颧骨上，掌心对着眼睛，不碰眼球。眼睛在掌心的暗处休息。", "Cup the palms slightly, heels of the hands on the cheekbones, the hollow of each palm over an eye without touching the eyeball. Let the eyes rest in the dark."], ["劳宫能让唱诵的声音变柔和；看看它能不能让眼睛也柔和下来：眼睛后面的压力、太阳穴的紧，有没有松一点。没有变化也记下来。", "Laogong softens the voice in chanting; see whether it softens the eyes too: the pressure behind them, the tightness at the temples. If nothing changes, write that down too."]]}, {"id": "chintuck", "slug": "chintuck", "zh": "收下巴", "en": "Chin tuck", "layer": null, "pts": [["dazhui", "felt"], ["fengfu", "felt"]], "cue": "从大椎沿着一条线，一直到风府。", "cueEn": "One line from Dazhui all the way up to Fengfu.", "notes": [["怎么做。 平躺，膝盖弯曲，头下不垫，或只垫一条薄毛巾。轻轻点头，像在说「嗯」：下巴往喉咙方向收，后脑勺贴着地面往上拉长。手指摸着脖子两侧，那两条大肌肉不绷紧。停 5 到 10 秒，放松。做几次。", "How to do it. Lie on your back, knees bent, no pillow or just a thin towel. Nod gently, as if saying \"mm\": draw the chin towards the throat and let the back of the head lengthen up along the floor. Keep your fingers on the two big muscles at the sides of the neck; they stay soft. Hold 5 to 10 seconds, then let go. A few times."], ["幅度很小。 是「收」，不是低头。全程不应该痛；手臂发麻、头晕，就停下。", "A very small movement. It is a tuck, not a bow of the head. It should never hurt; if your arm goes numb or you feel dizzy, stop."], ["放在哪里。 热身里：肩 → 收下巴 → 头部转动 → 侧倾 → 脊柱。融心式（下巴点地）待得久之后：躺下做几次，短，浅。", "Where it goes. In the warm-up: shoulders → chin tuck → head movements → side bends → spine. After a long Melting Heart with the chin on the floor: lie down and do a few, short and shallow."], ["2026-11-20，第一次。 从大椎沿着一条线一直到风府，很明显。感觉一开始是从很像心脏那块地方，很深沉地升上来。", "20 November 2026, the first time. From Dazhui, one clear line all the way up to Fengfu. At first it felt as if it rose, deep and slow, from somewhere like the heart."]]}], "pts": {"baliao": {"zh": "八髎", "py": "Baliao", "code": "BL31–34", "en": "Eight Crevices", "find": "站着，双手叉腰，拇指在后。拇指往后、往中间滑，碰到脊柱。拇指不动，手掌往下翻，贴着后腰。中指往下的这一片就是骶部，八髎都在里面。", "findEn": "Stand with hands on hips, thumbs behind. Slide the thumbs back and in until they meet the spine. Keep the thumbs there and turn the palms down onto the lower back. The area under your middle fingers and below is the sacrum; the eight Baliao points are all in it.", "slug": "baliao"}, "baohuang": {"zh": "胞肓", "py": "Baohuang", "code": "BL53", "en": "Bladder Vitals", "find": "站着。先找腰窝：后腰最下面，脊柱两边各有一个小凹窝。右手放到背后，手指朝下，手掌贴在屁股上半部、靠外边。手往上挪，让手腕这一头和腰窝一样高。手掌最上面靠外的这一片，胞肓就在里面。", "findEn": "Stand. First find the dimples: at the very bottom of your lower back there is a small hollow on each side of the spine. Put your right hand behind you, fingers pointing down, palm on the upper, outer part of the buttock. Move the hand up until the wrist end is level with the dimples. Baohuang lies in the area at the top outer corner of your palm.", "slug": "baohuang"}, "chongmen": {"zh": "冲门", "py": "Chongmen", "code": "SP12", "en": "Surging Gate", "find": "半躺或平躺，腿伸直。右手食指和中指并拢，放在右边大腿根的折痕上，从外侧骨盆那块骨头旁边开始。沿折痕慢慢往里、往下移，找到一跳一跳的地方。从跳的地方往外挪一个手指宽，还在折痕里。", "findEn": "Lie back, legs straight. Put your right index and middle fingers together on the crease at the top of your right thigh, beside the hip bone. Slide along the crease, inward and down, until you feel a beat. Then move one finger-width outward, still in the crease.", "slug": "chongmen"}, "dabao": {"zh": "大包", "py": "Dabao", "code": "SP21", "en": "Great Embracement", "find": "坐着，左手臂举过头顶。右手手掌横放，手指并拢，食指一边贴着左腋窝正中。往下量两个手掌宽。用中指指肚在那里摸，会摸到两根骨头之间的一道软缝，就是这一片。", "findEn": "Sit and raise your left arm over your head. Lay your right hand flat and sideways, fingers together, index-finger edge against the middle of your left armpit. Measure down two hand-widths. Feel there with the pad of your middle finger: a soft groove between two ribs. That is the place.", "slug": "dabao"}, "dantian": {"zh": "丹田", "py": "Dantian", "code": "Area", "en": "Lower Dantian", "find": "手掌横放在肚脐下面，掌心对着小腹。手掌盖住的这一片，就是下丹田。它不是一个点，是一片区域。", "findEn": "Lay your palm across your belly just below the navel. The area under your hand is the lower dantian. It is an area, not a point.", "slug": "dantian"}, "huantiao": {"zh": "环跳", "py": "Huantiao", "code": "GB30", "en": "Jumping Circle", "find": "左侧躺，下面的腿伸直，上面的右腿屈髋屈膝。右手摸到屁股外侧最凸的那块骨头。右手拇指第一个关节的横纹压在这块骨头最高点上，拇指尖朝脊柱。拇指尖落下的地方就是。", "findEn": "Lie on your left side, lower leg straight, right leg bent at hip and knee. With your right hand, find the most prominent bone on the outside of your hip. Press the crease of your thumb's first joint on its highest point, thumb tip pointing to the spine. Where the thumb tip lands is the point.", "slug": "huantiao"}, "kuagen": {"zh": "胯根", "py": "Kua root", "code": "Area", "en": "Kua root · inner groin", "find": "坐着，屈膝，膝盖往外打开。同侧手的中指放进大腿根和小腹相连的那条折痕。手掌盖住的这一片就是胯根。中指往深处轻轻探，会摸到一条往下凹的槽。", "findEn": "Sit with your knee bent and dropped open to the side. Lay the middle finger of the same-side hand in the crease where the thigh meets the belly. The area under your palm is the kua root. Let the middle finger feel gently deeper: there is a groove that dips down.", "slug": "kuagen"}, "laogong": {"zh": "劳宫", "py": "Laogong", "code": "PC8", "en": "Palace of Toil", "find": "轻轻握拳，中指尖碰到掌心的地方。", "findEn": "Make a loose fist: where the tip of your middle finger meets the palm.", "slug": "laogong"}, "mingmen": {"zh": "命门", "py": "Mingmen", "code": "GV4", "en": "Gate of Life", "find": "先找到肚脐。从肚脐正对着往后，到后腰脊柱的正中。用中指指肚摸，正对的地方有一个凹陷。", "findEn": "Find your navel first. Go straight back from it to the middle of the spine in your lower back. Feel with the pad of your middle finger: right there is a small hollow.", "slug": "mingmen"}, "qichong": {"zh": "气冲", "py": "Qichong", "code": "ST30", "en": "Surging Qi", "find": "平躺。中指从肚脐沿中线往下滑，滑到下腹最下面那块横着的硬骨，停在它上边。食指、中指、无名指并拢竖放，从这里往外量三个手指宽。那里能摸到一跳一跳的，就是。", "findEn": "Lie on your back. Slide your middle finger down the midline from the navel to the hard crosswise bone at the bottom of the belly, and stop on its upper edge. Put the index, middle and ring fingers together, pointing up and down, and measure three finger-widths out from there. Where you feel a beat is the point.", "slug": "qichong"}, "qihai": {"zh": "气海", "py": "Qihai", "code": "CV6", "en": "Sea of Qi", "find": "食指和中指并拢，放在肚脐正下方，两指的下沿。", "findEn": "Two fingers together just below the navel: the point is at their lower edge.", "slug": "qihai"}, "qugu": {"zh": "曲骨", "py": "Qugu", "code": "CV2", "en": "Curved Bone", "find": "中指从肚脐沿着中线往下滑。滑到下腹最下面那块横着的硬骨。它上边缘的正中间。", "findEn": "Slide your middle finger down the midline from the navel. Stop at the hard bone at the bottom of the belly. The centre of its upper edge.", "slug": "qugu"}, "shangjiao": {"zh": "上焦", "py": "Shangjiao", "code": "Area", "en": "Upper jiao", "find": "手掌平放在胸骨上，两乳之间。手掌盖住的胸腔这一片，就是上焦。", "findEn": "Lay your palm flat on your breastbone, between the breasts. The chest under your hand is the upper jiao.", "slug": "shangjiao"}, "shangyang": {"zh": "商阳", "py": "Shangyang", "code": "LI1", "en": "Shang Yang", "find": "食指伸直，指甲朝上。看指甲靠大拇指那一边、靠近手指根的那个角。同一只手的拇指指甲尖，放在这个角外面紧挨着的地方，不压在指甲上。", "findEn": "Straighten your index finger, nail up. Look at the corner of the nail on the thumb side, nearest the base of the finger. Put the tip of the thumbnail of the same hand just outside that corner const cv=$('#woods'),cx=cv.getContext('2d');let W,H,trees=[],motes=[];const rnd=(a,b)=>a+Math.random()*(b-a);

 trees.sort((a,b)=>a.L-b.L);motes=Array.from({length:Math.round(W*H/22000)},()=>({x:rnd(0,W),y:rnd(0,H),r:rnd(.4,1.3),v:rnd(.04,.18),p:Math.random()*6}))}
function drawWoods(t){const g=cx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0e1a18');g.addColorStop(.6,'#0b1312');g.addColorStop(1,'#070c0b');cx.fillStyle=g;cx.fillRect(0,0,W,H);

 for(let i=0;i<4;i++){const y=H*(.3+i*.17)+Math.sin(t*.12+i)*12;const fg=cx.createLinearGradient(0,y-80,0,y+80);fg.addColorStop(0,'rgba(201,214,207,0)');fg.addColorStop(.5,`rgba(201,214,207,${.05-i*.008})`);fg.addColorStop(1,'rgba(201,214,207,0)');cx.fillStyle=fg;cx.fillRect(0,y-80,W,160)}
 for(const m of motes){if(!reduce){m.y-=m.v;m.x+=Math.sin(t+m.p)*.1;if(m.y<-4){m.y=H+4;m.x=rnd(0,W)}}cx.fillStyle='rgba(201,214,207,.22)';cx.beginPath();cx.arc(m.x,m.y,m.r,0,6.3);cx.fill()}

 const stones=c.st.map((s,i)=>s.key&&LIGHT[s.key]?null:stone(c.id+i,s.at[0],s.at[1],`${s.zh} ${s.py||''} ${s.code}`,{'data-chan':c.id,'data-i':i}));
 const mstones=c.mid?[]:c.st.map((s,i)=>s.key&&LIGHT[s.key]?null:stone(c.id+'m'+i,1000-s.at[0],s.at[1],`${s.zh} ${s.py||''} ${s.code}`,{'data-chan':c.id,'data-i':i,'aria-hidden':'true',tabindex:'-1'}));

 if(!text.querySelector('.back')){text.insertAdjacentHTML('afterbegin','<button class="back chip" type="button" style="position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px));font:inherit;color:var(--ink);background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer">回到林子 · Back to the forest</button>');
  text.querySelector('.back').onclick=()=>{text.classList.add('sr');text.style.cssText='';corner.focus()}}
 text.querySelectorAll('a').forEach(a=>{a.target='_blank';a.rel='noopener';a.style.color='var(--ink)'});text.querySelector('.back').focus()};

let idleT;function idleReset(){$('#idle').classList.remove('on');clearTimeout(idleT);if(touched.size<2)idleT=setTimeout(()=>$('#idle').classList.add('on'),7000)}
addEventListener('pointerdown',idleReset);

/* 11-20: the lights next to this one on the body (the map is the body), for 「想找的是旁边的？」 */
window.__LIGHTXY=()=>Object.fromEntries(Object.keys(LIGHT).filter(x=>DATA.pts[x]).map(x=>[x,{x:LIGHT[x].x,y:LIGHT[x].y,zh:DATA.pts[x].zh,py:DATA.pts[x].py,slug:DATA.pts[x].slug||x}]));
window.FF_NEAR=k=>{if(window.__NEAR)return (window.__NEAR[k]||[]).filter(x=>LIGHT[x.k]);const L=LIGHT[k];if(!L)return [];return Object.keys(LIGHT).filter(x=>x!==k&&DATA.pts[x]).map(x=>[x,Math.hypot(LIGHT[x].x-L.x,LIGHT[x].y-L.y)]).sort((a,b)=>a[1]-b[1]).slice(0,3).map(([x])=>({k:x,zh:DATA.pts[x].zh,py:DATA.pts[x].py,slug:DATA.pts[x].slug||x}))};
function arrive(){$('#map').classList.add('on');corner.classList.add('on');
 const h0=location.hash.slice(1);if(h0)setTimeout(()=>{STACK=[h0];if(route(h0))try{history.replaceState({f:1},'','#'+h0)}catch(x){}},reduce?0:900);
 const ks=Object.keys(LIGHT).sort((a,b)=>LIGHT[b].y-LIGHT[a].y);ks.forEach((k,i)=>{const g=LIGHT[k].g;g.style.opacity=0;g.style.transition='opacity 1.4s';setTimeout(()=>g.style.opacity=1,reduce?0:400+i*90)});
 if(!touched.size&&LIGHT.laogong){LIGHT.laogong.g.classList.add('invite');setTimeout(()=>{if(!touched.size)$('#idle').classList.add('on')},reduce?0:2200)}else idleReset()}
const entry=document.getElementById('entry');
function leave(){if(!entry||entry.classList.contains('out'))return;entry.classList.add('out');if(window.__entryStop)setTimeout(window.__entryStop,1900);setTimeout(()=>entry.remove(),1900);arrive()}
window.__entryGo=leave;
let seen=false;try{seen=sessionStorage.getItem('forest-entered')==='1'}catch(e){}
if(!entry||seen){if(entry)entry.remove();arrive()}
else{const gate=document.getElementById('gate');new MutationObserver(()=>{if(gate.classList.contains('on'))setTimeout(leave,600)}).observe(gate,{attributes:true,attributeFilter:['class']})}
})();

// 「找到了吗」之后：接住一片飘来的叶子。只记次数：不记名字、不记 IP、不用 cookie。
// Used on point pages (via ticks-client.js) and in the forest. Any element <div data-ff="pointkey"></div> is mounted automatically.
(function(){
  if(window.FoundFlow)return;
  var API=document.documentElement.getAttribute('data-ticks')||window.__TICKS||'';
  var FELT=[['warm','热了','Warm'],['soft','松了','Softer'],['tingle','有点麻','Tingling'],['sink','沉下去','Sinking'],['move','想动','Engaged'],['none','没感觉','Nothing yet']];
  var STUCK=[['where','不确定是这里',"Not sure it's here"],['step','有一步不懂','A step is unclear'],['reach','够不到',"Can't reach"]];
  var STUCK_AT={laogong:[['nails','指甲太长','Long nails']]};  // only where it really happens
  function stuckFor(k){return STUCK.concat(STUCK_AT[k]||[])}
  // the forest has a 中文/English switch (body.zh / body.en, spans .z/.e); point pages show Chinese with English beneath
  function forest(){return document.body.classList.contains('zh')||document.body.classList.contains('en')}
  function T(z,e,inline){return forest()?'<span class="z">'+z+'</span><span class="e">'+e+'</span>':(inline?z+' · '+e:z+'<span class="ff-en">'+e+'</span>')}
  function INP(found){return '<div class="ff-in"><b>'+(found?T('一起捡叶子？','Meet up?'):T('哪天一起找？','Find it together?'))+'</b> <a href="inperson.html">'+T('当面','In person',1)+' →</a></div>'}
  // 11-20: 「不确定是这里」 → the lights next door on the body (forest: window.FF_NEAR; point pages: data-near from the build)
  function NEARBY(el,k){var L=window.FF_NEAR?window.FF_NEAR(k):(function(){try{return JSON.parse(el.getAttribute('data-near')||'[]')}catch(e){return []}})();if(!L.length)return '';
    return '<div class="ff-near"><p><b>'+T('想找的是旁边的？','Maybe the one next door?')+'</b></p><div class="ff-drift">'+L.map(function(x){
      return window.FF_NEAR?'<button type="button" class="chip" data-pt="'+esc(x.k)+'">'+T(esc(x.zh),esc(x.py),1)+'</button>':'<a class="ff-nb" href="'+esc(x.slug)+'.html">'+T(esc(x.zh),esc(x.py),1)+' →</a>'}).join('')+'</div></div>'}
  var CSS='.ff{display:flex;flex-direction:column;gap:10px;margin-top:12px}.ff[hidden]{display:none}.ff p{margin:0}'+
    '.ff-en{display:block;color:var(--muted,#5d6b6b);font-size:13px;font-weight:400}'+
    '.ff-q{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.ff-q b{font-weight:600}'+
    '.ff button{font:inherit;font-size:14px;border-radius:999px;border:1px solid var(--line,#dfe3df);background:transparent;color:inherit;padding:5px 13px;cursor:pointer}'+
    '.ff-done{color:var(--water,#1f6f6a);font-size:14px}'+
    '.ff-drift{display:flex;flex-wrap:wrap;gap:8px}'+
    '.ff .ff-chip{border:none;background:rgba(60,150,140,.16);color:inherit;padding:6px 12px;animation:fffloat 5s ease-in-out infinite}'+
    '.ff .ff-chip:nth-child(2n){animation-delay:-1.6s}.ff .ff-chip:nth-child(3n){animation-delay:-3.1s}'+
    '.ff-chip i{font-style:normal;font-size:12px;color:var(--muted,#5d6b6b);margin-left:6px}'+
    '.ff-stuck .ff-chip{background:rgba(190,90,60,.16)}'+
    '.ff .ff-chip.on{background:#1f6f6a;color:#fff;animation:none}.ff-chip.on i{color:#fff}'+
    '@keyframes fffloat{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-3px) rotate(-1deg)}}'+
    '@media (prefers-reduced-motion:reduce){.ff .ff-chip{animation:none}}'+
    '.ff-say{font-size:13px;color:var(--water,#1f6f6a)}'+
    '.ff-in{background:rgba(60,150,140,.12);border-radius:12px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;font-size:14px}.ff-in a{color:var(--water,#1f6f6a)}.ff-in .ff-en{display:inline;margin-left:4px}.ff-near{display:flex;flex-direction:column;gap:8px}.ff-nb{color:var(--water,#1f6f6a);font-size:14px;padding:4px 0;margin-right:12px}'+
    '.ff-links{display:flex;flex-wrap:wrap;gap:6px 16px}.ff-links a{color:var(--water,#1f6f6a)}'+
    '.ff-mail{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.ff-mail code{font-size:12.5px;user-select:all;background:transparent;border:1px solid var(--line,#dfe3df);border-radius:6px;padding:1px 7px}.ff-mail .ff-copy{font-size:12px;padding:2px 10px}';
  function css(){if(document.getElementById('ff-css'))return;var s=document.createElement('style');s.id='ff-css';s.textContent=CSS;document.head.appendChild(s)}
  function get(k){try{return localStorage.getItem(k)}catch(e){return null}}
  function put(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  function tick(id){return fetch(API+'/tick',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:id})}).then(function(r){if(!r.ok)throw 0;return r.json()})}
  function counts(ids){return fetch(API+'/counts?ids='+ids.join(',')).then(function(r){if(!r.ok)throw 0;return r.json()}).catch(function(){return {}})}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function chips(k,list,cls,c){return '<div class="ff-drift '+cls+'">'+list.map(function(x){var id='leaf-'+k+'-'+x[0],on=get('leaf:'+k+':'+x[0])==='1',n=c[id]||0;
    return '<button type="button" class="ff-chip'+(on?' on':'')+'" data-c="'+x[0]+'"'+(on?' aria-pressed="true" disabled':'')+'>'+T(esc(x[1]),esc(x[2]),1)+(n?'<i>'+n+'</i>':'')+'</button>'}).join('')+'</div>'}
  function after(el,k,a){
    var list=a==='yes'?FELT:stuckFor(k),ids=list.map(function(x){return 'leaf-'+k+'-'+x[0]});if(a==='yes')ids.push('find-'+k+'-yes');
    counts(ids).then(function(c){
      var head;
      if(a==='yes'){var n=Math.max(0,(c['find-'+k+'-yes']||1)-1);
        head='<p class="ff-done">✓ '+(n?T('你和另外 '+n+' 人找到了','Found, with '+n+' others'):T('找到了','Found'))+'</p><p><b>'+T('有什么感觉？','What do you feel?')+'</b></p>';
      }else head='<p><b>'+T('卡在哪？','Stuck where?')+'</b></p>';
      var caught=list.some(function(x){return get('leaf:'+k+':'+x[0])==='1'});
      el.innerHTML=head+chips(k,list,a==='yes'?'ff-felt':'ff-stuck',c)+(a==='no'&&get('leaf:'+k+':where')==='1'?NEARBY(el,k):'')+(caught?INP(a==='yes'):'');
    });
  }
  function ask(el,k){
    el.innerHTML='<div class="ff-q"><b>'+T('找到了吗？','Found it?',1)+'</b> <button type="button" data-a="yes">'+T('✓ 找到了','✓ Yes',1)+'</button> <button type="button" data-a="no">'+T('没找到','Not yet',1)+'</button></div>';
  }
  function mount(el){
    if(el.__ff)return;el.__ff=1;var k=el.getAttribute('data-ff');if(!API||!/^[a-z0-9-]{1,40}$/.test(k))return;css();el.classList.add('ff');
    var a=get('found:'+k);if(a==='yes'||a==='no')after(el,k,a);else ask(el,k);el.hidden=false;
    el.addEventListener('click',function(e){
      var b=e.target.closest('button');if(!b||b.disabled)return;
      if(b.hasAttribute('data-a')){var ans=b.getAttribute('data-a');[].forEach.call(el.querySelectorAll('button'),function(x){x.disabled=true});
        tick('find-'+k+'-'+ans).then(function(){put('found:'+k,ans);after(el,k,ans)}).catch(function(){[].forEach.call(el.querySelectorAll('button'),function(x){x.disabled=false})});return}
      if(b.classList.contains('ff-chip')){var c=b.getAttribute('data-c');b.disabled=true;
        tick('leaf-'+k+'-'+c).then(function(x){put('leaf:'+k+':'+c,'1');b.classList.add('on');b.setAttribute('aria-pressed','true');
          var i=b.querySelector('i');if(!i){i=document.createElement('i');b.appendChild(i)}i.textContent=x.count;
          try{el.dispatchEvent(new CustomEvent('ff-caught',{bubbles:true,detail:{k:k,c:c,kind:b.closest('.ff-stuck')?'stuck':'felt'}}))}catch(x){}
          if(c==='where'&&!el.querySelector('.ff-near')){var nb=NEARBY(el,k);if(nb)el.querySelector('.ff-drift').insertAdjacentHTML('afterend',nb)}
          if(!el.querySelector('.ff-in'))el.insertAdjacentHTML('beforeend',INP(!b.closest('.ff-stuck')));
        }).catch(function(){b.disabled=false});return}
      if(b.classList.contains('ff-copy')){var t='hello@weidingpractice.com';
        (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){b.textContent='已复制 · Copied'}).catch(function(){var r=document.createRange();r.selectNodeContents(el.querySelector('.ff-mail code'));var s=getSelection();s.removeAllRanges();s.addRange(r)})}
    });
  }
  function scan(root){[].forEach.call((root||document).querySelectorAll('[data-ff]'),mount)}
  window.FoundFlow={mount:mount,scan:scan};
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',function(){scan()});else scan();
  if(window.MutationObserver)new MutationObserver(function(){scan()}).observe(document.documentElement,{childList:true,subtree:true});
})();

</script>
