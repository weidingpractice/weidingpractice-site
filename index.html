": "足厥阴肝经", "en": "Liver channel (foot jueyin)", "color": "#45553c", "text": "肝足厥阴之脉，起于大指丛毛之际，上循足跗上廉，去内踝一寸，上踝八寸，交出太阴之后，上腘内廉，循股阴，入毛中，过阴器，抵小腹，挟胃，属肝，络胆，上贯膈，布胁肋，循喉咙之后，上入颃颡，连目系，上出额，与督脉会于巅；其支者，从目系下颊里，环唇内；其支者，复从肝别贯膈，上注肺。", "src": "《灵枢·经脉》，元胡氏古林书堂刻本（1339），卷三", "note": "小腿下段肝经走在脾经前面，到踝上八寸交到脾经后面。最后一支「上注肺」，回到肺经起头的地方，十二经走完一圈。", "st": [{"zh": "大敦", "py": "Dadun", "code": "LR1", "clause": "5.12.1", "loc": "在足趾，大趾末节外侧，趾甲根角侧后方0.1寸。", "at": [470, 1610], "seg": 1, "locEn": "On the big toe, on the outer side of the last segment, 0.1 cun beside and behind the corner at the base of the nail."}, {"zh": "行间", "py": "Xingjian", "code": "LR2", "clause": "5.12.2", "loc": "在足背，第1、2趾间，趾蹼缘后方赤白肉际处。", "at": [466, 1590], "seg": 2, "locEn": "On the top of the foot, between the 1st and 2nd toes, just behind the edge of the web, at the border of the red and white skin."}, {"zh": "太冲", "py": "Taichong", "code": "LR3", "clause": "5.12.3", "loc": "在足背，第1、2跖骨间，跖骨底结合部前方凹陷中，或触及动脉搏动。", "at": [464, 1568], "seg": 2, "locEn": "On the top of the foot, between the 1st and 2nd metatarsals, in the hollow in front of where their bases meet; the artery may be felt there."}, {"zh": "中封", "py": "Zhongfeng", "code": "LR4", "clause": "5.12.4", "loc": "在踝前内侧，足内踝前，胫骨前肌肌腱的内侧缘凹陷中。", "at": [464, 1492], "seg": 3, "locEn": "On the front and inner side of the ankle, in front of the inner ankle bone, in the hollow at the inner edge of the tibialis anterior tendon."}, {"zh": "蠡沟", "py": "Ligou", "code": "LR5", "clause": "5.12.5", "loc": "在小腿前内侧，内踝尖上5寸，胫骨内侧面的中央。", "at": [458, 1340], "seg": 4, "locEn": "On the front and inner side of the lower leg, 5 cun above the tip of the inner ankle bone, at the centre of the inner surface of the shinbone."}, {"zh": "中都", "py": "Zhongdu", "code": "LR6", "clause": "5.12.6", "loc": "在小腿前内侧，内踝尖上7寸，胫骨内侧面的中央。", "at": [456, 1282], "seg": 4, "locEn": "On the front and inner side of the lower leg, 7 cun above the tip of the inner ankle bone, at the centre of the inner surface of the shinbone."}, {"zh": "膝关", "py": "Xiguan", "code": "LR7", "clause": "5.12.7", "loc": "在小腿内侧，胫骨内侧髁的下方，阴陵泉（SP9）后1寸。", "at": [466, 1236], "seg": 5, "locEn": "On the inner side of the lower leg, below the medial condyle of the shinbone, 1 cun behind Yinlingquan (SP9)."}, {"zh": "曲泉", "py": "Ququan", "code": "LR8", "clause": "5.12.8", "loc": "在膝内侧，腘横纹内侧端，半腱肌肌腱内缘凹陷中。", "at": [466, 1200], "seg": 5, "locEn": "On the inner side of the knee, at the inner end of the knee crease, in the hollow at the inner edge of the semitendinosus tendon."}, {"zh": "阴包", "py": "Yinbao", "code": "LR9", "clause": "5.12.9", "loc": "在股内侧，髌底上4寸，股薄肌与缝匠肌之间。", "at": [462, 1110], "seg": 6, "locEn": "On the inner side of the thigh, 4 cun above the base of the kneecap, between gracilis and sartorius."}, {"zh": "足五里", "py": "Zuwuli", "code": "LR10", "clause": "5.12.10", "loc": "在股内侧，气冲（ST30）直下3寸，动脉搏动处。", "at": [470, 936], "seg": 6, "locEn": "On the inner side of the thigh, 3 cun straight below Qichong (ST30), where the artery can be felt."}, {"zh": "阴廉", "py": "Yinlian", "code": "LR11", "clause": "5.12.11", "loc": "在股内侧，气冲（ST30）直下2寸。", "at": [468, 918], "seg": 6, "locEn": "On the inner side of the thigh, 2 cun straight below Qichong (ST30)."}, {"zh": "急脉", "py": "Jimai", "code": "LR12", "clause": "5.12.12", "loc": "在腹股沟，横平耻骨联合上缘，前正中线旁开2.5寸。", "at": [452, 868], "seg": 7, "locEn": "In the groin, level with the upper edge of the pubic symphysis, 2.5 cun lateral to the anterior midline."}, {"zh": "章门", "py": "Zhangmen", "code": "LR13", "clause": "5.12.13", "loc": "在侧腹部，在第11肋游离端的下际。", "at": [410, 596], "seg": 9, "locEn": "On the side of the abdomen, just below the free end of the 11th rib."}, {"zh": "期门", "py": "Qimen", "code": "LR14", "clause": "5.12.14", "loc": "在前胸部，第６肋间隙，前正中线旁开４寸。", "at": [425, 430], "seg": 9, "locEn": "On the front of the chest, in the 6th intercostal space, 4 cun lateral to the anterior midline."}], "segs": {"1": ["起于大指丛毛之际", "从大脚趾趾甲后面长毛的地方起。", "It begins where the hairs grow behind the big toenail."], "2": ["上循足跗上廉", "往上沿着脚背的上边。", "Up along the upper edge of the top of the foot."], "3": ["去内踝一寸", "在离内踝一寸的地方。", "One cun in front of the inner ankle bone."], "4": ["上踝八寸，交出太阴之后", "往上到踝上八寸，交到脾经的后面。", "Up to eight cun above the ankle, where it crosses behind the spleen channel."], "5": ["上腘内廉", "往上到膝盖后面那个窝的内侧边。", "Up to the inner edge of the hollow behind the knee."], "6": ["循股阴", "沿着大腿内侧。", "Along the inner thigh."], "7": ["入毛中，过阴器，抵小腹", "进到阴毛里，绕过外阴，到小腹。", "Into the pubic hair, past the genitals, to the lower belly."], "8": ["挟胃，属肝，络胆", "夹着胃，属于肝，络着胆。", "Beside the stomach, belonging to the liver, linking with the gallbladder."], "9": ["上贯膈，布胁肋", "往上穿过膈，分布在胁肋。", "Up through the diaphragm, spreading over the ribs at the sides."], "10": ["循喉咙之后，上入颃颡", "沿着喉咙后面，往上进到颃颡，就是喉咙上头通鼻子的地方。", "Behind the throat, up into the space where the throat opens to the nose."], "11": ["连目系，上出额，与督脉会于巅", "连着目系，往上从额头出来，和督脉在头顶相会。", "Joined to the eye system, out through the forehead, meeting the governing vessel at the crown."], "12": ["其支者，从目系下颊里，环唇内", "一支从目系往下到面颊里面，绕着嘴唇里面一圈。", "A branch goes down from the eye system inside the cheek and circles inside the lips."], "13": ["其支者，复从肝别贯膈，上注肺", "一支又从肝分出，穿过膈，往上注到肺里。", "A branch leaves the liver again, through the diaphragm, and pours up into the lungs."]}, "page": {"file": "pages/lingshu-yuan-juan3-liver.jpg", "hl": [0.411, 0, 0.324, 1], "n": 30}, "inner": [{"p": [[468, 918], [484, 906], [500, 904]]}, {"p": [[500, 904], [496, 850], [490, 800]], "mid": true}, {"p": [[490, 800], [486, 680], [482, 548]], "mid": true}, {"p": [[482, 548], [476, 566], [470, 580]], "mid": true}, {"p": [[470, 580], [462, 594], [456, 606]], "mid": true}, {"p": [[470, 580], [482, 540], [490, 506]], "mid": true}, {"p": [[490, 506], [452, 512], [414, 530]]}, {"p": [[490, 506], [496, 380], [500, 240]], "mid": true}, {"p": [[500, 240], [500, 196], [500, 150]], "mid": true}, {"p": [[500, 150], [490, 138], [480, 128]]}, {"p": [[480, 128], [486, 100], [492, 72], [500, 46]]}], "branch": guan", "code": "GV3", "clause": "5.13.3", "loc": "在腰部，第4腰椎棘突下凹陷中，后正中线上。", "at": [500, 712], "seg": 2, "back": true, "locEn": "On the lower back, in the hollow below the spinous process of the 4th lumbar vertebra, on the posterior midline."}, {"zh": "命门", "py": "Mingmen", "code": "GV4", "clause": "5.13.4", "loc": "在腰部，第2腰椎棘突下凹陷中，后正中线上。", "at": [500, 628], "seg": 2, "key": "mingmen", "back": true, "locEn": "On the lower back, in the hollow below the spinous process of the 2nd lumbar vertebra, on the posterior midline."}, {"zh": "悬枢", "py": "Xuanshu", "code": "GV5", "clause": "5.13.5", "loc": "在腰部，第1腰椎棘突下凹陷中，后正中线上。", "at": [500, 600], "seg": 2, "back": true, "locEn": "On the lower back, in the hollow below the spinous process of the 1st lumbar vertebra, on the posterior midline."}, {"zh": "脊中", "py": "Jizhong", "code": "GV6", "clause": "5.13.6", "loc": "在背部，第11胸椎棘突下凹陷中，后正中线上。", "at": [500, 545], "seg": 2, "back": true, "locEn": "On the back, in the hollow below the spinous process of the 11th thoracic vertebra, on the posterior midline."}, {"zh": "中枢", "py": "Zhongshu", "code": "GV7", "clause": "5.13.7", "loc": "在背部，第10胸椎棘突下凹陷中，后正中线上。", "at": [500, 517], "seg": 2, "back": true, "locEn": "On the back, in the hollow below the spinous process of the 10th thoracic vertebra, on the posterior midline."}, {"zh": "筋缩", "py": "Jinsuo", "code": "GV8", "clause": "5.13.8", "loc": "在背部，第9胸椎棘突下凹陷中，后正中线上。", "at": [500, 490], "seg": 2, "back": true, "locEn": "On the back, in the hollow below the spinous process of the 9th thoracic vertebra, on the posterior midline."}, {"zh": "至阳", "py": "Zhiyang", "code": "GV9", "clause": "5.13.9", "loc": "在背部，第7胸椎棘突下凹陷中，后正中线上。", "at": [500, 435], "seg": 2, "back": true, "locEn": "On the back, in the hollow below the spinous process of the 7th thoracic vertebra, on the posterior midline."}, {"zh": "灵台", "py": "Lingtai", "code": "GV10", "clause": "5.13.10", "loc": "在背部，第6胸椎棘突下凹陷中，后正中线上。", "at": [500, 407], "seg": 2, "back": true, "locEn": "On the back  trees=[];for(let L=0;L<4;L++){const n=Math.max(4+L*2,Math.round(W/110*(1.5-L*.28)));for(let i=0;i<n;i++)trees.push({x:rnd(-30,W+30),w:(2+L*3)*rnd(.7,1.3),L,lean:rnd(-.012,.012)})}
 trees.sort((a,b)=>a.L-b.L);motes=Array.from({length:Math.round(W*H/22000)},()=>({x:rnd(0,W),y:rnd(0,H),r:rnd(.4,1.3),v:rnd(.04,.18),p:Math.random()*6}))}

 for(const tr of trees){const a=[.10,.16,.24,.34][tr.L];cx.fillStyle=`rgba(${[38,32,26,20][tr.L]},${[58,50,42,34][tr.L]},${[54,46,40,32][tr.L]},${a+.5})`;cx.save();cx.translate(tr.x,H);cx.rotate(tr.lean);cx.fillRect(-tr.w/2,-H*1.1,tr.w,H*1.1);cx.restore()}
 for(let i=0;i<4;i++){const y=H*(.3+i*.17)+Math.sin(t*.12+i)*12;const fg=cx.createLinearGradient(0,y-80,0,y+80);fg.addColorStop(0,'rgba(201,214,207,0)');fg.addColorStop(.5,`rgba(201,214,207,${.05-i*.008})`);fg.addColorStop(1,'rgba(201,214,207,0)');cx.fillStyle=fg;cx.fillRect(0,y-80,W,160)}
 for(const m of motes){if(!reduce){m.y-=m.v;m.x+=Math.sin(t+m.p)*.1;if(m.y<-4){m.y=H+4;m.x=rnd(0,W)}}cx.fillStyle='rgba(201,214,207,.22)';cx.beginPath();cx.arc(m.x,m.y,m.r,0,6.3);cx.fill()}
 const vg=cx.createRadialGradient(W/2,H/2,Math.min(W,H)*.3,W/2,H/2,Math.max(W,H)*.75);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.5)');cx.fillStyle=vg;cx.fillRect(0,0,W,H)}
